<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUBE-REV 0.8.5</title><style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#17191d;--muted:#68707b;--line:#d9dee7;--accent:#195bd7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}main{max-width:860px;margin:auto;padding:24px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 10px 30px #0000000a}.hidden{display:none!important}button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;cursor:pointer}.primary{background:var(--accent);color:white;border-color:var(--accent)}.faces{display:flex;gap:16px;justify-content:center;margin:24px 0}.face{display:grid;grid-template-columns:repeat(2,64px);gap:4px;background:#111;padding:5px;border-radius:8px}.st{height:64px;border-radius:4px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.selected{outline:3px solid var(--accent)}.progress{height:8px;background:#e7eaf0;border-radius:8px;overflow:hidden}.progress div{height:100%;background:var(--accent)}.small{font-size:13px;color:var(--muted)}@media(max-width:620px){.face{grid-template-columns:repeat(2,42px)}.st{height:42px}.faces{gap:7px}.choices{grid-template-columns:repeat(2,1fr)}}</style></head><body><main>
<section id="intro" class="card"><h1>큐브 첫 행동 선택 과제</h1><p>각 상태를 보고, 자연스럽게 풀기 시작한다면 가장 먼저 할 한 번의 회전을 선택하세요.</p><p class="small">중간에 창을 닫아도 이 기기에서 이어서 진행됩니다. 정답 피드백은 제공되지 않습니다.</p><button id="begin" class="primary">시작 또는 이어하기</button><p class="small">CUBE-REV 0.8.5</p></section>
<section id="task" class="card hidden"><div class="progress"><div id="bar"></div></div><p id="count" class="small"></p><div class="faces" id="faces"></div><p>회전할 면</p><div id="faceChoices" class="choices"></div><p>회전 방향</p><div id="turnChoices" class="choices"></div><button id="confirm" class="primary" disabled>선택 확정</button><p id="status" class="small"></p></section>
<section id="done" class="card hidden"><h2>완료되었습니다</h2><p id="doneText">응답을 안전하게 전송하고 있습니다.</p><button id="retry" class="primary hidden">다시 전송</button><p class="small">CUBE-REV 0.8.5</p></section></main>
<script src="collector-config.js"></script><script src="js/collector-client.js"></script><script src="js/participant-cognitive-mode-0.8.5.js"></script><script>
'use strict';let C=null,bank={},state,face=null,turn=null,shown=0;const $=s=>document.querySelector(s),colors={U:'#f5f5f5',D:'#ffd500',F:'#00a651',B:'#0051ba',R:'#c41e3a',L:'#ff5800'};
async function boot(){const [b,c]=await Promise.all([fetch('cognitive/PARTICIPANT_TRIAL_BANK_0.8.5.json',{cache:'no-store'}).then(r=>r.json()),fetch('cognitive/COGNITIVE_MODE_CONFIG_0.8.5.json',{cache:'no-store'}).then(r=>r.json())]);C=c;bank=Object.fromEntries(b.trials.map(t=>[t.trial_id,t]));const z=CUBE_REV_COGNITIVE_MODE_0805.loadOrCreate(C,{storage:localStorage,cryptoObj:crypto,now:()=>new Date().toISOString()});state=z.state;if(state.status==='SUBMITTED')showDone('이미 안전하게 제출되었습니다.');else if(state.cursor===state.schedule.length)send();else render()}
function fgrid(label,a){return `<div><b>${label}</b><div class="face">${a.flat().map(c=>`<div class="st" style="background:${colors[c]}"></div>`).join('')}</div></div>`}
function render(){const t=bank[state.schedule[state.cursor]];$('#intro').classList.add('hidden');$('#done').classList.add('hidden');$('#task').classList.remove('hidden');$('#count').textContent=`${state.cursor+1} / ${state.schedule.length}`;$('#bar').style.width=`${100*state.cursor/state.schedule.length}%`;$('#faces').innerHTML=fgrid('U',t.stickers.U)+fgrid('F',t.stickers.F)+fgrid('R',t.stickers.R);face=turn=null;$('#confirm').disabled=true;document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));shown=performance.now()}
function select(group,value,el){if(group==='face')face=value;else turn=value;el.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');$('#confirm').disabled=face===null||turn===null}
for(const f of 'URFDLB'){const b=document.createElement('button');b.textContent=f;b.onclick=()=>select('face',f,b);$('#faceChoices').appendChild(b)}for(const [v,l] of [['','시계 90°'],['2','180°'],["'",'반시계 90°']]){const b=document.createElement('button');b.textContent=l;b.onclick=()=>select('turn',v,b);$('#turnChoices').appendChild(b)}
$('#begin').onclick=boot;$('#confirm').onclick=()=>{const t=bank[state.schedule[state.cursor]],display=face+turn;let canonical=null;for(const [oldf,newf] of Object.entries(t.face_map))if(newf===face)canonical=oldf+turn;state=CUBE_REV_COGNITIVE_MODE_0805.record(localStorage,state,{trial_id:t.trial_id,state_id:t.state_id,rotation_id:t.rotation_id,class_code:t.class_code,choice_display:display,choice_canonical:canonical,latency_ms:Math.round(performance.now()-shown)},()=>new Date().toISOString());state.cursor===state.schedule.length?send():render()};
async function send(){ $('#intro').classList.add('hidden');$('#task').classList.add('hidden');$('#done').classList.remove('hidden');if(state.status==='SUBMITTED'){showDone('이미 안전하게 제출되었습니다.');return}try{const contractVersion='0.7.12';const cfg=CubeRevCollectorClient.normalizeConfig(window.CUBE_REV_COLLECTOR_CONFIG,contractVersion);const ref={get:()=>state,sync:()=>{state=CUBE_REV_COGNITIVE_MODE_0805.saveExternalMutation(localStorage,state,()=>new Date().toISOString())}};const client=new CubeRevCollectorClient({config:cfg,version:contractVersion,getSession:ref.get,exportSession:()=>CUBE_REV_COGNITIVE_MODE_0805.envelope(state),logEvent:()=>{},persist:ref.sync,setStatus:(m)=>{$('#doneText').textContent=m},randomHex:n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),x=>x.toString(16).padStart(2,'0')).join(''),hashString:CUBE_REV_COGNITIVE_MODE_0805.fnv1a,translate:k=>k});const receipt=await client.submit();state=JSON.parse(localStorage.getItem(CUBE_REV_COGNITIVE_MODE_0805.STORAGE_KEY));state=CUBE_REV_COGNITIVE_MODE_0805.markSubmitted(localStorage,state,receipt,()=>new Date().toISOString());showDone('응답이 안전하게 제출되었습니다.')}catch(e){const raw=localStorage.getItem(CUBE_REV_COGNITIVE_MODE_0805.STORAGE_KEY);if(raw)state=JSON.parse(raw);$('#doneText').textContent='응답은 이 기기에 보존되었습니다. 연결을 확인한 뒤 다시 전송하세요.';$('#retry').classList.remove('hidden')}}function showDone(x){$('#doneText').textContent=x;$('#retry').classList.add('hidden')}$('#retry').onclick=send;
</script></body></html>
