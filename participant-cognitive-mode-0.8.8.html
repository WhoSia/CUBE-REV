<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUBE-REV 0.8.8</title><style>:root{--bg:#f5f7fa;--card:#fff;--ink:#17191d;--muted:#68707b;--line:#d9dee7;--accent:#195bd7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}main{max-width:860px;margin:auto;padding:24px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}.hidden{display:none!important}button,input,textarea{font:inherit}button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;cursor:pointer}.primary{background:var(--accent);color:#fff}.faces{display:flex;gap:16px;justify-content:center;margin:24px 0}.face{display:grid;grid-template-columns:repeat(2,64px);gap:4px;background:#111;padding:5px;border-radius:8px}.st{height:64px;border-radius:4px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.selected{outline:3px solid var(--accent)}.progress{height:8px;background:#e7eaf0;border-radius:8px;overflow:hidden}.progress div{height:100%;background:var(--accent)}.small{font-size:13px;color:var(--muted)}textarea{width:100%;min-height:90px}@media(max-width:620px){.face{grid-template-columns:repeat(2,42px)}.st{height:42px}.faces{gap:7px}}</style></head><body><main>
<section id="intro" class="card"><h1>큐브 첫 행동 선택 과제</h1><p>각 상태에서 자연스럽게 가장 먼저 할 회전을 선택하세요.</p><p class="small">창을 닫아도 이 기기에서 이어집니다. 정답 피드백은 없습니다.</p><button id="begin" class="primary">시작 또는 이어하기</button><p class="small">CUBE-REV 0.8.8</p></section>
<section id="task" class="card hidden"><div class="progress"><div id="bar"></div></div><p id="count" class="small"></p><div id="faces" class="faces"></div><p>회전할 면</p><div id="faceChoices" class="choices"></div><p>회전 방향</p><div id="turnChoices" class="choices"></div><button id="confirm" class="primary" disabled>선택 확정</button></section>
<section id="post" class="card hidden"><h2>과제 후 확인</h2><label>이 과제가 무엇을 비교한다고 생각했나요?<textarea id="guess"></textarea></label><label>추측 확신도 (0–100)<input id="confidence" type="number" min="0" max="100" value="0"></label><p><label><input id="deliberate" type="checkbox"> 과제 목적을 추측해 일부러 선택 방식을 바꿨습니다</label></p><label>기술적 문제 또는 참고사항<textarea id="tech"></textarea></label><button id="finish" class="primary">응답 제출</button></section>
<section id="done" class="card hidden"><h2>완료되었습니다</h2><p id="doneText">응답을 안전하게 전송하고 있습니다.</p><button id="retry" class="primary hidden">다시 전송</button><p class="small">CUBE-REV 0.8.8</p></section></main>
<script src="collector-config.js"></script><script src="js/collector-client.js"></script><script src="js/participant-cognitive-mode-0.8.8.js"></script><script>
'use strict';let C,bank={},state,face,turn,shown=0;const $=s=>document.querySelector(s),colors={U:'#f5f5f5',D:'#ffd500',F:'#00a651',B:'#0051ba',R:'#c41e3a',L:'#ff5800'},now=()=>new Date().toISOString();
async function assets(){const [b,c]=await Promise.all([fetch('cognitive/PARTICIPANT_STIMULUS_BANK_0.8.8.json',{cache:'no-store'}).then(r=>r.json()),fetch('cognitive/COGNITIVE_MODE_CONFIG_0.8.8.json',{cache:'no-store'}).then(r=>r.json())]);C=c;bank=Object.fromEntries(b.stimuli.map(x=>[x.stimulus_id,x]))}
async function boot(){await assets();const z=CUBE_REV_COGNITIVE_MODE_0808.loadOrCreate(C,{storage:localStorage,cryptoObj:crypto,now});state=z.state;state=CUBE_REV_COGNITIVE_MODE_0808.event(localStorage,state,'TASK_OPENED',{resumed:z.resumed},now);route()}
function route(){['intro','task','post','done'].forEach(x=>$('#'+x).classList.add('hidden'));if(state.status==='SUBMITTED'){showDone('이미 안전하게 제출되었습니다.');return}if(state.status==='POST_TASK'||state.status==='READY_TO_SUBMIT'){if(state.status==='READY_TO_SUBMIT'){send();return}$('#post').classList.remove('hidden');return}$('#task').classList.remove('hidden');render()}
function grid(l,a){return `<div><b>${l}</b><div class="face">${a.flat().map(c=>`<div class="st" style="background:${colors[c]}"></div>`).join('')}</div></div>`}function render(){const t=bank[state.schedule[state.cursor]];$('#count').textContent=`${state.cursor+1} / 28`;$('#bar').style.width=`${100*state.cursor/28}%`;$('#faces').innerHTML=grid('U',t.stickers.U)+grid('F',t.stickers.F)+grid('R',t.stickers.R);face=turn=null;$('#confirm').disabled=true;document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));shown=performance.now()}
function sel(g,v,e){g==='f'?face=v:turn=v;e.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');$('#confirm').disabled=face==null||turn==null}for(const f of 'URFDLB'){const b=document.createElement('button');b.textContent=f;b.onclick=()=>sel('f',f,b);$('#faceChoices').appendChild(b)}for(const [v,l] of [['','시계 90°'],['2','180°'],["'",'반시계 90°']]){const b=document.createElement('button');b.textContent=l;b.onclick=()=>sel('t',v,b);$('#turnChoices').appendChild(b)}
$('#begin').onclick=boot;$('#confirm').onclick=()=>{const t=bank[state.schedule[state.cursor]];let canonical=null;for(const [oldf,newf] of Object.entries(t.face_map))if(newf===face)canonical=oldf+turn;state=CUBE_REV_COGNITIVE_MODE_0808.record(localStorage,state,{stimulus_id:t.stimulus_id,state_id:t.state_id,rotation_id:t.rotation_id,choice_display:face+turn,choice_canonical:canonical,latency_ms:Math.round(performance.now()-shown)},now);route()};$('#finish').onclick=()=>{state=CUBE_REV_COGNITIVE_MODE_0808.savePostTask(localStorage,state,{hypothesis_guess:$('#guess').value,confidence:$('#confidence').value,deliberate_strategy_change:$('#deliberate').checked,technical_notes:$('#tech').value},now);send()};
document.addEventListener('visibilitychange',()=>{if(state)state=CUBE_REV_COGNITIVE_MODE_0808.event(localStorage,state,document.hidden?'VISIBILITY_HIDDEN':'VISIBILITY_VISIBLE',{},now)});addEventListener('pagehide',()=>{if(state)state=CUBE_REV_COGNITIVE_MODE_0808.event(localStorage,state,'PAGEHIDE',{cursor:state.cursor},now)});
async function send(){['intro','task','post'].forEach(x=>$('#'+x).classList.add('hidden'));$('#done').classList.remove('hidden');if(state.status==='SUBMITTED'){showDone('이미 안전하게 제출되었습니다.');return}try{state=CUBE_REV_COGNITIVE_MODE_0808.prepareSubmissionSnapshot(localStorage,state,now);state=CUBE_REV_COGNITIVE_MODE_0808.event(localStorage,state,'SUBMISSION_ATTEMPT',{snapshot_hash:state.submission_snapshot_hash},now);const cv='0.7.12',cfg=CubeRevCollectorClient.normalizeConfig(window.CUBE_REV_COLLECTOR_CONFIG,cv),ref={get:()=>state,sync:()=>{state=CUBE_REV_COGNITIVE_MODE_0808.saveExternalMutation(localStorage,state,now)}};const client=new CubeRevCollectorClient({config:cfg,version:cv,getSession:ref.get,exportSession:()=>CUBE_REV_COGNITIVE_MODE_0808.exportSnapshot(state),logEvent:()=>{},persist:ref.sync,setStatus:m=>$('#doneText').textContent=m,randomHex:n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),x=>x.toString(16).padStart(2,'0')).join(''),hashString:CUBE_REV_COGNITIVE_MODE_0808.fnv1a,translate:k=>k});const receipt=await client.submit();state=JSON.parse(localStorage.getItem(CUBE_REV_COGNITIVE_MODE_0808.STORAGE_KEY));state=CUBE_REV_COGNITIVE_MODE_0808.markSubmitted(localStorage,state,receipt,now);showDone('응답이 안전하게 제출되었습니다.')}catch(e){const raw=localStorage.getItem(CUBE_REV_COGNITIVE_MODE_0808.STORAGE_KEY);if(raw)state=JSON.parse(raw);state=CUBE_REV_COGNITIVE_MODE_0808.event(localStorage,state,'SUBMISSION_FAILED',{message:String(e&&e.message||e).slice(0,300),snapshot_hash:state.submission_snapshot_hash||null},now);$('#doneText').textContent='응답은 이 기기에 보존되었습니다. 연결 후 다시 전송하세요.';$('#retry').classList.remove('hidden')}}function showDone(x){$('#done').classList.remove('hidden');$('#doneText').textContent=x;$('#retry').classList.add('hidden')}$('#retry').onclick=send;
</script></body></html>
