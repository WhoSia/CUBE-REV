<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CUBE-REV G7-P5 Instrument Validation</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:32px auto;padding:0 18px;line-height:1.45}
.warn{border:1px solid #999;padding:12px;margin:12px 0;background:#f5f5f5}
button{margin:4px;padding:8px 12px}.moves{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
code{word-break:break-word}.hidden{display:none}
</style>
<h1>CUBE-REV G7-P5 Instrument Validation</h1>
<div class="warn"><b>Validation mode only.</b> Human data collection is not authorized by this build.</div>
<label>Packet JSON <input id="packetFile" type="file" accept=".json"></label>
<button id="load">Load packet</button>
<div id="status"></div>
<section id="trial" class="hidden">
  <p><b id="trialId"></b> · exact-state reconstruction by scramble</p>
  <p>Scramble: <code id="scramble"></code></p>
  <p>Choose the move you would play next:</p>
  <div class="moves" id="moves"></div>
</section>
<button id="export" disabled>Export local JSONL</button>
<script type="module" src="./app.mjs"></script>
</html>
