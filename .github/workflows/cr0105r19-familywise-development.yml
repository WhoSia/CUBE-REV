name: CR0105R19 Quotient Familywise Development
on:
  push:
    branches: [cube-rev-0.10.5-r1.9-quotient-familywise-readiness]
    paths: [cr0105r19/RUN_FAMILYWISE_DEVELOPMENT]
permissions:
  contents: write
concurrency:
  group: cr0105r19-familywise-development
  cancel-in-progress: false
jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify geometry probe and NAPKIN before historical development
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          g=json.load(open('research/0.10.5-r1.9/evidence-geometry-probe/QUOTIENT_GEOMETRY_PROBE.json'))
          n=json.load(open('research/0.10.5-r1.9/NAPKIN_INTENT_AND_PREREGISTRATION.json'))
          assert g['status']=='PASS'
          assert n['status']=='FROZEN_BEFORE_R19_DEVELOPMENT_EXECUTION'
          assert n['historical_data_status']['r17_900'].startswith('HISTORICAL_DEVELOPMENT_ONLY')
          assert n['historical_data_status']['r18_900'].startswith('HISTORICAL_DEVELOPMENT_ONLY')
          print('CR0105R19_DEVELOPMENT_LINEAGE_PASS')
          PY
      - name: Install pinned cubing runtime
        run: npm install --no-save --ignore-scripts cubing@0.63.3
      - name: Run quotient geometry and attempt-level familywise crossfit court
        id: dev
        shell: bash
        env:
          R19_DEV_ROOT: /tmp/r19dev
        run: |
          set +e
          mkdir -p /tmp/r19dev
          node research/0.10.5-r1.9/r19_familywise_development.mjs 2>&1 | tee /tmp/r19dev/development.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist fail-observable development evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p research/0.10.5-r1.9/evidence-familywise-development
          for f in QUOTIENT_FEATURE_LEDGER.json CROSSFIT_SCORED_FEATURES.json FULL_LOCAL_REFERENCE.json CROSSFIT_ATTEMPT_REFERENCE.json DEVELOPMENT_SUMMARY.json ATTEMPT_FAMILYWISE_NULL_PREREG_SEAL.json; do
            test -f "/tmp/r19dev/$f" && cp "/tmp/r19dev/$f" research/0.10.5-r1.9/evidence-familywise-development/ || true
          done
          cp /tmp/r19dev/development.log research/0.10.5-r1.9/evidence-familywise-development/DEVELOPMENT_LOG.txt || true
          python3 - <<'PY'
          import json,os,datetime,pathlib
          c=int('${{ steps.dev.outputs.exit_code || 97 }}')
          x={'schema_version':'CR0105R19-FAMILYWISE-DEVELOPMENT-RUN-1','workflow_run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'exit_code':c,'operational_status':'PASS' if c==0 else 'HOLD_OR_FAIL','role':'HISTORICAL_DEVELOPMENT_NO_FRESH_CONFIRMATORY_OUTCOME','human_observations':0,'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('research/0.10.5-r1.9/evidence-familywise-development/RUN_METADATA.json').write_text(json.dumps(x,indent=2)+'\n')
          PY
      - name: Commit development evidence before fresh-vintage read
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/0.10.5-r1.9/evidence-familywise-development
          git diff --cached --quiet || git commit -m "Record CUBE-REV 0.10.5-R1.9 familywise development ${GITHUB_RUN_ID}"
          git push origin HEAD:cube-rev-0.10.5-r1.9-quotient-familywise-readiness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CR0105R19-familywise-development
          retention-days: 30
          if-no-files-found: warn
          path: research/0.10.5-r1.9/evidence-familywise-development/
      - name: Enforce readiness calibration seal
        if: always()
        run: |
          test '${{ steps.dev.outputs.exit_code }}' = '0'
          python3 - <<'PY'
          import json
          s=json.load(open('research/0.10.5-r1.9/evidence-familywise-development/DEVELOPMENT_SUMMARY.json'))
          z=json.load(open('research/0.10.5-r1.9/evidence-familywise-development/ATTEMPT_FAMILYWISE_NULL_PREREG_SEAL.json'))
          assert s['status']=='PASS_READINESS_CALIBRATION',s
          assert z['status']=='SEALED_FOR_FUTURE_FRESH_VINTAGE',z
          assert z['future_fresh_outcomes_seen'] is False
          print('CR0105R19_FAMILYWISE_READINESS_SEAL_PASS')
          PY
