name: Validate G5-P5-R1 representation court

on:
  push:
    branches: ['research/current']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p5-r1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust format seal
        run: cargo fmt --all --check
      - name: Workspace check
        run: cargo check --workspace
      - name: Workspace tests
        run: cargo test --workspace
      - name: Materialize R1 exact court
        run: |
          mkdir -p g5/p5/ci-output
          cargo run --release --quiet -p search-geometry-core --bin p5_r1 > g5/p5/ci-output/p5-r1.tsv
      - name: Upload R1 court
        uses: actions/upload-artifact@v4
        with:
          name: g5-p5-r1-representation-court
          path: g5/p5/ci-output/p5-r1.tsv
