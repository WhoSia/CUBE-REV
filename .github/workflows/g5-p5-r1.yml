name: Validate G5-P5-R1 representation court

on:
  push:
    branches: ['research/current']
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  p5-r1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Canonicalize Rust for diagnostic R1
        run: cargo fmt --all
      - name: Publish canonical R1 source blobs without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          encode_blob() {
            local path="$1"
            local context="$2"
            local encoded
            encoded="$(base64 -w0 "$path")"
            local sha
            sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs"               -f content="$encoded" -f encoding="base64" --jq '.sha')"
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"               -f state="success" -f context="$context" -f description="$sha" >/dev/null
          }
          encode_blob "crates/search-geometry-core/src/lib.rs" "g5-p5-r1/rustfmt-lib"
          encode_blob "crates/search-geometry-core/src/bin/p5_r1.rs" "g5-p5-r1/rustfmt-bin"
      - name: Workspace check
        run: cargo check --workspace
      - name: Workspace tests
        run: cargo test --workspace
      - name: Materialize R1 exact court
        run: |
          mkdir -p g5/p5/ci-output
          cargo run --release --quiet -p search-geometry-core --bin p5_r1 > g5/p5/ci-output/p5-r1.tsv
      - name: Upload R1 court
        uses: actions/upload-artifact@v4
        with:
          name: g5-p5-r1-representation-court
          path: g5/p5/ci-output/p5-r1.tsv
