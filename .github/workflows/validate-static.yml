name: Validate CUBE-REV baseline and calibration

on:
  push:
    branches: [main, 'agent/**', 'cube-rev-*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check release identity and static assets
        run: node scripts/validate-static.mjs
      - name: Build and validate source-bound calibration host
        run: |
          node scripts/build-calibration-host.mjs
          node scripts/validate-calibration.mjs
          node tests/randomization.test.cjs
          node tests/history-fidelity.test.cjs
          node tests/neutral-probe.test.cjs
          node tests/runtime.test.cjs
          node tests/camera-orbit.test.cjs
          node tests/collector-receipt.integration.cjs
          python -m unittest tests/test_registry_and_annotation.py
          node tests/documented-cli.test.cjs

  r1_23_regeneration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate conservative pinned crosswalk
        run: python scripts/r1_23_crosswalk_regenerate.py
      - name: Regenerate round-bucket-repaired pinned crosswalk
        run: python scripts/r1_23_crosswalk_roundbucket_p1.py
      - name: Upload R1.23 P0 regeneration court
        uses: actions/upload-artifact@v4
        with:
          name: cube-rev-r1-23-regeneration-p0
          path: r1_23_output/
          if-no-files-found: error
          retention-days: 7
      - name: Upload R1.23 P1 round-bucket court
        uses: actions/upload-artifact@v4
        with:
          name: cube-rev-r1-23-regeneration-p1
          path: r1_23_output_p1/
          if-no-files-found: error
          retention-days: 7
