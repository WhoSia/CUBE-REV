name: Validate CUBE-REV baseline and calibration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check release identity and static assets
        run: node scripts/validate-static.mjs
      - name: Build and validate source-bound calibration host
        run: |
          node scripts/build-calibration-host.mjs
          node scripts/validate-calibration.mjs
          node tests/calibration.test.cjs
          node tests/collector-receipt.integration.cjs
          python -m unittest tests/test_registry_and_annotation.py
