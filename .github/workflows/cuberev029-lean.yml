name: CUBE-REV 0.29 Lean (read-only)
on:
  push:
    branches:
      - research/current
    paths:
      - formal/029/**
      - .github/workflows/cuberev029-lean.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cuberev029-lean-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore and SHA-check immutable local certificates
        run: python3 formal/029/restore_pinned_data.py
      - name: Cross-check the nineteen corner reads and mutation controls
        run: python3 formal/029/validate_19_corner_schedule.py
      - name: Audit corner-turn generator premises against full geometry
        run: python3 formal/029/audit_corner_turn_generators.py
      - name: Audit reachable corner coordinates against turn geometry
        run: python3 formal/029/audit_reachable_corner_bridge.py
      - name: Fail-closed Lean library and CI manifest validation
        run: python3 formal/029/audit_lake_manifest.py
      - name: Independently check Hall–Burnside graph quotient and mutations
        run: python3 scripts/cuberev-observation/audit_r029_hall_burnside_graph_quotient.py
      - name: Reject forgotten-gauge parity on an actual legal edge array
        run: python3 scripts/cuberev-observation/audit_r029_gauge_counterexample.py
      - name: Compile pinned Lean package
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: formal/029
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-github-cache: 'true'
      - name: Independently replay data certificates and negative controls
        working-directory: formal/029
        run: |
          python3 check_data.py EIGHTEEN_QUERY_DAG.json upper-policy-certificate.json
      - name: Inspect new theorem dependencies and compilation
        working-directory: formal/029
        run: |
          lake env lean "$PWD/PhysicalPolicyCompiler.lean"
          lake env lean "$PWD/PhysicalPolicyCompilerFast.lean"
          lake env lean "$PWD/CornerPairDecoder.lean"
          lake env lean "$PWD/CornerTurnGenerators.lean"
          lake env lean "$PWD/ReachableCornerCoordinates.lean"
          lake env lean "$PWD/CornerConservation.lean"
          lake env lean "$PWD/ReachableCornerIdentification.lean"
          lake env lean "$PWD/CornerPermutation.lean"
          lake env lean "$PWD/NineteenCornerTranscript.lean"
          lake env lean "$PWD/ObservationTransport.lean"
          lake env lean "$PWD/ElevenPrefix.lean"
          lake env lean "$PWD/NineteenSymmetry.lean"
          lake env lean "$PWD/SymmetryWordTransport.lean"
          lake env lean "$PWD/LegalEdgeSymmetry.lean"
          lake env lean "$PWD/PairedPolicyTransport.lean"
          lake env lean "$PWD/SymmetryInverse.lean"
          lake env lean "$PWD/RepresentativeRoundTrip.lean"
          lake env lean "$PWD/ColorGraphCharacter.lean"
          lake env lean "$PWD/GraphPosteriorCovariance.lean"
          lake env lean "$PWD/SignedRepresentativePolicy.lean"
          lake env lean "$PWD/SignedPairedPosterior.lean"
          lake env lean "$PWD/SignedTerminalIdentification.lean"
          lake env lean "$PWD/SignedPolicyTranscript.lean"
          lake env lean "$PWD/FrozenPolicyInterpreter.lean"
          lake env lean "$PWD/SignedSectorLeaf.lean"
          lake env lean "$PWD/NineteenSchedule.lean"
          lake env lean "$PWD/PhysicalEighteen.lean"
          lake env lean "$PWD/NineteenDataReceipt.lean"
