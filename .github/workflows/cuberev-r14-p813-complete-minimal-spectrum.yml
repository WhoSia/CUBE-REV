name: CUBE-REV R14-P8.13 complete minimal B6 spectrum
on:
  push:
    branches: [research/current]
    paths:
      - 'scripts/cuberev-observation/audit_r14_p813_complete_minimal_base_spectrum.py'
      - 'scripts/cuberev-observation/verify_r14_p814_66_pair_core_index.py'
      - 'data/0.28/R14_P814_ALL_66_EDGE_PAIRS_POSITIVE16_CORE_INDEX_20261110.json'
      - 'docs/0.28/20261110_R14_P813_COMPLETE_MINIMAL_SENSOR_SPECTRUM.md'
      - '.github/workflows/cuberev-r14-p813-complete-minimal-spectrum.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-minimal-b6-spectrum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enumerate every 0..4 omitted-tag combination and test inclusion-wise minimality
        run: |
          python scripts/cuberev-observation/audit_r14_p813_complete_minimal_base_spectrum.py > /tmp/p813.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/p813.json"))
          assert d["status"]=="R14_P813_COMPLETE_MINIMAL_B6_SIZE_SPECTRUM_GEOMETRIC_PASS"
          assert d["positive_observation_count"]=={"16":156,"17":672,"18":174,"19":20,"20":1}
          assert d["minimal_identifying_count"]=={"16":156,"17":276,"18":0,"19":0,"20":0}
          assert d["minimal_17_types"]=={"two_corners_one_edge":12,"one_corner_two_edges":264}
          assert d["edge_pair_core_coverage"]=={"1":24,"2":6,"3":24,"4":12}
          assert d["total_minimal"]==432 and d["minimal_size_spectrum"]==[16,17]
          assert d["per_corner_extendable_edge_pair_count"]==[33]*8
          assert d["per_corner_minimal17_one_corner_two_edges"]==33
          assert d["fresh_independent_physical_18htm_mitm"] is False
          print("R14_P813_COMPLETE_MINIMAL_B6_GEOMETRY_PASS_PHYSICAL_DEPENDENCY_PRESERVED")
          PY
      - name: Replay and verify the complete 66 physical-certificate reference index
        run: |
          python scripts/cuberev-observation/verify_r14_p814_66_pair_core_index.py > /tmp/p814.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/p814.json"))
          assert d["result"]=="R14_P814_66_PAIR_CORE_INDEX_REPLAY_PASS"
          assert d["all_edge_pairs"]==66 and d["positive16_selected_layouts"]==66
          assert d["uniquely_available_core"]==24
          assert d["candidate_core_multiplicities"]=={"1":24,"2":6,"3":24,"4":12}
          assert d["physical_B12_41_class_replayed"] is False
          print("R14_P814_REFERENCE_INDEX_PASS_GEOMETRY_ONLY")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cuberev-r14-p813-minimal-spectrum-geometry-json
          path: /tmp/p813.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: cuberev-r14-p814-66-pair-core-index-replay
          path: /tmp/p814.json
          retention-days: 30
      - name: No bot-authored source modifications
        run: git diff --exit-code HEAD --
