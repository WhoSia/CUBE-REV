name: G7-P12-R2 support-information Pareto census

on:
  push:
    branches: ['research/current']
    paths:
      - '.github/workflows/g7-p12-r2-pareto-census.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Validate R2 preseal
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open('g7/p12/r2-constitution.json'))
          r=json.load(open('g7/p12/r1-closure.json'))
          assert p['status']=='FROZEN_AFTER_R1_BEFORE_R2_OUTCOME'
          assert p['metrics']['no_behavioral_outcomes'] is True
          assert p['new_body_requests']==0 and p['source_contact']=='NONE'
          assert r['status']=='CLOSED'
          assert r['final_verdict'].startswith('COMPRESSION_NOT_AUTHORIZED')
          print('G7_P12_R2_PRESEAL_PASS')
          PY

      - name: Recover immutable legacy60 and fresh40
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2/legacy /tmp/r2/fresh
          fetch_artifact () {
            id="$1"; dir="$2"; expected="$3"
            curl --fail --location --silent --show-error               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$REPO/actions/artifacts/$id/zip"               -o "/tmp/r2/$dir.zip"
            echo "$expected  /tmp/r2/$dir.zip" | sha256sum -c -
            mkdir -p "/tmp/r2/$dir"
            unzip -q "/tmp/r2/$dir.zip" -d "/tmp/r2/$dir"
          }
          fetch_artifact 11238382539 legacy b6e30ab56548e27905dd3b3718c5a3e56d772bff10a744e92180d189a3259a11
          fetch_artifact 11242854238 fresh/b1 0bc3c845d0caadcd84a6df4ce8db4a65fae083d6ef01e076f5ce95755676c6ea
          fetch_artifact 11243410683 fresh/b2 c4589ff7955ea3fe7fe1d452f8a137e4f2c799e60cad27e863fa91bfcc7f975e
          fetch_artifact 11243041519 fresh/b3 82ce3af8a36c0eb3bf8f6192a72db1adb17f2046cf8ef2f602b4d583887ffe38
          fetch_artifact 11243391026 fresh/b4 8575409309eadab60cf5d2145925108c8139a62e75a7f2060785c4de75a3028a

      - name: Reconstitute legacy structural geometry
        run: |
          set -euo pipefail
          LEX="$(find /tmp/r2/legacy -name exact-trajectories.json -print -quit)"
          LMETA="$(find /tmp/r2/legacy -name solve-metadata.jsonl -print -quit)"
          mkdir -p /tmp/r2/build/legacy
          node scripts/g7-p7/prefix-context.mjs "$LEX" "$LMETA"             /tmp/r2/build/legacy/prefix-states.tsv /tmp/r2/build/legacy/context.jsonl
          cargo run -q -p search-geometry-core --bin g7_p7_reco_rivals             < /tmp/r2/build/legacy/prefix-states.tsv > /tmp/r2/build/legacy/features.tsv
          cargo run -q -p search-geometry-core --bin g7_p12_shell_flow             < /tmp/r2/build/legacy/prefix-states.tsv > /tmp/r2/build/legacy/shell.tsv

      - name: Reconstitute fresh structural geometry
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2/build/fresh/corpus
          node scripts/g7-p11/merge-fresh-corpus.mjs             --source P11_BATCH1=/tmp/r2/fresh/b1             --source P11_BATCH2=/tmp/r2/fresh/b2             --source P11_BATCH3=/tmp/r2/fresh/b3             --source P11_BATCH4=/tmp/r2/fresh/b4             --out /tmp/r2/build/fresh/corpus
          node scripts/cube/replay-exact-trajectories.mjs             --input /tmp/r2/build/fresh/corpus/combined-solves.jsonl             --out /tmp/r2/build/fresh/exact
          node scripts/g7-p7/prefix-context.mjs             /tmp/r2/build/fresh/exact/exact-trajectories.json             /tmp/r2/build/fresh/corpus/solve-metadata.jsonl             /tmp/r2/build/fresh/prefix-states.tsv /tmp/r2/build/fresh/context.jsonl
          cargo run -q -p search-geometry-core --bin g7_p7_reco_rivals             < /tmp/r2/build/fresh/prefix-states.tsv > /tmp/r2/build/fresh/features.tsv
          cargo run -q -p search-geometry-core --bin g7_p12_shell_flow             < /tmp/r2/build/fresh/prefix-states.tsv > /tmp/r2/build/fresh/shell.tsv

      - name: Combine ancestry-preserving structural inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2/build/all
          cat /tmp/r2/build/legacy/context.jsonl /tmp/r2/build/fresh/context.jsonl > /tmp/r2/build/all/context.jsonl
          python3 - <<'PY'
          def combine(a,b,out):
              A=open(a,encoding='utf-8').read().splitlines()
              B=open(b,encoding='utf-8').read().splitlines()
              assert A and B and A[0]==B[0]
              open(out,'w',encoding='utf-8').write('\n'.join([A[0],*A[1:],*B[1:]])+'\n')
          combine('/tmp/r2/build/legacy/features.tsv','/tmp/r2/build/fresh/features.tsv','/tmp/r2/build/all/features.tsv')
          combine('/tmp/r2/build/legacy/shell.tsv','/tmp/r2/build/fresh/shell.tsv','/tmp/r2/build/all/shell.tsv')
          print('G7_P12_R2_ANCESTRY_COMBINE_PASS')
          PY

      - name: Execute threshold-free Pareto census
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2/build/out
          python3 scripts/g7-p12/census-opportunity-pareto.py             --features /tmp/r2/build/all/features.tsv             --shell /tmp/r2/build/all/shell.tsv             --context /tmp/r2/build/all/context.jsonl             --out /tmp/r2/build/out | tee /tmp/r2/build/run.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/r2/build/out/support-information-pareto-census.json'))
          assert x['behavioral_outcomes_used'] is False
          assert len(x['lattice_census'])==7
          assert x['verdict']=='JOINT_PARETO_FRONTIER_MAPPED__NO_THRESHOLD_SELECTION'
          print('G7_P12_R2_RESULT_GATE_PASS')
          print('FRESH',x['fresh_pareto_frontier'])
          print('LEGACY',x['legacy_pareto_frontier'])
          print('JOINT',x['joint_pareto_frontier'])
          print('ORDERING',x['ordering'])
          PY

      - name: Seal R2 artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2/seal/authority /tmp/r2/seal/derived
          cp g7/p12/r2-constitution.json g7/p12/r1-closure.json /tmp/r2/seal/authority/
          cp /tmp/r2/build/out/support-information-pareto-census.json /tmp/r2/seal/derived/
          cp /tmp/r2/build/run.log /tmp/r2/seal/derived/execution.log
          printf '%s\n'             'PHASE=G7-P12-R2'             'OPERATION=SUPPORT_INFORMATION_PARETO_FRONTIER_CENSUS'             'BEHAVIORAL_OUTCOMES_USED=NO'             'NEW_SOURCE_CONTACT=NONE'             'HUMAN_CONTACT_GATE=CLOSED'             > /tmp/r2/seal/AUTHORITY.txt
          (cd /tmp/r2/seal && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P12-R2-pareto-census-${{ github.sha }}
          path: /tmp/r2/seal
          retention-days: 90
