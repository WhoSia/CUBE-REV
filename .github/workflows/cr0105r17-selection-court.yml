name: CR0105R17 Selection Correction Court
on:
  push:
    branches: [cube-rev-0.10.5-r1.7-selection-court]
    paths: [cr0105r17/RUN_SELECTION]
permissions:
  contents: write
  actions: read
concurrency:
  group: cr0105r17-selection-court
  cancel-in-progress: false
jobs:
  court:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify parent and grammar lineage
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('research/0.10.5-r1.7/evidence-parent/PARENT_ARTIFACT_PROBE.json'))
          g=json.load(open('research/0.10.5-r1.7/evidence-grammar/DETAIL_GRAMMAR_PROBE.json'))
          assert p['status']=='PASS' and g['status']=='PASS'
          assert p['db_sha256']=='a04f1d2fd351e34ec7406e63524b7b8ceb166bf8a53d4630f94c9d6a792848f1'
          assert g['linked_unique_frame_rows']==3604
          print('R17_SELECTION_PREFLIGHT_PASS')
          PY
      - name: Restore frozen R1.6 analytical DB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r17selection
          gh api -H 'Accept: application/vnd.github+json' repos/${GITHUB_REPOSITORY}/actions/artifacts/9310311696/zip > /tmp/r17selection/r16.zip
          unzip -q /tmp/r17selection/r16.zip -d /tmp/r17selection/unpacked
          DB="$(find /tmp/r17selection/unpacked -type f -name 'wca333.duckdb' -print -quit)"
          test -n "$DB"
          test "$(sha256sum "$DB" | awk '{print $1}')" = 'a04f1d2fd351e34ec7406e63524b7b8ceb166bf8a53d4630f94c9d6a792848f1'
          echo "R17_PARENT_DB=$DB" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install selection runtime
        run: python -m pip install --disable-pip-version-check duckdb==1.3.2
      - name: Execute support and weight stability court
        run: |
          set -euo pipefail
          export R17_OUT="$GITHUB_WORKSPACE/research/0.10.5-r1.7/evidence-selection"
          python research/0.10.5-r1.7/r17_selection_court.py | tee /tmp/r17selection/selection.log
      - name: Persist metadata and commit evidence
        run: |
          set -euo pipefail
          cp /tmp/r17selection/selection.log research/0.10.5-r1.7/evidence-selection/SELECTION_LOG.txt
          python3 - <<'PY'
          import json,os,datetime,pathlib
          x={'schema_version':'CR0105R17-SELECTION-RUN-1','workflow_run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'parent_artifact_id':9310311696,'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'human_observations':0}
          pathlib.Path('research/0.10.5-r1.7/evidence-selection/RUN_METADATA.json').write_text(json.dumps(x,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/0.10.5-r1.7/evidence-selection
          git diff --cached --quiet || git commit -m "Record CUBE-REV 0.10.5-R1.7 selection court ${GITHUB_RUN_ID}"
          git push origin HEAD:cube-rev-0.10.5-r1.7-selection-court
      - uses: actions/upload-artifact@v4
        with:
          name: CR0105R17-selection-court
          retention-days: 30
          path: research/0.10.5-r1.7/evidence-selection/
