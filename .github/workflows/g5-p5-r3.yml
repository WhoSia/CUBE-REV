name: Validate G5-P5-R3 closure court

on:
  push:
    branches: ['research/current']
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  p5-r3:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Canonicalize Rust for diagnostic R3
        run: cargo fmt --all
      - name: Publish canonical R3 source blob without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          encoded="$(base64 -w0 crates/search-geometry-core/src/bin/p5_r3.rs)"
          sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" -f content="$encoded" -f encoding="base64" --jq '.sha')"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="success" -f context="g5-p5-r3/rustfmt-bin" -f description="$sha" >/dev/null
      - name: Workspace check
        run: cargo check --workspace
      - name: Workspace tests
        run: cargo test --workspace
      - name: Materialize R3 closure court
        run: |
          mkdir -p g5/p5/ci-output
          cargo run --release --quiet -p search-geometry-core --bin p5_r3 > g5/p5/ci-output/p5-r3.tsv
      - name: Upload R3 court
        uses: actions/upload-artifact@v4
        with:
          name: g5-p5-r3-closure-court
          path: g5/p5/ci-output/p5-r3.tsv
