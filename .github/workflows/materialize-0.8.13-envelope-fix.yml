name: CUBE-REV 0.8.13 canonical envelope materializer
on:
  push:
    branches: [cube-rev-0.8.13-native-browser-live-factory]
    paths:
      - '.github/workflows/materialize-0.8.13-envelope-fix.yml'
      - 'scripts/patch_0_8_13_transport_envelope.py'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cube-rev-0.8.13-native-browser-live-factory
          fetch-depth: 0
      - name: Apply exact function patch
        run: python scripts/patch_0_8_13_transport_envelope.py
      - name: Verify syntax and patch markers
        run: |
          node --check js/participant-cognitive-mode-0.8.13.js
          grep -F 'TRANSPORT_SESSION_INTERNAL_DIVERGENCE' js/participant-cognitive-mode-0.8.13.js
          grep -F 'return deepFreeze(envelope)' js/participant-cognitive-mode-0.8.13.js
      - name: Commit canonical envelope implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/participant-cognitive-mode-0.8.13.js
          if git diff --cached --quiet; then
            echo CR0813_CANONICAL_ENVELOPE_ALREADY_MATERIALIZED
          else
            git commit -m 'fix(0.8.13): freeze canonical Collector transport envelope [skip ci]'
            git push origin HEAD:cube-rev-0.8.13-native-browser-live-factory
          fi
