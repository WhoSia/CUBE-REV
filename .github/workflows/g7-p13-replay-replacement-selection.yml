name: G7-P13 replay-invalid selection repair seal

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p13/replay-invalid-replacement-amendment.json'
      - 'scripts/g7-p13/repair-replay-invalid-selection.py'
      - '.github/workflows/g7-p13-replay-replacement-selection.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Validate pre-geometry amendment
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('g7/p13/replay-invalid-replacement-amendment.json'))
          assert x['status']=='FROZEN_BEFORE_ANY_P13_GEOMETRY'
          assert x['replacement_rule']['replace_only']==[11370,11962,13073]
          assert x['replacement_rule']['same_sampling_cell'] is True
          assert x['replacement_rule']['same_selection_era'] is True
          assert x['replacement_rule']['same_acquisition_batch'] is True
          print('G7_P13_REPLACEMENT_AMENDMENT_PASS')
          PY

      - name: Recover immutable authorities
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p13/orig /tmp/p13/p8 /tmp/p13/p3 /tmp/p13/p11
          fetch_artifact () {
            id="$1"; dir="$2"; expected="$3"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/artifacts/$id/zip" \
              -o "/tmp/p13/$dir.zip"
            echo "$expected  /tmp/p13/$dir.zip" | sha256sum -c -
            unzip -q "/tmp/p13/$dir.zip" -d "/tmp/p13/$dir"
          }
          fetch_artifact 11272225709 orig d41f3c558fd8b9fa8d595f146a225e462732d49e5fca8a67f52802b64e34d6c6
          fetch_artifact 11238930249 p8 460dc657565541b663f1bc91b6e75490a7591f56946a41c28af60802ee27f16a
          fetch_artifact 11205587281 p3 acb3dff14bbdb33fe4be3550e64eeba55dcb1879b85d6b8c1eacca7d9408c4e4
          fetch_artifact 11242753632 p11 45145487febf4d9fc975299ffe567a9e20ae63cb744a6205bd53f661941f8a67
          echo G7_P13_REPLACEMENT_INPUT_AUTHORITY_PASS

      - name: Materialize deterministic replacements
        run: |
          set -euo pipefail
          ORIG="$(find /tmp/p13/orig -name selection-manifest.json -print -quit)"
          COV="$(find /tmp/p13/p8 -name frozen-index-covariates.jsonl -print -quit)"
          IDX="$(find /tmp/p13/p3 -name linkage-support.jsonl -print -quit)"
          P11="$(find /tmp/p13/p11 -name selection-manifest.json -print -quit)"
          mkdir -p /tmp/p13/out
          python3 scripts/g7-p13/repair-replay-invalid-selection.py \
            --original-manifest "$ORIG" \
            --covariates "$COV" \
            --frozen-index "$IDX" \
            --legacy60 g7/p7/source-provenance-recovery.json \
            --p11-manifest "$P11" \
            --out /tmp/p13/out | tee /tmp/p13/repair.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/p13/out/selection-manifest-repaired.json'))
          assert x['status']=='SEALED_AFTER_PRE_GEOMETRY_REPLAY_INVALID_REPLACEMENT'
          assert x['target_total']==80
          assert set(map(int,x['replacements']))=={11370,11962,13073}
          assert all(v==20 for v in x['selected_cell_counts'].values())
          assert all(v==20 for v in x['selected_era_counts'].values())
          assert all(len(x['batches'][str(i)])==10 for i in range(1,9))
          print('G7_P13_REPLACEMENT_RESULT_GATE_PASS')
          print('REPLACEMENTS',x['replacements'])
          print('MANIFEST_SHA256',x['selection_manifest_sha256'])
          PY

      - name: Seal repaired selection
        run: |
          set -euo pipefail
          mkdir -p /tmp/p13/seal/authority /tmp/p13/seal/derived
          cp g7/p13/replay-invalid-replacement-amendment.json /tmp/p13/seal/authority/
          cp /tmp/p13/out/selection-manifest-repaired.json /tmp/p13/seal/derived/
          cp /tmp/p13/out/batch-*-source-ids.txt /tmp/p13/seal/derived/
          cp /tmp/p13/repair.log /tmp/p13/seal/derived/
          printf '%s\n' \
            'PHASE=G7-P13' \
            'OPERATION=PRE_GEOMETRY_REPLAY_INVALID_SELECTION_REPAIR' \
            'REPLACED=3' \
            'GEOMETRY_OPENED=NO' \
            'PRIOR100_EXCLUDED=YES' \
            > /tmp/p13/seal/AUTHORITY.txt
          (cd /tmp/p13/seal && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P13-repaired-selection-${{ github.sha }}
          path: /tmp/p13/seal
          retention-days: 90
