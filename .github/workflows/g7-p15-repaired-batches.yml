name: G7-P15 repaired fresh96 batches 1 and 12

on:
  push:
    branches: ['research/current']
    paths:
      - 'scripts/g7-p15/acquire-fresh96-repaired-batch.mjs'
      - '.github/workflows/g7-p15-repaired-batches.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: g7-p15-fresh96-repair-batches
  cancel-in-progress: false

jobs:
  batch:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: [1,12]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}

      - name: Zero-bot writeback firewall
        run: |
          set -euo pipefail
          ! grep -E 'git +(commit|push|tag)|contents: *write|github-actions\[bot\]' '.github/workflows/g7-p15-repaired-batches.yml'
          echo G7_P15_REPAIR_BATCH_ZERO_BOT_PASS

      - name: Recover repaired selection authority
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p15-repaired
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/artifacts/11307872805/zip" \
            -o /tmp/p15-repaired.zip
          echo 'b55c4057d62ba6649ef7c56a76ab21c90a5f911dcf05291d4f16046300048d91  /tmp/p15-repaired.zip' | sha256sum -c -
          unzip -q /tmp/p15-repaired.zip -d /tmp/p15-repaired
          MANIFEST="$(find /tmp/p15-repaired -name selection-manifest-repaired.json -print -quit)"
          test -n "$MANIFEST"
          node - "$MANIFEST" '${{ matrix.batch }}' <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const b=String(process.argv[3]);
          if(x.status!=='SEALED_AFTER_PRE_GEOMETRY_REPLAY_INVALID_REPLACEMENT') process.exit(1);
          if(x.selection_manifest_sha256!=='74d1b5becd25d5dd66028dce46cf73a95b9fc68a53ff6bb51d8366c97fb117cc') process.exit(2);
          if(!Array.isArray(x.batches[b])||x.batches[b].length!==8) process.exit(3);
          console.log('G7_P15_REPAIRED_BATCH_AUTHORITY_PASS',b,x.batches[b].join(','));
          NODE

      - name: Acquire repaired batch
        run: |
          set -euo pipefail
          B='${{ matrix.batch }}'
          PAD="$(printf '%02d' "$B")"
          MANIFEST="$(find /tmp/p15-repaired -name selection-manifest-repaired.json -print -quit)"
          OUT="/tmp/g7-p15-repaired-batch$PAD"
          rm -rf "$OUT"
          node scripts/g7-p15/acquire-fresh96-repaired-batch.mjs \
            --manifest "$MANIFEST" --batch "$B" --out "$OUT" --execute | tee "/tmp/g7-p15-repaired-batch$PAD.log"

      - name: Exact replay repaired batch
        run: |
          set -euo pipefail
          B='${{ matrix.batch }}'
          PAD="$(printf '%02d' "$B")"
          OUT="/tmp/g7-p15-repaired-batch$PAD"
          node scripts/cube/replay-exact-trajectories.mjs --input "$OUT/derived/solves.jsonl" --out "$OUT/exact"
          node - "$OUT/exact/exact-trajectories.json" "$B" <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const b=process.argv[3];
          if(x.solve_count!==8||x.exact_end_validation_pass!==8) process.exit(1);
          console.log('G7_P15_REPAIRED_BATCH_EXACT_PASS');
          console.log('BATCH\t'+b);
          console.log('PREFIXES\t'+x.total_prefixes);
          NODE

      - name: Seal repaired batch
        run: |
          set -euo pipefail
          B='${{ matrix.batch }}'
          PAD="$(printf '%02d' "$B")"
          OUT="/tmp/g7-p15-repaired-batch$PAD"
          cp "/tmp/g7-p15-repaired-batch$PAD.log" "$OUT/"
          printf '%s\n' \
            'PHASE=G7-P15' \
            "BATCH=$B" \
            'SOLVES=8' \
            'REPAIRED_SELECTION_ARTIFACT=11307872805' \
            'REPAIRED_MANIFEST_SHA256=74d1b5becd25d5dd66028dce46cf73a95b9fc68a53ff6bb51d8366c97fb117cc' \
            'GEOMETRY_OPENED_BEFORE_REPAIR=NO' \
            'RAW_PUBLIC_RELEASE=HOLD' \
            > "$OUT/AUTHORITY.txt"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P15-repaired-batch${{ matrix.batch }}-${{ github.sha }}
          path: /tmp/g7-p15-repaired-batch*
          retention-days: 90
