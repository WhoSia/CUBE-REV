name: CUBE-REV 0.8.15 cognitive mechanism lattice
on:
  push:
    branches: [cube-rev-0.8.15-cognitive-mechanism-lattice]
  pull_request:
    branches: [cube-rev-0.8.14-custody-device-staging]
    paths:
      - '.github/workflows/build-0.8.15-cognitive-mechanism-lattice.yml'
      - 'analysis/cognitive_mechanism_lattice_0_8_15.py'
      - 'tests/mechanism_lattice_0.8.15.test.py'
      - 'research/CUBE_REV_0.8.15*'
permissions:
  contents: read
jobs:
  mechanism-lattice:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cube-rev-0.8.15-cognitive-mechanism-lattice
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and protected-scope checks
        shell: bash
        run: |
          python -m py_compile analysis/cognitive_mechanism_lattice_0_8_15.py
          python -m py_compile tests/mechanism_lattice_0.8.15.test.py
          git fetch origin cube-rev-0.8.14-custody-device-staging
          protected='^(index\.html|collector-config\.js|js/collector-client\.js|participant-cognitive-mode-0\.8\.14\.html|unsupported-browser-0\.8\.14\.html|cognitive/PARTICIPANT_STIMULUS_BANK_0\.8\.13\.json|cognitive/COGNITIVE_MODE_CONFIG_0\.8\.13\.json)$'
          changed="$(git diff --name-only origin/cube-rev-0.8.14-custody-device-staging...HEAD)"
          if printf '%s\n' "$changed" | grep -E "$protected"; then
            echo 'Protected participant, bank, Collector, or production file changed.' >&2
            exit 1
          fi
      - name: Execute full mechanism lattice twice
        shell: bash
        run: |
          rm -rf artifacts/0.8.15 /tmp/cr0815-a /tmp/cr0815-b
          python analysis/cognitive_mechanism_lattice_0_8_15.py \
            --bank cognitive/PARTICIPANT_STIMULUS_BANK_0.8.13.json \
            --config cognitive/COGNITIVE_MODE_CONFIG_0.8.13.json \
            --outdir /tmp/cr0815-a \
            --sessions-per-mechanism 240 \
            --seed 8152026
          python analysis/cognitive_mechanism_lattice_0_8_15.py \
            --bank cognitive/PARTICIPANT_STIMULUS_BANK_0.8.13.json \
            --config cognitive/COGNITIVE_MODE_CONFIG_0.8.13.json \
            --outdir /tmp/cr0815-b \
            --sessions-per-mechanism 240 \
            --seed 8152026
          diff -ru /tmp/cr0815-a /tmp/cr0815-b
          mkdir -p artifacts
          mv /tmp/cr0815-a artifacts/0.8.15
      - name: Validate positive and negative controls
        run: python tests/mechanism_lattice_0.8.15.test.py
      - name: Verify committed research outputs
        shell: bash
        run: |
          cmp artifacts/0.8.15/CUBE_REV_0.8.15_MECHANISM_AXIS_REGISTRY.json research/CUBE_REV_0.8.15_MECHANISM_AXIS_REGISTRY.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/0.8.15/mechanism_identifiability_result.json')
          d=json.loads(p.read_text())
          pairs=d['predeclared_pair_results']
          assert pairs['h1_vs_h3']['classification']=='IDENTIFIABLE'
          assert pairs['stationary_h1_vs_switch']['classification']=='IDENTIFIABLE'
          assert pairs['open_vs_closed_loop']['classification']=='NON_IDENTIFIABLE'
          assert pairs['high_vs_low_capacity_same_policy']['classification']=='NON_IDENTIFIABLE'
          assert d['instrument_conclusions']['orientation_equivariance']=='PARTIAL_SINGLE_ROTATIONAL_PAIR'
          assert d['instrument_conclusions']['chunk_boundary_cost']=='NOT_IDENTIFIABLE_SINGLE_ACTION_TRIALS'
          assert d['instrument_conclusions']['recovery_monitoring']=='NOT_IDENTIFIABLE_NO_POST_ERROR_TRAJECTORY'
          print('CR0815_STATIC_RESEARCH_OUTPUTS_PASS')
          PY
      - name: Emit evidence digest inventory
        shell: bash
        run: |
          find artifacts/0.8.15 -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/0.8.15/ARTIFACT_SHA256SUMS.txt
          cp research/CUBE_REV_0.8.15_VALIDATION_REPORT.md artifacts/0.8.15/
          cp research/CUBE_REV_0.8.15_DECISION_PACKET.json artifacts/0.8.15/
          cp research/CUBE_REV_0.8.15_LITERATURE_ANCHORS.md artifacts/0.8.15/
          echo 'CR0815_COGNITIVE_MECHANISM_LATTICE_CI_PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cube-rev-0.8.15-cognitive-mechanism-lattice-evidence
          path: artifacts/0.8.15
          retention-days: 14
          if-no-files-found: error
