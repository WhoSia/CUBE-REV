name: G7-P15 second replay-invalid selection repair seal

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p15/replay-invalid-replacement-amendment-v2.json'
      - 'scripts/g7-p15/repair-fresh96-replay-invalid-v2.py'
      - '.github/workflows/g7-p15-replay-replacement-selection-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Zero-bot and second-amendment gate
        run: |
          set -euo pipefail
          ! grep -E 'git +(commit|push|tag)|contents: *write|github-actions\[bot\]' '.github/workflows/g7-p15-replay-replacement-selection-v2.yml'
          python3 - <<'PY'
          import json
          x=json.load(open('g7/p15/replay-invalid-replacement-amendment-v2.json'))
          assert x['status']=='FROZEN_BEFORE_ANY_P15_GEOMETRY'
          assert x['replacement_rule']['replace_only']==[2013]
          assert x['base_manifest_sha256']=='74d1b5becd25d5dd66028dce46cf73a95b9fc68a53ff6bb51d8366c97fb117cc'
          print('G7_P15_SECOND_REPAIR_AMENDMENT_PASS')
          print('G7_P15_ZERO_BOT_WRITEBACK_PATTERN_PASS')
          PY

      - name: Recover immutable base and prior-contact authorities
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p15/base /tmp/p15/p8 /tmp/p15/p3 /tmp/p15/p11 /tmp/p15/p13o /tmp/p15/p13r /tmp/p15/p14o /tmp/p15/p14r
          fetch_artifact () {
            id="$1"; dir="$2"; expected="$3"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/artifacts/$id/zip" \
              -o "/tmp/p15/$dir.zip"
            echo "$expected  /tmp/p15/$dir.zip" | sha256sum -c -
            unzip -q "/tmp/p15/$dir.zip" -d "/tmp/p15/$dir"
          }
          fetch_artifact 11307872805 base b55c4057d62ba6649ef7c56a76ab21c90a5f911dcf05291d4f16046300048d91
          fetch_artifact 11238930249 p8 460dc657565541b663f1bc91b6e75490a7591f56946a41c28af60802ee27f16a
          fetch_artifact 11205587281 p3 acb3dff14bbdb33fe4be3550e64eeba55dcb1879b85d6b8c1eacca7d9408c4e4
          fetch_artifact 11242753632 p11 45145487febf4d9fc975299ffe567a9e20ae63cb744a6205bd53f661941f8a67
          fetch_artifact 11272225709 p13o d41f3c558fd8b9fa8d595f146a225e462732d49e5fca8a67f52802b64e34d6c6
          fetch_artifact 11301332731 p13r 550bdfb59023aeb6e1804afb4c1ca358c397892a5785e08d07fcabe0915442e2
          fetch_artifact 11301404290 p14o 71faa1be721940b670c871a79a9af5bac63f84dc751b08b3a8098ff19025a46f
          fetch_artifact 11301826265 p14r aef35848ce24010b22ffcda96739b2503bed808e0196687ddf4988cf43f05440
          echo G7_P15_SECOND_REPAIR_INPUT_AUTHORITY_PASS

      - name: Materialize second deterministic repair
        run: |
          set -euo pipefail
          python3 scripts/g7-p15/repair-fresh96-replay-invalid-v2.py \
            --amendment g7/p15/replay-invalid-replacement-amendment-v2.json \
            --base-manifest "$(find /tmp/p15/base -name selection-manifest-repaired.json -print -quit)" \
            --covariates "$(find /tmp/p15/p8 -name frozen-index-covariates.jsonl -print -quit)" \
            --frozen-index "$(find /tmp/p15/p3 -name linkage-support.jsonl -print -quit)" \
            --legacy60 g7/p7/source-provenance-recovery.json \
            --p11-manifest "$(find /tmp/p15/p11 -name selection-manifest.json -print -quit)" \
            --p13-original "$(find /tmp/p15/p13o -name selection-manifest.json -print -quit)" \
            --p13-repaired "$(find /tmp/p15/p13r -name selection-manifest-repaired.json -print -quit)" \
            --p14-original "$(find /tmp/p15/p14o -name selection-manifest.json -print -quit)" \
            --p14-repaired "$(find /tmp/p15/p14r -name selection-manifest-repaired.json -print -quit)" \
            --out /tmp/p15/out | tee /tmp/p15/repair-v2.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/p15/out/selection-manifest-repaired-v2.json'))
          assert x['target_total']==96
          assert all(v==6 for v in x['selected_cell_counts'].values())
          assert all(len(x['batches'][str(i)])==8 for i in range(1,13))
          assert set(x['replacements'])=={'2013'}
          print('G7_P15_SECOND_REPAIR_RESULT_GATE_PASS')
          print('REPLACEMENTS',x['replacements'])
          print('MANIFEST_SHA256',x['selection_manifest_sha256'])
          print('BATCH1',x['batches']['1'])
          PY

      - name: Seal second repaired selection
        run: |
          set -euo pipefail
          mkdir -p /tmp/p15/seal/authority /tmp/p15/seal/derived
          cp g7/p15/replay-invalid-replacement-amendment-v2.json g7/p15/analysis-implementation-preseal.json /tmp/p15/seal/authority/
          cp /tmp/p15/out/selection-manifest-repaired-v2.json /tmp/p15/seal/derived/
          cp /tmp/p15/out/batch-*-source-ids.txt /tmp/p15/seal/derived/
          cp /tmp/p15/repair-v2.log /tmp/p15/seal/derived/
          printf '%s\n' \
            'PHASE=G7-P15' \
            'OPERATION=SECOND_PRE_GEOMETRY_REPLAY_REPAIR' \
            'REPLACED=1' \
            'GEOMETRY_OPENED=NO' \
            'HUMAN_CONTACT_GATE=CLOSED' \
            > /tmp/p15/seal/AUTHORITY.txt
          (cd /tmp/p15/seal && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P15-repaired-selection-v2-${{ github.sha }}
          path: /tmp/p15/seal
          retention-days: 90
