name: Validate G7-P2 reconstruction corpus intake

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p2/**'
      - 'scripts/g7-p2/**'
      - '.github/workflows/g7-p2.yml'
  pull_request:
    paths:
      - 'g7/p2/**'
      - 'scripts/g7-p2/**'
      - '.github/workflows/g7-p2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g7-p2-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node scripts/g7-p2/validate-source-registry.mjs
      - run: node scripts/g7-p2/test-parser.mjs
      - run: node scripts/g7-p2/test-reco-parser.mjs
      - run: node scripts/g7-p2/test-reco-acquisition.mjs
      - name: Validate JSON schema syntax
        run: node -e "JSON.parse(require('fs').readFileSync('g7/p2/human-solve-record.schema.json','utf8')); console.log('G7_P2_SCHEMA_JSON_PASS')"
      - name: Validate intake manifest
        run: |
          test -s g7/p2/manual-intake.tsv
          grep -q '^cubesolves_2014_dump' g7/p2/manual-intake.tsv
          grep -q '^cubedb' g7/p2/manual-intake.tsv
          grep -q '^speedcubing_reconstructions' g7/p2/manual-intake.tsv
          echo G7_P2_MANUAL_INTAKE_MANIFEST_PASS
      - run: python -m unittest scripts/g7-p2/test-cubesolves-extractor.py
      - name: Build intake-ready receipt
        run: |
          mkdir -p g7/p2/build
          node scripts/g7-p2/validate-source-registry.mjs > g7/p2/build/source-registry-receipt.txt
          node scripts/g7-p2/test-parser.mjs > g7/p2/build/parser-receipt.txt
          node scripts/g7-p2/test-reco-parser.mjs > g7/p2/build/reco-parser-receipt.txt
          node scripts/g7-p2/test-reco-acquisition.mjs > g7/p2/build/reco-acquisition-policy-receipt.txt
          python -m unittest scripts/g7-p2/test-cubesolves-extractor.py > g7/p2/build/cubesolves-extractor-receipt.txt 2>&1
          cp g7/p2/source-registry.json g7/p2/build/
          cp g7/p2/human-solve-record.schema.json g7/p2/build/
          cp g7/p2/manual-intake.tsv g7/p2/build/
          cp g7/p2/reco-acquisition-policy.json g7/p2/build/
      - uses: actions/upload-artifact@v4
        with:
          name: G7-P2-intake-ready-${{ github.sha }}
          path: g7/p2/build
          if-no-files-found: error

  reco-bounded-materialize:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute bounded real capture
        run: |
          set -o pipefail
          rm -rf /tmp/reco-bounded-capture
          node scripts/g7-p2/acquire-reco.mjs --execute --page-start 1 --pages 1 --max-solves 10 --puzzle 3x3 --delay-ms 2000 --out /tmp/reco-bounded-capture
      - name: Validate capture and custody
        run: |
          set -o pipefail
          node scripts/g7-p2/validate-reco-bounded-capture.mjs /tmp/reco-bounded-capture 10 | tee /tmp/reco-bounded-capture/validation-receipt.txt
          (cd /tmp/reco-bounded-capture && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          test "$(find /tmp/reco-bounded-capture/raw/solve -type f -name '*.html' | wc -l)" -eq 10
          test -s /tmp/reco-bounded-capture/derived/solves.jsonl
          test -s /tmp/reco-bounded-capture/capture-manifest.json
          echo G7_P2_RECO_BOUNDED_CUSTODY_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: G7-P2-reco-bounded-capture-${{ github.sha }}
          path: /tmp/reco-bounded-capture
          if-no-files-found: error
          retention-days: 1

  reco-index-census:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute index-only census
        run: |
          set -o pipefail
          rm -rf /tmp/reco-index-census
          mkdir -p /tmp/reco-index-census/derived
          node scripts/g7-p2/census-reco-index.mjs --out /tmp/reco-index-census --delay-ms 2000 --max-pages 400 | tee /tmp/reco-index-census/derived/execution.log
      - name: Seal census evidence
        run: |
          (cd /tmp/reco-index-census && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          test -s /tmp/reco-index-census/derived/census.json
          test -s /tmp/reco-index-census/derived/index-rows.jsonl
          grep -q $'SOLVE_BODY_REQUESTS\\t0' /tmp/reco-index-census/derived/execution.log
          echo G7_P2_RECO_INDEX_CENSUS_CUSTODY_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: G7-P2-reco-index-census-${{ github.sha }}
          path: /tmp/reco-index-census
          if-no-files-found: error
          retention-days: 1

