name: Validate G7-P5 prospective planning instrument

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p5/**'
      - 'scripts/g7-p5/**'
      - 'crates/search-geometry-core/src/bin/g7_p5_*.rs'
      - '.github/workflows/g7-p5.yml'
  pull_request:
    paths:
      - 'g7/p5/**'
      - 'scripts/g7-p5/**'
      - 'crates/search-geometry-core/src/bin/g7_p5_*.rs'
      - '.github/workflows/g7-p5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g7-p5-precontact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Frozen authority gates
        run: |
          set -euo pipefail
          node - <<'NODE'
          const p=require('./g7/p5/preseal.json');
          const s=require('./g7/p5/instrument-schema.json');
          const c=require('./g7/p5/contact-constitution.json');
          const r=require('./g7/p5/rival-ecology-court.json');
          if(p.human_contact.live_data_collection_authorized_by_this_phase!==false) process.exit(1);
          if(c.status!=='DESIGN_ONLY_HUMAN_CONTACT_CLOSED') process.exit(2);
          if(!s.required_event_types.includes('choice_committed')) process.exit(3);
          if(r.status!=='PRESEALED_BEFORE_ECOLOGY_EXECUTION') process.exit(4);
          console.log('G7_P5_AUTHORITY_PASS');
          NODE

      - name: Polyglot unit gates
        run: |
          set -euo pipefail
          node scripts/g7-p5/test-packet-generator.mjs
          node scripts/g7-p5/test-instrument-synthetic.mjs
          node scripts/g7-p5/test-browser-core.mjs
          node scripts/g7-p5/test-state-net.mjs
          node scripts/g7-p5/test-event-integrity.mjs
          node scripts/g7-p5/test-packet-audit.mjs
          node scripts/g7-p5/test-analysis.mjs
          node scripts/g7-p5/test-sensitivity.mjs
          node scripts/g7-p5/test-instrument-closure.mjs
          node scripts/g7-p5/test-rival-ecology.mjs
          node scripts/g7-p5/test-fresh-packet-replication.mjs
          node scripts/g7-p5/test-final-precontact.mjs

      - name: Materialize canonical packet and audit
        run: |
          set -euo pipefail
          rm -rf /tmp/g7-p5
          mkdir -p /tmp/g7-p5
          cargo run -q -p search-geometry-core --bin g7_p5_packet_generator > /tmp/g7-p5/packet.tsv
          node scripts/g7-p5/compile-packet.mjs /tmp/g7-p5/packet.tsv /tmp/g7-p5/packet.json | tee /tmp/g7-p5/packet.log
          node scripts/g7-p5/audit-packet.mjs /tmp/g7-p5/packet.json /tmp/g7-p5/packet-audit.json
          test "$(node -e "console.log(require('/tmp/g7-p5/packet.json').trials.length)")" -eq 24

      - name: Materialize rival ecology and fresh packet replication
        run: |
          set -euo pipefail
          cargo run -q -p search-geometry-core --bin g7_p5_rival_ecology | tee /tmp/g7-p5/rival-ecology.tsv
          node scripts/g7-p5/fresh-packet-replication.mjs /tmp/g7-p5/fresh-packet-replication.json

      - name: Synthetic end-to-end validation
        run: |
          set -euo pipefail
          node scripts/g7-p5/synthesize-events.mjs /tmp/g7-p5/packet.json /tmp/g7-p5/synthetic-events.jsonl
          node scripts/g7-p5/validate-event-integrity.mjs /tmp/g7-p5/packet.json /tmp/g7-p5/synthetic-events.jsonl /tmp/g7-p5/event-integrity.json
          python3 scripts/g7-p5/analyze.py             --packet /tmp/g7-p5/packet.json             --events /tmp/g7-p5/synthetic-events.jsonl             --out /tmp/g7-p5/analysis             --permutations 20000
          python3 scripts/g7-p5/sensitivity.py --out /tmp/g7-p5/sensitivity.json --reps 5000
          node scripts/g7-p5/evaluate-instrument.mjs             --audit /tmp/g7-p5/packet-audit.json             --analysis /tmp/g7-p5/analysis/analysis.json             --sensitivity /tmp/g7-p5/sensitivity.json             --out /tmp/g7-p5/closure
          node scripts/g7-p5/evaluate-final-precontact.mjs             --instrument /tmp/g7-p5/closure/G7-P5-INSTRUMENT-CLOSURE.json             --fresh /tmp/g7-p5/fresh-packet-replication.json             --ecology /tmp/g7-p5/rival-ecology.tsv             --out /tmp/g7-p5/final
          node - <<'NODE'
          const i=require('/tmp/g7-p5/closure/G7-P5-INSTRUMENT-CLOSURE.json');
          const f=require('/tmp/g7-p5/final/G7-P5-FINAL-PRECONTACT.json');
          if(i.verdict!=='PASS_INSTRUMENT_VALIDATED_HUMAN_CONTACT_NOT_YET_OPEN') process.exit(1);
          if(i.human_contact_open) process.exit(2);
          if(!f.p5_close_recommended||!f.next_phase_permission) process.exit(3);
          console.log('G7_P5_INSTRUMENT_FINAL_PASS');
          console.log('G7_P5_FINAL_PRECONTACT_PASS');
          console.log('EXPANDED_ECOLOGY_NEXT_PHASE\t'+f.expanded_rival_ecology_required_next_phase);
          NODE

      - name: Seal precontact authority artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/g7-p5/authority /tmp/g7-p5/web
          cp g7/p5/preseal.json g7/p5/instrument-schema.json g7/p5/contact-constitution.json g7/p5/rival-ecology-court.json /tmp/g7-p5/authority/
          cp g7/p5/web/index.html g7/p5/web/app.mjs g7/p5/web/browser-core.mjs g7/p5/web/state-net.mjs /tmp/g7-p5/web/
          printf '%s\n'             'HUMAN_CONTACT=DESIGN_ONLY_HUMAN_CONTACT_CLOSED'             'LIVE_DATA=NONE'             'SYNTHETIC_ONLY=YES' > /tmp/g7-p5/AUTHORITY.txt
          (cd /tmp/g7-p5 && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P5-precontact-${{ github.sha }}
          path: /tmp/g7-p5
          if-no-files-found: error
          retention-days: 90
