name: CR0105R17 Full Route Court
on:
  push:
    branches: [cube-rev-0.10.5-r1.7-full-court]
    paths: [cr0105r17/RUN_FULL_ROUTE]
permissions:
  contents: write
  actions: read
concurrency:
  group: cr0105r17-full-route-court
  cancel-in-progress: false
jobs:
  court:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify parent and solved-validator lineage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open('research/0.10.5-r1.7/evidence-parent/PARENT_ARTIFACT_PROBE.json'))
          v=json.load(open('research/0.10.5-r1.7/evidence-pattern-solved/KPATTERN_SOLVED_FIXTURE.json'))
          assert p['status']=='PASS'
          assert p['db_sha256']=='a04f1d2fd351e34ec7406e63524b7b8ceb166bf8a53d4630f94c9d6a792848f1'
          assert v['predicate_discrepancy_count']==3
          assert v['decision']=='REPLACE_HANDROLLED_ORIENTATION_HASH_WITH_KPATTERN_SOLVED'
          print('R17_FULL_LOCAL_LINEAGE_PASS')
          PY
      - name: Verify phase and target-selection courts from sealed sibling branches
        run: |
          set -euo pipefail
          git fetch origin cube-rev-0.10.5-r1.7-counterfactual-route cube-rev-0.10.5-r1.7-selection-court
          git show origin/cube-rev-0.10.5-r1.7-counterfactual-route:research/0.10.5-r1.7/evidence-phase-taxonomy/PHASE_TAXONOMY_COURT.json > /tmp/r17_phase.json
          git show origin/cube-rev-0.10.5-r1.7-selection-court:research/0.10.5-r1.7/evidence-selection-target/TARGET_SELECTION_ADJUDICATION.json > /tmp/r17_target.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/r17_phase.json')); t=json.load(open('/tmp/r17_target.json'))
          assert p['status']=='PASS' and p['post_inspection_classification_rate']>0.98
          assert 'UNDER10_SPEED_X_ERA' in t['internal_weight_gate_passes']
          assert t['estimand_decision']['full_wca_population']=='PROHIBITED_ZERO_OVERLAP'
          print('R17_PHASE_SELECTION_LINEAGE_PASS')
          PY
      - name: Restore exact frozen R1.6 analytical DB once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r17full
          gh api -H 'Accept: application/vnd.github+json' repos/${GITHUB_REPOSITORY}/actions/artifacts/9310311696/zip > /tmp/r17full/r16.zip
          unzip -q /tmp/r17full/r16.zip -d /tmp/r17full/unpacked
          DB="$(find /tmp/r17full/unpacked -type f -name 'wca333.duckdb' -print -quit)"
          test -n "$DB"
          test "$(sha256sum "$DB" | awk '{print $1}')" = 'a04f1d2fd351e34ec7406e63524b7b8ceb166bf8a53d4630f94c9d6a792848f1'
          echo "R17_PARENT_DB=$DB" >> "$GITHUB_ENV"
          echo "R17_FULL_ROOT=/tmp/r17full" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install frozen analytical runtimes
        run: |
          python -m pip install --disable-pip-version-check duckdb==1.3.2 requests==2.32.4 beautifulsoup4==4.13.4 lxml==6.0.0
          npm install --no-save --ignore-scripts cubing@0.63.3
      - name: Prepare prospective 900-attempt target-stratified sample
        id: sample
        shell: bash
        run: |
          set +e
          python research/0.10.5-r1.7/r17_prepare_full_route_court.py 2>&1 | tee /tmp/r17full/sample.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run state admission gate then phase-aware counterfactual court
        id: route
        if: always()
        shell: bash
        run: |
          set +e
          if test -f /tmp/r17full/FULL_ROUTE_SAMPLE_MANIFEST.json; then
            node research/0.10.5-r1.7/r17_full_route_court.mjs 2>&1 | tee /tmp/r17full/route.log
            code=${PIPESTATUS[0]}
          else
            echo 'FULL_ROUTE_SAMPLE_MANIFEST_MISSING' | tee /tmp/r17full/route.log
            code=98
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist full-court evidence regardless of gate result
        if: always()
        run: |
          set -euo pipefail
          mkdir -p research/0.10.5-r1.7/evidence-full-route
          test -f /tmp/r17full/FULL_ROUTE_SAMPLE_MANIFEST.json && cp /tmp/r17full/FULL_ROUTE_SAMPLE_MANIFEST.json research/0.10.5-r1.7/evidence-full-route/ || true
          test -d /tmp/r17full/route && cp /tmp/r17full/route/*.json research/0.10.5-r1.7/evidence-full-route/ 2>/dev/null || true
          test -f /tmp/r17full/sample.log && cp /tmp/r17full/sample.log research/0.10.5-r1.7/evidence-full-route/SAMPLE_LOG.txt || true
          test -f /tmp/r17full/route.log && cp /tmp/r17full/route.log research/0.10.5-r1.7/evidence-full-route/ROUTE_LOG.txt || true
          cp /tmp/r17_phase.json research/0.10.5-r1.7/evidence-full-route/PHASE_LINEAGE.json
          cp /tmp/r17_target.json research/0.10.5-r1.7/evidence-full-route/TARGET_SELECTION_LINEAGE.json
          python3 - <<'PY'
          import json,os,datetime,pathlib
          s=int('${{ steps.sample.outputs.exit_code || 97 }}'); r=int('${{ steps.route.outputs.exit_code || 97 }}')
          x={'schema_version':'CR0105R17-FULL-ROUTE-RUN-1','workflow_run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'parent_artifact_id':9310311696,'parent_db_sha256':'a04f1d2fd351e34ec7406e63524b7b8ceb166bf8a53d4630f94c9d6a792848f1','sample_exit_code':s,'route_exit_code':r,'status':'PASS' if s==0 and r==0 else 'HOLD','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'human_observations':0}
          pathlib.Path('research/0.10.5-r1.7/evidence-full-route/RUN_METADATA.json').write_text(json.dumps(x,indent=2)+'\n')
          PY
      - name: Commit full-court evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/0.10.5-r1.7/evidence-full-route
          git diff --cached --quiet || git commit -m "Record CUBE-REV 0.10.5-R1.7 full route court ${GITHUB_RUN_ID}"
          git push origin HEAD:cube-rev-0.10.5-r1.7-full-court
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CR0105R17-full-route-court
          retention-days: 30
          if-no-files-found: warn
          path: research/0.10.5-r1.7/evidence-full-route/
      - name: Enforce full R1.7 route gate
        if: always()
        run: |
          test '${{ steps.sample.outputs.exit_code }}' = '0'
          test '${{ steps.route.outputs.exit_code }}' = '0'
          python3 - <<'PY'
          import json
          g=json.load(open('research/0.10.5-r1.7/evidence-full-route/ROUTE_ADMISSION_GATE.json'))
          r=json.load(open('research/0.10.5-r1.7/evidence-full-route/FULL_ROUTE_COURT.json'))
          assert g['status']=='PASS',g
          assert r['status']=='PASS',r
          assert r['human_observations']==0
          print('CR0105R17_FULL_ROUTE_PASS')
          PY
