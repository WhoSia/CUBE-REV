name: CUBE-REV 0.19 R5 Six-Word SAT and External DRUP Proof

on:
  push:
    branches: [research/current]
    paths:
      - 'scripts/cuberev-019/prove-L5-five-source-k6-SAT.py'
      - 'scripts/cuberev-019/verify-L5-R5-rank-symmetry-and-pair-cuts.py'
      - 'docs/0.19/P8_ORDER_INVARIANT_L5_FIVE_ONLY_LP_CERT.json'
      - 'scripts/cuberev-019/verify-L5-seven-five-source-and-extension.py'
      - 'scripts/cuberev-019/export-L5-physical.mjs'
      - '.github/workflows/cuberev-019-r5-k6-exact-court.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r5-six-experiment-court:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate original 0.18 source requirements and all real L5 partitions
        run: |
          mkdir -p /tmp/cuberev019-p10
          node scripts/cuberev-018/export-mstar-physical.mjs /tmp/cuberev019-p10/physical.json
          node scripts/cuberev-019/export-L5-physical.mjs /tmp/cuberev019-p10/physical.json /tmp/cuberev019-p10/partitions.tsv
          test "$(wc -l < /tmp/cuberev019-p10/partitions.tsv)" -eq 14938
      - name: Export independent physical eighteen-by-twenty-four edge action map
        run: |
          node --input-type=module > /tmp/cuberev019-p10/maps.txt <<'JS'
          import {urMoveAutomaton} from './scripts/cuberev-015/ur-fiber-tomography.mjs';
          for (const action of urMoveAutomaton()) console.log(action.join(' '));
          JS
          test "$(wc -l < /tmp/cuberev019-p10/maps.txt)" -eq 18
      - name: Independently replay physical seven-word R5 upper and exact non-extension
        run: |
          python -u scripts/cuberev-019/verify-L5-seven-five-source-and-extension.py \
            --physical /tmp/cuberev019-p10/physical.json \
            --maps /tmp/cuberev019-p10/maps.txt \
            --partitions /tmp/cuberev019-p10/partitions.tsv \
            --output /tmp/cuberev019-p10/R5_seven_word_physical_witness.json \
            | tee /tmp/cuberev019-p10/R5_seven_word_physical_witness.log
          grep -q 'CUBE_REV_019_P10_SEVEN_WORD_EXTENSION_ONE_WORD_IMPOSSIBLE_PHYSICAL_14938_PARTITIONS_MAX36_PASS' /tmp/cuberev019-p10/R5_seven_word_physical_witness.log
      - name: Independently verify rank>=6 twice, rank-preserving 16-symmetry and 747883 integer pair cuts
        run: |
          python -u scripts/cuberev-019/verify-L5-R5-rank-symmetry-and-pair-cuts.py \
            --physical /tmp/cuberev019-p10/physical.json \
            --maps /tmp/cuberev019-p10/maps.txt \
            --partitions /tmp/cuberev019-p10/partitions.tsv \
            --dual docs/0.19/P8_ORDER_INVARIANT_L5_FIVE_ONLY_LP_CERT.json \
            --output /tmp/cuberev019-p10/P11_R5_rank_symmetry_dual_cuts_receipt.json \
            | tee /tmp/cuberev019-p10/P11_original_physical_integer_audit.log
          grep -q 'CUBE_REV_019_P11_R5_RANK_AND_SYMMETRY_INTEGER_PAIR_GATE_PASS' /tmp/cuberev019-p10/P11_original_physical_integer_audit.log
      - name: Install pinned proof-producing SAT engine
        run: |
          python -m pip install --disable-pip-version-check 'python-sat==1.9.dev15'
      - name: Verify R5 all-k physical quotient and test six-word satisfiability
        run: |
          python -u scripts/cuberev-019/prove-L5-five-source-k6-SAT.py \
            --physical /tmp/cuberev019-p10/physical.json \
            --maps /tmp/cuberev019-p10/maps.txt \
            --partitions /tmp/cuberev019-p10/partitions.tsv \
            --output /tmp/cuberev019-p10/r5-six-court \
            --conflicts 30000000 \
            | tee /tmp/cuberev019-p10/r5-six-solver.log
          grep -q 'CUBE_REV_019_P10_R5_3344_TO_2023_PHYSICAL_COVER_COLUMNS_16_SYMMETRIES_137_ORBITS_PASS' /tmp/cuberev019-p10/r5-six-solver.log
      - name: Independently verify any UNSAT certificate against generated CNF
        run: |
          file=/tmp/cuberev019-p10/r5-six-court/R5_k6_physical
          if test -s "${file}.drup"; then
            git clone --quiet https://github.com/marijnheule/drat-trim.git /tmp/cuberev019-p10/drat-trim
            git -C /tmp/cuberev019-p10/drat-trim checkout --quiet 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
            make -C /tmp/cuberev019-p10/drat-trim
            /tmp/cuberev019-p10/drat-trim/drat-trim \
              /tmp/cuberev019-p10/r5-six-court/R5_k6_physical_with_sound_symmetry.cnf \
              "${file}.drup" | tee /tmp/cuberev019-p10/r5-six-court/external_DRUP_verification.log
            grep -Fq 's VERIFIED' /tmp/cuberev019-p10/r5-six-court/external_DRUP_verification.log
          else
            echo "R5_K6_PROOF_NOT_YET_EMITTED — no external UNSAT claim."
          fi
      - name: Promote only externally proof-checked R5 k6 UNSAT or independently replayed SAT
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/cuberev019-p10/r5-six-court')
          r=json.loads((p/'R5_k6_preparation.json').read_text())
          state=r['k6_decision']
          if state=='UNSAT_DRUP_EMITTED_EXTERNAL_VERIFICATION_PENDING':
              assert 's VERIFIED' in (p/'external_DRUP_verification.log').read_text()
              r['k6_decision']='R5_SIX_WORD_UNSAT_EXTERNAL_DRUP_VERIFIED'
              print('CUBE_REV_019_P10_R5_EXACT_INTEGER_OPTIMUM_SEVEN_WITH_P9_AND_PHYSICAL_WITNESS_PASS')
          elif state=='SAT_PHYSICAL_SIX_WORD_WITNESS_REPLAYED':
              print('CUBE_REV_019_P10_R5_SIX_WORD_SAT_REPLAYED_REVIEW_PRIOR_MIP_REPORT')
          else:
              print('CUBE_REV_019_P10_R5_K6_STILL_UNKNOWN_NOT_PROMOTED')
          (p/'POST_EXTERNAL_VERIFICATION_RECEIPT.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
      - name: Retain physical partitions, solution/DRUP, CNF, status and all source hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cube-rev-019-p10-r5-six-word-exact-court
          path: /tmp/cuberev019-p10/
          retention-days: 60
          if-no-files-found: warn
