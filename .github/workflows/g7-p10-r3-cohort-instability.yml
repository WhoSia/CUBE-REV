name: G7-P10-R3 Cohort-Instability Decomposition Audit

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p10/lb7-cohort-instability-preseal.json'
      - 'scripts/g7-p10/audit-lb7-cohort-instability.py'
      - '.github/workflows/g7-p10-r3-cohort-instability.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Validate preseal
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('g7/p10/lb7-cohort-instability-preseal.json'))
          assert x['status']=='FROZEN_AFTER_R2_BEFORE_R3_OUTCOME'
          assert x['new_body_requests']==0
          assert x['focal_contrast']=='P7_BATCH4 versus pooled other cohorts'
          print('G7_P10_R3_PRESEAL_PASS')
          PY

      - name: Recover frozen geometry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p10r3/p7
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/artifacts/11238382539/zip" \
            -o /tmp/p10r3/p7.zip
          echo 'b6e30ab56548e27905dd3b3718c5a3e56d772bff10a744e92180d189a3259a11  /tmp/p10r3/p7.zip' | sha256sum -c -
          unzip -q /tmp/p10r3/p7.zip -d /tmp/p10r3/p7

      - name: Execute cohort-instability decomposition
        run: |
          set -euo pipefail
          FEAT="$(find /tmp/p10r3/p7 -name five-rival-features.tsv -print -quit)"
          CTX="$(find /tmp/p10r3/p7 -name prefix-context.jsonl -print -quit)"
          mkdir -p /tmp/p10r3/out
          python3 scripts/g7-p10/audit-lb7-cohort-instability.py \
            --features "$FEAT" \
            --context "$CTX" \
            --out /tmp/p10r3/out | tee /tmp/p10r3/run.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/p10r3/out/lb7-cohort-instability-decomposition.json'))
          assert x['r2_style_eligible_solves']>0
          assert x['raw_matched']['P7_BATCH4']['n_solves']>=5
          assert x['raw_matched']['OTHER_COHORTS']['n_solves']>=5
          print('G7_P10_R3_RESULT_GATE_PASS',x['verdict'])
          print('RAW',x['raw_matched'])
          print('COMMON',x['common_support_standardization']['common_weight_means'])
          print('DIFF',x['common_support_standardization']['common_weight_difference'])
          print('TVD',x['common_support_standardization']['composition_tvd'])
          PY

      - name: Seal
        run: |
          set -euo pipefail
          mkdir -p /tmp/p10r3/seal/authority /tmp/p10r3/seal/derived
          cp g7/p10/lb7-cohort-instability-preseal.json /tmp/p10r3/seal/authority/
          cp /tmp/p10r3/out/lb7-cohort-instability-decomposition.json /tmp/p10r3/seal/derived/
          cp /tmp/p10r3/run.log /tmp/p10r3/seal/derived/execution.log
          printf '%s\n' \
            'PHASE=G7-P10-R3' \
            'OPERATION=LB7_COHORT_INSTABILITY_DECOMPOSITION_AUDIT' \
            'NEW_SOURCE_CONTACT=NONE' \
            'HUMAN_CONTACT_GATE=CLOSED' \
            > /tmp/p10r3/seal/AUTHORITY.txt
          (cd /tmp/p10r3/seal && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P10-R3-cohort-instability-${{ github.sha }}
          path: /tmp/p10r3/seal
          retention-days: 90
