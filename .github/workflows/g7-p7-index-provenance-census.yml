name: G7-P7 full-index provenance-support Census

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p7/preseal.json'
      - 'g7/p7/source-provenance-recovery.json'
      - 'g7/p7/active-set-manifest.json'
      - 'scripts/g7-p7/census-index-provenance.py'
      - '.github/workflows/g7-p7-index-provenance-census.yml'
  pull_request:
    paths:
      - 'g7/p7/preseal.json'
      - 'g7/p7/source-provenance-recovery.json'
      - 'g7/p7/active-set-manifest.json'
      - 'scripts/g7-p7/census-index-provenance.py'
      - '.github/workflows/g7-p7-index-provenance-census.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --no-cache-dir duckdb==1.4.1

      - name: Recover retained G7-P3 full-index metadata authority
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/g7-p7-index/p3
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/artifacts/11205587281/zip" \
            -o /tmp/g7-p7-index/p3.zip
          echo 'acb3dff14bbdb33fe4be3550e64eeba55dcb1879b85d6b8c1eacca7d9408c4e4  /tmp/g7-p7-index/p3.zip' | sha256sum -c -
          unzip -q /tmp/g7-p7-index/p3.zip -d /tmp/g7-p7-index/p3
          INDEX="$(find /tmp/g7-p7-index/p3 -name linkage-support.jsonl -print -quit)"
          POP="$(find /tmp/g7-p7-index/p3 -name population-geometry.json -print -quit)"
          test -n "$INDEX"; test -n "$POP"
          python3 - "$INDEX" "$POP" <<'PY'
          import json,sys
          idx=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip()]
          pop=json.load(open(sys.argv[2],encoding='utf-8'))
          assert len(idx)==12941
          assert len({x['source_id'] for x in idx})==12941
          assert sum(1 for x in idx if x.get('puzzle')=='3x3')==10591
          assert pop['row_count']==12941
          assert pop['puzzle_counts']['3x3']==10591
          print('G7_P7_P3_POPULATION_METADATA_AUTHORITY_PASS')
          PY

      - name: Recover frozen WCA export authority
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/g7-p7-index/wca-authority
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/artifacts/11210089432/zip" \
            -o /tmp/g7-p7-index/wca-authority.zip
          echo 'df733a69f95fe2a6af0d300cd63de591bb072c49fddfb6cdb981a0b74deab94a  /tmp/g7-p7-index/wca-authority.zip' | sha256sum -c -
          unzip -q /tmp/g7-p7-index/wca-authority.zip -d /tmp/g7-p7-index/wca-authority
          API="$(find /tmp/g7-p7-index/wca-authority -name api.json -print -quit)"
          test -n "$API"
          URL="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['tsv_url'])" "$API")"
          curl --fail --location --retry 3 --retry-delay 3 "$URL" -o /tmp/g7-p7-index/wca.tsv.zip
          echo 'ac9afd834b6d7e31cb3cdd99f47eb21569fafb5d26d8628528aae2db8867d6a7  /tmp/g7-p7-index/wca.tsv.zip' | sha256sum -c -
          mkdir -p /tmp/g7-p7-index/wca
          unzip -q /tmp/g7-p7-index/wca.tsv.zip -d /tmp/g7-p7-index/wca
          echo 'G7_P7_FULL_INDEX_FROZEN_WCA_BYTES_PASS'

      - name: Execute full-index provenance-support Census
        run: |
          set -euo pipefail
          INDEX="$(find /tmp/g7-p7-index/p3 -name linkage-support.jsonl -print -quit)"
          mkdir -p /tmp/g7-p7-index/out
          python3 scripts/g7-p7/census-index-provenance.py \
            --index "$INDEX" \
            --wca-dir /tmp/g7-p7-index/wca \
            --sample-registry g7/p7/source-provenance-recovery.json \
            --out /tmp/g7-p7-index/out \
            --wca-source-sha256 ac9afd834b6d7e31cb3cdd99f47eb21569fafb5d26d8628528aae2db8867d6a7 | tee /tmp/g7-p7-index/census.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/g7-p7-index/out/full-index-provenance-support-census.json'))
          assert x['reco_rows_all']==12941
          assert x['reco_rows_3x3']==10591
          assert x['frozen_body_sample_60']['rows']==60
          print('G7_P7_FULL_INDEX_PROVENANCE_RESULT_GATE_PASS')
          PY

      - name: Remove raw authorities and seal derived Census only
        run: |
          set -euo pipefail
          mkdir -p /tmp/g7-p7-index/seal/authority /tmp/g7-p7-index/seal/derived
          cp g7/p7/preseal.json g7/p7/source-provenance-recovery.json /tmp/g7-p7-index/seal/authority/
          cp /tmp/g7-p7-index/p3/population-geometry.json /tmp/g7-p7-index/seal/authority/ || true
          cp /tmp/g7-p7-index/out/full-index-provenance-support-census.json /tmp/g7-p7-index/seal/derived/
          cp /tmp/g7-p7-index/out/full-index-provenance-rows.jsonl /tmp/g7-p7-index/seal/derived/
          printf '%s\n' \
            'OPERATION=FULL_INDEX_PROVENANCE_SUPPORT_CENSUS' \
            'RECO_INDEX_ROWS=12941' \
            'RECO_3X3_ROWS=10591' \
            'RECO_SOLVE_BODY_CONTACT=NONE' \
            'WCA_RAW_PACKAGED=NO' \
            'P2_EXPIRED_ARTIFACT_RECONSTITUTED_FROM_P3_DERIVED_METADATA=YES' \
            > /tmp/g7-p7-index/seal/AUTHORITY.txt
          rm -rf /tmp/g7-p7-index/wca /tmp/g7-p7-index/wca.tsv.zip /tmp/g7-p7-index/wca-authority /tmp/g7-p7-index/wca-authority.zip /tmp/g7-p7-index/p3 /tmp/g7-p7-index/p3.zip
          (cd /tmp/g7-p7-index/seal && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P7-full-index-provenance-census-${{ github.sha }}
          path: /tmp/g7-p7-index/seal
          if-no-files-found: error
          retention-days: 90
