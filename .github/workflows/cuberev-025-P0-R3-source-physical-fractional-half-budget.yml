name: CUBE-REV 0.25 P0-R3 real physical 2-pattern half-priced cost-share finite proof
on:
  workflow_dispatch:
  push:
    branches: [research/current]
    paths:
      - "scripts/cuberev-025/p0_r3_halfprice_pairs_go/main.go"
      - ".github/workflows/cuberev-025-P0-R3-source-physical-fractional-half-budget.yml"
permissions:
  contents: read
jobs:
  original-physical-cubie-half-unit-cost-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ban GitHub Actions bot author and committer
        shell: bash
        run: |
          if git log --format='%an <%ae> %cn <%ce>' | grep -Ei 'github-actions?\[bot\]|github-action\[bot\]'; then
            echo "::error::GitHub Actions bot research contribution is forbidden"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.2"
      - name: All five genuine physical four-cubie finite 0/1/2 half-action cost-share PDBs
        shell: bash
        run: |
          set -o pipefail
          timeout 960 go run scripts/cuberev-025/p0_r3_halfprice_pairs_go/main.go | tee /tmp/p0r3_half_cost.txt
          test "$(grep -c '^P0R3_TRUE_PHYSICAL_HALF_COST_PDB COMPLETE pattern=' /tmp/p0r3_half_cost.txt)" -eq 5
          test "$(grep -c '^P0R3_EXACT_TWO_PATTERN_PAIR scale2_' /tmp/p0r3_half_cost.txt)" -eq 10
          grep -Fq 'exhaustive_cases=7290' /tmp/p0r3_half_cost.txt
          grep -Fq 'P0R3_PHYSICAL_SOURCE_FINITE_COMPLETE SUCCESS' /tmp/p0r3_half_cost.txt
          grep -Fq 'global_17_nonexistence_proved=0' /tmp/p0r3_half_cost.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuberev025-p0r3-7290-original-cubie-half-budget-receipt
          path: /tmp/p0r3_half_cost.txt
          retention-days: 30
          if-no-files-found: warn
      - name: No tracked source mutation or CI-generated author commit
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
