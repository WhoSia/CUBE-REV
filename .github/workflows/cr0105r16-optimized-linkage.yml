name: CR0105R16 Optimized Linkage Court
on:
  push:
    branches: [cube-rev-0.10.5-r1.6-optimized-linkage]
    paths: [cr0105r16/RUN_OPT]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cr0105r16-optimized-linkage
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: R1.5 lineage and R1.6 probe preflight
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('research/0.10.5-r1.5/final/RAVEL_FINAL_SEAL.json'))
          assert x['status']=='PASS'
          assert x['public_data_research_pivot']['primary_empirical_strategy']=='PUBLIC_DATA_FIRST'
          p=json.load(open('research/0.10.5-r1.6/evidence/RECO_INDEX_SURFACE_PROBE.json'))
          assert p['status']=='PASS'
          assert p['three_by_three_rows']>=10000
          assert p['pagination_like_links']==[]
          print('R16_OPT_PREFLIGHT_PASS')
          PY
      - name: Resolve current WCA v2 export
        run: |
          set -euo pipefail
          mkdir -p /tmp/r16opt/wca
          curl --fail --location --retry 5 --retry-all-errors \
            -A 'CUBE-REV/0.10.5-R1.6 optimized public-data research' \
            https://www.worldcubeassociation.org/api/v0/export/public \
            -o /tmp/r16opt/export_api.json
          TSV_URL="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/r16opt/export_api.json'))['tsv_url'])
          PY
          )"
          curl --fail --location --retry 6 --retry-all-errors --connect-timeout 30 \
            -A 'CUBE-REV/0.10.5-R1.6 optimized public-data research' \
            "$TSV_URL" -o /tmp/r16opt/wca.tsv.zip
          sha256sum /tmp/r16opt/wca.tsv.zip
          unzip -q /tmp/r16opt/wca.tsv.zip -d /tmp/r16opt/wca
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analytical runtime
        run: python -m pip install --disable-pip-version-check duckdb==1.3.2 requests==2.32.4 beautifulsoup4==4.13.4 lxml==6.0.0
      - name: Execute optimized native-equality linkage court
        id: court
        shell: bash
        run: |
          set +e
          export R16_ROOT=/tmp/r16opt
          export WCA_DIR=/tmp/r16opt/wca
          export WCA_API_JSON=/tmp/r16opt/export_api.json
          export WCA_ZIP=/tmp/r16opt/wca.tsv.zip
          export R16_OUT="$GITHUB_WORKSPACE/research/0.10.5-r1.6/evidence-opt"
          python research/0.10.5-r1.6/r16_ingest_optimized.py 2>&1 | tee /tmp/r16opt/court.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist optimized run metadata
        if: always()
        run: |
          mkdir -p research/0.10.5-r1.6/evidence-opt
          python3 - <<'PY'
          import json,os,datetime,pathlib
          x={'schema_version':'CR0105R16-OPT-RUN-META-1','workflow_run_id':os.environ.get('GITHUB_RUN_ID'),
             'head_sha':os.environ.get('GITHUB_SHA'),'court_exit_code':int('${{ steps.court.outputs.exit_code || 99 }}'),
             'linkage_engine':'DISTINCT_NAME_NORMALIZATION_PLUS_DUCKDB_NATIVE_EQUALITY',
             'human_observations':0,'human_recruitment':'DEFERRED_BY_RESEARCH_DESIGN',
             'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('research/0.10.5-r1.6/evidence-opt/RUN_METADATA.json').write_text(json.dumps(x,indent=2)+'\n')
          PY
          cp /tmp/r16opt/court.log research/0.10.5-r1.6/evidence-opt/COURT_LOG.txt || true
      - name: Commit compact optimized evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/0.10.5-r1.6/evidence-opt
          git diff --cached --quiet || git commit -m "Record CUBE-REV 0.10.5-R1.6 optimized linkage court ${GITHUB_RUN_ID}"
          git push origin HEAD:cube-rev-0.10.5-r1.6-optimized-linkage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CR0105R16-optimized-linkage
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/0.10.5-r1.6/evidence-opt/
            /tmp/r16opt/wca333.duckdb
            /tmp/r16opt/export_api.json
            /tmp/r16opt/court.log
      - name: Enforce optimized closure
        if: always()
        run: |
          test "${{ steps.court.outputs.exit_code }}" = "0"
          python3 - <<'PY'
          import json
          x=json.load(open('research/0.10.5-r1.6/evidence-opt/RAVEL_FINAL_SEAL.json'))
          assert x['status']=='PASS',x
          assert x['human_observations']==0
          assert x['human_recruitment']=='DEFERRED_BY_RESEARCH_DESIGN'
          print('CR0105R16_OPTIMIZED_PASS')
          PY
