name: G7-P11 fresh reco batch 4

on:
  push:
    branches: ['research/current']
    paths:
      - '.github/workflows/g7-p11-fresh-batch4.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  batch4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Recover sealed fresh selection
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p11-selection
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/artifacts/11242753632/zip" \
            -o /tmp/p11-selection.zip
          echo '45145487febf4d9fc975299ffe567a9e20ae63cb744a6205bd53f661941f8a67  /tmp/p11-selection.zip' | sha256sum -c -
          unzip -q /tmp/p11-selection.zip -d /tmp/p11-selection
          MANIFEST="$(find /tmp/p11-selection -name selection-manifest.json -print -quit)"
          node - "$MANIFEST" <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(x.status!=='SEALED_BEFORE_FRESH_BODY_CONTACT') process.exit(1);
          if(x.selection_manifest_sha256!=='70057c8868da63b7aaeef9d2a005be163602a667cfe2a675af6e9ec5acbcdee9') process.exit(2);
          if(x.batches['4'].length!==10) process.exit(3);
          console.log('G7_P11_BATCH4_SELECTION_AUTHORITY_PASS');
          console.log('IDS\t'+x.batches['4'].join(','));
          NODE
      - name: Dry-run bounded acquisition authority
        run: |
          MANIFEST="$(find /tmp/p11-selection -name selection-manifest.json -print -quit)"
          node scripts/g7-p11/acquire-fresh-reco-batch.mjs --manifest "$MANIFEST" --batch 4 --out /tmp/unused
      - name: Acquire frozen fresh batch 4
        run: |
          set -euo pipefail
          MANIFEST="$(find /tmp/p11-selection -name selection-manifest.json -print -quit)"
          rm -rf /tmp/g7-p11-batch04
          node scripts/g7-p11/acquire-fresh-reco-batch.mjs --manifest "$MANIFEST" --batch 4 --out /tmp/g7-p11-batch04 --execute | tee /tmp/g7-p11-batch04-execution.log
      - name: Exact trajectory replay
        run: |
          set -euo pipefail
          node scripts/cube/replay-exact-trajectories.mjs --input /tmp/g7-p11-batch04/derived/solves.jsonl --out /tmp/g7-p11-batch04/exact
          node - <<'NODE'
          const x=require('/tmp/g7-p11-batch04/exact/exact-trajectories.json');
          if(x.solve_count!==10||x.exact_end_validation_pass!==10) process.exit(1);
          console.log('G7_P11_BATCH4_EXACT_PASS');
          console.log('PREFIXES\t'+x.total_prefixes);
          NODE
      - name: Seal batch
        run: |
          set -euo pipefail
          cp /tmp/g7-p11-batch04-execution.log /tmp/g7-p11-batch04/
          printf '%s\n' 'PHASE=G7-P11' 'BATCH=4' 'SOLVES=10' 'SELECTION_MANIFEST_SHA256=70057c8868da63b7aaeef9d2a005be163602a667cfe2a675af6e9ec5acbcdee9' 'BULK_MIRROR=HOLD' 'RAW_PUBLIC_RELEASE=HOLD' > /tmp/g7-p11-batch04/AUTHORITY.txt
          (cd /tmp/g7-p11-batch04 && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: G7-P11-fresh-batch4-${{ github.sha }}
          path: /tmp/g7-p11-batch04
          retention-days: 90
