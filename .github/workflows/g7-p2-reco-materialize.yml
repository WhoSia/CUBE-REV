name: G7-P2 reco.nz bounded corpus materialization

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p2/probes/reco-bounded-materialize-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute bounded real capture
        run: |
          rm -rf /tmp/reco-bounded-capture
          node scripts/g7-p2/acquire-reco.mjs --execute --page-start 1 --pages 1 --max-solves 10 --puzzle 3x3 --delay-ms 2000 --out /tmp/reco-bounded-capture
      - name: Validate capture and custody
        run: |
          node scripts/g7-p2/validate-reco-live-probe.mjs /tmp/reco-bounded-capture | tee /tmp/reco-bounded-capture/validation-receipt.txt
          (cd /tmp/reco-bounded-capture && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          test "$(find /tmp/reco-bounded-capture/raw/solve -type f -name '*.html' | wc -l)" -ge 5
          test -s /tmp/reco-bounded-capture/derived/solves.jsonl
          test -s /tmp/reco-bounded-capture/capture-manifest.json
          echo G7_P2_RECO_BOUNDED_CUSTODY_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: G7-P2-reco-bounded-capture-${{ github.sha }}
          path: /tmp/reco-bounded-capture
          if-no-files-found: error
          retention-days: 1
