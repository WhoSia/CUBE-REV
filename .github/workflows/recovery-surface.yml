name: Validate recovery-surface core

on:
  push:
    branches: ['research/current']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust format seal
        run: cargo fmt --all --check
      - name: Rust check
        run: cargo check --workspace
      - name: Rust tests
        run: cargo test --workspace
      - name: Frozen P3 grid and independent audit
        run: |
          mkdir -p g5/p3/ci-output
          cargo run --quiet -p recovery-game-core --bin p3_close > g5/p3/ci-output/p3-grid.tsv
          python scripts/g5_p3_independent_audit.py g5/p3/ci-output/p3-grid.tsv
          python scripts/g5_p3_learned_quotient.py > g5/p3/ci-output/p3-learned-quotient.json
      - name: Upload P3 court outputs
        uses: actions/upload-artifact@v4
        with:
          name: g5-p3-court
          path: g5/p3/ci-output/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Existing TypeScript contract
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm run test:parity
          npm run test:replay
