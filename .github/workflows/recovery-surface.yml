name: Validate recovery-surface core

on:
  push:
    branches: ['research/current']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Produce canonical rustfmt patch
        run: |
          cargo fmt --all
          git diff -- crates/recovery-game-core/src/lib.rs crates/recovery-game-core/src/bin/p3_close.rs > /tmp/g5-p3-rustfmt.patch
      - name: Upload rustfmt patch
        uses: actions/upload-artifact@v4
        with:
          name: g5-p3-rustfmt-patch
          path: /tmp/g5-p3-rustfmt.patch
