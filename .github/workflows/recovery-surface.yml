name: Validate recovery-surface core

on:
  push:
    branches: ['research/current']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recovery-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Materialize canonical Rust blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo fmt --all
          CONTENT=$(base64 -w0 crates/recovery-game-core/src/bin/p3_close.rs)
          SHA=$(curl -fsSL -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs             -d "{\"content\":\"$CONTENT\",\"encoding\":\"base64\"}" | python -c "import json,sys; print(json.load(sys.stdin)['sha'])")
          printf '%s\n' "$SHA" > /tmp/p3-close-blob-sha.txt
      - name: Upload canonical blob identity
        uses: actions/upload-artifact@v4
        with:
          name: g5-p3-formatted-blob
          path: /tmp/p3-close-blob-sha.txt
