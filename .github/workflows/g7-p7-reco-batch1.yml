name: Acquire G7-P7 reco.nz batch 1

on:
  push:
    branches: ['research/current']
    paths:
      - '.github/workflows/g7-p7-reco-batch1.yml'
      - 'scripts/g7-p7/acquire-reco-batch.mjs'
      - 'scripts/g7-p7/test-acquire-reco-batch.mjs'
      - 'g7/p7/reco-campaign-manifest.json'
      - 'g7/p2/reco-acquisition-policy.json'
  pull_request:
    paths:
      - '.github/workflows/g7-p7-reco-batch1.yml'
      - 'scripts/g7-p7/acquire-reco-batch.mjs'
      - 'scripts/g7-p7/test-acquire-reco-batch.mjs'
      - 'g7/p7/reco-campaign-manifest.json'
      - 'g7/p2/reco-acquisition-policy.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dry-run authority check
        run: node scripts/g7-p7/test-acquire-reco-batch.mjs
      - name: Acquire frozen batch 1
        run: |
          set -euo pipefail
          rm -rf /tmp/g7-p7-batch01
          node scripts/g7-p7/acquire-reco-batch.mjs             --batch 1             --out /tmp/g7-p7-batch01             --execute
      - name: Exact trajectory replay
        run: |
          set -euo pipefail
          node scripts/g7-p4/replay-pilot-exact.mjs             --input /tmp/g7-p7-batch01/derived/solves.jsonl             --out /tmp/g7-p7-batch01/exact
          node - <<'NODE'
          const x=require('/tmp/g7-p7-batch01/exact/exact-trajectories.json');
          if(x.solve_count!==10) process.exit(1);
          if(x.exact_end_validation_pass!==10) process.exit(2);
          console.log('G7_P7_RECO_BATCH1_EXACT_PASS');
          console.log('PREFIXES\t'+x.total_prefixes);
          NODE
      - name: Seal batch artifact
        run: |
          set -euo pipefail
          printf '%s\n'             'BATCH=1'             'SOLVES=10'             'BULK_MIRROR=HOLD'             'RAW_PUBLIC_RELEASE=HOLD' > /tmp/g7-p7-batch01/AUTHORITY.txt
          (cd /tmp/g7-p7-batch01 && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: G7-P7-reco-batch1-${{ github.sha }}
          path: /tmp/g7-p7-batch01
          if-no-files-found: error
          retention-days: 90
