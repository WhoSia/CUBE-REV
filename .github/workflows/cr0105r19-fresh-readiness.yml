name: CR0105R19 Fresh Vintage Readiness
on:
  push:
    branches: [cube-rev-0.10.5-r1.9-quotient-familywise-readiness]
    paths: [cr0105r19/RUN_FRESH_READINESS]
permissions:
  contents: write
  actions: read
jobs:
  fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify R3 seal before any current reco.nz read
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          s=json.load(open('research/0.10.5-r1.9/evidence-nested-gate-repair/ATTEMPT_FAMILYWISE_NULL_PREREG_SEAL_R3.json'))
          assert s['status']=='SEALED_FOR_FUTURE_FRESH_VINTAGE_R3_NESTED_EXACT_PREREG_GATE'
          assert s['seal_sha256']=='86522ee214024c8cac5257e07a4b9df451edff764fed13d9027ba79c957f2fca'
          assert s['future_fresh_outcomes_seen'] is False
          print('CR0105R19_R3_PRE_FRESH_SEAL_PASS')
          PY
      - name: Restore exact frozen R1.6 analytical DB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r19fresh
          gh api -H 'Accept: application/vnd.github+json' repos/${GITHUB_REPOSITORY}/actions/artifacts/9310311696/zip > /tmp/r19fresh/r16.zip
          unzip -q /tmp/r19fresh/r16.zip -d /tmp/r19fresh/unpacked
          DB="$(find /tmp/r19fresh/unpacked -type f -name 'wca333.duckdb' -print -quit)"
          test -n "$DB"
          SHA="$(sha256sum "$DB" | awk '{print $1}')"
          test "$SHA" = 'a04f1d2fd351e34ec7406e63524b7b8ceb166bf8a53d4630f94c9d6a792848f1'
          echo "R19_PARENT_DB=$DB" >> "$GITHUB_ENV"
          echo "R19_PARENT_DB_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "R19_FRESH_ROOT=/tmp/r19fresh" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned preflight runtime
        run: python -m pip install --disable-pip-version-check duckdb==1.3.2 requests==2.32.4 beautifulsoup4==4.13.4 lxml==6.0.0
      - name: Read and characterize current reconstruction vintage
        id: fresh
        shell: bash
        run: |
          set +e
          python research/0.10.5-r1.9/r19_fresh_vintage_readiness.py 2>&1 | tee /tmp/r19fresh/fresh.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist fail-observable fresh readiness evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p research/0.10.5-r1.9/evidence-fresh-readiness
          test -f /tmp/r19fresh/FRESH_VINTAGE_READINESS.json && cp /tmp/r19fresh/FRESH_VINTAGE_READINESS.json research/0.10.5-r1.9/evidence-fresh-readiness/ || true
          cp /tmp/r19fresh/fresh.log research/0.10.5-r1.9/evidence-fresh-readiness/FRESH_LOG.txt || true
          python3 - <<'PY'
          import json,os,datetime,pathlib
          c=int('${{ steps.fresh.outputs.exit_code || 97 }}')
          x={'schema_version':'CR0105R19-FRESH-READINESS-RUN-1','workflow_run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'r3_seal':'86522ee214024c8cac5257e07a4b9df451edff764fed13d9027ba79c957f2fca','exit_code':c,'operational_status':'PASS' if c==0 else 'HOLD_OR_FAIL','confirmatory_scoring_authorized':False,'human_observations':0,'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('research/0.10.5-r1.9/evidence-fresh-readiness/RUN_METADATA.json').write_text(json.dumps(x,indent=2)+'\n')
          PY
      - name: Commit current-vintage readiness evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/0.10.5-r1.9/evidence-fresh-readiness
          git diff --cached --quiet || git commit -m "Record CUBE-REV 0.10.5-R1.9 fresh readiness ${GITHUB_RUN_ID}"
          git push origin HEAD:cube-rev-0.10.5-r1.9-quotient-familywise-readiness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CR0105R19-fresh-readiness
          retention-days: 30
          if-no-files-found: warn
          path: research/0.10.5-r1.9/evidence-fresh-readiness/
      - name: Enforce index integrity only, never require fresh data to exist
        if: always()
        run: |
          test '${{ steps.fresh.outputs.exit_code }}' = '0'
          python3 - <<'PY'
          import json
          x=json.load(open('research/0.10.5-r1.9/evidence-fresh-readiness/FRESH_VINTAGE_READINESS.json'))
          assert x['live']['index_superset_gate'] is True
          assert x['ordering_proof']['r3_seal_sha256']=='86522ee214024c8cac5257e07a4b9df451edff764fed13d9027ba79c957f2fca'
          assert x['confirmatory_authority']['score_recovery_rate'] is False
          print('CR0105R19_FRESH_READINESS_PASS',x['status'])
          PY
