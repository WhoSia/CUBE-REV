name: CUBE-REV 0.19 Original Physical Five-Source k5 Exact Court

on:
  push:
    branches: [research/current]
    paths:
      - 'scripts/cuberev-019/prove-L5-five-source-k5-impossibility.py'
      - 'scripts/cuberev-019/export-L5-physical.mjs'
      - 'docs/0.19/P8_ORDER_INVARIANT_L5_FIVE_ONLY_LP_CERT.json'
      - '.github/workflows/cuberev-019-l5-five-source-k5-court.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-physical-five-source-k5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconstruct 1192 original physical sources and full five-move partition census
        run: |
          mkdir -p /tmp/cuberev019-p9
          node scripts/cuberev-018/export-mstar-physical.mjs /tmp/cuberev019-p9/physical.json
          node scripts/cuberev-019/export-L5-physical.mjs /tmp/cuberev019-p9/physical.json /tmp/cuberev019-p9/L5_partitions.tsv
          test "$(wc -l < /tmp/cuberev019-p9/L5_partitions.tsv)" -eq 14938
      - name: Independently create sticker-derived 18x24 legal HTM edge transition maps
        run: |
          node --input-type=module > /tmp/cuberev019-p9/maps.txt <<'JS'
          import {urMoveAutomaton} from './scripts/cuberev-015/ur-fiber-tomography.mjs';
          for (const action of urMoveAutomaton()) console.log(action.join(' '));
          JS
          test "$(wc -l < /tmp/cuberev019-p9/maps.txt)" -eq 18
      - name: Complete no-SAT finite proof for all 480 five-position sources, k<=5
        run: |
          python -u scripts/cuberev-019/prove-L5-five-source-k5-impossibility.py \
            --physical /tmp/cuberev019-p9/physical.json \
            --maps /tmp/cuberev019-p9/maps.txt \
            --partitions /tmp/cuberev019-p9/L5_partitions.tsv \
            --dual docs/0.19/P8_ORDER_INVARIANT_L5_FIVE_ONLY_LP_CERT.json \
            --output /tmp/cuberev019-p9/P9_five_source_k5_exact_receipt.json | tee /tmp/cuberev019-p9/P9_finite_proof.log
          grep -q 'CUBE_REV_019_L5_480_FIVE_SOURCE_K5_EXACT_FINITE_UNSAT_PASS' /tmp/cuberev019-p9/P9_finite_proof.log
      - name: Gate completed theorem receipt on physical source and exact counts
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('/tmp/cuberev019-p9')
          r=json.loads((p/'P9_five_source_k5_exact_receipt.json').read_text())
          assert r['state']=='K5_UNSAT_LOCAL_COMPLETE_INTEGER_BRANCHING_PASS'
          assert r['physical_source_sha256']==hashlib.sha256((p/'physical.json').read_bytes()).hexdigest()
          assert r['five_source_sets']==480
          assert r['physical_observation_partition_count']==14938
          assert r['distinct_five_source_cover_types']==3344
          assert r['five_source_maximal_cover_types']==2023
          assert r['k5_dual_eligible_maximal_columns']==396
          assert r['forbidden_pair_choices']==61098
          assert r['allowed_pair_choices']==17112
          print('CUBE_REV_019_PHYSICAL_FIVE_SOURCE_K5_INDEPENDENT_END_TO_END_GATE_PASS')
          PY
          sha256sum /tmp/cuberev019-p9/physical.json /tmp/cuberev019-p9/maps.txt /tmp/cuberev019-p9/L5_partitions.tsv /tmp/cuberev019-p9/P9_five_source_k5_exact_receipt.json > /tmp/cuberev019-p9/sha256sums.txt
      - name: Retain original physical input, proof transcript and theorem receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cube-rev-019-five-source-k5-exact-finite-proof
          path: /tmp/cuberev019-p9/
          retention-days: 90
          if-no-files-found: warn
