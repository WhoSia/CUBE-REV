name: CUBE-REV 0.11 — Face-Word Algebra Regression
on:
  push:
    branches: ['research/current']
    paths:
      - 'scripts/cube/simple-face-word-normal-form.mjs'
      - 'scripts/cube/test-simple-face-word-normal-form.mjs'
      - 'scripts/cube/full-notation-normal-form.mjs'
      - 'scripts/cube/test-full-notation-normal-form.mjs'
      - 'scripts/cuberev-011/operator-permutation.mjs'
      - 'scripts/cuberev-011/test-operator-permutation.mjs'
      - 'scripts/cuberev-011/bigram-euler-null.mjs'
      - 'scripts/cuberev-011/test-bigram-euler-null.mjs'
      - 'scripts/cuberev-011/legal-word-transfer.mjs'
      - 'scripts/cuberev-011/test-legal-word-transfer.mjs'
      - 'scripts/cuberev-013/cross4-pdb.mjs'
      - 'scripts/cuberev-013/test-cross4-pdb.mjs'
      - 'scripts/cuberev-013/cross-goal-candidates.mjs'
      - 'scripts/cuberev-013/test-cross-goal-candidates.mjs'
      - 'scripts/cuberev-014/goal-posterior.mjs'
      - 'scripts/cuberev-014/test-goal-posterior.mjs'
      - 'scripts/cuberev-014/finite-observation-channel.mjs'
      - 'scripts/cuberev-014/test-finite-observation-channel.mjs'
      - 'scripts/cuberev-014/coset-observation-witness.mjs'
      - 'scripts/cuberev-014/test-coset-observation-witness.mjs'
      - 'scripts/cuberev-015/future-distance-refinement.mjs'
      - 'scripts/cuberev-015/test-future-distance-refinement.mjs'
      - 'scripts/cuberev-015/single-history-observability.mjs'
      - 'scripts/cuberev-015/test-single-history-observability.mjs'
      - 'scripts/cuberev-015/active-first-two-and-lift.mjs'
      - 'scripts/cuberev-015/test-active-first-two-and-lift.mjs'
      - 'scripts/cuberev-015/five-edge-fiber.mjs'
      - 'scripts/cuberev-015/test-five-edge-fiber.mjs'
      - 'scripts/cuberev-015/ur-fiber-tomography.mjs'
      - 'scripts/cuberev-015/test-ur-fiber-tomography.mjs'
      - 'scripts/cuberev-015/noisy-fiber-experiment.mjs'
      - 'scripts/cuberev-015/test-noisy-fiber-experiment.mjs'
      - '.github/workflows/cuberev-011-face-word-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  algebra-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Face-word rewrite unit regressions
        run: |
          node scripts/cube/test-simple-face-word-normal-form.mjs
          node scripts/cube/test-full-notation-normal-form.mjs
          node scripts/cuberev-011/test-operator-permutation.mjs
          node scripts/cuberev-011/test-bigram-euler-null.mjs
          node scripts/cuberev-011/test-legal-word-transfer.mjs
          node scripts/cuberev-013/test-cross4-pdb.mjs
          node scripts/cuberev-013/test-cross-goal-candidates.mjs
          node scripts/cuberev-014/test-goal-posterior.mjs
          node scripts/cuberev-014/test-finite-observation-channel.mjs
          node scripts/cuberev-014/test-coset-observation-witness.mjs
          node scripts/cuberev-015/test-future-distance-refinement.mjs
          node scripts/cuberev-015/test-single-history-observability.mjs
          node scripts/cuberev-015/test-active-first-two-and-lift.mjs
          node scripts/cuberev-015/test-five-edge-fiber.mjs
          node scripts/cuberev-015/test-ur-fiber-tomography.mjs
          node scripts/cuberev-015/test-noisy-fiber-experiment.mjs
      - name: Assert read-only workflow
        run: |
          ! grep -E 'git +(commit|push|tag)|contents: *write|github-actions\[bot\]' .github/workflows/cuberev-011-face-word-regression.yml
