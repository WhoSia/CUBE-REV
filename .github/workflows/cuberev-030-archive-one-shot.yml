name: CUBE-REV 0.30 historical custody (read-only)
on:
  push:
    branches: [research/current]
    paths:
      - '.github/workflows/cuberev-030-archive-one-shot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  custody:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ad79a52ecbff844553ec8b89696aead6bc3d0711'
          persist-credentials: false
      - name: Seal historical README and 0.18 cohort at the exact source commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess,tarfile,io
          from pathlib import Path
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head=='ad79a52ecbff844553ec8b89696aead6bc3d0711'
          paths=sorted(p for p in subprocess.check_output(['git','ls-files'],text=True).splitlines() if p=='README.md' or p.startswith(('.github/workflows/cuberev-018-','scripts/cuberev-018/','docs/0.18/')))
          workflows=[p for p in paths if p.startswith('.github/workflows/')]
          assert len(workflows)==11, workflows
          out=Path('/tmp/cuberev030-custody');out.mkdir()
          entries=[]
          with tarfile.open(out/'exact-source.tar.gz','w:gz') as tar:
              for p in paths:
                  raw=subprocess.check_output(['git','show',f'{head}:{p}'])
                  blob=subprocess.check_output(['git','rev-parse',f'{head}:{p}'],text=True).strip()
                  assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==blob
                  entries.append(dict(path=p,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),git_blob_sha=blob))
                  info=tarfile.TarInfo(p);info.size=len(raw);tar.addfile(info,io.BytesIO(raw))
          with tarfile.open(out/'exact-source.tar.gz','r:gz') as tar:
              for e in entries:
                  assert hashlib.sha256(tar.extractfile(e['path']).read()).hexdigest()==e['sha256']
          # Workflow entry points are separate from reusable source code.
          # Any incoming workflow reference blocks automatic retirement.
          other=[p for p in subprocess.check_output(['git','ls-files','.github/workflows'],text=True).splitlines() if p not in workflows]
          refs=[]
          for p in other:
              src=Path(p).read_text()
              for w in workflows:
                  if w in src or Path(w).name in src: refs.append([p,w])
          manifest=dict(schema='cuberev.retirement.preseal.v1',source_head=head,files=entries,workflow_candidates=workflows,incoming_workflow_references=refs,deletion_authorized=False)
          (out/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          for p in sorted(out.iterdir()):
              raw=p.read_bytes();print('CUSTODY_SHA256',p.name,hashlib.sha256(raw).hexdigest(),len(raw))
          print('CUSTODY_FILES',len(entries),'WORKFLOWS',len(workflows),'INCOMING',json.dumps(refs))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cuberev-030-retirement-preseal
          path: /tmp/cuberev030-custody/
          if-no-files-found: error
          retention-days: 90
