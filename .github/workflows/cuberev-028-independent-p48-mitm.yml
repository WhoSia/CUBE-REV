name: CUBE-REV 0.28 independent P48 B6 MITM

on:
  push:
    branches: ['research/current']
    paths:
      - 'scripts/cuberev-observation/b6_independent_48sticker_goals.py'
      - 'scripts/cuberev-observation/test_b6_independent_48sticker_goals.py'
      - 'scripts/cuberev-observation/verify_b6_41_mitm_p48.cpp'
      - 'scripts/cuberev-observation/audit_b6_single_erasure_core_multiplicities.py'
      - 'scripts/cuberev-observation/verify_b6_negative_19_pairs_p48.py'
      - 'scripts/cuberev-observation/test_b6_negative_19_pairs_p48.py'
      - 'scripts/cuberev-observation/verify_b6_complete_4845_p48.py'
      - 'scripts/cuberev-observation/test_b6_complete_4845_p48.py'
      - 'scripts/cuberev-observation/emit_b5_adjacent_p48_discovery_goals.py'
      - 'scripts/cuberev-observation/discover_b5_adjacent_p48_mitm.cpp'
      - 'scripts/cuberev-observation/verify_b5_adjacent_p48_discovery_receipt.py'
      - 'scripts/cuberev-observation/active_p48_fixed_site_scan.py'
      - 'scripts/cuberev-observation/test_active_p48_fixed_site_scan.py'
      - 'scripts/cuberev-observation/active_p48_b6_ten_frame_bridge.py'
      - 'scripts/cuberev-observation/test_active_p48_b6_ten_frame_bridge.py'
      - '.github/workflows/cuberev-028-independent-p48-mitm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-physical-b6:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python P48 geometric target and adversarial tests
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/cuberev-observation -p 'test_b6_independent_48sticker_goals.py' -v
          python -m unittest discover -s scripts/cuberev-observation -p 'test_b6_negative_19_pairs_p48.py' -v
          python scripts/cuberev-observation/audit_b6_single_erasure_core_multiplicities.py
          python scripts/cuberev-observation/b6_independent_48sticker_goals.py --emit /tmp/cuberev-p48
          python -m unittest discover -s scripts/cuberev-observation -p 'test_b6_complete_4845_p48.py' -v
          python -m unittest discover -s scripts/cuberev-observation -p 'test_active_p48_fixed_site_scan.py' -v
          python -m unittest discover -s scripts/cuberev-observation -p 'test_active_p48_b6_ten_frame_bridge.py' -v
          python scripts/cuberev-observation/active_p48_b6_ten_frame_bridge.py | tee /tmp/cuberev-p48-b6-ten-frame.log
          grep -q '^ACTIVE_B6_P48_NONADAPTIVE_HORIZON_EXACT_10' /tmp/cuberev-p48-b6-ten-frame.log
          python scripts/cuberev-observation/active_p48_fixed_site_scan.py | tee /tmp/cuberev-p48-active-scan.log
          grep -q '^ACTIVE_P48_12_FRAME_TWO_PROBE_RECONSTRUCTION_PASS' /tmp/cuberev-p48-active-scan.log
          python scripts/cuberev-observation/verify_b6_complete_4845_p48.py | tee /tmp/cuberev-p48/all4845_classification.log
          grep -q '^P48_B6_ALL_4845_NEGATIVE_CLASSIFICATION_PASS' /tmp/cuberev-p48/all4845_classification.log
          grep -q '^P48_B6_15_SENSOR_LOWER_BOUND_PASS' /tmp/cuberev-p48/all4845_classification.log
          grep -q '^P48_B6_872_SUPPORT_KERNEL_IRREDUNDANT' /tmp/cuberev-p48/all4845_classification.log
          python scripts/cuberev-observation/emit_b5_adjacent_p48_discovery_goals.py /tmp/cuberev-p48
      - name: Compile exact P48 full-state MITM
        run: |
          set -euo pipefail
          g++ --version | head -n 1
          g++ -O3 -std=c++17 -I /tmp/cuberev-p48 scripts/cuberev-observation/verify_b6_41_mitm_p48.cpp -o /tmp/cuberev-p48/mitm_p48
          g++ -O3 -std=c++17 -I /tmp/cuberev-p48 scripts/cuberev-observation/discover_b5_adjacent_p48_mitm.cpp -o /tmp/cuberev-p48/discover_b5_p48
      - name: Reconstruct B5 negative-adjacent witness pairs using fresh P48 exact MITM
        run: |
          set -euo pipefail
          /tmp/cuberev-p48/discover_b5_p48 /tmp/cuberev-p48/b5_adjacent_candidate_goals121.txt | tee /tmp/cuberev-p48/b5_adjacent_discovery.log
          python scripts/cuberev-observation/verify_b5_adjacent_p48_discovery_receipt.py /tmp/cuberev-p48/b5_adjacent_discovery.log
      - name: Independent 41-target exact radius-6 exclusion (5 complete batches)
        run: |
          set -euo pipefail
          cd /tmp/cuberev-p48
          for bounds in '0 8' '8 16' '16 24' '24 32' '32 41'; do
            read first last <<< "$bounds"
            echo "BATCH $first:$last"
            ./mitm_p48 targets41.txt "$first" "$last" | tee "batch_${first}_${last}.log"
            grep -q "P48_CERTIFIED range=$first:$last" "batch_${first}_${last}.log"
          done
          test "$(grep -h '^P48_PASS target=' batch_*.log | wc -l)" -eq 41
          sha256sum targets41.txt raw_goal48.hex b6_factor_table.hpp all4845_classification.log b5_adjacent_discovery.log b5_adjacent_candidate_orbits11.txt b5_adjacent_candidate_goals121.txt batch_*.log | tee sha256sums.txt
          echo "INDEPENDENT_P48_B6_41_ALL_PASS"
      - name: Preserve verification outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuberev-028-independent-p48-b6-${{ github.sha }}
          path: |
            /tmp/cuberev-p48/targets41.txt
            /tmp/cuberev-p48/b5_adjacent_candidate_goals121.txt
            /tmp/cuberev-p48/b5_adjacent_candidate_orbits11.txt
            /tmp/cuberev-p48/b5_adjacent_discovery.log
            /tmp/cuberev-p48/all4845_classification.log
            /tmp/cuberev-p48/raw_goal48.hex
            /tmp/cuberev-p48/b6_factor_table.hpp
            /tmp/cuberev-p48/batch_*.log
            /tmp/cuberev-p48/sha256sums.txt
          retention-days: 30
