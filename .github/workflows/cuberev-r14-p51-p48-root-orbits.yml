name: CUBE-REV R14-P5.1 P48 root orbit theorem

on:
  push:
    branches:
      - research/current
    paths:
      - 'scripts/cuberev-observation/audit_r14_p51_p48_group_lift.py'
      - 'docs/0.28/20261106_R14_P51_PHYSICAL_P48_ROOT_ORBIT_THEOREM.md'
      - '.github/workflows/cuberev-r14-p51-p48-root-orbits.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-group-equivariance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate standalone 3D P48 and 576-to-12 paired-query stabilizer
        run: |
          python scripts/cuberev-observation/audit_r14_p51_p48_group_lift.py > /tmp/r14-p51.json
          python -c 'import json;d=json.load(open("/tmp/r14-p51.json"));assert d["result"]=="R14_P51_P48_FULL_GROUP_COVARIANCE_PASS" and d["physical_slot_count"]==48 and d["physical_move_count"]==18 and d["physical_legal_scrambles_checked"]==2001 and d["full_joint_probe_orbit"]==576 and d["local_group_order"]==12 and d["proper_spatial_rotations"]==24 and d["first_frame_response_orbits"]=={"same":6,"opposite":6,"adjacent":24} and d["first_frame_fixed_query_second_query_orbits"]==12 and d["first_frame_fixed_query_second_orbit_size_histogram"]=={"1":6,"21":2,"22":3,"462":1} and d["all_root_color_pair_orbits_verified"] and d["illegal_edge_only_swap_rejected"];print("R14_P51_P48_GROUP_COVARIANCE_AND_ROOT_ORBITS_PASS")'
      - name: Preserve exact read-only proof receipt
        uses: actions/upload-artifact@v4
        with:
          name: cuberev-r14-p51-physical-root-orbits
          path: /tmp/r14-p51.json
          retention-days: 30
