name: CUBE-REV 0.8.13 native browser and factory certification
on:
  push:
    branches: [cube-rev-0.8.13-native-browser-live-factory]
  pull_request:
    branches: [cube-rev-0.8.12-active-session-cas]
    paths:
      - '.github/workflows/build-0.8.13-native-browser-live-factory.yml'
      - 'participant-cognitive-mode-0.8.13.html'
      - 'js/*0.8.13*'
      - 'scripts/*0_8_13*'
      - 'tests/*0.8.13*'
      - 'factory/**'
      - 'cognitive/*0.8.13*'
      - 'research/*0.8.13*'
permissions:
  contents: read
jobs:
  native-browser-and-factory:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cube-rev-0.8.13-native-browser-live-factory
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build pinned 0.8.13 assets
        run: node scripts/build_0_8_13_assets.js
      - name: Syntax and identity checks
        shell: bash
        run: |
          node --check scripts/build_0_8_13_assets.js
          node --check scripts/make_synthetic_snapshot_0_8_13.js
          node --check scripts/live_collector_probe_0_8_13.mjs
          node --check js/public-asset-verifier-0.8.13.js
          node --check js/participant-cognitive-mode-0.8.13.js
          node --check js/active-session-cas-0.8.13.js
          node --check tests/native_multi_window_0.8.13.spec.js
          python -m py_compile factory/cognitive_snapshot_adapter_0_8_13.py tests/factory_reconstruction_0.8.13.py tests/transport_session_bridge_0.8.13.py
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('participant-cognitive-mode-0.8.13.html','utf8');
          const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(x=>x[1]).filter(x=>x.trim());
          if(blocks.length!==1)throw new Error(`INLINE_SCRIPT_COUNT:${blocks.length}`);
          for(const s of ['active-session-cas-0.8.12.js','active-session-cas-0.8.13.js','participant-cognitive-mode-0.8.13.js'])if(!html.includes(s))throw new Error(`SCRIPT_MISSING:${s}`);
          fs.writeFileSync('/tmp/cr0813-inline.js',blocks[0]);
          NODE
          node --check /tmp/cr0813-inline.js
          grep -F '"version":"CUBE-REV 0.8.13"' cognitive/PARTICIPANT_STIMULUS_BANK_0.8.13.json
          grep -F '"version":"CUBE-REV 0.8.13"' cognitive/COGNITIVE_MODE_CONFIG_0.8.13.json
          grep -F '"native_browser_contract":"TWO_PAGE_SAME_ORIGIN_WEB_LOCKS_STORAGE_EVENT_V1"' cognitive/COGNITIVE_MODE_CONFIG_0.8.13.json
          grep -F '"factory_adapter_contract":"CR0813_COGNITIVE_SNAPSHOT_FACTORY_ADAPTER_V1"' cognitive/COGNITIVE_MODE_CONFIG_0.8.13.json
          ! grep -E '"(state_id|rotation_id|face_map|choice_canonical|canonical_move|pair_id|member_id|probe_name|diagnostic_class|branch_count|branch_level|decision_class|distance)"[[:space:]]*:' cognitive/PARTICIPANT_STIMULUS_BANK_0.8.13.json
      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute native two-page browser and delayed receipt tests
        run: npx playwright test tests/native_multi_window_0.8.13.spec.js --workers=1 --reporter=line
      - name: Execute Factory reconstruction
        run: |
          node scripts/make_synthetic_snapshot_0_8_13.js artifacts/0.8.13/live_synthetic_snapshot.json
          python tests/transport_session_bridge_0.8.13.py
          python factory/cognitive_snapshot_adapter_0_8_13.py artifacts/0.8.13/native_snapshot.json --outdir artifacts/0.8.13/native_factory
          python factory/cognitive_snapshot_adapter_0_8_13.py artifacts/0.8.13/live_synthetic_snapshot.json --outdir artifacts/0.8.13/synthetic_factory
          python tests/factory_reconstruction_0.8.13.py
      - name: Run inherited contracts
        run: |
          node tests/active_session_cas_0.8.12.test.js
          node -r ./js/atomic-migration-commit-authority-0.8.11.js tests/atomic_migration_arbitration_0.8.11.test.js
          node tests/cross_version_resume_hash_pin_0.8.10.test.js
          node tests/public_bank_minimization_0.8.9.test.js
          node tests/immutable_snapshot_contract_0.8.8.test.js
      - name: Verify frozen Collector and deterministic generated bytes
        shell: bash
        run: |
          git fetch origin cube-rev-0.8.12-active-session-cas
          if git diff --name-only origin/cube-rev-0.8.12-active-session-cas...HEAD | grep -E '^(collector-config\.js|js/collector-client\.js)$'; then
            echo 'Frozen collector file changed.' >&2; exit 1
          fi
          mkdir -p /tmp/cr0813-first
          cp cognitive/PARTICIPANT_STIMULUS_BANK_0.8.13.json cognitive/COGNITIVE_MODE_CONFIG_0.8.13.json research/CUBE_REV_0.8.13_ASSET_MANIFEST.json js/asset-pins-0.8.13.js /tmp/cr0813-first/
          node scripts/build_0_8_13_assets.js
          cmp /tmp/cr0813-first/PARTICIPANT_STIMULUS_BANK_0.8.13.json cognitive/PARTICIPANT_STIMULUS_BANK_0.8.13.json
          cmp /tmp/cr0813-first/COGNITIVE_MODE_CONFIG_0.8.13.json cognitive/COGNITIVE_MODE_CONFIG_0.8.13.json
          cmp /tmp/cr0813-first/CUBE_REV_0.8.13_ASSET_MANIFEST.json research/CUBE_REV_0.8.13_ASSET_MANIFEST.json
          cmp /tmp/cr0813-first/asset-pins-0.8.13.js js/asset-pins-0.8.13.js
          sha256sum cognitive/PARTICIPANT_STIMULUS_BANK_0.8.13.json cognitive/COGNITIVE_MODE_CONFIG_0.8.13.json research/CUBE_REV_0.8.13_ASSET_MANIFEST.json js/asset-pins-0.8.13.js > artifacts/0.8.13/GENERATED_SHA256SUMS.txt
          echo 'CR0813_NATIVE_FACTORY_CI_PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cube-rev-0.8.13-native-browser-factory-evidence
          path: artifacts/0.8.13
          retention-days: 14
          if-no-files-found: warn
