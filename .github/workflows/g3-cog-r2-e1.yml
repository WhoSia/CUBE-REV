name: G3 cognitive runtime E1 and RSTP certification

on:
  push:
    branches: [g3-p10-r1-cognitive-runtime]
    paths:
      - 'g3-cog/**'
      - '.github/workflows/g3-cog-r2-e1.yml'
      - '!g3-cog/certification/r2-receipt.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify-e1:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - name: Checkout exact branch bytes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: g3-p10-r1-cognitive-runtime
          fetch-depth: 0
      - name: Install exact Playwright package
        shell: bash
        run: |
          set -euxo pipefail
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Execute served-HTTPS E1, 24-permutation, manifest and non-Cube RSTP certification
        id: cert
        shell: bash
        env:
          G3_E1_URL: https://cube-rev-g3-cog-e1.onrender.com
        run: |
          set +e
          node g3-cog/tests/r2-e1-cert.mjs
          STATUS=$?
          node -e "const fs=require('fs');const p='g3-cog/certification/r2-receipt.json';const r=JSON.parse(fs.readFileSync(p));Object.assign(r,{workflow:'g3-cog-r2-e1.yml',workflow_run_id:process.env.GITHUB_RUN_ID,workflow_run_attempt:process.env.GITHUB_RUN_ATTEMPT,container:'mcr.microsoft.com/playwright:v1.55.0-noble',playwright:'1.55.0',runner:'ubuntu-24.04'});fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n')"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Seal R2 receipt back to branch
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add g3-cog/certification/r2-receipt.json
          git commit -m 'G3 P10-R2: seal E1 and RSTP certification receipt [skip ci]' || true
          git push origin HEAD:g3-p10-r1-cognitive-runtime
      - name: Enforce R2 verdict
        shell: bash
        run: |
          test '${{ steps.cert.outputs.status }}' = '0'
