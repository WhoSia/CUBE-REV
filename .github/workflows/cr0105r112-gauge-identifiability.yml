name: CR0105R112 Gauge Identifiability Court
on:
  push:
    branches: [cube-rev-0.10.5-r1.12-roux-generation-g2]
    paths: [cr0105r112/RUN_GAUGE_IDENTIFIABILITY]
permissions:
  contents: write
jobs:
  identifiability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify frozen primary and first destroy court
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          g=json.load(open('research/0.10.5-r1.12/evidence-g2/ROUX_G2_GEOMETRY_AUDIT.json'))
          d=json.load(open('research/0.10.5-r1.12/evidence-destroy/ROUX_G2_COORDINATE_GAUGE_DESTROY_AUDIT.json'))
          assert g['status']=='HOLD_ROUX_G2_GEOMETRY'
          assert g['semantic_sha256']=='f1c19e8b960373e9968cab8b57c48a0ae4ed130d02d8d27704126462d40595e8'
          assert d['status']=='POSTHOC_DIAGNOSTIC_ONLY_NO_G2_GATE_CHANGE'
          assert d['semantic_sha256']=='9f505ef602a68d0c62158bfc0f05f81b5da7dcdc7951b82b0048202b6ccb2611'
          assert d['post_result_gate_change'] is False
          assert d['counts']['route_global_any_solution']==120
          print('CR0105R112_GAUGE_IDENTIFIABILITY_LINEAGE_PASS')
          PY
      - name: Install exact cube-state runtime
        run: npm install --no-save --ignore-scripts cubing@0.63.3
      - name: Run final-orientation and FB-prefix gauge attack
        id: gaugecourt
        shell: bash
        env: {R112_ROOT: /tmp/r112}
        run: |
          set +e
          mkdir -p /tmp/r112
          node research/0.10.5-r1.12/r112_destroy_gauge_identifiability.mjs 2>&1 | tee /tmp/r112/GAUGE_IDENTIFIABILITY_LOG.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist fail-observable gauge evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p research/0.10.5-r1.12/evidence-gauge-identifiability
          for f in ROUX_G2_GAUGE_IDENTIFIABILITY_AUDIT.json ROUX_G2_GAUGE_IDENTIFIABILITY_ROWS.json GAUGE_IDENTIFIABILITY_LOG.txt; do
            test -f "/tmp/r112/$f" && cp "/tmp/r112/$f" research/0.10.5-r1.12/evidence-gauge-identifiability/ || true
          done
          python3 - <<'PY'
          import json,os,datetime,pathlib
          x={'schema_version':'CR0105R112-GAUGE-IDENTIFIABILITY-RUN-1','workflow_run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'exit_code':int('${{ steps.gaugecourt.outputs.exit_code || 97 }}'),'primary_gate_changed':False,'fresh_network_read':False,'fresh_confirmatory_scoring':False,'human_observations':0,'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('research/0.10.5-r1.12/evidence-gauge-identifiability/RUN_METADATA.json').write_text(json.dumps(x,indent=2)+'\n')
          PY
      - name: Commit gauge evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/0.10.5-r1.12/evidence-gauge-identifiability
          git diff --cached --quiet || git commit -m "Record CUBE-REV 0.10.5-R1.12 gauge identifiability court ${GITHUB_RUN_ID}"
          git pull --rebase origin cube-rev-0.10.5-r1.12-roux-generation-g2
          git push origin HEAD:cube-rev-0.10.5-r1.12-roux-generation-g2
      - name: Enforce diagnostic-only completion
        if: always()
        run: |
          test '${{ steps.gaugecourt.outputs.exit_code }}' = '0'
          python3 - <<'PY'
          import json
          x=json.load(open('research/0.10.5-r1.12/evidence-gauge-identifiability/ROUX_G2_GAUGE_IDENTIFIABILITY_AUDIT.json'))
          assert x['status']=='POSTHOC_DIAGNOSTIC_ONLY_NO_G2_GATE_CHANGE'
          assert x['post_result_gate_change'] is False
          print('CR0105R112_GAUGE_IDENTIFIABILITY_COMPLETE',x['counts'])
          PY
