name: CUBE-REV 0.18 Exact 398-Row Cube M-star k33 Proof Court

on:
  push:
    branches: [research/current]
    paths:
      - 'scripts/cuberev-018/reduce-by-source-implication.py'
      - 'scripts/cuberev-018/audit-rowcore-highs-k33.py'
      - 'scripts/cuberev-018/solve-rowcore-k33.py'
      - '.github/workflows/cuberev-018-rowcore-k33.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-implication:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct real 18-HTM Cube observation partitions from sticker model
        run: |
          mkdir -p /tmp/cuberev018-rowcore
          node scripts/cuberev-018/export-mstar-physical.mjs /tmp/cuberev018-rowcore/physical.json
      - name: Reconstruct and fully verify all 1192 to 398 source implications
        run: |
          python scripts/cuberev-018/reduce-by-source-implication.py \
            --physical /tmp/cuberev018-rowcore/physical.json \
            --output /tmp/cuberev018-rowcore/row-implication.json
      - name: Independently reproduce numerical HiGHS k33 court (not a formal proof)
        run: |
          python -m pip install --disable-pip-version-check 'scipy==1.17.0'
          python scripts/cuberev-018/audit-rowcore-highs-k33.py \
            --physical /tmp/cuberev018-rowcore/physical.json \
            --core /tmp/cuberev018-rowcore/row-implication.json \
            --output /tmp/cuberev018-rowcore/highs-numerical-receipt.json \
            --seconds 45
      - name: Install pinned proof-capable SAT solver
        run: |
          python -m pip install --disable-pip-version-check 'python-sat==1.9.dev15'
          python -m pip show python-sat
      - name: Solve exactly equivalent 398-original-source k33 SAT CNF
        run: |
          python scripts/cuberev-018/solve-rowcore-k33.py \
            --physical /tmp/cuberev018-rowcore/physical.json \
            --core /tmp/cuberev018-rowcore/row-implication.json \
            --output /tmp/cuberev018-rowcore/k33 \
            --conflicts 2500000
      - name: Independently replay any SAT catalogue on real Cube actions
        run: |
          node scripts/cuberev-018/verify-sat-witness-physical.mjs \
            /tmp/cuberev018-rowcore/k33/sat_witness.json
      - name: Verify any UNSAT certificate with separately pinned checker
        run: |
          if test ! -f /tmp/cuberev018-rowcore/k33/cube_original_398row_k33.drup; then
            echo 'CUBE_K33_NO_UNSAT_TRACE: SAT or UNKNOWN; no lower-bound promotion'
          else
            git clone --quiet https://github.com/marijnheule/drat-trim.git /tmp/cuberev018-rowcore/drat-trim
            git -C /tmp/cuberev018-rowcore/drat-trim checkout --quiet 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
            make -C /tmp/cuberev018-rowcore/drat-trim
            /tmp/cuberev018-rowcore/drat-trim/drat-trim \
              /tmp/cuberev018-rowcore/k33/cube_original_398row_k33.cnf \
              /tmp/cuberev018-rowcore/k33/cube_original_398row_k33.drup \
              | tee /tmp/cuberev018-rowcore/k33/independent_checker.log
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/cuberev018-rowcore/k33')
          log=(p/'independent_checker.log').read_text()
          assert 's VERIFIED' in log,log[-3000:]
          receipt=json.loads((p/'receipt.json').read_text())
          assert receipt['state']=='UNSAT_EXTERNAL_CHECK_PENDING'
          assert receipt['k']==33 and receipt['equivalent_core_constraints']==398
          receipt['state']='CUBE_ORIGINAL_K33_CORE398_DRUP_INDEPENDENTLY_VERIFIED'
          receipt['independent_certificate']=True
          receipt['checker_pin']='2e3b2dc0ecf938addbd779d42877b6ed69d9a985'
          (p/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('CUBE_REV_018_K33_FULL_ORIGINAL_EXACT_UNSAT_VIA_ROWCORE_PASS')
          PY
          fi
      - name: Retain frozen original Cube, equivalence certificate, CNF, and checked proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cube-rev-018-398row-exact-k33-certificate
          path: /tmp/cuberev018-rowcore/
          if-no-files-found: warn
          retention-days: 30
