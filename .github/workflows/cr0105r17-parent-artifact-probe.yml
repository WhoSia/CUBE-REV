name: CR0105R17 Parent Artifact Probe
on:
  push:
    branches: [cube-rev-0.10.5-r1.7-counterfactual-route]
    paths: [cr0105r17/RUN_PARENT_PROBE]
permissions:
  contents: write
  actions: read
concurrency:
  group: cr0105r17-parent-artifact-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify R1.6 lineage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('research/0.10.5-r1.6/final/RAVEL_INTERPRETATION_SEAL.json'))
          assert x['status']=='PASS'
          assert x['authoritative_evidence']['artifact_id']==9310311696
          assert x['wca_population_spine']['zip_sha256']=='35ce0975798b3c4f648c2421f35b94784ed0811fec8df12f70e8ae574f2d20ad'
          assert x['public_authority_boundary']['human_observations']==0
          print('R16_LINEAGE_PASS')
          PY
      - name: Restore exact R1.6 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r17parent
          gh api -H 'Accept: application/vnd.github+json' \
            repos/${GITHUB_REPOSITORY}/actions/artifacts/9310311696/zip > /tmp/r17parent/r16.zip
          unzip -q /tmp/r17parent/r16.zip -d /tmp/r17parent/unpacked
          find /tmp/r17parent/unpacked -maxdepth 3 -type f -printf '%P\t%s\n' | sort > /tmp/r17parent/files.tsv
          DB="$(find /tmp/r17parent/unpacked -type f -name 'wca333.duckdb' -print -quit)"
          test -n "$DB"
          echo "R17_PARENT_DB=$DB" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install probe runtime
        run: python -m pip install --disable-pip-version-check duckdb==1.3.2
      - name: Audit parent DB schema
        run: |
          set -euo pipefail
          mkdir -p research/0.10.5-r1.7/evidence-parent
          python3 - <<'PY'
          import duckdb,json,hashlib,os,pathlib
          db=pathlib.Path(os.environ['R17_PARENT_DB'])
          h=hashlib.sha256()
          with db.open('rb') as f:
              for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
          con=duckdb.connect(str(db),read_only=True)
          tables=[r[0] for r in con.execute("show tables").fetchall()]
          wanted=['attempt_spine','phenotype_attempts','reco_index','linkage_candidates','linkage_class','scrambles_333','results_333','attempts_333','competitions_333']
          rows={}
          schemas={}
          for t in wanted:
              if t in tables:
                  rows[t]=con.execute(f'select count(*) from {t}').fetchone()[0]
                  schemas[t]=[{'name':r[0],'type':r[1]} for r in con.execute(f'describe {t}').fetchall()]
          checks={
            'attempts_333': rows.get('attempt_spine')==9159748,
            'reco_333': rows.get('reco_index')==10596,
            'linkage_class': rows.get('linkage_class')==10596,
            'linkage_candidates_nonzero': rows.get('linkage_candidates',0)>0,
            'phenotype_population': rows.get('phenotype_attempts')==9159748,
          }
          out={
            'schema_version':'CR0105R17-PARENT-ARTIFACT-PROBE-1',
            'status':'PASS' if all(checks.values()) else 'HOLD',
            'parent_artifact_id':9310311696,
            'parent_artifact_digest':'sha256:f40270656c24d2a17b0b29a0add9e21b58950a9a9ac154cef0d475a1908ea27d',
            'db_bytes':db.stat().st_size,'db_sha256':h.hexdigest(),
            'tables':tables,'row_counts':rows,'schemas':schemas,'checks':checks,
            'human_observations':0,'public_runner_mutation':False
          }
          p=pathlib.Path('research/0.10.5-r1.7/evidence-parent/PARENT_ARTIFACT_PROBE.json')
          p.write_text(json.dumps(out,indent=2)+'\n')
          if out['status']!='PASS': raise SystemExit(2)
          print(json.dumps({'status':out['status'],'rows':rows},indent=2))
          PY
          cp /tmp/r17parent/files.tsv research/0.10.5-r1.7/evidence-parent/PARENT_ARTIFACT_FILES.tsv
      - name: Commit probe evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/0.10.5-r1.7/evidence-parent
          git diff --cached --quiet || git commit -m "Record CUBE-REV 0.10.5-R1.7 parent artifact probe ${GITHUB_RUN_ID}"
          git push origin HEAD:cube-rev-0.10.5-r1.7-counterfactual-route
