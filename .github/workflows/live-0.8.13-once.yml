name: CUBE-REV 0.8.13 one-time live Collector certification
on:
  push:
    branches: [cube-rev-0.8.13-native-browser-live-factory]
    paths: ['.github/workflows/live-0.8.13-once.yml']
  pull_request:
    branches: [cube-rev-0.8.12-active-session-cas]
    paths: ['.github/workflows/live-0.8.13-once.yml']
permissions:
  contents: write
jobs:
  live-collector:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cube-rev-0.8.13-native-browser-live-factory
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact synthetic live-cert snapshot
        run: |
          # execution nonce: 2026-08-02T20:49+09:00
          node scripts/build_0_8_13_assets.js
          node scripts/make_synthetic_snapshot_0_8_13.js artifacts/0.8.13/live_synthetic_snapshot.json
      - name: Submit same snapshot twice with different nonces
        env:
          CUBE_REV_COLLECTOR_ENDPOINT: https://script.google.com/macros/s/AKfycbwJEB0khZSmbbvUkjlzdWE9y33ALHml9D8NUnDhPi9_Z5Z6ZmhoRfjwaRo6vjjaDVVyPw/exec
          CUBE_REV_COLLECTOR_ID: CUBE-REV-0712-MAIN
          CUBE_REV_COLLECTOR_CONTRACT: '0.7.12'
          CUBE_REV_COLLECTOR_PROTOCOL: receipt-v2
        run: node scripts/live_collector_probe_0_8_13.mjs artifacts/0.8.13/live_synthetic_snapshot.json artifacts/0.8.13/live_collector_evidence.json
      - name: Commit live evidence after successful receipt convergence
        shell: bash
        run: |
          cp artifacts/0.8.13/live_collector_evidence.json research/CUBE_REV_0.8.13_LIVE_COLLECTOR_EVIDENCE.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/CUBE_REV_0.8.13_LIVE_COLLECTOR_EVIDENCE.json
          if git diff --cached --quiet; then
            echo 'CR0813_LIVE_EVIDENCE_ALREADY_COMMITTED'
          else
            git commit -m 'evidence(0.8.13): record live Collector receipt convergence'
            git push origin HEAD:cube-rev-0.8.13-native-browser-live-factory
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cube-rev-0.8.13-live-collector-evidence
          path: artifacts/0.8.13
          retention-days: 14
          if-no-files-found: error
  observe-live-evidence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cube-rev-0.8.13-native-browser-live-factory
          fetch-depth: 0
      - name: Wait for and verify committed live evidence
        shell: bash
        run: |
          for attempt in $(seq 1 120); do
            git fetch origin cube-rev-0.8.13-native-browser-live-factory --quiet
            if git show origin/cube-rev-0.8.13-native-browser-live-factory:research/CUBE_REV_0.8.13_LIVE_COLLECTOR_EVIDENCE.json > /tmp/live-evidence.json 2>/dev/null; then
              node -e "const fs=require('fs');const e=JSON.parse(fs.readFileSync('/tmp/live-evidence.json','utf8'));if(e.schema_version!=='CR0813-LIVE-COLLECTOR-EVIDENCE-1')throw Error('LIVE_EVIDENCE_SCHEMA');if(e.result!=='PASS_LIVE_COLLECTOR_TWO_NONCE_DEDUP')throw Error('LIVE_EVIDENCE_RESULT');if(e.snapshot.session_id!=='CR0813-LIVE-CERT-SYNTHETIC-DO-NOT-ANALYZE-001')throw Error('LIVE_SESSION_IDENTITY');if(e.snapshot.response_count!==28)throw Error('LIVE_RESPONSE_COUNT');if(!Array.isArray(e.deliveries)||e.deliveries.length!==2)throw Error('LIVE_DELIVERY_COUNT');if(!['stored','duplicate'].includes(e.deliveries[0].status))throw Error('FIRST_RECEIPT_STATUS');if(e.deliveries[1].status!=='duplicate')throw Error('SECOND_RECEIPT_STATUS');console.log('CR0813_LIVE_EVIDENCE_OBSERVED first='+e.deliveries[0].status+' second='+e.deliveries[1].status+' file='+(e.deliveries[1].file_name||e.deliveries[0].file_name));"
              exit 0
            fi
            sleep 2
          done
          echo 'LIVE_EVIDENCE_TIMEOUT' >&2
          exit 1
