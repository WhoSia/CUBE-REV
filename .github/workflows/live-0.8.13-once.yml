name: CUBE-REV 0.8.13 one-time live Collector certification
on:
  pull_request:
    branches: [cube-rev-0.8.12-active-session-cas]
    paths: ['.github/workflows/live-0.8.13-once.yml']
permissions:
  contents: write
jobs:
  live-collector:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cube-rev-0.8.13-native-browser-live-factory
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact synthetic live-cert snapshot
        run: |
          # execution nonce: 2026-08-02T20:58+09:00
          node scripts/build_0_8_13_assets.js
          node scripts/make_synthetic_snapshot_0_8_13.js artifacts/0.8.13/live_synthetic_snapshot.json
      - name: Probe live receipt-v2 Collector
        id: probe
        shell: bash
        env:
          CUBE_REV_COLLECTOR_ENDPOINT: https://script.google.com/macros/s/AKfycbwJEB0khZSmbbvUkjlzdWE9y33ALHml9D8NUnDhPi9_Z5Z6ZmhoRfjwaRo6vjjaDVVyPw/exec
          CUBE_REV_COLLECTOR_ID: CUBE-REV-0712-MAIN
          CUBE_REV_COLLECTOR_CONTRACT: '0.7.12'
          CUBE_REV_COLLECTOR_PROTOCOL: receipt-v2
        run: |
          set +e
          node scripts/live_collector_probe_0_8_13.mjs artifacts/0.8.13/live_synthetic_snapshot.json artifacts/0.8.13/live_collector_evidence.json > artifacts/0.8.13/live_probe.log 2>&1
          status=$?
          set -e
          cat artifacts/0.8.13/live_probe.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit live success or failure evidence
        if: always()
        shell: bash
        env:
          PROBE_STATUS: ${{ steps.probe.outputs.status }}
          TRIGGER_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$PROBE_STATUS" = "0" ] && [ -f artifacts/0.8.13/live_collector_evidence.json ]; then
            node -e "const fs=require('fs');const p='artifacts/0.8.13/live_collector_evidence.json';const e=JSON.parse(fs.readFileSync(p,'utf8'));e.trigger_sha=process.env.TRIGGER_SHA;e.workflow_run=Number(process.env.RUN_ID);fs.writeFileSync(p,JSON.stringify(e,null,2));"
            cp artifacts/0.8.13/live_collector_evidence.json research/CUBE_REV_0.8.13_LIVE_COLLECTOR_EVIDENCE.json
            rm -f research/CUBE_REV_0.8.13_LIVE_COLLECTOR_FAILURE.json
            message='evidence(0.8.13): record live Collector receipt convergence'
          else
            node -e "const fs=require('fs'),crypto=require('crypto');const log=fs.existsSync('artifacts/0.8.13/live_probe.log')?fs.readFileSync('artifacts/0.8.13/live_probe.log','utf8'):'';const e={schema_version:'CR0813-LIVE-COLLECTOR-FAILURE-1',trigger_sha:process.env.TRIGGER_SHA,workflow_run:Number(process.env.RUN_ID),failed_at:new Date().toISOString(),probe_status:Number(process.env.PROBE_STATUS||-1),endpoint_sha256:crypto.createHash('sha256').update('https://script.google.com/macros/s/AKfycbwJEB0khZSmbbvUkjlzdWE9y33ALHml9D8NUnDhPi9_Z5Z6ZmhoRfjwaRo6vjjaDVVyPw/exec').digest('hex'),log_tail:log.slice(-4000)};fs.writeFileSync('research/CUBE_REV_0.8.13_LIVE_COLLECTOR_FAILURE.json',JSON.stringify(e,null,2));"
            rm -f research/CUBE_REV_0.8.13_LIVE_COLLECTOR_EVIDENCE.json
            message='evidence(0.8.13): record live Collector probe failure'
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A research
          if ! git diff --cached --quiet; then
            git commit -m "$message"
            git fetch origin cube-rev-0.8.13-native-browser-live-factory
            git rebase origin/cube-rev-0.8.13-native-browser-live-factory
            git push origin HEAD:cube-rev-0.8.13-native-browser-live-factory
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cube-rev-0.8.13-live-collector-evidence
          path: artifacts/0.8.13
          retention-days: 14
          if-no-files-found: error
      - name: Enforce live probe success
        if: always()
        shell: bash
        env:
          PROBE_STATUS: ${{ steps.probe.outputs.status }}
        run: test "$PROBE_STATUS" = "0"
