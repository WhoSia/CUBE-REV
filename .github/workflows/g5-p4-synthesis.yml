name: Validate G5-P4 recovery synthesis

on:
  push:
    branches: ['research/current']
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  p4-synthesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Canonicalize Rust in runner
        run: cargo fmt --all
      - name: Publish canonical source blobs without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          encode_blob() {
            local path="$1"
            local context="$2"
            local encoded
            encoded="$(base64 -w0 "$path")"
            local sha
            sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs"               -f content="$encoded" -f encoding="base64" --jq '.sha')"
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"               -f state="success" -f context="$context" -f description="$sha" >/dev/null
          }
          encode_blob "crates/recovery-synthesis-core/src/lib.rs" "g5-p4/rustfmt-lib"
          encode_blob "crates/recovery-synthesis-core/src/bin/p4_open.rs" "g5-p4/rustfmt-bin"
      - name: Workspace check
        run: cargo check --workspace
      - name: Workspace tests
        run: cargo test --workspace
      - name: Materialize P4 opening court
        run: |
          mkdir -p g5/p4/ci-output
          cargo run --quiet -p recovery-synthesis-core --bin p4_open > g5/p4/ci-output/p4-opening.tsv
      - name: Upload P4 opening court
        uses: actions/upload-artifact@v4
        with:
          name: g5-p4-opening-court
          path: g5/p4/ci-output/
