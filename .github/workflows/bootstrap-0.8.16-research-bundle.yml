name: Bootstrap CUBE-REV 0.8.16 research bundle
on:
  push:
    branches: [cube-rev-0.8.16-minimal-trajectory-probes]
    paths:
      - '.github/workflows/bootstrap-0.8.16-research-bundle.yml'
      - 'scripts/bootstrap_0_8_16_bundle.py'
      - 'scripts/.cr0816_payload_*.txt'
      - 'research/.cr0816_bootstrap_trigger'
  pull_request:
    branches: [cube-rev-0.8.15-cognitive-mechanism-lattice]
    paths:
      - '.github/workflows/bootstrap-0.8.16-research-bundle.yml'
      - 'scripts/bootstrap_0_8_16_bundle.py'
      - 'scripts/.cr0816_payload_*.txt'
      - 'research/.cr0816_bootstrap_trigger'
permissions:
  contents: write
jobs:
  install-and-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cube-rev-0.8.16-minimal-trajectory-probes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and install exact research bundle
        run: |
          python scripts/bootstrap_0_8_16_bundle.py
          python -m py_compile analysis/minimal_trajectory_probes_0_8_16.py
          python -m py_compile analysis/external_trajectory_linkage_0_8_16.py
          python -m py_compile tests/minimal_trajectory_probes_0.8.16.test.py
      - name: Commit readable research sources without workflow mutation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/minimal_trajectory_probes_0_8_16.py
          git add analysis/external_trajectory_linkage_0_8_16.py
          git add tests/minimal_trajectory_probes_0.8.16.test.py
          git add research/CUBE_REV_0.8.16_*
          git rm --ignore-unmatch scripts/bootstrap_0_8_16_bundle.py
          git rm --ignore-unmatch scripts/.cr0816_payload_00.txt scripts/.cr0816_payload_00a.txt scripts/.cr0816_payload_00b.txt scripts/.cr0816_payload_01.txt scripts/.cr0816_payload_02.txt scripts/.cr0816_payload_03.txt scripts/.cr0816_payload_04.txt scripts/.cr0816_payload_05.txt scripts/.cr0816_payload_06.txt
          git rm --ignore-unmatch research/.cr0816_bootstrap_trigger
          git diff --cached --check
          git commit -m 'feat(0.8.16): install minimal trajectory probe research wave'
          git push origin HEAD:cube-rev-0.8.16-minimal-trajectory-probes
