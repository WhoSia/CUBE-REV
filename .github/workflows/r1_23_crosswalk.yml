name: CUBE-REV R1.23 Crosswalk Court

on:
  push:
    branches:
      - research/r1.23-crosswalk-rebuild
    paths:
      - 'research/r1_23/rebuild_crosswalk.py'
      - '.github/workflows/r1_23_crosswalk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'research/r1_23/**'
      - '.github/workflows/r1_23_crosswalk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r1.23-crosswalk-rebuild
      - name: Acquire pinned CubeRoot bytes
        shell: bash
        run: |
          rm -rf research/r1_23/input research/r1_23/out
          mkdir -p research/r1_23/input research/r1_23/out
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/2017YANR02/cuberoot.me/e5a6bb14961b5b26c882f9fb3bf13d61d9eba890/data/recon_backup/recons_backup.json' \
            -o research/r1_23/input/recons_backup.json
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/2017YANR02/cuberoot.me/e5a6bb14961b5b26c882f9fb3bf13d61d9eba890/data/recon_backup/wca_attempts.json' \
            -o research/r1_23/input/wca_attempts.json
          sha256sum research/r1_23/input/*.json
      - name: Regenerate crosswalk and court
        run: |
          python3 research/r1_23/rebuild_crosswalk.py \
            --recons research/r1_23/input/recons_backup.json \
            --attempts research/r1_23/input/wca_attempts.json \
            --out research/r1_23/out
      - name: Smoke audit
        run: |
          python3 - <<'PY'
          import csv,json,pathlib
          p=pathlib.Path('research/r1_23/out')
          s=json.load(open(p/'summary.json'))
          assert s['n_wca_classified']==1625, s['n_wca_classified']
          rows=list(csv.DictReader(open(p/'crosswalk.csv')))
          assert len(rows)==1625
          assert all(r['recon_id'] for r in rows)
          print(s['verdict'])
          PY
      - name: Persist execution receipt
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          rm -rf research/r1_23/input
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/r1_23/out
          if git diff --cached --quiet; then
            echo 'No output changes'
          else
            git commit -m 'research: R1.23 regenerated crosswalk receipt [skip ci]'
            git push origin HEAD:research/r1.23-crosswalk-rebuild
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CUBE_REV_0.10.5-R1.23_CROSSWALK_COURT
          path: research/r1_23/out/
          if-no-files-found: error
          retention-days: 90
