name: CUBE-REV 0.22 P8-R3 — Source-Path HTR Membership
on:
  push:
    branches: [research/current]
    paths: ['scripts/cuberev-022/verify-p8-r3-exact-solution-HTR-first-contact-audit.mjs', 'data/cuberev-022/p8_r3_source_anchored_phase2_exact_witness_fixtures.json', '.github/workflows/cuberev-022-P8-R3-solved-path-HTR-contact.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified_sourced_paths:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original full-cube source and HTR-group audit
        run: |
          set -euo pipefail
          node scripts/cuberev-022/verify-p8-r3-exact-solution-HTR-first-contact-audit.mjs | tee p8_r3_path_HTR_receipt.json
      - name: Save exact physical receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuberev-022-P8-R3-physical-HTR-path-audit
          path: p8_r3_path_HTR_receipt.json
          retention-days: 90
