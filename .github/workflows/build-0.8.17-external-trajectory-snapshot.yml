name: CUBE-REV 0.8.17 external trajectory snapshot
on:
  push:
    branches: [cube-rev-0.8.17-versioned-external-trajectory]
  pull_request:
    branches: [cube-rev-0.8.16-minimal-trajectory-probes]
    paths:
      - '.github/workflows/build-0.8.17-external-trajectory-snapshot.yml'
      - 'analysis/external_trajectory_snapshot_0_8_17.py'
      - 'tests/external_trajectory_snapshot_0.8.17.test.py'
      - 'research/CUBE_REV_0.8.17*'
permissions:
  contents: read
jobs:
  external-trajectory-court:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cube-rev-0.8.17-versioned-external-trajectory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and protected-scope checks
        shell: bash
        run: |
          python -m py_compile analysis/external_trajectory_snapshot_0_8_17.py
          python -m py_compile tests/external_trajectory_snapshot_0.8.17.test.py
          git fetch origin cube-rev-0.8.16-minimal-trajectory-probes
          changed="$(git diff --name-only origin/cube-rev-0.8.16-minimal-trajectory-probes...HEAD)"
          protected='^(index\.html|collector-config\.js|js/collector-client\.js|participant-cognitive-mode-.*\.html|unsupported-browser-.*\.html|cognitive/|factory/|analysis/minimal_trajectory_probes_0_8_16\.py|tests/minimal_trajectory_probes_0\.8\.16\.test\.py|research/CUBE_REV_0\.8\.16)'
          if printf '%s\n' "$changed" | grep -E "$protected"; then
            echo 'Protected participant, parent research, Collector, Factory, bank, config, or production file changed.' >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '(^|/)\.cr0817_|bootstrap_0_8_17|bootstrap-0\.8\.17'; then
            echo 'Temporary bootstrap material remains in the research branch.' >&2
            exit 1
          fi
      - name: Execute deterministic external snapshot twice
        shell: bash
        run: |
          rm -rf /tmp/cr0817-a /tmp/cr0817-b artifacts/0.8.17
          python analysis/external_trajectory_snapshot_0_8_17.py \
            --fixtures research/CUBE_REV_0.8.17_EXTERNAL_TRAJECTORY_FIXTURE_PACK.json \
            --probe-registry research/CUBE_REV_0.8.16_TRAJECTORY_PROBE_REGISTRY.json \
            --outdir /tmp/cr0817-a
          python analysis/external_trajectory_snapshot_0_8_17.py \
            --fixtures research/CUBE_REV_0.8.17_EXTERNAL_TRAJECTORY_FIXTURE_PACK.json \
            --probe-registry research/CUBE_REV_0.8.16_TRAJECTORY_PROBE_REGISTRY.json \
            --outdir /tmp/cr0817-b
          diff -ru /tmp/cr0817-a /tmp/cr0817-b
          mkdir -p artifacts
          mv /tmp/cr0817-a artifacts/0.8.17
      - name: Run 0.8.17 contract court
        run: |
          python tests/external_trajectory_snapshot_0.8.17.test.py \
            --analysis analysis/external_trajectory_snapshot_0_8_17.py \
            --artifact-dir artifacts/0.8.17 \
            --fixtures research/CUBE_REV_0.8.17_EXTERNAL_TRAJECTORY_FIXTURE_PACK.json \
            --probe-registry research/CUBE_REV_0.8.16_TRAJECTORY_PROBE_REGISTRY.json
      - name: Run inherited 0.8.16 and 0.8.15 courts
        shell: bash
        run: |
          rm -rf /tmp/cr0816-inherited
          python analysis/minimal_trajectory_probes_0_8_16.py \
            --bank cognitive/PARTICIPANT_STIMULUS_BANK_0.8.13.json \
            --outdir /tmp/cr0816-inherited \
            --family-count 6 \
            --sessions-per-mechanism 360 \
            --seed 8162026
          python analysis/external_trajectory_linkage_0_8_16.py \
            --out /tmp/cr0816-inherited/CUBE_REV_0.8.16_EXTERNAL_LINKAGE_DRYRUN.json
          python tests/minimal_trajectory_probes_0.8.16.test.py \
            --artifact-dir /tmp/cr0816-inherited \
            --bank cognitive/PARTICIPANT_STIMULUS_BANK_0.8.13.json
          python tests/mechanism_lattice_0.8.15.test.py
      - name: Verify committed snapshot outputs
        shell: bash
        run: |
          cmp artifacts/0.8.17/CUBE_REV_0.8.17_ECOLOGICAL_PROBE_TRANSFER_RESULT.json research/CUBE_REV_0.8.17_ECOLOGICAL_PROBE_TRANSFER_RESULT.json
          cmp artifacts/0.8.17/CUBE_REV_0.8.17_ROUTE_GRAMMAR_ROWS.jsonl research/CUBE_REV_0.8.17_ROUTE_GRAMMAR_ROWS.jsonl
          cmp artifacts/0.8.17/CUBE_REV_0.8.17_EXTERNAL_SNAPSHOT_MANIFEST.json research/CUBE_REV_0.8.17_EXTERNAL_SNAPSHOT_MANIFEST.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/0.8.17/CUBE_REV_0.8.17_ECOLOGICAL_PROBE_TRANSFER_RESULT.json').read_text())
          assert r['decision']['local_motif_support']=='PASS'
          assert r['decision']['distributional_ecological_alignment']=='HOLD'
          assert r['decision']['timing_transfer']=='HOLD'
          assert r['decision']['cognitive_mechanism_transfer']=='NO_GO'
          assert r['stm_conformance']['exact_match_count']==10
          print('CR0817_COMMITTED_SNAPSHOT_OUTPUTS_PASS')
          PY
      - name: Seal portable self-excluding evidence inventory
        shell: bash
        run: |
          cp research/CUBE_REV_0.8.17_EXTERNAL_TRAJECTORY_FIXTURE_PACK.json artifacts/0.8.17/
          cp research/CUBE_REV_0.8.17_EXTERNAL_SOURCE_REGISTRY.json artifacts/0.8.17/
          cp research/CUBE_REV_0.8.17_ROUTE_GRAMMAR_CONTRACT.json artifacts/0.8.17/
          cp research/CUBE_REV_0.8.17_SCOPE_CHECKPOINT.md artifacts/0.8.17/
          cp research/CUBE_REV_0.8.17_VALIDATION_REPORT.md artifacts/0.8.17/
          cp research/CUBE_REV_0.8.17_DECISION_PACKET.json artifacts/0.8.17/
          cp research/CUBE_REV_0.8.17_RUNBOOK.md artifacts/0.8.17/
          (
            cd artifacts/0.8.17
            find . -type f ! -name ARTIFACT_SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum > /tmp/CR0817_ARTIFACT_SHA256SUMS.txt
            mv /tmp/CR0817_ARTIFACT_SHA256SUMS.txt ARTIFACT_SHA256SUMS.txt
            sha256sum -c ARTIFACT_SHA256SUMS.txt
          )
          echo 'CR0817_EXTERNAL_TRAJECTORY_CI_PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cube-rev-0.8.17-external-trajectory-evidence
          path: artifacts/0.8.17
          retention-days: 14
          if-no-files-found: error
