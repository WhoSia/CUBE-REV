name: CUBE-REV 0.25 P0-R4 five genuine cubie PDB shared face-budget certificate
on:
  workflow_dispatch:
  push:
    branches: [research/current]
    paths:
      - "scripts/cuberev-025/p0_r4_five_pattern_face_budget_go/main.go"
      - ".github/workflows/cuberev-025-P0-R4-five-pattern-continuous-face-budget-original-cube.yml"
permissions:
  contents: read
jobs:
  source-complete-physical-face-budget-five-patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject GitHub Actions bot author or committer in active branch history
        shell: bash
        run: |
          if git log --format='%an <%ae> %cn <%ce>' | grep -Ei 'github-actions?\[bot\]|github-action\[bot\]'; then
            echo "::error::GitHub bot commits forbidden"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.2"
      - name: Physical original 54-sticker five marked-cubie quotient cap 7 versus 8 exhaustive bounded proof
        shell: bash
        run: |
          set -o pipefail
          timeout 850 go run scripts/cuberev-025/p0_r4_five_pattern_face_budget_go/main.go | tee /tmp/cuberev-p0r4.log
          test "$(grep -c '^P0R4_SOURCE_COMPLETE_PHYSICAL_PROJECTED_WORD_COUNTS ' /tmp/cuberev-p0r4.log)" -eq 10
          grep -Fq 'P0R4_CERTIFICATE_CAP_SEARCH_COMPLETE bound=7 all_six_face_cap_vectors=792' /tmp/cuberev-p0r4.log
          grep -Fq 'P0R4_CERTIFICATE_CAP_SEARCH_COMPLETE bound=8 all_six_face_cap_vectors=1287 exists_common_cap=true' /tmp/cuberev-p0r4.log
          grep -Fq 'P0R4_UNIVERSAL_FIVE_PATTERN_CONTINUOUS_FACE_PRICE_CERTIFIED totalCap=8 ' /tmp/cuberev-p0r4.log
          grep -Fq 'P0R4_NOTE_COMPLETE_BOUNDED_WORD_CAP_SEARCH_DOES_NOT_SOLVE_GLOBAL_FRACTIONAL_COST_OPTIMIZATION_OR_FULL_CUBE_D15' /tmp/cuberev-p0r4.log
      - name: Independent existing actual whole 54-sticker WCA 18 HTM replay
        shell: bash
        run: |
          node scripts/cuberev-024/p1_r5_independent_original_54_facelet_18_replay.mjs
      - name: Read-only checkout
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
