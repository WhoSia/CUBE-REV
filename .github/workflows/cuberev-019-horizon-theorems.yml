name: CUBE-REV 0.19 Exact Fixed/Adaptive Physical Horizon Theorems
on:
  push:
    branches: [research/current]
    paths:
      - 'scripts/cuberev-019/verify-universal-and-adaptive-horizon.mjs'
      - 'scripts/cuberev-019/prove-fixed-horizon-L8.cpp'
      - '.github/workflows/cuberev-019-horizon-theorems.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-horizons:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify nine-turn universal observation and seven-turn adaptive minimax
        run: |
          node scripts/cuberev-019/verify-universal-and-adaptive-horizon.mjs
      - name: Derive independent sticker-move physical map in C++ interchange format
        run: |
          mkdir -p /tmp/cuberev019-horizon
          node --input-type=module > /tmp/cuberev019-horizon/physical-maps.txt <<'JS'
          import {urMoveAutomaton} from './scripts/cuberev-015/ur-fiber-tomography.mjs';
          for(const action of urMoveAutomaton()) console.log(action.join(' '));
          JS
      - name: Exhaustively verify eight-turn physical nonidentifiability
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -o /tmp/cuberev019-horizon/L8-check \
            scripts/cuberev-019/prove-fixed-horizon-L8.cpp
          /tmp/cuberev019-horizon/L8-check \
            < /tmp/cuberev019-horizon/physical-maps.txt \
            | tee /tmp/cuberev019-horizon/L8-rank-histogram.log
          grep -q 'CUBE_REV_019_LENGTH8_ALL_Q5_Q6_179830784_WORDS_MAX_RANK11_PASS' \
            /tmp/cuberev019-horizon/L8-rank-histogram.log
      - name: Retain physical-move interchange and exhaustive histogram
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cube-rev-019-exact-fixed9-adaptive7-horizon
          path: /tmp/cuberev019-horizon/
          retention-days: 90
