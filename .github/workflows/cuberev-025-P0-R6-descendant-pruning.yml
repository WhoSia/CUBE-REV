name: CUBE-REV 0.25 P0-R6 physical descendant pruning and matched performance court
on:
  workflow_dispatch:
  push:
    branches: [research/current]
    paths:
      - "scripts/cuberev-025/p0_r6_one_step_descendant_cpp/**"
      - "scripts/cuberev-025/p0_r6_receipt_go/**"
      - ".github/workflows/cuberev-025-P0-R6-descendant-pruning.yml"
permissions:
  contents: read
jobs:
  original-physical-full-cube:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject bot authors and committers
        shell: bash
        run: |
          set -euo pipefail
          if git log --format='%an <%ae> %cn <%ce>' | grep -Ei 'github-actions?\[bot\]|github-action\[bot\]'; then exit 1; fi
      - name: Compile unchanged physical P0-R5 reference and P0-R6 C++17
        run: |
          set -euo pipefail
          g++ -std=c++17 -O3 -Wno-return-type scripts/cuberev-025/p0_r5_corner_projected_global_membership_cpp/main.cpp -o /tmp/p0r5
          g++ -std=c++17 -O3 -Wno-return-type scripts/cuberev-025/p0_r6_one_step_descendant_cpp/main.cpp -o /tmp/p0r6
      - name: Small-radius completed sanity test
        shell: bash
        run: |
          set -euo pipefail
          /tmp/p0r6 3 3 120 | tee /tmp/p0r6-small.txt
          grep -Fq 'EXACT_EQUATION_PASS 1' /tmp/p0r6-small.txt
          grep -Fq 'P0R6_COMPLETE 1 ' /tmp/p0r6-small.txt
      - name: Reproduce original completed P0-R5 baseline on SAME runner
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f 'BENCH_P0R5_WALL_SECONDS %e PEAK_RSS_KIB %M USER_SECONDS %U SYSTEM_SECONDS %S' timeout 1000 /tmp/p0r5 6 7 950 2>&1 | tee /tmp/p0r5.log
          grep -Fq 'P0R5_FULL_PHYSICAL_GEODESIC_BOUNDS_LOWER 14 UPPER 18 OLD_CERTIFICATE_REPRODUCED 1' /tmp/p0r5.log
          grep -Fq 'P0R5_SAFE_ORIGINAL_CUBIE_PREFILTER_COMPLETE 1 GOAL_RADIUS 6 SOURCE_RADIUS 7 FULL_GOAL_STATES 8240087' /tmp/p0r5.log
      - name: Full original physical P0-R6 one-step subtree pruning
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f 'BENCH_P0R6_WALL_SECONDS %e PEAK_RSS_KIB %M USER_SECONDS %U SYSTEM_SECONDS %S' timeout 1100 /tmp/p0r6 6 7 1050 2>&1 | tee /tmp/p0r6.log
          grep -Fq 'P0R6_CANONICAL_ACCOUNTING BASELINE 120213368' /tmp/p0r6.log
          grep -Fq 'EXACT_EQUATION_PASS 1' /tmp/p0r6.log
          grep -Fq 'P0R6_COMPLETE 1 FULL_GOAL 8240087' /tmp/p0r6.log
          grep -Fq 'P0R6_GLOBAL_LOWER 14 UPPER 18 NEW_LOWER_NOT_CLAIMED 1' /tmp/p0r6.log
      - name: Independently audit exact coverage and measured time/RSS in Go
        shell: bash
        run: |
          set -euo pipefail
          go run scripts/cuberev-025/p0_r6_receipt_go/main.go /tmp/p0r5.log /tmp/p0r6.log | tee /tmp/p0r6-audit.log
          grep -Fq 'P0R6_AUDIT_SUCCESS' /tmp/p0r6-audit.log
      - name: Preserve immutable run-local evidence even on HOLD or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r6a-paired-b7-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/p0r5.log
            /tmp/p0r6.log
            /tmp/p0r6-audit.log
          if-no-files-found: warn
          retention-days: 30
      - name: No source mutation or writeback
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD --
          test -z "$(git ls-files --modified)"
