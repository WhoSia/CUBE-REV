name: G7-P19-P3 fresh48 bounded acquisition

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p19/p2-receipt.json'
      - 'scripts/g7-p19/acquire-fresh48-reco-batch.mjs'
      - '.github/workflows/g7-p19-p3-fresh48-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: g7-p19-fresh48-reco
  cancel-in-progress: false

jobs:
  batch:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: [1,2,3,4,5,6]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}

      - name: Zero-bot writeback firewall
        run: |
          set -euo pipefail
          ! grep -E 'git +(commit|push|tag)|contents: *write|github-actions\[bot\]' '.github/workflows/g7-p19-p3-fresh48-acquisition.yml'
          echo G7_P19_P3_ZERO_BOT_WRITEBACK_PATTERN_PASS

      - name: Recover sealed P19 fresh48 selection
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p19sel
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/artifacts/11333473475/zip" \
            -o /tmp/p19sel.zip
          echo '131bb5b3c5ef2b8176b04dc97684e000e0afcdedd651fe75e2a7f0b4418237da  /tmp/p19sel.zip' | sha256sum -c -
          unzip -q /tmp/p19sel.zip -d /tmp/p19sel
          MANIFEST="$(find /tmp/p19sel -name selection-manifest.json -print -quit)"
          test -n "$MANIFEST"
          node - "$MANIFEST" '${{ matrix.batch }}' <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const b=String(process.argv[3]);
          if(x.status!=='SEALED_BEFORE_FRESH48_BODY_CONTACT') process.exit(1);
          if(x.selection_manifest_sha256!=='671e230314aed38ed68e9c8337c2e64b3f57e2bddca181405d08f5805c78d15e') process.exit(2);
          if(x.prior_body_contacted_excluded!==418) process.exit(3);
          if(!Array.isArray(x.batches[b])||x.batches[b].length!==8) process.exit(4);
          console.log('G7_P19_BATCH_SELECTION_AUTHORITY_PASS');
          console.log('BATCH\t'+b);
          console.log('IDS\t'+x.batches[b].join(','));
          NODE

      - name: Dry-run bounded acquisition authority
        run: |
          set -euo pipefail
          MANIFEST="$(find /tmp/p19sel -name selection-manifest.json -print -quit)"
          node scripts/g7-p19/acquire-fresh48-reco-batch.mjs \
            --manifest "$MANIFEST" --batch '${{ matrix.batch }}' --out /tmp/unused

      - name: Acquire frozen fresh48 batch
        run: |
          set -euo pipefail
          B='${{ matrix.batch }}'
          PAD="$(printf '%02d' "$B")"
          MANIFEST="$(find /tmp/p19sel -name selection-manifest.json -print -quit)"
          OUT="/tmp/g7-p19-batch$PAD"
          rm -rf "$OUT"
          node scripts/g7-p19/acquire-fresh48-reco-batch.mjs \
            --manifest "$MANIFEST" --batch "$B" \
            --out "$OUT" --execute | tee "/tmp/g7-p19-batch$PAD-execution.log"

      - name: Exact trajectory replay
        run: |
          set -euo pipefail
          B='${{ matrix.batch }}'
          PAD="$(printf '%02d' "$B")"
          OUT="/tmp/g7-p19-batch$PAD"
          node scripts/cube/replay-exact-trajectories.mjs \
            --input "$OUT/derived/solves.jsonl" \
            --out "$OUT/exact"
          node - "$OUT/exact/exact-trajectories.json" "$B" <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const b=process.argv[3];
          if(x.solve_count!==8) process.exit(1);
          if(x.exact_end_validation_pass!==8) process.exit(2);
          console.log('G7_P19_BATCH_EXACT_PASS');
          console.log('BATCH\t'+b);
          console.log('PREFIXES\t'+x.total_prefixes);
          NODE

      - name: Seal bounded batch
        run: |
          set -euo pipefail
          B='${{ matrix.batch }}'
          PAD="$(printf '%02d' "$B")"
          OUT="/tmp/g7-p19-batch$PAD"
          cp "/tmp/g7-p19-batch$PAD-execution.log" "$OUT/"
          printf '%s\n' \
            'PHASE=G7-P19-P3' \
            "BATCH=$B" \
            'SOLVES=8' \
            'SELECTION_ARTIFACT=11333473475' \
            'SELECTION_MANIFEST_SHA256=671e230314aed38ed68e9c8337c2e64b3f57e2bddca181405d08f5805c78d15e' \
            'PRIOR_CONTACTED_EXCLUDED=418' \
            'MAX_SOLVES_PER_BATCH=8' \
            'MIN_DELAY_MS=2000' \
            'BULK_MIRROR=HOLD' \
            'RAW_PUBLIC_RELEASE=HOLD' \
            'HUMAN_CONTACT_GATE=CLOSED' \
            > "$OUT/AUTHORITY.txt"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P19-fresh48-batch${{ matrix.batch }}-${{ github.sha }}
          path: /tmp/g7-p19-batch*
          retention-days: 90
