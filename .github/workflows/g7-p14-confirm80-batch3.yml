name: G7-P14 confirm80 reco batch 3

on:
  push:
    branches: ['research/current']
    paths:
      - '.github/workflows/g7-p14-confirm80-batch3.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  batch3:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}

      - name: Recover sealed P14 confirm80 selection
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p14-selection
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/artifacts/11301404290/zip" \
            -o /tmp/p14-selection.zip
          echo '71faa1be721940b670c871a79a9af5bac63f84dc751b08b3a8098ff19025a46f  /tmp/p14-selection.zip' | sha256sum -c -
          unzip -q /tmp/p14-selection.zip -d /tmp/p14-selection
          MANIFEST="$(find /tmp/p14-selection -name selection-manifest.json -print -quit)"
          test -n "$MANIFEST"
          node - "$MANIFEST" <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(x.status!=='SEALED_BEFORE_CONFIRM80_BODY_CONTACT') process.exit(1);
          if(x.selection_manifest_sha256!=='39fa29383ab3b61fb8f2969861ee531a04e50762eaae4fcea4f4144ee8078658') process.exit(2);
          if(x.batches['3'].length!==10) process.exit(3);
          if(x.prior_body_contacted_excluded!==183) process.exit(4);
          console.log('G7_P14_BATCH3_SELECTION_AUTHORITY_PASS');
          console.log('IDS\t'+x.batches['3'].join(','));
          NODE

      - name: Dry-run bounded acquisition authority
        run: |
          set -euo pipefail
          MANIFEST="$(find /tmp/p14-selection -name selection-manifest.json -print -quit)"
          node scripts/g7-p14/acquire-confirm80-reco-batch.mjs \
            --manifest "$MANIFEST" --batch 3 --out /tmp/unused

      - name: Acquire frozen confirm80 batch 3
        run: |
          set -euo pipefail
          MANIFEST="$(find /tmp/p14-selection -name selection-manifest.json -print -quit)"
          rm -rf /tmp/g7-p14-batch03
          node scripts/g7-p14/acquire-confirm80-reco-batch.mjs \
            --manifest "$MANIFEST" --batch 3 \
            --out /tmp/g7-p14-batch03 --execute | tee /tmp/g7-p14-batch03-execution.log

      - name: Exact trajectory replay
        run: |
          set -euo pipefail
          node scripts/cube/replay-exact-trajectories.mjs \
            --input /tmp/g7-p14-batch03/derived/solves.jsonl \
            --out /tmp/g7-p14-batch03/exact
          node - <<'NODE'
          const x=require('/tmp/g7-p14-batch03/exact/exact-trajectories.json');
          if(x.solve_count!==10) process.exit(1);
          if(x.exact_end_validation_pass!==10) process.exit(2);
          console.log('G7_P14_BATCH3_EXACT_PASS');
          console.log('PREFIXES\t'+x.total_prefixes);
          NODE

      - name: Seal batch
        run: |
          set -euo pipefail
          cp /tmp/g7-p14-batch03-execution.log /tmp/g7-p14-batch03/
          printf '%s\n' \
            'PHASE=G7-P14' \
            'BATCH=3' \
            'SOLVES=10' \
            'SELECTION_MANIFEST_SHA256=39fa29383ab3b61fb8f2969861ee531a04e50762eaae4fcea4f4144ee8078658' \
            'PRIOR_BODY_CONTACTED_EXCLUDED=183' \
            'BULK_MIRROR=HOLD' \
            'RAW_PUBLIC_RELEASE=HOLD' \
            > /tmp/g7-p14-batch03/AUTHORITY.txt
          (cd /tmp/g7-p14-batch03 && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P14-confirm80-batch3-${{ github.sha }}
          path: /tmp/g7-p14-batch03
          retention-days: 90
