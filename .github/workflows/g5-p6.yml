name: Validate G5-P6 representation ecology

on:
  push:
    branches: ['research/current']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust format seal
        run: cargo fmt --all --check
      - name: Workspace check
        run: cargo check --workspace
      - name: Workspace tests
        run: cargo test --workspace
      - name: Materialize P6 ecology court
        run: |
          mkdir -p g5/p6/ci-output
          cargo run --release --quiet -p search-geometry-core --bin p6 > g5/p6/ci-output/p6.tsv
      - name: Upload P6 court
        uses: actions/upload-artifact@v4
        with:
          name: g5-p6-representation-ecology
          path: g5/p6/ci-output/p6.tsv
