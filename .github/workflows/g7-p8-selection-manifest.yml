name: G7-P8 outcome-blind body-light selection manifest

concurrency:
  group: g7-p8-selection-manifest-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p8/**'
      - 'g7/p7/source-provenance-recovery.json'
      - 'scripts/g7-p8/**'
      - '.github/workflows/g7-p8-selection-manifest.yml'
  pull_request:
    paths:
      - 'g7/p8/**'
      - 'g7/p7/source-provenance-recovery.json'
      - 'scripts/g7-p8/**'
      - '.github/workflows/g7-p8-selection-manifest.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  seal-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover frozen P3 index authority
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/g7-p8/p3
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/artifacts/11205587281/zip" \
            -o /tmp/g7-p8/p3.zip
          echo 'acb3dff14bbdb33fe4be3550e64eeba55dcb1879b85d6b8c1eacca7d9408c4e4  /tmp/g7-p8/p3.zip' | sha256sum -c -
          unzip -q /tmp/g7-p8/p3.zip -d /tmp/g7-p8/p3
          INDEX="$(find /tmp/g7-p8/p3 -name linkage-support.jsonl -print -quit)"
          test -n "$INDEX"
          python3 - "$INDEX" <<'PY'
          import json,sys
          xs=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip()]
          assert len(xs)==12941
          assert sum(1 for x in xs if x.get('puzzle')=='3x3')==10591
          print('G7_P8_P3_INDEX_AUTHORITY_PASS')
          PY

      - name: Recover frozen P7 refined provenance authority
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/g7-p8/p7
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/artifacts/11236528187/zip" \
            -o /tmp/g7-p8/p7.zip
          echo '33d6f25b4426cb938dee7dd970a2adc5940ed521db1ece836a8bd65d9aa9fe7b  /tmp/g7-p8/p7.zip' | sha256sum -c -
          unzip -q /tmp/g7-p8/p7.zip -d /tmp/g7-p8/p7
          test -n "$(find /tmp/g7-p8/p7 -name full-index-provenance-rows.jsonl -print -quit)"
          test -n "$(find /tmp/g7-p8/p7 -name competition-label-reconciliation-audit-v2.json -print -quit)"
          echo 'G7_P8_P7_REFINED_AUTHORITY_PASS'

      - name: Seal 200-ID outcome-blind selection manifest
        run: |
          set -euo pipefail
          INDEX="$(find /tmp/g7-p8/p3 -name linkage-support.jsonl -print -quit)"
          BASE="$(find /tmp/g7-p8/p7 -name full-index-provenance-rows.jsonl -print -quit)"
          V2="$(find /tmp/g7-p8/p7 -name competition-label-reconciliation-audit-v2.json -print -quit)"
          mkdir -p /tmp/g7-p8/out
          python3 scripts/g7-p8/select-body-light-support-surface.py \
            --index "$INDEX" \
            --base-rows "$BASE" \
            --v2 "$V2" \
            --frozen60 g7/p7/source-provenance-recovery.json \
            --out /tmp/g7-p8/out
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/g7-p8/out/selection-manifest.json'))
          assert x['status']=='SEALED_BEFORE_SOURCE_CONTACT'
          assert x['target_total']==200
          assert len(x['rows'])==200
          assert len({r['source_id'] for r in x['rows']})==200
          assert sum(x['stratum_counts'].values())==200
          print('G7_P8_SELECTION_RESULT_GATE_PASS')
          print(x['stratum_counts'])
          print(x['year_band_counts'])
          print(x['selection_manifest_sha256'])
          PY

      - name: Seal selection-only artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/g7-p8/seal/authority /tmp/g7-p8/seal/derived
          cp g7/p8/constitution.json /tmp/g7-p8/seal/authority/
          cp /tmp/g7-p8/out/selection-manifest.json /tmp/g7-p8/seal/derived/
          cp /tmp/g7-p8/out/selected-source-ids.txt /tmp/g7-p8/seal/derived/
          printf '%s\n' \
            'PHASE=G7-P8' \
            'OPERATION=OUTCOME_BLIND_BODY_LIGHT_SELECTION_MANIFEST' \
            'SOURCE_CONTACT=NONE' \
            'SELECTED_IDS=200' \
            'BODY_REQUESTS_PERFORMED=0' \
            > /tmp/g7-p8/seal/AUTHORITY.txt
          rm -rf /tmp/g7-p8/p3 /tmp/g7-p8/p3.zip /tmp/g7-p8/p7 /tmp/g7-p8/p7.zip
          (cd /tmp/g7-p8/seal && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P8-selection-manifest-${{ github.sha }}
          path: /tmp/g7-p8/seal
          if-no-files-found: error
          retention-days: 90
