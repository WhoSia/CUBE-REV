name: CUBE-REV observation generalization — read-only smoke

on:
  push:
    branches:
      - research/current
    paths:
      - 'scripts/cuberev-observation/**'
      - 'docs/observation-generalization/**'
      - '.github/workflows/cuberev-observation-generalization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-observation-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical test dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==1.26.4' 'scipy==1.14.1' 'python-sat==1.9.dev15'
      - name: Verify physical geometry, inverses, and observational baselines
        run: |
          python -m unittest discover -s scripts/cuberev-observation -p 'test_*.py' -v
      - name: Independently rederive B5 13 physical witness orbits and replay 220 supports
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic scripts/cuberev-observation/b5_independent_48sticker_seed_search.cpp -o /tmp/cuberev-b5-fresh
          /tmp/cuberev-b5-fresh > /tmp/cuberev-b5-independent-seeds.txt 2> /tmp/cuberev-b5-independent-search.log
          grep -F 'B5_BALL_PASS 621649' /tmp/cuberev-b5-independent-search.log
          test "$(grep -c '^ORBIT .* FOUND left=' /tmp/cuberev-b5-independent-seeds.txt)" -eq 13
          python scripts/cuberev-observation/verify_b5_three_edge_physical_manifest.py data/0.28/B5_13_ORBIT_INDEPENDENT_WORD_PAIR_WITNESSES_20261104.json > /tmp/cuberev-b5-independent-physical-replay.json
          python scripts/cuberev-observation/verify_b5_independent_cpp_receipt.py /tmp/cuberev-b5-independent-seeds.txt data/0.28/B5_13_ORBIT_INDEPENDENT_WORD_PAIR_WITNESSES_20261104.json > /tmp/cuberev-b5-cross-language-bridge.json
          python -c 'import json; d=json.load(open("/tmp/cuberev-b5-cross-language-bridge.json")); assert d["pinned_receipt_identical"] and d["complete_physical_certificate"] and d["original_edge_triples_replayed"]==220; print("B5_FRESH_CPP_TO_PYTHON_220_PHYSICAL_PASS")'
          python -c 'import json; d=json.load(open("/tmp/cuberev-b5-independent-physical-replay.json")); x=d["audit"]; assert x["full_220_certificate"] and x["distinct_triple_edge_supports_physically_replayed"]==220 and x["physical_orbits_covered"]==13; print("B5_220_INDEPENDENT_PHYSICAL_PASS")'
      - name: Certify exact 21 fixed-frame color lower bound by exhaustive edge collisions
        run: |
          python scripts/cuberev-observation/audit_20_frame_edge_collisions.py | tee /tmp/cuberev-color-r3-fixed-lower.log
          grep -q '^20_FRAME_FIXED_EDGE_COLLISION_ALL_OMISSIONS_PASS 10626/10626' /tmp/cuberev-color-r3-fixed-lower.log
          grep -q '^EXACT_NONADAPTIVE_21_LOWER_PASS' /tmp/cuberev-color-r3-fixed-lower.log
      - name: R7 Hall adaptive 18-frame lower-bound certificate
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic scripts/cuberev-observation/audit_r7_edge_hall_adaptive.cpp -o /tmp/cuberev-r7-hall
          /tmp/cuberev-r7-hall | tee /tmp/r7-hall.log
          grep -q '^R7_ADAPTIVE_EDGE_HALL_LOWER_18_PASS 456979723200 490497638400' /tmp/r7-hall.log
      - name: R8 exact edge-local certificate census under full corner oracle
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic scripts/cuberev-observation/audit_r8_edge_state_certificates.cpp -o /tmp/cuberev-r8-local-cert
          /tmp/cuberev-r8-local-cert | tee /tmp/cuberev-r8-cert.log
          grep -q '^R8_EDGE_CERT_MASK omitted=8 total=735471 singleton=0 ambiguous=735471' /tmp/cuberev-r8-cert.log
          grep -q '^R8_EDGE_CORNER_ORACLE_LOCAL_CERTIFICATE_17_PASS tested_16_read_masks=735471 singleton_17_read_masks=14664' /tmp/cuberev-r8-cert.log
      - name: R8 exactly classify four-unknown-edge adaptive policy subproblems
        run: |
          python scripts/cuberev-observation/audit_r8_four_edge_adaptive_subproblems.py | tee /tmp/r8-four-edge.log
          grep -q '^R8_FOUR_EDGE_ADAPTIVE_MINIMAX_PASS subsets=495 parity_cases=1980 depth3=72 depth4=369 depth5=54' /tmp/r8-four-edge.log
          grep -q '^R8_STAGED_ORACLE_EDGE_POLICY_PASS prefix=16 residual_max=5 total_worst=21 mean_budget_numerator=1962 denominator=495' /tmp/r8-four-edge.log
      - name: R9 full residual fixed-versus-feedback separation and 190080 policy replays
        run: |
          python scripts/cuberev-observation/audit_r9_feedback_fixed_separation.py | tee /tmp/cuberev-r9-feedback.log
          grep -q '^R9_EXACT_FEEDBACK_SEPARATION_PASS remaining_subsets=495 parity_cases=1980 adaptive_better=216 equal=279 adaptive_depth_sum=1962 fixed_depth_sum=2178' /tmp/cuberev-r9-feedback.log
          grep -q '^R9_ALL_PARITY_EXPLICIT_POLICY_REPLAY_PASS physical_conditional_states 190080' /tmp/cuberev-r9-feedback.log
      - name: Costed two-frame B2 color belief audit (finite scope)
        run: |
          python scripts/cuberev-observation/audit_color_p48_r4_b2_costed_beliefs.py | tee /tmp/cuberev-color-r4-b2-belief.log
          grep -q '^R4_COLOR_B2_TWO_FRAME_UNIFORM_POSTERIOR_PASS adaptive 1976 fixed 2242 denominator 262' /tmp/cuberev-color-r4-b2-belief.log
          grep -q '^R4_COLOR_B2_WORST_AMBIGUITY_PASS adaptive 18 fixed 18' /tmp/cuberev-color-r4-b2-belief.log
      - name: Exact bounded R5 B2 two-frame physical Pareto and branch DP
        run: |
          python scripts/cuberev-observation/audit_color_p48_r5_exact_b2_pareto.py | tee /tmp/cuberev-color-r5-exact-pareto.log
          grep -q '^R5_B2_EXACT_PARETO_PASS' /tmp/cuberev-color-r5-exact-pareto.log
          grep -q '^R5_B2_ADAPTIVE_PARETO_POINTS' /tmp/cuberev-color-r5-exact-pareto.log
          grep -q '^R5_B2_EXTREME_PASS' /tmp/cuberev-color-r5-exact-pareto.log
      - name: Audit all 156 B6 optimal single-tag exchanges
        run: python scripts/cuberev-observation/audit_b6_full_sensor_swap_graph.py
      - name: Verify 24-by-3 physical incidence bridge theorem
        run: python scripts/cuberev-observation/verify_b6_cross_core_bridge.py
      - name: Independent JavaScript geometry and swap graph
        run: node scripts/cuberev-observation/independent_js_b6_exchange_graph.mjs
      - name: Export physical transition receipt (artifact, not repository write)
        run: |
          mkdir -p /tmp/cuberev-observation
          python scripts/cuberev-observation/physical_edges.py > /tmp/cuberev-observation/edge_transitions.json
          python scripts/cuberev-observation/robust_observation.py --moves /tmp/cuberev-observation/edge_transitions.json --length 2 --errors 0 > /tmp/cuberev-observation/smoke.json
          cat /tmp/cuberev-observation/smoke.json
          python scripts/cuberev-observation/l7_targeted_witnesses.py --length 7 --max-nodes 5000 > /tmp/cuberev-observation/l7_bounded.json
          cat /tmp/cuberev-observation/l7_bounded.json
          python scripts/cuberev-observation/dictionary_coverage.py > /tmp/cuberev-observation/dictionary_coverage.json
          cat /tmp/cuberev-observation/dictionary_coverage.json
          python scripts/cuberev-observation/physical_set_cover.py > /tmp/cuberev-observation/restricted_set_cover.json
          cat /tmp/cuberev-observation/restricted_set_cover.json
          python scripts/cuberev-observation/physical_set_cover.py --solver sat --max-k 4 > /tmp/cuberev-observation/seed4_sat_optimum.json
          python -c 'import json; d=json.load(open("/tmp/cuberev-observation/seed4_sat_optimum.json")); assert d["exact"]["status"]=="SAT" and d["exact"]["k"]==4, d; print("SEED4_RESTRICTED_SAT_K4_PASS")'
          python scripts/cuberev-observation/verify_l7_27_cover.py > /tmp/cuberev-observation/L7_27_cover_verified.json
          cat /tmp/cuberev-observation/L7_27_cover_verified.json
          python scripts/cuberev-observation/verify_l7_25_cover.py > /tmp/cuberev-observation/L7_25_cover_verified.json
          cat /tmp/cuberev-observation/L7_25_cover_verified.json
          python scripts/cuberev-observation/verify_l7_15_cover.py > /tmp/cuberev-observation/L7_15_cover_verified.json
          cat /tmp/cuberev-observation/L7_15_cover_verified.json
          python scripts/cuberev-observation/verify_l7_11_cover.py > /tmp/cuberev-observation/L7_11_cover_verified.json
          cat /tmp/cuberev-observation/L7_11_cover_verified.json
          python scripts/cuberev-observation/verify_sensor_orbits.py > /tmp/cuberev-observation/sensor_orbit_columns.json
          cat /tmp/cuberev-observation/sensor_orbit_columns.json
          python scripts/cuberev-observation/sensor_symmetry.py > /tmp/cuberev-observation/sensor_symmetry.json
          python -c 'import json; r=json.load(open("/tmp/cuberev-observation/sensor_symmetry.json")); assert r["tested_proper_cube_rotations"]==24 and len(r["certified_sensor_automorphisms"])==4; print("SENSOR_SYMMETRY_ENUMERATION_PASS",len(r["certified_sensor_automorphisms"]))'
          python scripts/cuberev-observation/check_25_irredundancy.py > /tmp/cuberev-observation/L7_25_irredundancy.json
          cat /tmp/cuberev-observation/L7_25_irredundancy.json
          python scripts/cuberev-observation/verify_temporal_channel_counterexample.py > /tmp/cuberev-observation/temporal_counterexample.json
          cat /tmp/cuberev-observation/temporal_counterexample.json
          python scripts/cuberev-observation/channel_model_transfer.py > /tmp/cuberev-observation/channel_transfer_11.json
          cat /tmp/cuberev-observation/channel_transfer_11.json
          python scripts/cuberev-observation/verify_l7_erasure5_cover.py > /tmp/cuberev-observation/L7_erasure5_verified.json
          python scripts/cuberev-observation/erasure_prefix_oracle_cost.py > /tmp/cuberev-observation/L7_erasure5_prefix.json
          python scripts/cuberev-observation/global_dual_obligations.py > /tmp/cuberev-observation/global_dual_orbits.json
          python scripts/cuberev-observation/erasure_observation_policy.py > /tmp/cuberev-observation/erasure_stop_policy.json
          python scripts/cuberev-observation/adaptive_erasure_minimax.py --sources 0,1 --horizon 2 > /tmp/cuberev-observation/adaptive_small_policy.json
          python scripts/cuberev-observation/fullcube_sensor_goal_theorem.py > /tmp/cuberev-observation/fullcube_sensor_goal_theorem.json
          node scripts/cuberev-observation/independent_node_corner_kernel.mjs > /tmp/cuberev-observation/fullcube_node_corner_kernel.json
          python scripts/cuberev-observation/fullcube_edge_kernel_radius4.py > /tmp/cuberev-observation/fullcube_edge_kernel_radius4.json
          python scripts/cuberev-observation/fullcube_mixed_sensor_minimum14.py --all-witnesses > /tmp/cuberev-observation/fullcube_mixed_sensor_minimum14.json
          python scripts/cuberev-observation/replay_027_p22_shallow_bridge.py > /tmp/cuberev-observation/replay_027_p22_shallow_bridge.json
          python -c 'import json; p="/tmp/cuberev-observation/fullcube_mixed_sensor_minimum14.json"; d=json.load(open(p)); assert d["exact_minimum_total_tags"]==14 and d["number_of_minimum_fourteen_tag_designs"]==2856; print("PHYSICAL_RADIUS4_MIN14_PASS")'
          python scripts/cuberev-observation/fullcube_sensor_radius_hierarchy.py --all-witnesses > /tmp/cuberev-observation/fullcube_sensor_radius_hierarchy.json
          python -c 'import json; r=json.load(open("/tmp/cuberev-observation/fullcube_sensor_radius_hierarchy.json")); assert [x["minimum_tagged_edge_orientation_sensors"] for x in r["results"]]==[3,8,9] and [x["successful_minimal_design_count"] for x in r["results"]]==[8,42,8]; print("SENSOR_RADIUS_HIERARCHY_PASS")'
          python scripts/cuberev-observation/fullcube_goal_pattern_databases.py > /tmp/cuberev-observation/fullcube_pattern_databases.json
          python scripts/cuberev-observation/fullcube_multisensor_goal_cases.py > /tmp/cuberev-observation/fullcube_multisensor_goals.json
          python scripts/cuberev-observation/fullcube_andor_baseline_comparison.py > /tmp/cuberev-observation/fullcube_andor_baselines.json
          python -c 'import json; p="/tmp/cuberev-observation/fullcube_sensor_goal_theorem.json"; d=json.load(open(p)); assert d["minimum_sensors_for_all_eighteen_single_turn_states"]==3 and len(d["all_eight_minimal_face_cover_sensor_sets"])==8; print("FULLCUBE_3_SENSOR_MINIMUM_PASS")'
          python scripts/cuberev-observation/fullcube_policy_family_benchmark.py > /tmp/cuberev-observation/fullcube_policy_family.json
          python scripts/cuberev-observation/k4_v4_burnside_feasibility.py > /tmp/cuberev-observation/k4_v4_burnside.json
          cat /tmp/cuberev-observation/k4_v4_burnside.json
          python scripts/cuberev-observation/fullcube_adaptive_goal_policy.py > /tmp/cuberev-observation/fullcube_adaptive_goal_policy.json
          cat /tmp/cuberev-observation/fullcube_adaptive_goal_policy.json
          python scripts/cuberev-observation/fullcube_goal_info_conflict.py > /tmp/cuberev-observation/fullcube_goal_info_conflict.json
          cat /tmp/cuberev-observation/fullcube_goal_info_conflict.json
          python scripts/cuberev-observation/verify_l7_erasure7_cover.py > /tmp/cuberev-observation/L7_erasure7_verified.json
          cat /tmp/cuberev-observation/L7_erasure7_verified.json
          sha256sum /tmp/cuberev-observation/*.json > /tmp/cuberev-observation/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cuberev-observation-smoke
          path: /tmp/cuberev-observation/
          retention-days: 30
