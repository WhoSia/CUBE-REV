name: CUBE-REV 0.25 P0-R3B physical shortest-word face-envelope continuous-price certificate
on:
  workflow_dispatch:
  push:
    branches: [research/current]
    paths:
      - "scripts/cuberev-025/p0_r3b_source_projected_face_envelope_go/main.go"
      - ".github/workflows/cuberev-025-P0-R3B-continuous-face-price-envelope.yml"
permissions:
  contents: read
jobs:
  real-physical-shortest-source-face-envelopes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Forbid automated contributors
        shell: bash
        run: |
          if git log --format='%an <%ae> %cn <%ce>' | grep -Ei 'github-actions?\[bot\]|github-action\[bot\]'; then
            echo "::error::Github Actions bot research author/committer forbidden"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.2"
      - name: True WCA five original 54-sticker quotient full shortest-face word DAGs
        shell: bash
        run: |
          set -o pipefail
          timeout 530 go run scripts/cuberev-025/p0_r3b_source_projected_face_envelope_go/main.go | tee /tmp/p0r3b-envelopes.log
          test "$(grep -c '^P0R3B_REAL_SHORTEST_PROJECTED_WORDS_COMPLETE' /tmp/p0r3b-envelopes.log)" -eq 5
          test "$(grep -c '^P0R3B_PHYSICAL_FACE_ENVELOPE_PAIR' /tmp/p0r3b-envelopes.log)" -eq 10
          grep -Fq 'P0R3B_SOURCE_COMPLETE_SHORTEST_SIGNATURE_PAIRS ten_pairs=10' /tmp/p0r3b-envelopes.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuberev025-p0r3b-original-physical-projected-word-envelopes
          path: /tmp/p0r3b-envelopes.log
          retention-days: 30
          if-no-files-found: warn
      - name: Strict read-only code version and no CI generated Git commits
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
