name: G7-P10-R1 Support-Choice Factorization Audit

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p10/support-choice-factorization-preseal.json'
      - 'scripts/g7-p10/audit-support-choice-factorization.py'
      - '.github/workflows/g7-p10-r1-support-choice.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate preseal
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('g7/p10/support-choice-factorization-preseal.json'))
          assert x['status']=='FROZEN_AFTER_P10_BEFORE_R1_OUTCOME'
          assert x['new_body_requests']==0
          print('G7_P10_R1_PRESEAL_PASS')
          PY
      - name: Recover frozen geometry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/p10r1/p7
          curl --fail --location --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/actions/artifacts/11238382539/zip"             -o /tmp/p10r1/p7.zip
          echo 'b6e30ab56548e27905dd3b3718c5a3e56d772bff10a744e92180d189a3259a11  /tmp/p10r1/p7.zip' | sha256sum -c -
          unzip -q /tmp/p10r1/p7.zip -d /tmp/p10r1/p7
      - name: Execute factorization
        run: |
          FEAT="$(find /tmp/p10r1/p7 -name five-rival-features.tsv -print -quit)"
          CTX="$(find /tmp/p10r1/p7 -name prefix-context.jsonl -print -quit)"
          mkdir -p /tmp/p10r1/out
          python3 scripts/g7-p10/audit-support-choice-factorization.py             --features "$FEAT" --context "$CTX" --out /tmp/p10r1/out --permutations 100000 | tee /tmp/p10r1/run.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/p10r1/out/support-choice-factorization.json'))
          assert x['states']==2725 and x['solves']==60
          assert x['max_factorization_abs_residual']<1e-12
          print('G7_P10_R1_RESULT_GATE_PASS',x['verdict'])
          print('G1',x['targeted_reanalysis']['g1'])
          print('LB7',x['targeted_reanalysis']['lb7'])
          print('Q3',x['targeted_reanalysis']['q3'])
          PY
      - name: Seal
        run: |
          mkdir -p /tmp/p10r1/seal/authority /tmp/p10r1/seal/derived
          cp g7/p10/support-choice-factorization-preseal.json /tmp/p10r1/seal/authority/
          cp /tmp/p10r1/out/support-choice-factorization.json /tmp/p10r1/seal/derived/
          cp /tmp/p10r1/run.log /tmp/p10r1/seal/derived/execution.log
          printf '%s\n' 'PHASE=G7-P10-R1' 'OPERATION=SUPPORT_EMERGENCE_CONDITIONAL_CHOICE_FACTORIZATION_AUDIT' 'NEW_SOURCE_CONTACT=NONE' > /tmp/p10r1/seal/AUTHORITY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: G7-P10-R1-support-choice-${{ github.sha }}
          path: /tmp/p10r1/seal
          retention-days: 90
