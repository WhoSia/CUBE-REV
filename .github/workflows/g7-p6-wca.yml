name: Materialize G7-P6 latest WCA census

on:
  workflow_dispatch:
  push:
    branches: ['research/current']
    paths:
      - '.github/workflows/g7-p6-wca.yml'

permissions:
  contents: read

jobs:
  g7-p6-wca-current:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install census dependency
        run: pip install --no-cache-dir duckdb==1.4.1

      - name: Resolve current WCA export
        run: |
          set -euo pipefail
          mkdir -p /tmp/g7-p6-wca
          curl --fail --location --silent --show-error             https://www.worldcubeassociation.org/api/v0/export/public             -o /tmp/g7-p6-wca/api.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/g7-p6-wca/api.json'))
          assert x.get('tsv_url'), x
          print('G7_P6_WCA_API_PASS')
          print('EXPORT_DATE',x.get('export_date'))
          print('EXPORT_VERSION',x.get('export_version'))
          PY

      - name: Download and verify TSV archive
        run: |
          set -euo pipefail
          URL="$(python3 -c "import json;print(json.load(open('/tmp/g7-p6-wca/api.json'))['tsv_url'])")"
          curl --fail --location --retry 3 --retry-delay 3             "$URL" -o /tmp/g7-p6-wca/wca.tsv.zip
          sha256sum /tmp/g7-p6-wca/wca.tsv.zip | tee /tmp/g7-p6-wca/source-sha256.txt
          unzip -q /tmp/g7-p6-wca/wca.tsv.zip -d /tmp/g7-p6-wca/extracted
          test -n "$(find /tmp/g7-p6-wca/extracted -type f -name '*result_attempts*.tsv' -print -quit)"
          test -n "$(find /tmp/g7-p6-wca/extracted -type f -name '*scrambles*.tsv' -print -quit)"
          echo 'G7_P6_WCA_DOWNLOAD_PASS'

      - name: Census 3x3 attempts and scrambles
        run: |
          set -euo pipefail
          SHA="$(cut -d' ' -f1 /tmp/g7-p6-wca/source-sha256.txt)"
          python3 scripts/g7-p6/census-wca-latest.py             --extract-dir /tmp/g7-p6-wca/extracted             --out-dir /tmp/g7-p6-wca/out             --source-sha256 "$SHA"             --api-json /tmp/g7-p6-wca/api.json | tee /tmp/g7-p6-wca/census.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/g7-p6-wca/out/wca-latest-census.json'))
          assert x['verdict']=='PASS_SOURCE_SEMANTICS',x
          assert x['wca_333']['attempt_rows']>9_000_000,x['wca_333']
          assert x['wca_333']['persons']>100_000,x['wca_333']
          print('G7_P6_WCA_CENSUS_GATE_PASS')
          PY

      - name: Remove raw archive and source tables
        run: |
          set -euo pipefail
          rm -rf /tmp/g7-p6-wca/extracted /tmp/g7-p6-wca/wca.tsv.zip
          test ! -e /tmp/g7-p6-wca/wca.tsv.zip
          printf '%s\n'             'RAW_WCA_ARCHIVE_PACKAGED=NO'             'SOURCE_AUTHORITY=WCA_OFFICIAL_EXPORT'             'ROLE=ATTEMPT_AND_SCRAMBLE_CENSUS'             > /tmp/g7-p6-wca/out/AUTHORITY.txt
          cp /tmp/g7-p6-wca/api.json /tmp/g7-p6-wca/out/api.json
          cp /tmp/g7-p6-wca/source-sha256.txt /tmp/g7-p6-wca/out/source-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P6-WCA-latest-census-${{ github.sha }}
          path: /tmp/g7-p6-wca/out
          if-no-files-found: error
          retention-days: 90
