name: G7-P13 fresh80 reco batch 1

on:
  push:
    branches: ['research/current']
    paths:
      - '.github/workflows/g7-p13-fresh80-batch1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  batch1:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}

      - name: Recover sealed P13 fresh80 selection
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p13-selection
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/artifacts/11301332731/zip" \
            -o /tmp/p13-selection.zip
          echo '550bdfb59023aeb6e1804afb4c1ca358c397892a5785e08d07fcabe0915442e2  /tmp/p13-selection.zip' | sha256sum -c -
          unzip -q /tmp/p13-selection.zip -d /tmp/p13-selection
          MANIFEST="$(find /tmp/p13-selection -name selection-manifest-repaired.json -print -quit)"
          test -n "$MANIFEST"
          node - "$MANIFEST" <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(x.status!=='SEALED_AFTER_PRE_GEOMETRY_REPLAY_INVALID_REPLACEMENT') process.exit(1);
          if(x.selection_manifest_sha256!=='bde808a0735242d6525ed4622846b4f16c166e76f2267e56cd5207377c880639') process.exit(2);
          if(x.batches['1'].length!==10) process.exit(3);
          if(x.prior_body_excluded!==100) process.exit(4);
          console.log('G7_P13_BATCH1_SELECTION_AUTHORITY_PASS');
          console.log('IDS\t'+x.batches['1'].join(','));
          NODE

      - name: Dry-run bounded acquisition authority
        run: |
          set -euo pipefail
          MANIFEST="$(find /tmp/p13-selection -name selection-manifest-repaired.json -print -quit)"
          node scripts/g7-p13/acquire-fresh80-reco-batch.mjs \
            --manifest "$MANIFEST" \
            --batch 1 \
            --out /tmp/unused

      - name: Acquire frozen fresh80 batch 1
        run: |
          set -euo pipefail
          MANIFEST="$(find /tmp/p13-selection -name selection-manifest-repaired.json -print -quit)"
          rm -rf /tmp/g7-p13-batch01
          node scripts/g7-p13/acquire-fresh80-reco-batch.mjs \
            --manifest "$MANIFEST" \
            --batch 1 \
            --out /tmp/g7-p13-batch01 \
            --execute | tee /tmp/g7-p13-batch01-execution.log

      - name: Exact trajectory replay
        run: |
          set -euo pipefail
          node scripts/cube/replay-exact-trajectories.mjs \
            --input /tmp/g7-p13-batch01/derived/solves.jsonl \
            --out /tmp/g7-p13-batch01/exact
          node - <<'NODE'
          const x=require('/tmp/g7-p13-batch01/exact/exact-trajectories.json');
          if(x.solve_count!==10) process.exit(1);
          if(x.exact_end_validation_pass!==10) process.exit(2);
          console.log('G7_P13_BATCH1_EXACT_PASS');
          console.log('PREFIXES\t'+x.total_prefixes);
          NODE

      - name: Seal batch
        run: |
          set -euo pipefail
          cp /tmp/g7-p13-batch01-execution.log /tmp/g7-p13-batch01/
          printf '%s\n' \
            'PHASE=G7-P13' \
            'BATCH=1' \
            'SOLVES=10' \
            'SELECTION_MANIFEST_SHA256=bde808a0735242d6525ed4622846b4f16c166e76f2267e56cd5207377c880639' \
            'PRIOR100_EXCLUDED=YES' \
            'BULK_MIRROR=HOLD' \
            'RAW_PUBLIC_RELEASE=HOLD' \
            > /tmp/g7-p13-batch01/AUTHORITY.txt
          (cd /tmp/g7-p13-batch01 && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P13-fresh80-batch1-${{ github.sha }}
          path: /tmp/g7-p13-batch01
          retention-days: 90
