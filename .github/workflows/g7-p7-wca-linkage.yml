name: G7-P7 reco.nz ↔ WCA exact-attempt linkage audit

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p7/preseal.json'
      - 'g7/p7/active-set-manifest.json'
      - 'scripts/g7-p7/link-wca-attempts.py'
      - 'scripts/g7-p7/merge-reco-corpus.mjs'
      - '.github/workflows/g7-p7-wca-linkage.yml'
  pull_request:
    paths:
      - 'g7/p7/preseal.json'
      - 'g7/p7/active-set-manifest.json'
      - 'scripts/g7-p7/link-wca-attempts.py'
      - 'scripts/g7-p7/merge-reco-corpus.mjs'
      - '.github/workflows/g7-p7-wca-linkage.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  linkage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --no-cache-dir duckdb==1.4.1

      - name: Frozen linkage authority and self-test
        run: |
          set -euo pipefail
          python3 scripts/g7-p7/link-wca-attempts.py --self-test
          node - <<'NODE'
          const p=require('./g7/p7/preseal.json').linkage_audit;
          if(p.status!=='SEMANTIC_REPAIR_FROZEN_AFTER_V1_BEFORE_V2_EXECUTION') process.exit(1);
          if(p.wca_authority.artifact_id!==11210089432) process.exit(2);
          if(p.version!==2||!p.v1_observed_receipt.disclosed_before_v2) process.exit(3);
          console.log('G7_P7_WCA_LINKAGE_V2_AUTHORITY_PASS');
          NODE

      - name: Recover immutable 60-solve reco corpus
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/g7-p7-link/input
          fetch_artifact () {
            id="$1"; name="$2"; expected="$3"
            curl --fail --location --silent --show-error               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPO/actions/artifacts/$id/zip"               -o "/tmp/g7-p7-link/input/$name.zip"
            got="$(sha256sum "/tmp/g7-p7-link/input/$name.zip" | awk '{print $1}')"
            test "$got" = "$expected"
            mkdir -p "/tmp/g7-p7-link/input/$name"
            unzip -q "/tmp/g7-p7-link/input/$name.zip" -d "/tmp/g7-p7-link/input/$name"
          }
          fetch_artifact 11205789954 p4-pilot d031b3f135de864d4f554bbb5453bd7773a04794ba4c1d048e0c0797f7fcf24f
          fetch_artifact 11206421721 p4-confirmatory aa1e997da19ce0aa9bad039c69821d73de2f41eb7cb9def899e075ff55b55b75
          fetch_artifact 11211556529 p7-batch1 9781d3e436b383ae5cb8cb8410a85ea5114a94ad4a7d5f9a8f34a743df3347c4
          fetch_artifact 11215205073 p7-batch2 943a763bb58b23cf67618e393b8590887d28a619cc1e3f36837ec94825df1a66
          fetch_artifact 11215270269 p7-batch3 7fc32a24b95c5bd15dd65bddea985e5da1f59006d8934fad80031a69be8ffba8
          fetch_artifact 11215332190 p7-batch4 5113f6c9a7903463a24fce2ced503eda5e5d535148a28d5ec7ceb669a6a63f68
          mkdir -p /tmp/g7-p7-link/corpus
          node scripts/g7-p7/merge-reco-corpus.mjs             --source P4_PILOT=/tmp/g7-p7-link/input/p4-pilot             --source P4_CONFIRMATORY=/tmp/g7-p7-link/input/p4-confirmatory             --source P7_BATCH1=/tmp/g7-p7-link/input/p7-batch1             --source P7_BATCH2=/tmp/g7-p7-link/input/p7-batch2             --source P7_BATCH3=/tmp/g7-p7-link/input/p7-batch3             --source P7_BATCH4=/tmp/g7-p7-link/input/p7-batch4             --out /tmp/g7-p7-link/corpus

      - name: Recover frozen WCA export authority
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/g7-p7-link/wca-authority
          curl --fail --location --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/actions/artifacts/11210089432/zip"             -o /tmp/g7-p7-link/wca-authority.zip
          echo 'df733a69f95fe2a6af0d300cd63de591bb072c49fddfb6cdb981a0b74deab94a  /tmp/g7-p7-link/wca-authority.zip' | sha256sum -c -
          unzip -q /tmp/g7-p7-link/wca-authority.zip -d /tmp/g7-p7-link/wca-authority
          API="$(find /tmp/g7-p7-link/wca-authority -name api.json -print -quit)"
          SHA_FILE="$(find /tmp/g7-p7-link/wca-authority -name source-sha256.txt -print -quit)"
          test -n "$API"; test -n "$SHA_FILE"
          URL="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['tsv_url'])" "$API")"
          curl --fail --location --retry 3 --retry-delay 3 "$URL" -o /tmp/g7-p7-link/wca.tsv.zip
          got="$(sha256sum /tmp/g7-p7-link/wca.tsv.zip | awk '{print $1}')"
          test "$got" = 'ac9afd834b6d7e31cb3cdd99f47eb21569fafb5d26d8628528aae2db8867d6a7'
          mkdir -p /tmp/g7-p7-link/wca
          unzip -q /tmp/g7-p7-link/wca.tsv.zip -d /tmp/g7-p7-link/wca
          echo 'G7_P7_FROZEN_WCA_BYTES_PASS'

      - name: Execute 60-solve exact-attempt linkage audit
        run: |
          set -euo pipefail
          python3 scripts/g7-p7/link-wca-attempts.py             --reco /tmp/g7-p7-link/corpus/combined-solves.jsonl             --wca-dir /tmp/g7-p7-link/wca             --out /tmp/g7-p7-link/out             --wca-source-sha256 ac9afd834b6d7e31cb3cdd99f47eb21569fafb5d26d8628528aae2db8867d6a7 | tee /tmp/g7-p7-link/linkage.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/g7-p7-link/out/reco-wca-linkage.json'))
          assert x['reco_solves']==60
          assert sum(x['class_counts'].values())==60
          print('G7_P7_WCA_LINKAGE_RESULT_GATE_PASS')
          print(x['class_counts'])
          PY

      - name: Remove WCA raw and seal derived linkage only
        run: |
          set -euo pipefail
          rm -rf /tmp/g7-p7-link/wca /tmp/g7-p7-link/wca.tsv.zip /tmp/g7-p7-link/input /tmp/g7-p7-link/corpus
          mkdir -p /tmp/g7-p7-link/out/authority
          cp g7/p7/preseal.json /tmp/g7-p7-link/out/authority/
          cp /tmp/g7-p7-link/wca-authority/source-sha256.txt /tmp/g7-p7-link/out/authority/ || true
          printf '%s\n'             'RECO_SOURCE_CONTACT=NONE'             'RECO_SOLVES=60'             'WCA_RAW_PACKAGED=NO'             'OPERATION=LINKAGE_AUDIT'             > /tmp/g7-p7-link/out/AUTHORITY.txt
          (cd /tmp/g7-p7-link/out && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P7-reco-WCA-linkage-${{ github.sha }}
          path: /tmp/g7-p7-link/out
          if-no-files-found: error
          retention-days: 90
