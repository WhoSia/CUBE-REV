name: G7-P13 fresh80 method-progress terminal analysis

on:
  push:
    branches: ['research/current']
    paths:
      - '.github/workflows/g7-p13-fresh80-analysis.yml'
      - 'scripts/g7-p13/analyze-fresh80-method-progress.py'
      - 'scripts/g7-p13/merge-fresh80-corpus.mjs'
      - 'g7/p13/constitution.json'
      - 'g7/p13/replay-invalid-replacement-amendment.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Validate P13 frozen analysis authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          c=json.load(open('g7/p13/constitution.json'))
          a=json.load(open('g7/p13/replay-invalid-replacement-amendment.json'))
          assert c['fixed_analysis']['candidate_reselection']=='FORBIDDEN'
          assert c['fixed_analysis']['progress_partitions']==[4,5,6,10]
          assert c['fixed_analysis']['prior100_pooling_before_verdict']=='FORBIDDEN'
          assert a['status']=='FROZEN_BEFORE_ANY_P13_GEOMETRY'
          print('G7_P13_TERMINAL_PRESEAL_PASS')
          PY

      - name: Recover eight immutable batch artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p13
          fetch_artifact () {
            b="$1"; id="$2"; expected="$3"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/artifacts/$id/zip" \
              -o "/tmp/p13/b$b.zip"
            echo "$expected  /tmp/p13/b$b.zip" | sha256sum -c -
            mkdir -p "/tmp/p13/b$b"
            unzip -q "/tmp/p13/b$b.zip" -d "/tmp/p13/b$b"
          }
          fetch_artifact 1 11301352851 965a18ca9969be65469e52c92d8d1a1a21cd2e022ec4ae7431ae500113e45051
          fetch_artifact 2 11301148487 183b58f8c596872c816f5ef93e51251d984f55761a0dfd35f280c4487c40c746
          fetch_artifact 3 11301576955 a3a1fcec681ee94d5a9724ee3ac8feb21e8deed8578808e0eaedf0e9afe2af2a
          fetch_artifact 4 11300573510 0938a546d123d915942ee67e18dabfc212c90afa2a44c7b7197d03ad4e61b81e
          fetch_artifact 5 11301551669 731d668e88ede7d61a9d73ea4d45ed19b1b13a36a0172b4b2c2239fdd15daa7c
          fetch_artifact 6 11301123162 a6ffff8bdb75437593f4cf99d7b1d36f281531868f82edb7b677c7b20f77f2f8
          fetch_artifact 7 11300877650 14448550881dbc0966fb447f5fdae92482ea54086d0eb5dab142fe4801d3ee14
          fetch_artifact 8 11301252675 9900a87195dec52002e5aecabbdc7a357163e4d20f7a590a0241fc6bb76ad519
          echo G7_P13_EIGHT_BATCH_AUTHORITY_PASS

      - name: Merge fresh80 corpus
        run: |
          set -euo pipefail
          mkdir -p /tmp/p13/build/corpus
          node scripts/g7-p13/merge-fresh80-corpus.mjs \
            --source P13_BATCH1=/tmp/p13/b1 \
            --source P13_BATCH2=/tmp/p13/b2 \
            --source P13_BATCH3=/tmp/p13/b3 \
            --source P13_BATCH4=/tmp/p13/b4 \
            --source P13_BATCH5=/tmp/p13/b5 \
            --source P13_BATCH6=/tmp/p13/b6 \
            --source P13_BATCH7=/tmp/p13/b7 \
            --source P13_BATCH8=/tmp/p13/b8 \
            --out /tmp/p13/build/corpus

      - name: Exact fresh80 replay
        run: |
          set -euo pipefail
          node scripts/cube/replay-exact-trajectories.mjs \
            --input /tmp/p13/build/corpus/combined-solves.jsonl \
            --out /tmp/p13/build/exact
          node - <<'NODE'
          const x=require('/tmp/p13/build/exact/exact-trajectories.json');
          if(x.solve_count!==80) process.exit(1);
          if(x.exact_end_validation_pass!==80) process.exit(2);
          console.log('G7_P13_FRESH80_EXACT_PASS');
          console.log('PREFIXES\t'+x.total_prefixes);
          NODE

      - name: Reconstitute fixed geometry
        run: |
          set -euo pipefail
          mkdir -p /tmp/p13/build/geometry
          node scripts/g7-p7/prefix-context.mjs \
            /tmp/p13/build/exact/exact-trajectories.json \
            /tmp/p13/build/corpus/solve-metadata.jsonl \
            /tmp/p13/build/geometry/prefix-states.tsv \
            /tmp/p13/build/geometry/context.jsonl
          cargo run -q -p search-geometry-core --bin g7_p7_reco_rivals \
            < /tmp/p13/build/geometry/prefix-states.tsv \
            > /tmp/p13/build/geometry/features.tsv
          cargo run -q -p search-geometry-core --bin g7_p12_shell_flow \
            < /tmp/p13/build/geometry/prefix-states.tsv \
            > /tmp/p13/build/geometry/shell.tsv

      - name: Execute fresh-only terminal adjudication
        run: |
          set -euo pipefail
          mkdir -p /tmp/p13/build/out
          python3 scripts/g7-p13/analyze-fresh80-method-progress.py \
            --features /tmp/p13/build/geometry/features.tsv \
            --shell /tmp/p13/build/geometry/shell.tsv \
            --context /tmp/p13/build/geometry/context.jsonl \
            --out /tmp/p13/build/out \
            --permutations 100000 | tee /tmp/p13/build/terminal.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/p13/build/out/fresh80-method-progress-replication.json'))
          assert x['fresh_only'] is True
          assert x['prior100_pooled'] is False
          assert x['r1_reselected'] is False
          assert x['solves']==80
          assert x['verdict'] in ('REPLICATED_HETEROGENEITY','PARTIAL_REPLICATION','NOT_REPLICATED','SUPPORT_LIMITED')
          print('G7_P13_TERMINAL_RESULT_GATE_PASS',x['verdict'])
          print('PREDICTIONS',x['primary_predictions'])
          print('POOLED',x['pooled_by_progress'])
          print('METHODS',x['method_by_progress'])
          PY

      - name: Seal P13 terminal artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/p13/seal/authority /tmp/p13/seal/derived
          cp g7/p13/constitution.json /tmp/p13/seal/authority/
          cp g7/p13/replay-invalid-replacement-amendment.json /tmp/p13/seal/authority/
          cp /tmp/p13/build/corpus/corpus-receipt.json /tmp/p13/seal/derived/
          cp /tmp/p13/build/out/fresh80-method-progress-replication.json /tmp/p13/seal/derived/
          cp /tmp/p13/build/terminal.log /tmp/p13/seal/derived/execution.log
          printf '%s\n' \
            'PHASE=G7-P13' \
            'OPERATION=FRESH_METHOD_PROGRESS_HETEROGENEITY_REPLICATION_CAMPAIGN' \
            'FRESH_SOLVES=80' \
            'PRIOR100_POOLED_BEFORE_VERDICT=NO' \
            'R1_RESELECTED=NO' \
            'HUMAN_CONTACT_GATE=CLOSED' \
            > /tmp/p13/seal/AUTHORITY.txt
          (cd /tmp/p13/seal && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P13-fresh80-terminal-${{ github.sha }}
          path: /tmp/p13/seal
          retention-days: 90
