name: Validate G7-P4 stratified policy geometry

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p4/**'
      - 'scripts/g7-p4/**'
      - '.github/workflows/g7-p4.yml'
  pull_request:
    paths:
      - 'g7/p4/**'
      - 'scripts/g7-p4/**'
      - '.github/workflows/g7-p4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g7-p4-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frozen authorities
        run: |
          node -e "for (const p of ['g7/p4/preseal.json','g7/p4/pilot-manifest.json']) JSON.parse(require('fs').readFileSync(p,'utf8')); console.log('G7_P4_JSON_AUTHORITY_PASS')"
      - run: node scripts/g7-p4/test-pilot-acquisition.mjs
      - run: node scripts/g7-p4/test-pilot-trajectory.mjs

  g7-p4-pilot-contact:
    needs: g7-p4-unit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute frozen bounded pilot
        run: |
          set -euo pipefail
          rm -rf /tmp/g7-p4-pilot
          node scripts/g7-p4/acquire-pilot.mjs --execute --out /tmp/g7-p4-pilot | tee /tmp/g7-p4-pilot.log
          test "$(find /tmp/g7-p4-pilot/raw/solve -type f -name '*.html' | wc -l)" -eq 10
          grep -q $'SOLVE_BODY_REQUESTS\t10' /tmp/g7-p4-pilot.log
          grep -q $'BULK_MIRROR\tHOLD' /tmp/g7-p4-pilot.log
      - name: Materialize trajectory geometry gate
        run: |
          set -euo pipefail
          node scripts/g7-p4/analyze-pilot-trajectory.mjs             --input /tmp/g7-p4-pilot/derived/solves.jsonl             --out /tmp/g7-p4-pilot/derived/p4
          (cd /tmp/g7-p4-pilot && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: G7-P4-pilot-${{ github.sha }}
          path: /tmp/g7-p4-pilot
          if-no-files-found: error
          retention-days: 30
