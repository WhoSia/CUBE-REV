name: Validate G5-P5 search geometry

on:
  push:
    branches: ['research/current']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p5-search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust format seal
        run: cargo fmt --all --check
      - name: Workspace check
        run: cargo check --workspace
      - name: Workspace tests
        run: cargo test --workspace
      - name: Materialize exact first-hit P5-R0 geometry
        run: |
          mkdir -p g5/p5/ci-output
          cargo run --release --quiet -p search-geometry-core --bin p5_r0 > g5/p5/ci-output/p5-r0-first-hit.tsv
      - name: Upload P5 court
        uses: actions/upload-artifact@v4
        with:
          name: g5-p5-r0-first-hit-search-geometry
          path: g5/p5/ci-output/
