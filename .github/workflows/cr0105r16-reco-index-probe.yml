name: CR0105R16 Reco Index Surface Probe
on:
  push:
    branches: [cube-rev-0.10.5-r1.6-wca-public-data-spine]
    paths: [cr0105r16/RUN_RECO_PROBE]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests==2.32.4 beautifulsoup4==4.13.4 lxml==6.0.0
      - name: Probe public reconstruction index surface
        run: |
          python - <<'PY'
          import requests,hashlib,json,re,pathlib
          from bs4 import BeautifulSoup
          u='https://reco.nz/solve/'
          r=requests.get(u,timeout=45,headers={'User-Agent':'CUBE-REV/0.10.5-R1.6 read-only public index audit'}); r.raise_for_status()
          s=BeautifulSoup(r.text,'lxml'); tbl=s.find('table')
          rows=[]
          for tr in (tbl.find_all('tr') if tbl else []):
            td=tr.find_all('td')
            if len(td)<2: continue
            vals=[' '.join(x.stripped_strings) for x in td]
            try: rid=int(vals[0])
            except: continue
            href=next((a.get('href') for a in tr.find_all('a',href=True) if re.search(r'/solve/\d+',a.get('href',''))),None)
            rows.append({'id':rid,'puzzle':vals[1] if len(vals)>1 else None,'href':href})
          forms=[{'action':f.get('action'),'method':f.get('method'),'inputs':[{'name':x.get('name'),'value':x.get('value'),'type':x.get('type')} for x in f.find_all(['input','select'])]} for f in s.find_all('form')]
          links=sorted(set(a.get('href') for a in s.find_all('a',href=True) if any(k in a.get('href','').lower() for k in ['page','offset','solve?','filter'])))[:200]
          scripts=[x.get('src') for x in s.find_all('script',src=True)]
          out={'schema_version':'CR0105R16-RECO-SURFACE-PROBE-1','status':'PASS','url':u,'http':r.status_code,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest(),
               'table_rows':len(rows),'three_by_three_rows':sum(x['puzzle']=='3x3' for x in rows),'id_min':min((x['id'] for x in rows),default=None),'id_max':max((x['id'] for x in rows),default=None),
               'forms':forms,'pagination_like_links':links,'scripts':scripts}
          p=pathlib.Path('research/0.10.5-r1.6/evidence/RECO_INDEX_SURFACE_PROBE.json'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Commit probe evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/0.10.5-r1.6/evidence/RECO_INDEX_SURFACE_PROBE.json
          git commit -m "Record CUBE-REV 0.10.5-R1.6 reco index surface probe ${GITHUB_RUN_ID}"
          git push origin HEAD:cube-rev-0.10.5-r1.6-wca-public-data-spine
