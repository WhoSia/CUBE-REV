name: CUBE-REV 0.24 P1-R3 true 54-facelet multiaxis historical regression
on:
  workflow_dispatch:
  push:
    branches: [research/current]
    paths:
      - "scripts/cuberev-024/p1_r3_true_54_facelet_multiaxis_dr_cpp/main.cpp"
      - "scripts/cuberev-024/p1_r3_independent_source_replay.mjs"
      - ".github/workflows/cuberev-024-P1-R3-true-cube-three-axis-two-phase-cpp.yml"
permissions:
  contents: read
jobs:
  original-physical-three-axis-source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Forbid bot code author/committer in active branch ancestry
        shell: bash
        run: |
          if git log --format='%an <%ae> %cn <%ce>' | grep -Ei 'github-actions?\[bot\]|github-action\[bot\]'; then
            echo "::error::GitHub Actions bot contribution forbidden"
            exit 1
          fi
      - name: Compile actual original 54-sticker C++17 three-axis historical baseline
        shell: bash
        run: |
          g++ -std=c++17 -O3 -Wno-return-type scripts/cuberev-024/p1_r3_true_54_facelet_multiaxis_dr_cpp/main.cpp -o /tmp/cuberev-p1r3
      - name: Original WCA and authentic written FMC fully solved three-axis source regression
        shell: bash
        run: |
          timeout 180 /tmp/cuberev-p1r3 | tee /tmp/p1r3-source-regression.log
          test "$(grep -c '^CASE .* STATUS SOLVED_PHYSICALLY_ALL54 ' /tmp/p1r3-source-regression.log)" -eq 4
          test "$(grep -c '^WINNER ' /tmp/p1r3-source-regression.log)" -eq 4
          grep -q '^CASE WCA_SeoulSummer2026_333_Final_A_1 .* SOLUTION_LEN 21$' /tmp/p1r3-source-regression.log
          grep -q '^CASE WCA_SeoulSummer2026_333_First_A_1 .* SOLUTION_LEN 19$' /tmp/p1r3-source-regression.log
          grep -q '^CASE FMC_World2026_Miao_main_EO_DR .* SOLUTION_LEN 9$' /tmp/p1r3-source-regression.log
          grep -q '^CASE FMC_World2026_Riabov_main_EO_DR .* SOLUTION_LEN 9$' /tmp/p1r3-source-regression.log
          grep -q '^FRAME FMC_World2026_Miao_main_EO_DR AXIS FB .* P1 0 P2 9 ' /tmp/p1r3-source-regression.log
          grep -q '^INVERSE_SCRAMBLE_BASELINE_LEN 20$' /tmp/p1r3-source-regression.log
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Independently check historical 21 19 9 9 source words on existing real 54-sticker engine
        run: node scripts/cuberev-024/p1_r3_independent_source_replay.mjs
      - name: Source checkout is read only
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
