name: CUBE-REV 0.24 P1-R3 true 54-facelet multiaxis DR
on:
  workflow_dispatch:
  push:
    branches: [research/current]
    paths:
      - "scripts/cuberev-024/p1_r3_true_54_facelet_multiaxis_dr_cpp/main.cpp"
      - "scripts/cuberev-024/p1_r3_independent_source_replay.mjs"
      - ".github/workflows/cuberev-024-P1-R3-true-cube-three-axis-two-phase-cpp.yml"
permissions:
  contents: read
jobs:
  whole-cube-source-pdb-and-conjugacy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Forbid github-actions bot authors and committers
        shell: bash
        run: |
          if git log --format='%an <%ae> %cn <%ce>' | grep -Ei 'github-actions?\[bot\]|github-action\[bot\]'; then
            echo "::error::GitHub Actions bot contribution prohibited"
            exit 1
          fi
      - name: Build independent original-sticker C++17 phase engine
        shell: bash
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra scripts/cuberev-024/p1_r3_true_54_facelet_multiaxis_dr_cpp/main.cpp -o /tmp/cuberev024-p1r3
      - name: Run long original 3x3 WCA and public-authored FMC full-solve corpus
        shell: bash
        run: |
          /tmp/cuberev024-p1r3 | tee /tmp/p1r3-receipt.txt
          test "$(grep -c '^CASE .* STATUS SOLVED_PHYSICALLY_ALL54 ' /tmp/p1r3-receipt.txt)" -eq 4
          test "$(grep -c '^WINNER ' /tmp/p1r3-receipt.txt)" -eq 4
          grep -q '^CASE WCA_SeoulSummer2026_333_Final_A_1 .* SOLUTION_LEN 21$' /tmp/p1r3-receipt.txt
          grep -q '^CASE WCA_SeoulSummer2026_333_First_A_1 .* SOLUTION_LEN 19$' /tmp/p1r3-receipt.txt
          grep -q '^CASE FMC_World2026_Miao_main_EO_DR .* SOLUTION_LEN 9$' /tmp/p1r3-receipt.txt
          grep -q '^CASE FMC_World2026_Riabov_main_EO_DR .* SOLUTION_LEN 9$' /tmp/p1r3-receipt.txt
          grep -q '^FRAME FMC_World2026_Miao_main_EO_DR AXIS FB .* P1 0 P2 9 ' /tmp/p1r3-receipt.txt
          grep -q '^INVERSE_SCRAMBLE_BASELINE_LEN 20$' /tmp/p1r3-receipt.txt
      - name: Reject any within-first-13-DR-phase path beating official WCA inverse 20, but do not claim global HTM optimality
        shell: bash
        run: |
          P1R3_FIND19=1 /tmp/cuberev024-p1r3 "R'" "B'" F2 D2 F2 L2 R2 "U'" F2 L2 D2 B2 D F "L'" R2 B U2 F2 R2 > /tmp/p1r3-target19-negative.txt 2>&1
          cat /tmp/p1r3-target19-negative.txt
          grep -q '^TARGET19_UNRESOLVED_RESOURCE_OR_PHASE_DEPTH_BOUND
        with:
          node-version: "22.16.0"
      - name: Independently replay original 54-sticker C++ witnesses in Node
        run: node scripts/cuberev-024/p1_r3_independent_source_replay.mjs
      - name: Verify checkout remained read-only
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
 /tmp/p1r3-target19-negative.txt
          test "$(grep -c '^TARGET19_AXIS .* STOPPED 0
        with:
          node-version: "22.16.0"
      - name: Independently replay original 54-sticker C++ witnesses in Node
        run: node scripts/cuberev-024/p1_r3_independent_source_replay.mjs
      - name: Verify checkout remained read-only
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
 /tmp/p1r3-target19-negative.txt)" -eq 3
      - name: Positive source control of the bounded 19-move C++ real-cube challenger
        shell: bash
        run: |
          P1R3_FIND19=1 /tmp/cuberev024-p1r3 L2 F2 U F2 R2 U B2 R2 D U F L U "F'" R2 B "R'" D "B'" > /tmp/p1r3-target19-positive.txt 2>&1
          cat /tmp/p1r3-target19-positive.txt
          grep -q '^FOUND_TARGET19_LEN 19 WORD ' /tmp/p1r3-target19-positive.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Independently replay original 54-sticker C++ witnesses in Node
        run: node scripts/cuberev-024/p1_r3_independent_source_replay.mjs
      - name: Verify checkout remained read-only
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
