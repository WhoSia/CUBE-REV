name: CUBE-REV 0.25 P0-R6F TCS bounded residual language dominance
on:
  workflow_dispatch:
  push:
    branches: [research/current]
    paths:
      - "formal/025/BoundedResidualDominance.lean"
      - "formal/025/lakefile.toml"
      - ".github/workflows/cuberev-025-P0-R6F-lean-residual-dominance.yml"
permissions:
  contents: read
jobs:
  verify-ordered-language-simulation-preorder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Forbid GitHub bot authors and committers
        shell: bash
        run: |
          set -euo pipefail
          if git log --format='%an <%ae> %cn <%ce>' | grep -Ei 'github-actions?\\[bot\\]|github-action\\[bot\\]'; then exit 1; fi
      - name: Lean4 kernel build of exact language inclusion and sound antichain evidence
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/025
          build: true
          test: false
          use-mathlib-cache: false
      - name: Keep all tracked source immutable
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD --
          test -z "$(git status --porcelain --untracked-files=no)"
