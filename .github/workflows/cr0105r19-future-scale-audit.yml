name: CR0105R19 Future Score Scale Audit
on:
  push:
    branches: [cube-rev-0.10.5-r1.9-quotient-familywise-readiness]
    paths: [cr0105r19/RUN_FUTURE_SCALE_AUDIT]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify R3 and zero-fresh state
        run: |
          python3 - <<'PY'
          import json
          s=json.load(open('research/0.10.5-r1.9/evidence-nested-gate-repair/ATTEMPT_FAMILYWISE_NULL_PREREG_SEAL_R3.json'))
          f=json.load(open('research/0.10.5-r1.9/evidence-fresh-readiness/FRESH_VINTAGE_READINESS.json'))
          assert s['status']=='SEALED_FOR_FUTURE_FRESH_VINTAGE_R3_NESTED_EXACT_PREREG_GATE'
          assert f['status']=='READINESS_PASS_DATA_WAIT' and f['fresh']['new_reco_id_rows']==0
          print('R19_FUTURE_SCALE_PRECHECK_PASS')
          PY
      - name: Install pinned cubing runtime
        run: npm install --no-save --ignore-scripts cubing@0.63.3
      - name: Run future-scale compatibility audit
        id: audit
        shell: bash
        env:
          R19_SCALE_ROOT: /tmp/r19scale
        run: |
          set +e
          mkdir -p /tmp/r19scale
          node research/0.10.5-r1.9/r19_future_scale_compatibility.mjs 2>&1 | tee /tmp/r19scale/scale.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p research/0.10.5-r1.9/evidence-future-scale-audit
          test -f /tmp/r19scale/FUTURE_SCORE_SCALE_COMPATIBILITY.json && cp /tmp/r19scale/FUTURE_SCORE_SCALE_COMPATIBILITY.json research/0.10.5-r1.9/evidence-future-scale-audit/ || true
          cp /tmp/r19scale/scale.log research/0.10.5-r1.9/evidence-future-scale-audit/SCALE_LOG.txt || true
          python3 - <<'PY'
          import json,os,datetime,pathlib
          c=int('${{ steps.audit.outputs.exit_code || 97 }}')
          x={'schema_version':'CR0105R19-FUTURE-SCALE-AUDIT-RUN-1','workflow_run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'exit_code':c,'status':'PASS' if c==0 else 'HOLD_OR_FAIL','metric_or_null_changed':False,'current_fresh_rows':0,'human_observations':0,'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('research/0.10.5-r1.9/evidence-future-scale-audit/RUN_METADATA.json').write_text(json.dumps(x,indent=2)+'\n')
          PY
      - name: Commit audit evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/0.10.5-r1.9/evidence-future-scale-audit
          git diff --cached --quiet || git commit -m "Record CUBE-REV 0.10.5-R1.9 future-scale audit ${GITHUB_RUN_ID}"
          git push origin HEAD:cube-rev-0.10.5-r1.9-quotient-familywise-readiness
      - name: Enforce compatibility health
        if: always()
        run: |
          test '${{ steps.audit.outputs.exit_code }}' = '0'
          python3 - <<'PY'
          import json
          x=json.load(open('research/0.10.5-r1.9/evidence-future-scale-audit/FUTURE_SCORE_SCALE_COMPATIBILITY.json'))
          assert x['status']=='PASS_FUTURE_SCALE_COMPATIBILITY',x
          print('CR0105R19_FUTURE_SCALE_PASS')
          PY
