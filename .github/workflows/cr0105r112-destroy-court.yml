name: CR0105R112 Coordinate Gauge Destroy Court
on:
  push:
    branches: [cube-rev-0.10.5-r1.12-roux-generation-g2]
    paths: [cr0105r112/RUN_DESTROY]
permissions:
  contents: write
jobs:
  destroy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify primary G2 result is already sealed and unchanged
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          g=json.load(open('research/0.10.5-r1.12/evidence-g2/ROUX_G2_GEOMETRY_AUDIT.json'))
          n=json.load(open('research/0.10.5-r1.12/evidence-g2/ROUX_G2_NULL_AUDIT.json'))
          assert g['status']=='HOLD_ROUX_G2_GEOMETRY'
          assert g['semantic_sha256']=='f1c19e8b960373e9968cab8b57c48a0ae4ed130d02d8d27704126462d40595e8'
          assert n['status']=='HOLD_ROUX_G2_NULL_FOUNDRY'
          assert g['post_result_gate_change'] is False
          print('CR0105R112_DESTROY_PRIMARY_SEAL_PASS')
          PY
      - name: Install exact cube-state runtime
        run: npm install --no-save --ignore-scripts cubing@0.63.3
      - name: Run posthoc coordinate-gauge destroy court
        id: destroycourt
        shell: bash
        env: {R112_ROOT: /tmp/r112}
        run: |
          set +e
          mkdir -p /tmp/r112
          node research/0.10.5-r1.12/r112_destroy_coordinate_gauge.mjs 2>&1 | tee /tmp/r112/DESTROY_LOG.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist diagnostic evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p research/0.10.5-r1.12/evidence-destroy
          for f in ROUX_G2_COORDINATE_GAUGE_DESTROY_AUDIT.json ROUX_G2_COORDINATE_GAUGE_ROWS.json DESTROY_LOG.txt; do
            test -f "/tmp/r112/$f" && cp "/tmp/r112/$f" research/0.10.5-r1.12/evidence-destroy/ || true
          done
          python3 - <<'PY'
          import json,os,datetime,pathlib
          x={'schema_version':'CR0105R112-DESTROY-RUN-1','workflow_run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'exit_code':int('${{ steps.destroycourt.outputs.exit_code || 97 }}'),'primary_gate_changed':False,'fresh_network_read':False,'human_observations':0,'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('research/0.10.5-r1.12/evidence-destroy/DESTROY_RUN_METADATA.json').write_text(json.dumps(x,indent=2)+'\n')
          PY
      - name: Commit diagnostic evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/0.10.5-r1.12/evidence-destroy
          git diff --cached --quiet || git commit -m "Record CUBE-REV 0.10.5-R1.12 destroy court ${GITHUB_RUN_ID}"
          git pull --rebase origin cube-rev-0.10.5-r1.12-roux-generation-g2
          git push origin HEAD:cube-rev-0.10.5-r1.12-roux-generation-g2
      - name: Enforce diagnostic-only completion
        if: always()
        run: |
          test '${{ steps.destroycourt.outputs.exit_code }}' = '0'
          python3 - <<'PY'
          import json
          x=json.load(open('research/0.10.5-r1.12/evidence-destroy/ROUX_G2_COORDINATE_GAUGE_DESTROY_AUDIT.json'))
          assert x['status']=='POSTHOC_DIAGNOSTIC_ONLY_NO_G2_GATE_CHANGE'
          assert x['post_result_gate_change'] is False
          print('CR0105R112_DESTROY_COMPLETE',x['counts'])
          PY
