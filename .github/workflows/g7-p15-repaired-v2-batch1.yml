name: G7-P15 second-repair batch1 acquisition

on:
  push:
    branches: ['research/current']
    paths:
      - 'scripts/g7-p15/acquire-fresh96-repaired-v2-batch1.mjs'
      - '.github/workflows/g7-p15-repaired-v2-batch1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  batch1:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Zero-bot firewall
        run: |
          set -euo pipefail
          ! grep -E 'git +(commit|push|tag)|contents: *write|github-actions\[bot\]' '.github/workflows/g7-p15-repaired-v2-batch1.yml'
      - name: Recover second repaired selection
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p15-v2
          curl --fail --location --silent --show-error             -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/actions/artifacts/11308150998/zip" -o /tmp/p15-v2.zip
          echo '6df4279900442557b5c63e94986cb8690535b0b3f0487978284ad59616607bdd  /tmp/p15-v2.zip' | sha256sum -c -
          unzip -q /tmp/p15-v2.zip -d /tmp/p15-v2
          test -n "$(find /tmp/p15-v2 -name selection-manifest-repaired-v2.json -print -quit)"
      - name: Acquire second-repaired batch1
        run: |
          set -euo pipefail
          MANIFEST="$(find /tmp/p15-v2 -name selection-manifest-repaired-v2.json -print -quit)"
          OUT=/tmp/g7-p15-final-batch01
          node scripts/g7-p15/acquire-fresh96-repaired-v2-batch1.mjs --manifest "$MANIFEST" --out "$OUT" --execute | tee /tmp/g7-p15-final-batch01.log
      - name: Exact replay
        run: |
          set -euo pipefail
          OUT=/tmp/g7-p15-final-batch01
          node scripts/cube/replay-exact-trajectories.mjs --input "$OUT/derived/solves.jsonl" --out "$OUT/exact"
          node - "$OUT/exact/exact-trajectories.json" <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(x.solve_count!==8||x.exact_end_validation_pass!==8) process.exit(1);
          console.log('G7_P15_FINAL_BATCH1_EXACT_PASS'); console.log('PREFIXES\t'+x.total_prefixes);
          NODE
      - name: Seal final batch1
        run: |
          set -euo pipefail
          OUT=/tmp/g7-p15-final-batch01
          cp /tmp/g7-p15-final-batch01.log "$OUT/"
          printf '%s\n' 'PHASE=G7-P15' 'BATCH=1' 'SOLVES=8'             'SELECTION_MANIFEST_SHA256=7e7d99682436c7b75bb6a7d2cd28eac54bbb87d3d3cef163e7ceacb7c16c3bb6'             'GEOMETRY_OPENED_BEFORE_REPAIR=NO' 'RAW_PUBLIC_RELEASE=HOLD' > "$OUT/AUTHORITY.txt"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: G7-P15-final-batch1-${{ github.sha }}
          path: /tmp/g7-p15-final-batch01
          retention-days: 90
