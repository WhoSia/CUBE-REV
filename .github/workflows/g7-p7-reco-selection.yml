name: Acquire frozen G7-P7 reco.nz campaign batch 4

on:
  push:
    branches: ['research/current']
    paths:
      - '.github/workflows/g7-p7-reco-selection.yml'
  pull_request:
    paths:
      - '.github/workflows/g7-p7-reco-selection.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bounded-batch:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frozen authority
        run: |
          set -euo pipefail
          node scripts/g7-p7/test-reco-campaign-manifest.mjs
          node scripts/g7-p7/test-acquire-reco-batch.mjs
          node - <<'NODE'
          const p=require('./g7/p7/preseal.json');
          const c=require('./g7/p7/reco-campaign-constitution.json');
          if(p.naming_preflight.current_suffix!=='Court') process.exit(1);
          if(c.authority.bulk_authorized!==false) process.exit(2);
          if(c.authority.max_solves_per_run!==10||c.authority.campaign_ceiling!==40) process.exit(3);
          console.log('G7_P7_BATCH4_AUTHORITY_PASS');
          NODE
      - name: Acquire frozen batch 4
        run: |
          set -euo pipefail
          rm -rf /tmp/g7-p7-batch04
          node scripts/g7-p7/acquire-reco-batch.mjs --batch 4 --out /tmp/g7-p7-batch04 --execute
      - name: Exact trajectory replay
        run: |
          set -euo pipefail
          node scripts/cube/replay-exact-trajectories.mjs --input /tmp/g7-p7-batch04/derived/solves.jsonl --out /tmp/g7-p7-batch04/exact
          node - <<'NODE'
          const x=require('/tmp/g7-p7-batch04/exact/exact-trajectories.json');
          if(x.solve_count!==10||x.exact_end_validation_pass!==10) process.exit(1);
          console.log('G7_P7_RECO_BATCH4_EXACT_PASS');
          console.log('PREFIXES\t'+x.total_prefixes);
          NODE
      - name: Seal batch artifact
        run: |
          set -euo pipefail
          printf '%s\n' 'BATCH=4' 'SOLVES=10' 'BULK_MIRROR=HOLD' 'RAW_PUBLIC_RELEASE=HOLD' > /tmp/g7-p7-batch04/AUTHORITY.txt
          (cd /tmp/g7-p7-batch04 && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: G7-P7-reco-batch4-${{ github.sha }}
          path: /tmp/g7-p7-batch04
          if-no-files-found: error
          retention-days: 90

  observe-push:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Observe matching push run without source contact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node - <<'NODE'
          const {GH_TOKEN,REPO,HEAD_SHA}=process.env;
          const url=`https://api.github.com/repos/${REPO}/actions/workflows/g7-p7-reco-selection.yml/runs?event=push&branch=research%2Fcurrent&per_page=20`;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          for(let i=0;i<36;i++){
            const res=await fetch(url,{headers:{Authorization:`Bearer ${GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
            if(!res.ok) throw new Error('API_'+res.status);
            const data=await res.json();
            const run=data.workflow_runs.find(x=>x.head_sha===HEAD_SHA);
            if(run){
              console.log('MATCHED_PUSH_RUN_ID\t'+run.id);
              console.log('MATCHED_PUSH_STATUS\t'+run.status);
              console.log('MATCHED_PUSH_CONCLUSION\t'+run.conclusion);
              if(run.status==='completed'){
                if(run.conclusion!=='success') process.exit(2);
                console.log('G7_P7_BATCH4_PUSH_OBSERVER_PASS');
                process.exit(0);
              }
            }
            await sleep(10000);
          }
          throw new Error('MATCHED_PUSH_RUN_TIMEOUT');
          NODE
