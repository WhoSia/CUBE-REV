name: G7-P8 frozen-population index covariate census

concurrency:
  group: g7-p8-index-covariate-census-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p8/index-only-census-amendment.json'
      - 'scripts/g7-p8/census-frozen-index-covariates.mjs'
      - 'scripts/reco/parse-reco-html.mjs'
      - '.github/workflows/g7-p8-index-covariate-census.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate amendment and source-contact firewall
        run: |
          set -euo pipefail
          node - <<'NODE'
          const x=require('./g7/p8/index-only-census-amendment.json');
          if(x.status!=='PRESEALED_BEFORE_ANY_G7_P8_SOURCE_CONTACT') process.exit(1);
          if(x.authority_boundary.solve_body_requests!==0) process.exit(2);
          if(x.acquisition_policy.mode!=='INDEX_CENSUS_ONLY') process.exit(3);
          if(x.acquisition_policy.min_delay_ms<2000) process.exit(4);
          console.log('G7_P8_INDEX_CENSUS_AMENDMENT_GATE_PASS');
          NODE

      - name: Recover frozen G7-P3 population authority
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/g7-p8-p3
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/artifacts/11205587281/zip" \
            -o /tmp/g7-p8-p3.zip
          echo 'acb3dff14bbdb33fe4be3550e64eeba55dcb1879b85d6b8c1eacca7d9408c4e4  /tmp/g7-p8-p3.zip' | sha256sum -c -
          unzip -q /tmp/g7-p8-p3.zip -d /tmp/g7-p8-p3
          FROZEN="$(find /tmp/g7-p8-p3 -name linkage-support.jsonl -print -quit)"
          test -n "$FROZEN"
          python3 - "$FROZEN" <<'PY'
          import json,sys
          xs=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip()]
          assert len(xs)==12941
          assert len({int(x['source_id']) for x in xs})==12941
          assert sum(1 for x in xs if x.get('puzzle')=='3x3')==10591
          print('G7_P8_FROZEN_POPULATION_AUTHORITY_PASS')
          PY

      - name: Execute respectful index-only covariate census
        run: |
          set -euo pipefail
          FROZEN="$(find /tmp/g7-p8-p3 -name linkage-support.jsonl -print -quit)"
          rm -rf /tmp/g7-p8-index-covariates
          node scripts/g7-p8/census-frozen-index-covariates.mjs \
            --frozen-index "$FROZEN" \
            --out /tmp/g7-p8-index-covariates \
            --delay-ms 2000 \
            --max-pages 400 | tee /tmp/g7-p8-index-covariates.log
          grep -q $'SOLVE_BODY_REQUESTS\t0' /tmp/g7-p8-index-covariates.log
          test -s /tmp/g7-p8-index-covariates/census.json
          test -s /tmp/g7-p8-index-covariates/frozen-index-covariates.jsonl
          node - <<'NODE'
          const x=require('/tmp/g7-p8-index-covariates/census.json');
          if(x.frozen_population_rows!==12941||x.frozen_3x3_rows!==10591) process.exit(1);
          if(x.solve_body_requests!==0||x.raw_html_retained!==false) process.exit(2);
          console.log('G7_P8_INDEX_COVARIATE_RESULT_GATE_PASS');
          console.log('METHOD_COVERAGE\t'+x.method_3x3_coverage_of_frozen);
          console.log('RECONSTRUCTOR_COVERAGE\t'+x.reconstructor_3x3_coverage_of_frozen);
          console.log('FROZEN_MISSING\t'+x.frozen_ids_missing);
          NODE

      - name: Seal minimal derived census
        run: |
          set -euo pipefail
          mkdir -p /tmp/g7-p8-seal/authority /tmp/g7-p8-seal/derived
          cp g7/p8/constitution.json g7/p8/index-only-census-amendment.json /tmp/g7-p8-seal/authority/
          cp /tmp/g7-p8-index-covariates/census.json /tmp/g7-p8-seal/derived/
          cp /tmp/g7-p8-index-covariates/frozen-index-covariates.jsonl /tmp/g7-p8-seal/derived/
          cp /tmp/g7-p8-index-covariates.log /tmp/g7-p8-seal/derived/execution.log
          printf '%s\n' \
            'PHASE=G7-P8' \
            'OPERATION=FROZEN_POPULATION_INDEX_ONLY_METHOD_RECONSTRUCTOR_CENSUS' \
            'FROZEN_ROWS=12941' \
            'FROZEN_3X3=10591' \
            'SOLVE_BODY_REQUESTS=0' \
            'RAW_INDEX_HTML_RETAINED=NO' \
            > /tmp/g7-p8-seal/AUTHORITY.txt
          rm -rf /tmp/g7-p8-p3 /tmp/g7-p8-p3.zip
          (cd /tmp/g7-p8-seal && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P8-index-covariate-census-${{ github.sha }}
          path: /tmp/g7-p8-seal
          if-no-files-found: error
          retention-days: 90
