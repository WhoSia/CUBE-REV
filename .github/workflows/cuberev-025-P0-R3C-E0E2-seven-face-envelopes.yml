name: CUBE-REV 0.25 P0-R3C actual E0 E2 <=7 face-envelope nonshortest source test
on:
  workflow_dispatch:
  push:
    branches: [research/current]
    paths:
      - "scripts/cuberev-025/p0_r3c_E0_E2_nonshortest_face_envelope_go/main.go"
      - ".github/workflows/cuberev-025-P0-R3C-E0E2-seven-face-envelopes.yml"
permissions:
  contents: read
jobs:
  original-physical-E0-E2-face-quota-search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No GitHub Actions bot committers or authors
        shell: bash
        run: |
          if git log --format='%an <%ae> %cn <%ce>' | grep -Ei 'github-actions?\[bot\]|github-action\[bot\]'; then exit 1; fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.2"
      - name: Source-authentic physical projected word quota finite E0 versus E2
        shell: bash
        run: |
          set -o pipefail
          timeout 480 go run scripts/cuberev-025/p0_r3c_E0_E2_nonshortest_face_envelope_go/main.go | tee /tmp/p0r3c-quota.txt
          grep -Fq 'P0R3B_REAL_SHORTEST_PROJECTED_WORDS_COMPLETE pattern=EDGE4_0 source_h=7' /tmp/p0r3c-quota.txt
          grep -Eq '^P0R3C_(REAL_PHYSICAL_NONSHORTEST_E2_SUCCESS|E0_E2_SINGLE_WORD_PAIR_ENVELOPE7_UNPROVEN)' /tmp/p0r3c-quota.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuberev025-p0r3c-actual-E0-E2-physical-projected-face-quota-receipt
          path: /tmp/p0r3c-quota.txt
          retention-days: 30
          if-no-files-found: warn
      - name: No tracked source edits
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
