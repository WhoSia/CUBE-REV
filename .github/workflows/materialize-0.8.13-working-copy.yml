name: CUBE-REV 0.8.13 Collector working-copy materializer
on:
  push:
    branches: [cube-rev-0.8.13-native-browser-live-factory]
    paths:
      - '.github/workflows/materialize-0.8.13-working-copy.yml'
      - 'scripts/patch_0_8_13_collector_working_copy.py'
  pull_request:
    branches: [cube-rev-0.8.12-active-session-cas]
    paths:
      - '.github/workflows/materialize-0.8.13-working-copy.yml'
      - 'scripts/patch_0_8_13_collector_working_copy.py'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cube-rev-0.8.13-native-browser-live-factory
          fetch-depth: 0
      - name: Apply exact working-copy patch
        run: python scripts/patch_0_8_13_collector_working_copy.py
      - name: Verify patched sources
        run: |
          node --check js/participant-cognitive-mode-0.8.13.js
          node --check tests/native_multi_window_0.8.13.spec.js
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('participant-cognitive-mode-0.8.13.html','utf8');
          const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(x=>x[1]).filter(x=>x.trim());
          if(blocks.length!==1)throw new Error(`INLINE_SCRIPT_COUNT:${blocks.length}`);
          fs.writeFileSync('/tmp/cr0813-inline.js',blocks[0]);
          NODE
          node --check /tmp/cr0813-inline.js
          grep -F 'function collectorWorkingCopy' js/participant-cognitive-mode-0.8.13.js
          grep -F 'collectorWorkingCopy(state)' participant-cognitive-mode-0.8.13.html
      - name: Commit working-copy implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/participant-cognitive-mode-0.8.13.js participant-cognitive-mode-0.8.13.html tests/native_multi_window_0.8.13.spec.js
          if git diff --cached --quiet; then
            echo CR0813_COLLECTOR_WORKING_COPY_ALREADY_MATERIALIZED
          else
            git commit -m 'fix(0.8.13): isolate mutable Collector working copy [skip ci]'
            git push origin HEAD:cube-rev-0.8.13-native-browser-live-factory
          fi
