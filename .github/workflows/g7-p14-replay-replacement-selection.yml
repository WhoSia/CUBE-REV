name: G7-P14 confirm80 replay-invalid selection repair seal

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p14/replay-invalid-replacement-amendment.json'
      - 'scripts/g7-p14/repair-confirm80-replay-invalid.py'
      - '.github/workflows/g7-p14-replay-replacement-selection.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate pre-geometry amendment
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('g7/p14/replay-invalid-replacement-amendment.json'))
          assert x['status']=='FROZEN_BEFORE_ANY_P14_GEOMETRY'
          assert x['replacement_rule']['replace_only']==[3276,11912,14005,7309]
          print('G7_P14_REPAIR_AMENDMENT_PASS')
          PY
      - name: Recover immutable authorities
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p14/orig /tmp/p14/p8 /tmp/p14/p3 /tmp/p14/p11 /tmp/p14/p13o /tmp/p14/p13r
          fetch_artifact () {
            id="$1"; dir="$2"; expected="$3"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/artifacts/$id/zip" -o "/tmp/p14/$dir.zip"
            echo "$expected  /tmp/p14/$dir.zip" | sha256sum -c -
            unzip -q "/tmp/p14/$dir.zip" -d "/tmp/p14/$dir"
          }
          fetch_artifact 11301404290 orig 71faa1be721940b670c871a79a9af5bac63f84dc751b08b3a8098ff19025a46f
          fetch_artifact 11238930249 p8 460dc657565541b663f1bc91b6e75490a7591f56946a41c28af60802ee27f16a
          fetch_artifact 11205587281 p3 acb3dff14bbdb33fe4be3550e64eeba55dcb1879b85d6b8c1eacca7d9408c4e4
          fetch_artifact 11242753632 p11 45145487febf4d9fc975299ffe567a9e20ae63cb744a6205bd53f661941f8a67
          fetch_artifact 11272225709 p13o d41f3c558fd8b9fa8d595f146a225e462732d49e5fca8a67f52802b64e34d6c6
          fetch_artifact 11301332731 p13r 550bdfb59023aeb6e1804afb4c1ca358c397892a5785e08d07fcabe0915442e2
      - name: Materialize deterministic repair
        run: |
          set -euo pipefail
          python3 scripts/g7-p14/repair-confirm80-replay-invalid.py \
            --original-manifest "$(find /tmp/p14/orig -name selection-manifest.json -print -quit)" \
            --covariates "$(find /tmp/p14/p8 -name frozen-index-covariates.jsonl -print -quit)" \
            --frozen-index "$(find /tmp/p14/p3 -name linkage-support.jsonl -print -quit)" \
            --legacy60 g7/p7/source-provenance-recovery.json \
            --p11-manifest "$(find /tmp/p14/p11 -name selection-manifest.json -print -quit)" \
            --p13-original "$(find /tmp/p14/p13o -name selection-manifest.json -print -quit)" \
            --p13-repaired "$(find /tmp/p14/p13r -name selection-manifest-repaired.json -print -quit)" \
            --out /tmp/p14/out | tee /tmp/p14/repair.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/p14/out/selection-manifest-repaired.json'))
          assert x['target_total']==80 and len(x['selected_cell_counts'])==16
          assert all(v==5 for v in x['selected_cell_counts'].values())
          assert all(len(x['batches'][str(i)])==10 for i in range(1,9))
          print('G7_P14_REPAIR_RESULT_GATE_PASS')
          print('REPLACEMENTS',x['replacements'])
          print('MANIFEST_SHA256',x['selection_manifest_sha256'])
          PY
      - name: Seal repaired selection
        run: |
          set -euo pipefail
          mkdir -p /tmp/p14/seal/authority /tmp/p14/seal/derived
          cp g7/p14/replay-invalid-replacement-amendment.json /tmp/p14/seal/authority/
          cp /tmp/p14/out/selection-manifest-repaired.json /tmp/p14/seal/derived/
          cp /tmp/p14/out/batch-*-source-ids.txt /tmp/p14/seal/derived/
          cp /tmp/p14/repair.log /tmp/p14/seal/derived/
          printf '%s\n' 'PHASE=G7-P14' 'OPERATION=PRE_GEOMETRY_CONFIRM80_REPLAY_REPAIR' 'REPLACED=4' 'GEOMETRY_OPENED=NO' > /tmp/p14/seal/AUTHORITY.txt
          (cd /tmp/p14/seal && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: G7-P14-repaired-selection-${{ github.sha }}
          path: /tmp/p14/seal
          retention-days: 90
