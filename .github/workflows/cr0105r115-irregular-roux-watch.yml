name: CR0105R115 Irregular Roux Fresh Watch
on:
  push:
    branches: [cube-rev-0.10.5-r1.15-manuscript-bridge]
    paths: [cr0105r115/RUN_ROUX_WATCH]
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify manuscript seal and frozen G4 baseline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          s=json.load(open('research/0.10.5-r1.15/MANUSCRIPT_BRIDGE_SEAL.json'))
          b=json.load(open('research/0.10.5-r1.14/evidence-baseline/G4_BASELINE_VINTAGE.json'))
          assert s['status']=='PASS_MANUSCRIPT_BRIDGE_WITH_COHERENT_METHOD_CLAIM_HOLD_PREPRINT_FREEZE'
          assert s['roux_freshness_before_watch']['baseline_id_set_sha256']==b['live']['id_set_sha256']
          assert s['roux_freshness_before_watch']['authority_threshold']==20
          print('CR0105R115_WATCH_ORDERING_PASS')
          PY
      - name: Install index parser runtime
        run: python -m pip install --disable-pip-version-check requests==2.32.4 beautifulsoup4==4.13.4 lxml==6.0.0
      - name: Run irregular Roux watch
        id: watchrun
        shell: bash
        env: {R115_ROOT: /tmp/r115}
        run: |
          set +e
          mkdir -p /tmp/r115
          python research/0.10.5-r1.15/r115_irregular_roux_watch.py 2>&1 | tee /tmp/r115/IRREGULAR_ROUX_WATCH_LOG.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist watch evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p research/0.10.5-r1.15/evidence-irregular-watch
          test -f /tmp/r115/IRREGULAR_ROUX_WATCH.json && cp /tmp/r115/IRREGULAR_ROUX_WATCH.json research/0.10.5-r1.15/evidence-irregular-watch/ || true
          test -f /tmp/r115/IRREGULAR_ROUX_WATCH_LOG.txt && cp /tmp/r115/IRREGULAR_ROUX_WATCH_LOG.txt research/0.10.5-r1.15/evidence-irregular-watch/ || true
          python3 - <<'PY'
          import json,os,datetime,pathlib
          x={'schema_version':'CR0105R115-IRREGULAR-WATCH-RUN-1','workflow_run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'exit_code':int('${{ steps.watchrun.outputs.exit_code || 97 }}'),'automatic_schedule':False,'authority_scoring_performed':False,'g4_definition_mutated':False,'human_observations':0,'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('research/0.10.5-r1.15/evidence-irregular-watch/IRREGULAR_WATCH_RUN_METADATA.json').write_text(json.dumps(x,indent=2)+'\n')
          PY
      - name: Commit watch evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/0.10.5-r1.15/evidence-irregular-watch
          git diff --cached --quiet || git commit -m "Record CUBE-REV 0.10.5-R1.15 irregular Roux watch ${GITHUB_RUN_ID}"
          git pull --rebase origin cube-rev-0.10.5-r1.15-manuscript-bridge
          git push origin HEAD:cube-rev-0.10.5-r1.15-manuscript-bridge
      - name: Enforce watch integrity
        if: always()
        run: |
          test '${{ steps.watchrun.outputs.exit_code }}' = '0'
          python3 - <<'PY'
          import json
          x=json.load(open('research/0.10.5-r1.15/evidence-irregular-watch/IRREGULAR_ROUX_WATCH.json'))
          assert x['watch_mode']=='IRREGULAR_RESEARCH_TURN_NOT_AUTOMATION'
          assert x['ordering']['g4_reference_definitions_mutated'] is False
          assert x['ordering']['authority_scoring_performed'] is False
          print('CR0105R115_IRREGULAR_WATCH_COMPLETE',x['status'],x['roux_accumulation']['progress'])
          PY
