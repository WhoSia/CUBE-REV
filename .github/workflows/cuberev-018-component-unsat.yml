name: CUBE-REV 0.18 Exact M-star Component DRUP Certificates

on:
  push:
    branches: [research/current]
    paths:
      - 'scripts/cuberev-018/certify-physical-cover-components.py'
      - 'scripts/cuberev-018/prove-physical-component-minima.py'
      - '.github/workflows/cuberev-018-component-unsat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-component-minima:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate real Rubik sticker-derived 18-action source incidence
        run: |
          mkdir -p /tmp/cuberev018-components
          node scripts/cuberev-018/export-mstar-physical.mjs /tmp/cuberev018-components/physical.json
      - name: Certify exact all-k 1192-to-398 source row quotient
        run: |
          python scripts/cuberev-018/reduce-by-source-implication.py \
            --physical /tmp/cuberev018-components/physical.json \
            --output /tmp/cuberev018-components/rows.json
      - name: Certify exact all-k 1323-to-168 real-cube experiment dominance
        run: |
          python scripts/cuberev-018/reduce-by-physical-double-quotient.py \
            --physical /tmp/cuberev018-components/physical.json \
            --row-core /tmp/cuberev018-components/rows.json \
            --output /tmp/cuberev018-components/columns.json
      - name: Certify bipartite graph splits into 334x80 and 64x88 Cube blocks
        run: |
          python scripts/cuberev-018/certify-physical-cover-components.py \
            --physical /tmp/cuberev018-components/physical.json \
            --rows /tmp/cuberev018-components/rows.json \
            --columns /tmp/cuberev018-components/columns.json \
            --output /tmp/cuberev018-components/components.json
      - name: Install pinned proof-producing SAT engine
        run: |
          python -m pip install --disable-pip-version-check 'python-sat==1.9.dev15'
          python -m pip show python-sat
      - name: Compute separate original Rubik component SAT and DRUP proofs
        run: |
          python scripts/cuberev-018/prove-physical-component-minima.py \
            --physical /tmp/cuberev018-components/physical.json \
            --rows /tmp/cuberev018-components/rows.json \
            --columns /tmp/cuberev018-components/columns.json \
            --components /tmp/cuberev018-components/components.json \
            --output /tmp/cuberev018-components/proofs \
            --conflicts 3000000
      - name: Independently check each component UNSAT proof against its precise CNF
        run: |
          git clone --quiet https://github.com/marijnheule/drat-trim.git /tmp/cuberev018-components/drat-trim
          git -C /tmp/cuberev018-components/drat-trim checkout --quiet 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          make -C /tmp/cuberev018-components/drat-trim
          for spec in 5:26 4:6; do
            slot="${spec%%:*}"
            k="${spec##*:}"
            file="/tmp/cuberev018-components/proofs/cube_${slot}slot_k${k}"
            if test -f "${file}.drup"; then
              /tmp/cuberev018-components/drat-trim/drat-trim \
                "${file}.cnf" "${file}.drup" | tee "${file}.independent_check.log"
            else
              echo "CUBE_COMPONENT_${slot}_K${k}_NO_UNSAT_PROOF_SAT_OR_UNKNOWN"
            fi
          done
      - name: Promote exact theorem ONLY if both verified proofs and physical upper are present
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('/tmp/cuberev018-components/proofs')
          names=['cube_5slot_k26','cube_4slot_k6']
          accepted=[]
          for stem in names:
              r=json.loads((base/f'{stem}.receipt.json').read_text())
              log=base/f'{stem}.independent_check.log'
              if r['state']!='UNSAT_EXTERNAL_DRUP_CHECK_PENDING' or not log.exists():
                  print('EXACT_MSTAR_STILL_PENDING',stem,r['state'])
                  continue
              if 's VERIFIED' not in log.read_text():
                  raise AssertionError(f'DRUP_CHECK_FAILED_{stem}')
              r['state']='CUBE_COMPONENT_UNSAT_INDEPENDENT_DRUP_PASS'
              r['independent_proof_checked']=True
              (base/f'{stem}.receipt.json').write_text(json.dumps(r,indent=2)+'\n')
              accepted.append(stem)
              print('CUBE_COMPONENT_UNSAT_INDEPENDENT_DRUP_PASS',stem)
          if len(accepted)==2:
              cert={
                'result':'CUBE_REV_018_EXACT_PHYSICAL_MSTAR_34',
                'proof_source':'Two externally checked UNSAT component CNFs plus all-k original Cube double quotient',
                'unrestricted_original_source_count':1192,
                'original_physical_maximal_word_count':1323,
                'equivalent_components':[[334,80],[64,88]],
                'component_lower_bounds':[27,7],
                'physically_replayed_34_upper_run':'https://github.com/WhoSia/CUBE-REV/actions/runs/37948949764',
                'still_unproved':'Lean kernel verification of all physical sticker transitions and academic novelty'
              }
              (base/'EXACT_MSTAR_34_THEOREM_RECEIPT.json').write_text(
                  json.dumps(cert,indent=2)+'\n')
              print('CUBE_REV_018_EXACT_PHYSICAL_MSTAR34_PROOF_CHECKED_PASS')
          else:
              print('CUBE_REV_018_MSTAR_EXACT_STILL_OPEN; verified components',accepted)
          PY
      - name: Retain physical source, both equivalence witnesses, component CNFs and proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cube-rev-018-mstar34-component-proof-package
          path: /tmp/cuberev018-components/
          retention-days: 30
          if-no-files-found: warn
