name: G7-P9-R1 TS overlap-degree Attribution Audit

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p9/overlap-degree-preseal.json'
      - 'scripts/g7-p9/audit-ts-overlap-degree.py'
      - '.github/workflows/g7-p9-r1-overlap-degree.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate preseal
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('g7/p9/overlap-degree-preseal.json'))
          assert x['status']=='FROZEN_AFTER_P9_BEFORE_R1_OUTCOME'
          assert x['new_body_requests']==0
          print('G7_P9_R1_PRESEAL_PASS')
          PY
      - name: Recover frozen geometry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/p9r1/p7
          curl --fail --location --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/actions/artifacts/11238382539/zip"             -o /tmp/p9r1/p7.zip
          echo 'b6e30ab56548e27905dd3b3718c5a3e56d772bff10a744e92180d189a3259a11  /tmp/p9r1/p7.zip' | sha256sum -c -
          unzip -q /tmp/p9r1/p7.zip -d /tmp/p9r1/p7
      - name: Execute overlap-degree audit
        run: |
          FEAT="$(find /tmp/p9r1/p7 -name five-rival-features.tsv -print -quit)"
          mkdir -p /tmp/p9r1/out
          python3 scripts/g7-p9/audit-ts-overlap-degree.py --features "$FEAT" --out /tmp/p9r1/out --permutations 100000 | tee /tmp/p9r1/audit.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/p9r1/out/ts-overlap-degree-attribution.json'))
          assert x['states']==2725 and x['solves']==60
          assert x['pairwise_symmetric_difference_identity_max_abs_error']<1e-12
          print('G7_P9_R1_RESULT_GATE_PASS',x['verdict'])
          PY
      - name: Seal
        run: |
          mkdir -p /tmp/p9r1/seal/authority /tmp/p9r1/seal/derived
          cp g7/p9/overlap-degree-preseal.json /tmp/p9r1/seal/authority/
          cp /tmp/p9r1/out/ts-overlap-degree-attribution.json /tmp/p9r1/seal/derived/
          cp /tmp/p9r1/audit.log /tmp/p9r1/seal/derived/execution.log
          printf '%s\n' 'PHASE=G7-P9-R1' 'OPERATION=TS_OVERLAP_DEGREE_ATTRIBUTION_AUDIT' 'NEW_SOURCE_CONTACT=NONE' > /tmp/p9r1/seal/AUTHORITY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: G7-P9-R1-overlap-degree-${{ github.sha }}
          path: /tmp/p9r1/seal
          retention-days: 90
