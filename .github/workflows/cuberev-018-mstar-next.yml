name: CUBE-REV 0.18 M-star 30-34 exact bound and witness court

on:
  push:
    branches: [research/current]
    paths:
      - 'scripts/cuberev-018/solve-mstar-unrestricted.py'
      - 'scripts/cuberev-018/verify-sat-witness-physical.mjs'
      - 'scripts/cuberev-018/export-mstar-physical.mjs'
      - '.github/workflows/cuberev-018-mstar-next.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-higher-k:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate real Rubik physical original source incidence
        run: |
          mkdir -p /tmp/cuberev018-next
          node scripts/cuberev-018/export-mstar-physical.mjs /tmp/cuberev018-next/physical.json
      - name: Install reproducible exact SAT version
        run: python -m pip install --disable-pip-version-check 'python-sat==1.9.dev15'
      - name: Investigate unrestricted original Mstar candidates 30..34
        run: |
          for k in 30 31 32 33 34; do
            if [ "$k" -eq 30 ]; then budget=600000; else budget=300000; fi
            echo "MSTAR_UNRESTRICTED_1192_K=$k CONFLICT_BUDGET=$budget"
            python scripts/cuberev-018/solve-mstar-unrestricted.py \
              --instance /tmp/cuberev018-next/physical.json \
              --target full --k "$k" --conflicts "$budget" \
              --out "/tmp/cuberev018-next/full$k"
          done
      - name: Audit every SAT outcome by fresh independent physical replay
        run: |
          for k in 30 31 32 33 34; do
            node scripts/cuberev-018/verify-sat-witness-physical.mjs \
              "/tmp/cuberev018-next/full$k/sat_witness.json"
          done
      - name: Check all UNSAT proofs with independently pinned DRAT checker
        run: |
          git clone --quiet https://github.com/marijnheule/drat-trim.git /tmp/cuberev018-next/drat-trim
          git -C /tmp/cuberev018-next/drat-trim checkout --quiet 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          make -C /tmp/cuberev018-next/drat-trim
          for k in 30 31 32 33 34; do
            if test -f "/tmp/cuberev018-next/full$k/original_cover.drup"; then
              /tmp/cuberev018-next/drat-trim/drat-trim \
                "/tmp/cuberev018-next/full$k/original_cover.cnf" \
                "/tmp/cuberev018-next/full$k/original_cover.drup" \
                | tee "/tmp/cuberev018-next/full$k/checker.log"
              python - "$k" <<'PY'
          import json,sys
          from pathlib import Path
          k=int(sys.argv[1]);p=Path(f'/tmp/cuberev018-next/full{k}')
          assert 'VERIFIED' in (p/'checker.log').read_text()
          doc=json.loads((p/'receipt.json').read_text())
          assert doc['state']=='UNSAT_PROOF_PENDING_EXTERNAL_CHECK'
          doc['state']='UNSAT_DRUP_VERIFIED_ON_UNRESTRICTED_ORIGINAL_CNF'
          doc['independent_certificate']=True
          doc['drat_trim_pin']='2e3b2dc0ecf938addbd779d42877b6ed69d9a985'
          (p/'receipt.json').write_text(json.dumps(doc,indent=2)+'\n')
          print('MSTAR_HIGHER_K_INDEPENDENT_UNSAT_CERTIFICATE_PASS',k)
          PY
            else
              echo "MSTAR_HIGHER_K_NO_UNSAT_CERTIFICATE=$k (SAT or UNKNOWN)"
            fi
          done
      - name: Retain exact instance, CNFs, checked proofs and witness records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cube-rev-018-higher-mstar-certificate-suite
          path: /tmp/cuberev018-next/
          retention-days: 30
          if-no-files-found: warn
