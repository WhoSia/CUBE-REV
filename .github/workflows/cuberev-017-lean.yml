name: CUBE-REV 0.17 Lean kernel source checks
on:
  push:
    branches: [research/current]
    paths:
      - 'formal/017/**'
      - '.github/workflows/cuberev-017-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/017
          build: true
          test: false
          use-mathlib-cache: false
