name: G7-P14 confirm80 reco batch 6

on:
  push:
    branches: ['research/current']
    paths:
      - '.github/workflows/g7-p14-confirm80-batch6.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  batch6:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}

      - name: Recover sealed P14 confirm80 selection
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p14-selection
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/artifacts/11301826265/zip" \
            -o /tmp/p14-selection.zip
          echo 'aef35848ce24010b22ffcda96739b2503bed808e0196687ddf4988cf43f05440  /tmp/p14-selection.zip' | sha256sum -c -
          unzip -q /tmp/p14-selection.zip -d /tmp/p14-selection
          MANIFEST="$(find /tmp/p14-selection -name selection-manifest-repaired.json -print -quit)"
          test -n "$MANIFEST"
          node - "$MANIFEST" <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(x.status!=='SEALED_AFTER_PRE_GEOMETRY_REPLAY_INVALID_REPLACEMENT') process.exit(1);
          if(x.selection_manifest_sha256!=='3f81ebb8342c943388bf97b91011297afffa0bf4fad31647b7aeec619d9c5a47') process.exit(2);
          if(x.batches['6'].length!==10) process.exit(3);
          if(x.prior_body_contacted_excluded!==183) process.exit(4);
          console.log('G7_P14_BATCH6_SELECTION_AUTHORITY_PASS');
          console.log('IDS\t'+x.batches['6'].join(','));
          NODE

      - name: Dry-run bounded acquisition authority
        run: |
          set -euo pipefail
          MANIFEST="$(find /tmp/p14-selection -name selection-manifest-repaired.json -print -quit)"
          node scripts/g7-p14/acquire-confirm80-reco-batch.mjs \
            --manifest "$MANIFEST" --batch 6 --out /tmp/unused

      - name: Acquire frozen confirm80 batch 6
        run: |
          set -euo pipefail
          MANIFEST="$(find /tmp/p14-selection -name selection-manifest-repaired.json -print -quit)"
          rm -rf /tmp/g7-p14-batch06
          node scripts/g7-p14/acquire-confirm80-reco-batch.mjs \
            --manifest "$MANIFEST" --batch 6 \
            --out /tmp/g7-p14-batch06 --execute | tee /tmp/g7-p14-batch06-execution.log

      - name: Exact trajectory replay
        run: |
          set -uo pipefail
          set +e
          node scripts/cube/replay-exact-trajectories.mjs \
            --input /tmp/g7-p14-batch06/derived/solves.jsonl \
            --out /tmp/g7-p14-batch06/exact
          rc=$?
          set -e
          if [ -f /tmp/g7-p14-batch06/exact/exact-trajectories.json ]; then
            node - <<'NODE'
          const x=require('/tmp/g7-p14-batch06/exact/exact-trajectories.json');
          const bad=x.records.filter(r=>!r.final_solved_up_to_rotation||!r.final_canonical_solved).map(r=>r.source_id);
          console.log('END_VALIDATION_PASS\t'+x.exact_end_validation_pass);
          console.log('REPLAY_INVALID_IDS\t'+bad.join(','));
          if(x.solve_count===10 && x.exact_end_validation_pass===10){
            console.log('G7_P14_BATCH6_EXACT_PASS');
            console.log('PREFIXES\t'+x.total_prefixes);
          }
          NODE
          fi
          exit $rc

      - name: Seal batch
        run: |
          set -euo pipefail
          cp /tmp/g7-p14-batch06-execution.log /tmp/g7-p14-batch06/
          printf '%s\n' \
            'PHASE=G7-P14' \
            'BATCH=6' \
            'SOLVES=10' \
            'SELECTION_MANIFEST_SHA256=3f81ebb8342c943388bf97b91011297afffa0bf4fad31647b7aeec619d9c5a47' \
            'PRIOR_BODY_CONTACTED_EXCLUDED=183' \
            'BULK_MIRROR=HOLD' \
            'RAW_PUBLIC_RELEASE=HOLD' \
            > /tmp/g7-p14-batch06/AUTHORITY.txt
          (cd /tmp/g7-p14-batch06 && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P14-confirm80-batch6-${{ github.sha }}
          path: /tmp/g7-p14-batch06
          retention-days: 90
