name: Validate G7-P4 confirmatory population cohort

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p4/**'
      - 'scripts/g7-p4/**'
      - '.github/workflows/g7-p4-confirmatory.yml'
  pull_request:
    paths:
      - 'g7/p4/**'
      - 'scripts/g7-p4/**'
      - '.github/workflows/g7-p4-confirmatory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirmatory-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Authority tests
        run: |
          set -euo pipefail
          node scripts/g7-p4/test-confirmatory-acquisition.mjs
          node scripts/g7-p4/test-facelet-kernel.mjs
          node scripts/g7-p4/test-exact-trajectories.mjs
      - name: Execute frozen confirmatory contact
        run: |
          set -euo pipefail
          rm -rf /tmp/g7-p4-confirmatory
          node scripts/g7-p4/acquire-confirmatory.mjs --execute --out /tmp/g7-p4-confirmatory | tee /tmp/g7-p4-confirmatory.log
          test "$(find /tmp/g7-p4-confirmatory/raw/solve -type f -name '*.html' | wc -l)" -eq 10
          grep -q $'SOLVE_BODY_REQUESTS\t10' /tmp/g7-p4-confirmatory.log
          grep -q $'BULK_MIRROR\tHOLD' /tmp/g7-p4-confirmatory.log
      - name: Materialize confirmatory trajectory evidence
        run: |
          set -euo pipefail
          node scripts/g7-p4/analyze-pilot-trajectory.mjs             --input /tmp/g7-p4-confirmatory/derived/solves.jsonl             --out /tmp/g7-p4-confirmatory/derived/p4
          node scripts/g7-p4/materialize-exact-trajectories.mjs             --input /tmp/g7-p4-confirmatory/derived/solves.jsonl             --out /tmp/g7-p4-confirmatory/derived/exact
          (cd /tmp/g7-p4-confirmatory && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: G7-P4-confirmatory-${{ github.sha }}
          path: /tmp/g7-p4-confirmatory
          if-no-files-found: error
          retention-days: 90
