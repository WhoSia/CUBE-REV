name: Acquire G7-P7 reco.nz bounded batch 2

on:
  push:
    branches: ['research/current']
    paths:
      - '.github/workflows/g7-p7-reco-next.yml'
  workflow_dispatch:

permissions:
  contents: read

# trigger: batch2-authoritative-run

jobs:
  bounded-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dry-run authority check
        run: node scripts/g7-p7/test-acquire-reco-batch.mjs
      - name: Acquire frozen batch 2
        run: |
          set -euo pipefail
          rm -rf /tmp/g7-p7-batch02
          node scripts/g7-p7/acquire-reco-batch.mjs --batch 2 --out /tmp/g7-p7-batch02 --execute
      - name: Exact trajectory replay
        run: |
          set -euo pipefail
          node scripts/cube/replay-exact-trajectories.mjs --input /tmp/g7-p7-batch02/derived/solves.jsonl --out /tmp/g7-p7-batch02/exact
          node - <<'NODE'
          const x=require('/tmp/g7-p7-batch02/exact/exact-trajectories.json');
          if(x.solve_count!==10) process.exit(1);
          if(x.exact_end_validation_pass!==10) process.exit(2);
          console.log('G7_P7_RECO_BATCH2_EXACT_PASS');
          console.log('PREFIXES\t'+x.total_prefixes);
          NODE
      - name: Seal batch artifact
        run: |
          set -euo pipefail
          printf '%s\n' 'BATCH=2' 'SOLVES=10' 'BULK_MIRROR=HOLD' 'RAW_PUBLIC_RELEASE=HOLD' > /tmp/g7-p7-batch02/AUTHORITY.txt
          (cd /tmp/g7-p7-batch02 && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: G7-P7-reco-batch2-${{ github.sha }}
          path: /tmp/g7-p7-batch02
          if-no-files-found: error
          retention-days: 90
