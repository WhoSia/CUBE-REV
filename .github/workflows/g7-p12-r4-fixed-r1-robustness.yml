name: G7-P12-R4 fixed-R1 robustness stress

on:
  push:
    branches: ['research/current']
    paths:
      - '.github/workflows/g7-p12-r4-fixed-r1-robustness.yml'
      - 'scripts/g7-p12/stress-fixed-r1-robustness.py'
      - 'g7/p12/r4-constitution.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Validate R4 preseal
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open('g7/p12/r4-constitution.json'))
          r=json.load(open('g7/p12/r3-closure.json'))
          assert p['status']=='FROZEN_AFTER_R3_BEFORE_R4_VARIANT_OUTCOMES'
          assert p['parent']['selected_candidate_locked'] is True
          assert p['fixed_geometry']['no_candidate_reselection'] is True
          assert r['status']=='CLOSED'
          print('G7_P12_R4_PRESEAL_PASS')
          PY

      - name: Recover immutable legacy60 and fresh40
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r4/legacy /tmp/r4/fresh
          fetch_artifact () {
            id="$1"; dir="$2"; expected="$3"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/artifacts/$id/zip" \
              -o "/tmp/r4/$dir.zip"
            echo "$expected  /tmp/r4/$dir.zip" | sha256sum -c -
            mkdir -p "/tmp/r4/$dir"
            unzip -q "/tmp/r4/$dir.zip" -d "/tmp/r4/$dir"
          }
          fetch_artifact 11238382539 legacy b6e30ab56548e27905dd3b3718c5a3e56d772bff10a744e92180d189a3259a11
          fetch_artifact 11242854238 fresh/b1 0bc3c845d0caadcd84a6df4ce8db4a65fae083d6ef01e076f5ce95755676c6ea
          fetch_artifact 11243410683 fresh/b2 c4589ff7955ea3fe7fe1d452f8a137e4f2c799e60cad27e863fa91bfcc7f975e
          fetch_artifact 11243041519 fresh/b3 82ce3af8a36c0eb3bf8f6192a72db1adb17f2046cf8ef2f602b4d583887ffe38
          fetch_artifact 11243391026 fresh/b4 8575409309eadab60cf5d2145925108c8139a62e75a7f2060785c4de75a3028a
          echo 'G7_P12_R4_INPUT_AUTHORITY_PASS'

      - name: Reconstitute legacy geometry
        run: |
          set -euo pipefail
          LEX="$(find /tmp/r4/legacy -name exact-trajectories.json -print -quit)"
          LMETA="$(find /tmp/r4/legacy -name solve-metadata.jsonl -print -quit)"
          mkdir -p /tmp/r4/build/legacy
          node scripts/g7-p7/prefix-context.mjs "$LEX" "$LMETA" \
            /tmp/r4/build/legacy/prefix-states.tsv /tmp/r4/build/legacy/context.jsonl
          cargo run -q -p search-geometry-core --bin g7_p7_reco_rivals \
            < /tmp/r4/build/legacy/prefix-states.tsv > /tmp/r4/build/legacy/features.tsv
          cargo run -q -p search-geometry-core --bin g7_p12_shell_flow \
            < /tmp/r4/build/legacy/prefix-states.tsv > /tmp/r4/build/legacy/shell.tsv

      - name: Reconstitute fresh geometry
        run: |
          set -euo pipefail
          mkdir -p /tmp/r4/build/fresh/corpus
          node scripts/g7-p11/merge-fresh-corpus.mjs \
            --source P11_BATCH1=/tmp/r4/fresh/b1 \
            --source P11_BATCH2=/tmp/r4/fresh/b2 \
            --source P11_BATCH3=/tmp/r4/fresh/b3 \
            --source P11_BATCH4=/tmp/r4/fresh/b4 \
            --out /tmp/r4/build/fresh/corpus
          node scripts/cube/replay-exact-trajectories.mjs \
            --input /tmp/r4/build/fresh/corpus/combined-solves.jsonl \
            --out /tmp/r4/build/fresh/exact
          node scripts/g7-p7/prefix-context.mjs \
            /tmp/r4/build/fresh/exact/exact-trajectories.json \
            /tmp/r4/build/fresh/corpus/solve-metadata.jsonl \
            /tmp/r4/build/fresh/prefix-states.tsv /tmp/r4/build/fresh/context.jsonl
          cargo run -q -p search-geometry-core --bin g7_p7_reco_rivals \
            < /tmp/r4/build/fresh/prefix-states.tsv > /tmp/r4/build/fresh/features.tsv
          cargo run -q -p search-geometry-core --bin g7_p12_shell_flow \
            < /tmp/r4/build/fresh/prefix-states.tsv > /tmp/r4/build/fresh/shell.tsv

      - name: Combine ancestry-preserving inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/r4/build/all
          cat /tmp/r4/build/legacy/context.jsonl /tmp/r4/build/fresh/context.jsonl > /tmp/r4/build/all/context.jsonl
          python3 - <<'PY'
          def combine(a,b,out):
              A=open(a,encoding='utf-8').read().splitlines()
              B=open(b,encoding='utf-8').read().splitlines()
              assert A and B and A[0]==B[0]
              open(out,'w',encoding='utf-8').write('\n'.join([A[0],*A[1:],*B[1:]])+'\n')
          combine('/tmp/r4/build/legacy/features.tsv','/tmp/r4/build/fresh/features.tsv','/tmp/r4/build/all/features.tsv')
          combine('/tmp/r4/build/legacy/shell.tsv','/tmp/r4/build/fresh/shell.tsv','/tmp/r4/build/all/shell.tsv')
          print('G7_P12_R4_ANCESTRY_COMBINE_PASS')
          PY

      - name: Execute fixed-R1 robustness stress
        run: |
          set -euo pipefail
          mkdir -p /tmp/r4/build/out
          python3 scripts/g7-p12/stress-fixed-r1-robustness.py \
            --features /tmp/r4/build/all/features.tsv \
            --shell /tmp/r4/build/all/shell.tsv \
            --context /tmp/r4/build/all/context.jsonl \
            --out /tmp/r4/build/out \
            --permutations 100000 | tee /tmp/r4/build/run.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/r4/build/out/fixed-r1-robustness-stress.json'))
          assert x['r1_reselected'] is False
          assert x['independent_replication'] is False
          assert x['verdict'] in (
            'R1_ATTENUATION_ROBUST_ACROSS_PRESEALED_PERTURBATIONS',
            'R1_ATTENUATION_FRAGILE_UNDER_PRESEALED_PERTURBATIONS',
            'R1_ATTENUATION_MIXED_ROBUSTNESS')
          print('G7_P12_R4_RESULT_GATE_PASS',x['verdict'])
          print('SUMMARY',x['summary'])
          print('FRESH_VARIANTS',x['variant_results']['FRESH40'])
          print('LEGACY_VARIANTS',x['variant_results']['LEGACY60'])
          PY

      - name: Seal R4 artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/r4/seal/authority /tmp/r4/seal/derived
          cp g7/p12/r4-constitution.json g7/p12/r3-closure.json /tmp/r4/seal/authority/
          cp /tmp/r4/build/out/fixed-r1-robustness-stress.json /tmp/r4/seal/derived/
          cp /tmp/r4/build/run.log /tmp/r4/seal/derived/execution.log
          printf '%s\n' \
            'PHASE=G7-P12-R4' \
            'OPERATION=FIXED_R1_ATTENUATION_ROBUSTNESS_STRESS_TEST' \
            'R1_RESELECTED=NO' \
            'INDEPENDENT_REPLICATION=NO' \
            'NEW_SOURCE_CONTACT=NONE' \
            'HUMAN_CONTACT_GATE=CLOSED' \
            > /tmp/r4/seal/AUTHORITY.txt
          (cd /tmp/r4/seal && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P12-R4-fixed-r1-robustness-${{ github.sha }}
          path: /tmp/r4/seal
          retention-days: 90
