name: CUBE-REV 0.19 Exact R5 Five-Turn M-star Seven Finite Proof

on:
  push:
    branches: [research/current]
    paths:
      - 'scripts/cuberev-019/generate-L5-R5-integer-dual-candidates.py'
      - 'scripts/cuberev-019/verify-L5-R5-k6-integer-duals.py'
      - 'scripts/cuberev-019/verify-L5-R5-k6-high-rank-finite.py'
      - 'scripts/cuberev-019/compile-L5-R5-exact-seven-receipt.py'
      - 'scripts/cuberev-019/prove-L5-five-source-k5-impossibility.py'
      - '.github/workflows/cuberev-019-r5-exact-seven-finite-court.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-finite-physical-r5-minimum-seven:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct frozen original physical source and enumerate all 1889568 legal five-HTM words
        run: |
          mkdir -p /tmp/cuberev019-p12/certificates
          node scripts/cuberev-018/export-mstar-physical.mjs /tmp/cuberev019-p12/physical.json
          node scripts/cuberev-019/export-L5-physical.mjs /tmp/cuberev019-p12/physical.json /tmp/cuberev019-p12/L5_partitions.tsv
          test "$(wc -l < /tmp/cuberev019-p12/L5_partitions.tsv)" -eq 14938
      - name: Independently reconstruct actual 18x24 sticker-derived edge action maps
        run: |
          node --input-type=module > /tmp/cuberev019-p12/maps.txt <<'JS'
          import {urMoveAutomaton} from './scripts/cuberev-015/ur-fiber-tomography.mjs';
          for (const action of urMoveAutomaton()) console.log(action.join(' '));
          JS
          test "$(wc -l < /tmp/cuberev019-p12/maps.txt)" -eq 18
      - name: First prove that five physical words cannot cover all original 480 five-source requirements
        run: |
          python -u scripts/cuberev-019/prove-L5-five-source-k5-impossibility.py \
            --physical /tmp/cuberev019-p12/physical.json \
            --maps /tmp/cuberev019-p12/maps.txt \
            --partitions /tmp/cuberev019-p12/L5_partitions.tsv \
            --dual docs/0.19/P8_ORDER_INVARIANT_L5_FIVE_ONLY_LP_CERT.json \
            --output /tmp/cuberev019-p12/P9_receipt.json | tee /tmp/cuberev019-p12/P9.log
          grep -q 'CUBE_REV_019_L5_480_FIVE_SOURCE_K5_EXACT_FINITE_UNSAT_PASS' /tmp/cuberev019-p12/P9.log
      - name: Install numeric dual-candidate generator (solver output is NOT itself proof)
        run: |
          python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'scipy==1.15.3'
      - name: Regenerate all 445 proposed exact-integer dual certificates from scratch
        run: |
          OPENBLAS_NUM_THREADS=1 python -u scripts/cuberev-019/generate-L5-R5-integer-dual-candidates.py \
            --physical /tmp/cuberev019-p12/physical.json \
            --partitions /tmp/cuberev019-p12/L5_partitions.tsv \
            --output /tmp/cuberev019-p12/certificates \
            | tee /tmp/cuberev019-p12/dual_generation_NOT_THE_PROOF.log
          test -s /tmp/cuberev019-p12/certificates/P12_rank_sensitive_integer_duals.json
          test -s /tmp/cuberev019-p12/certificates/P12_raw_rank6_70_integer_duals.json
          test -s /tmp/cuberev019-p12/certificates/P12_rank7_pair_triple_integer_duals.json
      - name: Independent no-SAT no-LP plain-integer validation of ALL 445 dual courts
        run: |
          python -u scripts/cuberev-019/verify-L5-R5-k6-integer-duals.py \
            --physical /tmp/cuberev019-p12/physical.json \
            --maps /tmp/cuberev019-p12/maps.txt \
            --partitions /tmp/cuberev019-p12/L5_partitions.tsv \
            --duals_first /tmp/cuberev019-p12/certificates/P12_rank_sensitive_integer_duals.json \
            --duals_rank6 /tmp/cuberev019-p12/certificates/P12_raw_rank6_70_integer_duals.json \
            --duals_rank7 /tmp/cuberev019-p12/certificates/P12_rank7_pair_triple_integer_duals.json \
            --output /tmp/cuberev019-p12/P12_DUALS_ONLY_RECEIPT.json \
            | tee /tmp/cuberev019-p12/P12_exact_integer_dual_verification.log
          grep -q 'CUBE_REV_019_P12_ALL_445_INTEGER_DUAL_ORBIT_COURTS_PASS' /tmp/cuberev019-p12/P12_exact_integer_dual_verification.log
      - name: Independent raw-physical finite exhaustion for 4 5 or 6 rank-seven words and exact seven-word positive witness
        run: |
          python -u scripts/cuberev-019/verify-L5-R5-k6-high-rank-finite.py \
            --physical /tmp/cuberev019-p12/physical.json \
            --maps /tmp/cuberev019-p12/maps.txt \
            --partitions /tmp/cuberev019-p12/L5_partitions.tsv \
            --duals_first /tmp/cuberev019-p12/certificates/P12_rank_sensitive_integer_duals.json \
            --duals_rank6 /tmp/cuberev019-p12/certificates/P12_raw_rank6_70_integer_duals.json \
            --duals_rank7 /tmp/cuberev019-p12/certificates/P12_rank7_pair_triple_integer_duals.json \
            --output /tmp/cuberev019-p12/P12_HIGH_CASES_RECEIPT.json \
            | tee /tmp/cuberev019-p12/P12_exhaustive_high_rank.log
          grep -q 'CUBE_REV_019_P12_RANK7_FOUR_FIVE_SIX_EXHAUSTIVE_AND_7WORD_WITNESS_PASS' /tmp/cuberev019-p12/P12_exhaustive_high_rank.log
      - name: Promote EXACT R5 seven ONLY after all three independent physical verification receipts
        run: |
          python -u scripts/cuberev-019/compile-L5-R5-exact-seven-receipt.py \
            --physical /tmp/cuberev019-p12/physical.json \
            --p9 /tmp/cuberev019-p12/P9_receipt.json \
            --duals /tmp/cuberev019-p12/P12_DUALS_ONLY_RECEIPT.json \
            --rank7 /tmp/cuberev019-p12/P12_HIGH_CASES_RECEIPT.json \
            --output /tmp/cuberev019-p12/EXACT_R5_MSTAR5_SEVEN_THEOREM_RECEIPT.json \
            | tee /tmp/cuberev019-p12/P12_exact_theorem.log
          grep -q 'CUBE_REV_019_R5_PHYSICAL_EXACT_SEVEN_INDEPENDENT_FINITE_COURTS_PASS' /tmp/cuberev019-p12/P12_exact_theorem.log
          sha256sum /tmp/cuberev019-p12/physical.json \
            /tmp/cuberev019-p12/L5_partitions.tsv \
            /tmp/cuberev019-p12/EXACT_R5_MSTAR5_SEVEN_THEOREM_RECEIPT.json \
            > /tmp/cuberev019-p12/SHA256_RECEIPT.txt
      - name: Retain full independently checked source data and finite proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cube-rev-019-p12-exact-five-source-seven-original-physical-proof
          path: /tmp/cuberev019-p12/
          retention-days: 90
          if-no-files-found: warn
