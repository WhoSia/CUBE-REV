name: CUBE-REV R14-P5.4 mixed prefix stabilizer orbits

on:
  push:
    branches:
      - research/current
    paths:
      - 'scripts/cuberev-observation/audit_r14_p54_mixed_prefix_stabilizer_orbits.py'
      - 'scripts/cuberev-observation/audit_r14_p51_p48_group_lift.py'
      - 'docs/0.28/20261106_R14_P54_MIXED_PREFIX_STABILIZER_ORBITS.md'
      - '.github/workflows/cuberev-r14-p54-mixed-prefix-stabilizer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-mixed-prefix-orbits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: P48 all 77 profile orbits and joint parity boundary
        run: |
          python scripts/cuberev-observation/audit_r14_p54_mixed_prefix_stabilizer_orbits.py > /tmp/cuberev-r14-p54.json
          python -c 'import json;d=json.load(open("/tmp/cuberev-r14-p54.json"));assert d["result"]=="R14_P54_TWO_CUBIE_PREFIX_STABILIZER_35_ORBITS_PASS" and d["checked_distinct_mixed_prefix_profiles"]==77 and d["query_orbits"]==35 and d["boundary_exception_10_6_orbit_count"]==400 and d["orbit_histogram"]=={"1":24,"18":4,"20":6,"360":1};assert all(d["tested_profile_orbit_counts"][str(k)+","+str(l)]["orbits"] == (2*k+1)*(3*l+1)+int((k,l)==(10,6)) for k in range(11) for l in range(7));print("R14_P54_77_PROFILES_AND_BOUNDARY_PASS")'
      - name: Archive read-only result
        uses: actions/upload-artifact@v4
        with:
          name: cuberev-r14-p54-stabilizer-receipt
          path: /tmp/cuberev-r14-p54.json
          retention-days: 30
