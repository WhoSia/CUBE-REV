name: CR0105R13 Stability Recheck
on:
  push:
    branches: [cube-rev-0.10.5-r1.3-deployment-authority]
    paths: ['cr0105r13/RUN_STABILITY']
permissions:
  contents: write
jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Recheck stable public identity from fresh requests
        shell: bash
        env:
          DEPLOY_COMMIT: 19f7b83aceba3a3d0cec94a3c10b1b80af85fafd
          CAND_BYTES: '2591526'
          CAND_SHA256: 98e6431c72c7b32fd9461b261c981b470bdda04c617bdb0595b7ce059a250180
          CAND_BLOB: ce5b5608767083a696cf57982edd979a21b3ba22
          RESEARCH_BRANCH: cube-rev-0.10.5-r1.3-deployment-authority
        run: |
          set -euo pipefail
          ART=cr0105r13-stability-artifact
          EVID=research/0.10.5-r1.3/stability
          mkdir -p "$ART" "$EVID"
          main_sha=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          test "$main_sha" = "$DEPLOY_COMMIT"
          git fetch origin main --quiet
          test "$(git rev-parse "$main_sha:index.html")" = "$CAND_BLOB"
          : > "$ART/FRESH_FETCHES.jsonl"
          for i in 1 2 3; do
            u="https://whosia.github.io/CUBE-REV/?cr0105r13-stability=${GITHUB_RUN_ID}-${i}-$(date +%s%N)"
            code=$(curl -sS -L -H 'Cache-Control: no-cache, no-store' -o "$ART/public.html" -w '%{http_code}' "$u")
            bytes=$(wc -c < "$ART/public.html")
            sha=$(sha256sum "$ART/public.html" | cut -d' ' -f1)
            test "$code" = 200
            test "$bytes" = "$CAND_BYTES"
            test "$sha" = "$CAND_SHA256"
            I="$i" CODE="$code" BYTES="$bytes" SHA="$sha" URL="$u" python - <<'PY' >> "$ART/FRESH_FETCHES.jsonl"
          import json,os
          print(json.dumps({'attempt':int(os.environ['I']),'http_status':int(os.environ['CODE']),'bytes':int(os.environ['BYTES']),'sha256':os.environ['SHA'],'url':os.environ['URL']}))
          PY
            sleep 5
          done
          final_url=$(python - <<'PY'
          import json
          x=[json.loads(s) for s in open('cr0105r13-stability-artifact/FRESH_FETCHES.jsonl') if s.strip()]
          print(x[-1]['url'])
          PY
          )
          CR0105R13_ARTIFACT_DIR="$ART" CR0105R13_PUBLIC_URL="$final_url" python tests/cr0105r13_public_host_court.py
          MAIN_SHA="$main_sha" python - <<'PY'
          import json,os
          from pathlib import Path
          f=[json.loads(s) for s in Path('cr0105r13-stability-artifact/FRESH_FETCHES.jsonl').read_text().splitlines() if s.strip()]
          b=json.loads(Path('cr0105r13-stability-artifact/PUBLIC_HOST_BROWSER_COURT.json').read_text())
          checks={'main_still_deployment_commit':os.environ['MAIN_SHA']=='19f7b83aceba3a3d0cec94a3c10b1b80af85fafd','three_fresh_fetches_exact':len(f)==3 and all(x['http_status']==200 and x['bytes']==2591526 and x['sha256']=='98e6431c72c7b32fd9461b261c981b470bdda04c617bdb0595b7ce059a250180' for x in f),'fresh_browser_pass':b.get('status')=='PASS'}
          out={'schema_version':'CR0105R13-STABILITY-RECHECK-1','status':'PASS' if all(checks.values()) else 'HOLD','deployment_commit':os.environ['MAIN_SHA'],'fresh_fetches':f,'browser_checks':b.get('checks'),'checks':checks,'gate':'POSTDEPLOY_STABILITY_RECONFIRMED' if all(checks.values()) else 'STABILITY_HOLD'}
          Path('research/0.10.5-r1.3/stability/STABILITY_RECHECK.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          Path('cr0105r13-stability-artifact/STABILITY_RECHECK.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          PY
          cp "$ART/PUBLIC_HOST_BROWSER_COURT.json" "$EVID/PUBLIC_HOST_BROWSER_COURT.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$EVID"
          git commit -m "Reconfirm CUBE-REV 0.10.5-R1.3 public stability ${GITHUB_RUN_ID}"
          git push origin HEAD:${RESEARCH_BRANCH}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CR0105R13-stability-recheck
          path: cr0105r13-stability-artifact
          if-no-files-found: error
          retention-days: 30
