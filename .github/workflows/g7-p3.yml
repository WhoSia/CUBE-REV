name: Validate G7-P3 reconstruction population geometry

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p3/**'
      - 'scripts/g7-p3/**'
      - '.github/workflows/g7-p3.yml'
  pull_request:
    paths:
      - 'g7/p3/**'
      - 'scripts/g7-p3/**'
      - '.github/workflows/g7-p3.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  g7-p3-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frozen JSON authorities
        run: |
          node -e "for (const p of ['g7/p3/preseal.json','g7/p3/method-ontology.json','g7/p3/p2-anchor.json','g7/p3/sampling-linkage.json','g7/p3/cross-source-transport.json']) JSON.parse(require('fs').readFileSync(p,'utf8')); console.log('G7_P3_JSON_AUTHORITY_PASS')"
      - name: Population geometry regression
        run: node scripts/g7-p3/test-population-geometry.mjs
      - name: Sampling/linkage regression
        run: node scripts/g7-p3/test-sampling-linkage.mjs
      - name: Closure regression
        run: node scripts/g7-p3/test-closure.mjs

  g7-p3-final-materialization:
    needs: g7-p3-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover exact frozen G7-P2 census artifact
        uses: actions/download-artifact@v4
        with:
          name: G7-P2-reco-index-census-893b47bccd766fed5138e32ce714f9808badc708
          path: /tmp/g7-p2-census
          github-token: ${{ github.token }}
          repository: WhoSia/CUBE-REV
          run-id: 36816629497
      - name: Verify frozen artifact contents
        run: |
          set -euo pipefail
          cd /tmp/g7-p2-census
          sha256sum -c SHA256SUMS.txt
          test "$(sha256sum derived/index-rows.jsonl | cut -d' ' -f1)" = "d6fef3fdb1f47c5ae4744f4624c64d7782563490344ba8ced9b22c819357987c"
          test -s derived/census.json
          echo G7_P3_P2_EXACT_BYTES_PASS
      - name: Materialize population geometry
        run: |
          set -euo pipefail
          rm -rf /tmp/g7-p3
          node scripts/g7-p3/analyze-population.mjs \
            --input /tmp/g7-p2-census/derived/index-rows.jsonl \
            --preseal g7/p3/preseal.json \
            --ontology g7/p3/method-ontology.json \
            --out /tmp/g7-p3
          node scripts/g7-p3/validate-materialization.mjs \
            --report /tmp/g7-p3/population-geometry.json \
            --anchor g7/p3/p2-anchor.json
      - name: Materialize sampling and linkage support
        run: |
          set -euo pipefail
          node scripts/g7-p3/materialize-sampling-linkage.mjs \
            --input /tmp/g7-p2-census/derived/index-rows.jsonl \
            --preseal g7/p3/preseal.json \
            --ontology g7/p3/method-ontology.json \
            --config g7/p3/sampling-linkage.json \
            --out /tmp/g7-p3
          node -e "const x=require('/tmp/g7-p3/sampling-manifest.json'); if(x.eligible_population.n!==10591||x.population_estimation.selected.length!==64||x.coverage_analysis.selected.length!==96||x.linkage_support.counts.A_EXACT!==0) process.exit(1); console.log('G7_P3_SAMPLING_MATERIALIZATION_PASS')"
      - name: Final corpus constitution court
        run: |
          set -euo pipefail
          node scripts/g7-p3/evaluate-closure.mjs \
            --geometry /tmp/g7-p3/population-geometry.json \
            --sampling /tmp/g7-p3/sampling-manifest.json \
            --transport g7/p3/cross-source-transport.json \
            --preseal g7/p3/preseal.json \
            --out /tmp/g7-p3
          node -e "const x=require('/tmp/g7-p3/G7-P3-CLOSURE.json'); if(x.verdict!=='PASS_CONDITIONAL_CORPUS_WITH_EXPLICIT_SUPPORT_BOUNDARY'||!x.next_generation_permission) process.exit(1); console.log('G7_P3_FINAL_VERDICT_PASS')"
          (cd /tmp/g7-p3 && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: G7-P3-final-${{ github.sha }}
          path: /tmp/g7-p3
          if-no-files-found: error
          retention-days: 90
