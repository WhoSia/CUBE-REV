name: G3 P11 RSTP navigation instrument portability

on:
  push:
    branches: [g3-p11-rstp-navigation]
    paths:
      - 'g3-cog/nav/**'
      - 'g3-cog/generalization/P11-ISOMORPHISM.md'
      - '.github/workflows/g3-p11-nav.yml'
      - '!g3-cog/nav/certification/p11-receipt.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify-navigation:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - name: Checkout P11 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: g3-p11-rstp-navigation
          fetch-depth: 0
      - name: Install exact Playwright package
        shell: bash
        run: |
          set -euxo pipefail
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Execute second-domain browser certification
        id: cert
        shell: bash
        run: |
          set +e
          node g3-cog/nav/tests/serve.mjs > /tmp/rstp-nav-server.log 2>&1 &
          SERVER_PID=$!
          sleep 1
          node g3-cog/nav/tests/cert.mjs
          STATUS=$?
          kill "$SERVER_PID" 2>/dev/null || true
          node -e "const fs=require('fs');const p='g3-cog/nav/certification/p11-receipt.json';const r=JSON.parse(fs.readFileSync(p));Object.assign(r,{workflow:'g3-p11-nav.yml',workflow_run_id:process.env.GITHUB_RUN_ID,workflow_run_attempt:process.env.GITHUB_RUN_ATTEMPT,container:'mcr.microsoft.com/playwright:v1.55.0-noble',playwright:'1.55.0',runner:'ubuntu-24.04'});fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n')"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Seal P11 receipt to branch
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add g3-cog/nav/certification/p11-receipt.json
          git commit -m 'G3 P11: seal navigation instrument portability receipt [skip ci]' || true
          git push origin HEAD:g3-p11-rstp-navigation
      - name: Enforce P11 verdict
        shell: bash
        run: |
          test '${{ steps.cert.outputs.status }}' = '0'
