name: Patch CUBE-REV 0.8.14 dynamic lease final documents
on:
  push:
    branches: [cube-rev-0.8.14-custody-device-staging]
    paths:
      - '.github/workflows/patch-0.8.14-dynamic-lease-final-docs.yml'
permissions:
  contents: write
jobs:
  patch-final-documents:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cube-rev-0.8.14-custody-device-staging
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact dynamic lease document patch
        run: python scripts/patch_0_8_14_dynamic_lease_final_docs.py
      - name: Verify patch scope and commit
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' research/CUBE_REV_0.8.14_DECISION_PACKET.json research/CUBE_REV_0.8.14_RUNBOOK.md research/CUBE_REV_0.8.14_VALIDATION_REPORT.md | sort)"
          test "$changed" = "$expected"
          git config user.name 'CUBE-REV evidence bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/CUBE_REV_0.8.14_DECISION_PACKET.json research/CUBE_REV_0.8.14_RUNBOOK.md research/CUBE_REV_0.8.14_VALIDATION_REPORT.md
          git commit -m 'docs(0.8.14): seal dynamic persisted-expiry certification'
          git push origin HEAD:cube-rev-0.8.14-custody-device-staging
