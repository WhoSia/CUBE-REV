name: CR0105R111 Roux Quotient Geometry and Null Foundry
on:
  push:
    branches: [cube-rev-0.10.5-r1.11-roux-orientation-quotient]
    paths: [cr0105r111/RUN_FOUNDRY]
permissions:
  contents: write
jobs:
  foundry:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify frozen R1.11 authority boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open('research/0.10.5-r1.10/final/RAVEL_FINAL_SEAL.json'))
          n=json.load(open('research/0.10.5-r1.11/NAPKIN_INTENT_AND_PREREGISTRATION.json'))
          c=json.load(open('research/0.10.5-r1.11/NAPKIN_PREEXEC_CLARIFICATION_R2.json'))
          r3=json.load(open('research/0.10.5-r1.11/NAPKIN_PREEXEC_DESIGN_REPAIR_R3.json'))
          assert p['status']=='PASS_LAYERED_TRANSPORT_WITH_ROUX_HOLD_AND_FRESH_DATA_WAIT'
          assert p['authority']['roux_future_scorer_released'] is False
          assert n['frozen_before_r111_execution'] is True
          assert n['authority_logic']['fresh_network_read_in_r111'] is False
          assert n['authority_logic']['layered_cfop_zb_authority_modified'] is False
          assert c['status']=='FROZEN_BEFORE_ANY_R111_EMPIRICAL_EXECUTION'
          assert c['empirical_r111_outputs_seen_before_this_clarification'] is False
          assert c['gate_weakening'] is False
          assert r3['status']=='FROZEN_BEFORE_ANY_R111_EMPIRICAL_OUTPUT'
          assert r3['empirical_r111_outputs_seen_before_repair'] is False
          assert r3['gate_weakening'] is False
          assert r3['repaired_block_internal_quotient']['representative_invariance_gate']==0.99
          print('CR0105R111_PREEXEC_FREEZE_R3_PASS')
          PY
      - name: Install pinned cube runtime
        run: npm install --no-save --ignore-scripts cubing@0.63.3
      - name: Run block-internal orientation quotient and phase geometry
        id: geom
        shell: bash
        env: {R111_ROOT: /tmp/r111}
        run: |
          set +e
          mkdir -p /tmp/r111
          node research/0.10.5-r1.11/r111_roux_quotient_geometry.mjs 2>&1 | tee /tmp/r111/GEOMETRY_LOG.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run Roux-only null foundry
        id: null
        shell: bash
        env: {R111_ROOT: /tmp/r111}
        run: |
          set +e
          if test -f /tmp/r111/ROUX_FEATURE_LEDGER.json; then
            node research/0.10.5-r1.11/r111_roux_null_foundry.mjs 2>&1 | tee /tmp/r111/NULL_FOUNDRY_LOG.txt
            code=${PIPESTATUS[0]}
          else
            echo 'MISSING_GEOMETRY_OUTPUT' | tee /tmp/r111/NULL_FOUNDRY_LOG.txt
            code=97
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist fail-observable R1.11 evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p research/0.10.5-r1.11/evidence-geometry research/0.10.5-r1.11/evidence-null-foundry
          for f in ROUX_BLOCK_INTERNAL_GEOMETRY_AUDIT.json ROUX_FRAME_ROUTE_ROWS.json ROUX_FEATURE_LEDGER.json GEOMETRY_LOG.txt; do test -f "/tmp/r111/$f" && cp "/tmp/r111/$f" research/0.10.5-r1.11/evidence-geometry/ || true; done
          for f in ROUX_NULL_FOUNDRY_AUDIT.json ROUX_LOO_ATTEMPT_BANK.json ROUX_CROSSFIT_ATTEMPT_BANK.json ROUX_NESTED_FAMILYWISE_ROWS.json ROUX_TRANSPORT_PAIRS.json ROUX_FUTURE_AUTHORITY_SEAL.json NULL_FOUNDRY_LOG.txt; do test -f "/tmp/r111/$f" && cp "/tmp/r111/$f" research/0.10.5-r1.11/evidence-null-foundry/ || true; done
          python3 - <<'PY'
          import json,datetime,os,pathlib
          x={'schema_version':'CR0105R111-EXECUTION-METADATA-1','workflow_run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'geometry_exit_code':int('${{ steps.geom.outputs.exit_code || 98 }}'),'null_foundry_exit_code':int('${{ steps.null.outputs.exit_code || 98 }}'),'r3_preexecution_design_repair_enforced':True,'fresh_network_read':False,'fresh_scoring':False,'human_observations':0,'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('research/0.10.5-r1.11/EXECUTION_METADATA.json').write_text(json.dumps(x,indent=2)+'\n')
          PY
      - name: Commit R1.11 evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/0.10.5-r1.11
          git diff --cached --quiet || git commit -m "Record CUBE-REV 0.10.5-R1.11 Roux foundry ${GITHUB_RUN_ID}"
          git push origin HEAD:cube-rev-0.10.5-r1.11-roux-orientation-quotient
      - name: Enforce runtime completeness without converting scientific HOLD to CI failure
        if: always()
        run: |
          test '${{ steps.geom.outputs.exit_code }}' = '0'
          test '${{ steps.null.outputs.exit_code }}' = '0'
          test -f research/0.10.5-r1.11/evidence-geometry/ROUX_BLOCK_INTERNAL_GEOMETRY_AUDIT.json
          test -f research/0.10.5-r1.11/evidence-null-foundry/ROUX_NULL_FOUNDRY_AUDIT.json
          python3 - <<'PY'
          import json
          g=json.load(open('research/0.10.5-r1.11/evidence-geometry/ROUX_BLOCK_INTERNAL_GEOMETRY_AUDIT.json'))
          n=json.load(open('research/0.10.5-r1.11/evidence-null-foundry/ROUX_NULL_FOUNDRY_AUDIT.json'))
          assert g['schema_version']=='CR0105R111-ROUX-BLOCK-INTERNAL-GEOMETRY-R3-1'
          assert g['fresh_outcomes_seen'] is False and n['fresh_outcomes_seen'] is False
          assert n['human_observations']==0
          print('CR0105R111_RUNTIME_COMPLETE_R3',g['status'],n['status'])
          PY
