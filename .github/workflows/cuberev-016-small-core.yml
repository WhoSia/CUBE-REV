name: CUBE-REV 0.16 exact reduced-cover certificate
on:
  push:
    branches: [research/current]
    paths:
      - 'docs/0.16/P10_50_BY_116.json'
      - 'docs/0.16/P10_COMPONENT_THEOREM.md'
      - 'scripts/cuberev-016/test-p10-small-core.py'
      - 'scripts/cuberev-016/test-p11-integrality-overlap.py'
      - 'docs/0.16/P12_CORE_CERTIFICATE.json'
      - 'docs/0.16/P12_MINIMAL_GRAPH_OBSTRUCTION.md'
      - 'scripts/cuberev-016/test-p12-graph-core.py'
      - 'scripts/cuberev-016/test-p12-80-candidates.cpp'
      - 'docs/0.16/P11_FRACTIONAL_INTEGRALITY_AUDIT.md'
      - '.github/workflows/cuberev-016-small-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p10-finite-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check exact 50-target component proof
        run: python3 scripts/cuberev-016/test-p10-small-core.py
      - name: Check P11 exact fractional cover and overlap law
        run: python3 scripts/cuberev-016/test-p11-integrality-overlap.py
      - name: Verify P12 minimal 24-target graph core and emit exact 80 candidates
        run: python3 scripts/cuberev-016/test-p12-graph-core.py --emit /tmp/p12-mask80.txt
      - name: Compile and exhaust all 24,040,016 five-word choices
        run: |
          c++ -std=c++20 -O3 -Wall -Wextra -pedantic scripts/cuberev-016/test-p12-80-candidates.cpp -o /tmp/p12-core
          /tmp/p12-core /tmp/p12-mask80.txt
