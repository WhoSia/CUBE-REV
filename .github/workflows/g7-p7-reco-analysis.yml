name: Materialize G7-P7 reco.nz five-rival corpus

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p7/**'
      - 'core/reco/**'
      - 'scripts/reco/**'
      - 'scripts/cube/**'
      - 'scripts/g7-p7/**'
      - 'crates/search-geometry-core/**'
      - '.github/workflows/g7-p7-reco-analysis.yml'
  pull_request:
    paths:
      - 'g7/p7/**'
      - 'core/reco/**'
      - 'scripts/reco/**'
      - 'scripts/cube/**'
      - 'scripts/g7-p7/**'
      - 'crates/search-geometry-core/**'
      - '.github/workflows/g7-p7-reco-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate active authority and unit gates
        run: |
          set -euo pipefail
          node scripts/g7-p7/test-reco-campaign-manifest.mjs
          node scripts/g7-p7/test-reco-rival-kernel.mjs
          node scripts/g7-p7/test-reco-five-rival-analysis.mjs
          node scripts/g7-p7/test-reco-statistical-calibration.mjs
          node - <<'NODE'
          const c=require('./g7/p7/reco-campaign-closure.json');
          if(!c.closure.campaign_complete||c.closure.acquisition_pass!==40||c.closure.exact_end_validation_pass!==40) process.exit(1);
          if(c.closure.further_body_contact_under_this_campaign!==false) process.exit(2);
          console.log('G7_P7_RECO_ANALYSIS_AUTHORITY_PASS');
          NODE

      - name: Download immutable predecessor and campaign artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/g7-p7-input
          fetch_artifact () {
            id="$1"; name="$2"; expected="$3"
            curl --fail --location --silent --show-error               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPO/actions/artifacts/$id/zip"               -o "/tmp/g7-p7-input/$name.zip"
            got="$(sha256sum "/tmp/g7-p7-input/$name.zip" | awk '{print $1}')"
            test "$got" = "$expected"
            mkdir -p "/tmp/g7-p7-input/$name"
            unzip -q "/tmp/g7-p7-input/$name.zip" -d "/tmp/g7-p7-input/$name"
          }
          fetch_artifact 11205789954 p4-pilot d031b3f135de864d4f554bbb5453bd7773a04794ba4c1d048e0c0797f7fcf24f
          fetch_artifact 11206421721 p4-confirmatory aa1e997da19ce0aa9bad039c69821d73de2f41eb7cb9def899e075ff55b55b75
          fetch_artifact 11211556529 p7-batch1 9781d3e436b383ae5cb8cb8410a85ea5114a94ad4a7d5f9a8f34a743df3347c4
          fetch_artifact 11215205073 p7-batch2 943a763bb58b23cf67618e393b8590887d28a619cc1e3f36837ec94825df1a66
          fetch_artifact 11215270269 p7-batch3 7fc32a24b95c5bd15dd65bddea985e5da1f59006d8934fad80031a69be8ffba8
          fetch_artifact 11215332190 p7-batch4 5113f6c9a7903463a24fce2ced503eda5e5d535148a28d5ec7ceb669a6a63f68
          echo 'G7_P7_IMMUTABLE_ARTIFACT_DOWNLOAD_PASS'

      - name: Merge 60-solve corpus without source contact
        run: |
          set -euo pipefail
          rm -rf /tmp/g7-p7-build
          mkdir -p /tmp/g7-p7-build/corpus
          node scripts/g7-p7/merge-reco-corpus.mjs             --source P4_PILOT=/tmp/g7-p7-input/p4-pilot             --source P4_CONFIRMATORY=/tmp/g7-p7-input/p4-confirmatory             --source P7_BATCH1=/tmp/g7-p7-input/p7-batch1             --source P7_BATCH2=/tmp/g7-p7-input/p7-batch2             --source P7_BATCH3=/tmp/g7-p7-input/p7-batch3             --source P7_BATCH4=/tmp/g7-p7-input/p7-batch4             --out /tmp/g7-p7-build/corpus
          node - <<'NODE'
          const r=require('/tmp/g7-p7-build/corpus/corpus-receipt.json');
          if(r.solves!==60||r.unique_source_ids!==60||r.source_contact_performed!==false) process.exit(1);
          console.log('G7_P7_RECO_60_CORPUS_AUTHORITY_PASS');
          NODE

      - name: Replay exact states with current active core
        run: |
          set -euo pipefail
          node scripts/cube/replay-exact-trajectories.mjs             --input /tmp/g7-p7-build/corpus/combined-solves.jsonl             --out /tmp/g7-p7-build/exact
          node - <<'NODE'
          const x=require('/tmp/g7-p7-build/exact/exact-trajectories.json');
          if(x.solve_count!==60||x.exact_end_validation_pass!==60) process.exit(1);
          console.log('G7_P7_RECO_60_EXACT_PASS');
          console.log('PREFIXES\t'+x.total_prefixes);
          NODE

      - name: Materialize prefix context and five-rival geometry
        run: |
          set -euo pipefail
          node scripts/g7-p7/prefix-context.mjs             /tmp/g7-p7-build/exact/exact-trajectories.json             /tmp/g7-p7-build/corpus/solve-metadata.jsonl             /tmp/g7-p7-build/prefix-states.tsv             /tmp/g7-p7-build/prefix-context.jsonl
          cargo run -q -p search-geometry-core --bin g7_p7_reco_rivals             < /tmp/g7-p7-build/prefix-states.tsv             > /tmp/g7-p7-build/five-rival-features.tsv
          node scripts/g7-p7/analyze-reco-five-rival.mjs             --context /tmp/g7-p7-build/prefix-context.jsonl             --features /tmp/g7-p7-build/five-rival-features.tsv             --out /tmp/g7-p7-build/analysis
          python3 scripts/g7-p7/calibrate-reco-statistics.py             --context /tmp/g7-p7-build/prefix-context.jsonl             --features /tmp/g7-p7-build/five-rival-features.tsv             --out /tmp/g7-p7-build/calibration             --permutations 100000

      - name: Validate 60-ID recovered provenance registry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/g7-p7-provenance-authority
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/artifacts/11228144174/zip" \
            -o /tmp/g7-p7-provenance-authority.zip
          echo '02515d1bd946a7eec7e72823c170c12fc7e41ea69bb7aa88a58964127c2fad2d  /tmp/g7-p7-provenance-authority.zip' | sha256sum -c -
          unzip -q /tmp/g7-p7-provenance-authority.zip -d /tmp/g7-p7-provenance-authority
          SW="$(find /tmp/g7-p7-provenance-authority -name source-world-support-audit.json -print -quit)"
          test -n "$SW"
          python3 scripts/g7-p7/validate-provenance-recovery.py \
            --source-world "$SW" \
            --recovery g7/p7/source-provenance-recovery.json
          rm -rf /tmp/g7-p7-provenance-authority /tmp/g7-p7-provenance-authority.zip

      - name: Download refined population transport authority
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/g7-p7-refined-transport
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/artifacts/11236528187/zip" \
            -o /tmp/g7-p7-refined-transport.zip
          echo '33d6f25b4426cb938dee7dd970a2adc5940ed521db1ece836a8bd65d9aa9fe7b  /tmp/g7-p7-refined-transport.zip' | sha256sum -c -
          unzip -q /tmp/g7-p7-refined-transport.zip -d /tmp/g7-p7-refined-transport
          test -n "$(find /tmp/g7-p7-refined-transport -name refined-population-provenance-transport.json -print -quit)"
          echo 'G7_P7_REFINED_POPULATION_TRANSPORT_AUTHORITY_PASS'

      - name: Recovered-provenance five-rival geometry Stress Test
        run: |
          set -euo pipefail
          python3 scripts/g7-p7/analyze-recovered-provenance-geometry.py \
            --context /tmp/g7-p7-build/prefix-context.jsonl \
            --features /tmp/g7-p7-build/five-rival-features.tsv \
            --recovery g7/p7/source-provenance-recovery.json \
            --out /tmp/g7-p7-build/recovered-provenance \
            --permutations 100000

      - name: Refined provenance-conditioned five-rival geometry Transport Court
        run: |
          set -euo pipefail
          TP="$(find /tmp/g7-p7-refined-transport -name refined-population-provenance-transport.json -print -quit)"
          python3 scripts/g7-p7/analyze-refined-provenance-geometry-transport.py \
            --context /tmp/g7-p7-build/prefix-context.jsonl \
            --features /tmp/g7-p7-build/five-rival-features.tsv \
            --transport "$TP" \
            --out /tmp/g7-p7-build/refined-geometry-transport | tee /tmp/g7-p7-build/refined-geometry-transport.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/g7-p7-build/refined-geometry-transport/refined-provenance-five-rival-geometry-transport.json'))
          assert x['solves']==60 and x['population_rows']==10591
          assert 0 <= x['unidentified_population_mass'] <= 1
          print('G7_P7_REFINED_PROVENANCE_GEOMETRY_TRANSPORT_RESULT_GATE_PASS')
          print('VERDICT',x['verdict'])
          print('TS',x['overall']['TS'])
          print('H1',x['overall']['H1'])
          PY

      - name: Adversarial unidentified-provenance-mass Sign-Bound Court
        run: |
          set -euo pipefail
          python3 scripts/g7-p7/bound-unidentified-provenance-mass.py \
            --transport /tmp/g7-p7-build/refined-geometry-transport/refined-provenance-five-rival-geometry-transport.json \
            --out /tmp/g7-p7-build/unidentified-bound | tee /tmp/g7-p7-build/unidentified-bound.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/g7-p7-build/unidentified-bound/adversarial-unidentified-mass-sign-bound.json'))
          print('G7_P7_ADVERSARIAL_UNIDENTIFIED_MASS_RESULT_GATE_PASS')
          print('VERDICT',x['verdict'])
          print('TS',x['rivals']['TS'])
          print('H1',x['rivals']['H1'])
          PY

      - name: Seal derived-only private research artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/g7-p7-seal/authority /tmp/g7-p7-seal/derived
          cp g7/p7/preseal.json g7/p7/reco-campaign-constitution.json g7/p7/reco-campaign-manifest.json g7/p7/reco-campaign-closure.json g7/p7/source-provenance-recovery.json /tmp/g7-p7-seal/authority/
          cp /tmp/g7-p7-build/corpus/corpus-receipt.json /tmp/g7-p7-seal/derived/
          cp /tmp/g7-p7-build/corpus/solve-metadata.jsonl /tmp/g7-p7-seal/derived/
          cp /tmp/g7-p7-build/prefix-context.jsonl /tmp/g7-p7-seal/derived/
          cp /tmp/g7-p7-build/five-rival-features.tsv /tmp/g7-p7-seal/derived/
          cp /tmp/g7-p7-build/analysis/five-rival-analysis.json /tmp/g7-p7-seal/derived/
          cp /tmp/g7-p7-build/analysis/five-rival-analysis-receipt.md /tmp/g7-p7-seal/derived/
          cp /tmp/g7-p7-build/calibration/statistical-calibration.json /tmp/g7-p7-seal/derived/
          cp /tmp/g7-p7-build/calibration/statistical-calibration-receipt.md /tmp/g7-p7-seal/derived/
          cp /tmp/g7-p7-build/recovered-provenance/recovered-provenance-five-rival-geometry.json /tmp/g7-p7-seal/derived/
          cp /tmp/g7-p7-build/refined-geometry-transport/refined-provenance-five-rival-geometry-transport.json /tmp/g7-p7-seal/derived/
          cp /tmp/g7-p7-build/unidentified-bound/adversarial-unidentified-mass-sign-bound.json /tmp/g7-p7-seal/derived/
          cp g7/p7/reco-statistical-calibration.json /tmp/g7-p7-seal/authority/
          cp /tmp/g7-p7-build/exact/exact-trajectories.json /tmp/g7-p7-seal/derived/
          printf '%s\n'             'SOURCE_CONTACT=NONE'             'SOLVES=60'             'RAW_SOURCE_HTML_PACKAGED=NO'             'RAW_PUBLIC_RELEASE=HOLD'             'AUTHORITY=DESCRIPTIVE_NATURALISTIC_MEASUREMENT'             > /tmp/g7-p7-seal/AUTHORITY.txt
          (cd /tmp/g7-p7-seal && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          node - <<'NODE'
          const x=require('/tmp/g7-p7-seal/derived/five-rival-analysis.json');
          if(x.corpus.solves!==60) process.exit(1);
          if(x.authority!=='DESCRIPTIVE_NATURALISTIC_MEASUREMENT') process.exit(2);
          console.log('G7_P7_RECO_FIVE_RIVAL_MATERIALIZATION_PASS');
          console.log('STATES\t'+x.corpus.states);
          console.log('BOUNDARY_STATES\t'+x.boundary_states.states);
          console.log('FACE_NEXT_STATES\t'+x.all_states.face_next_states);
          console.log('MEAN_RIVAL_DIVERSITY\t'+x.all_states.mean_pairwise_jaccard_distance);
          console.log('BOUNDARY_DELTA\t'+x.within_solve_boundary_contrast.mean_boundary_minus_nonboundary_diversity);
          const c=require('/tmp/g7-p7-seal/derived/statistical-calibration.json');
          console.log('CALIBRATION_H1_EXCESS\t'+c.choice_calibration.H1.solve_mean_excess);
          console.log('CALIBRATION_H3_EXCESS\t'+c.choice_calibration.H3.solve_mean_excess);
          console.log('CALIBRATION_TS_EXCESS\t'+c.choice_calibration.TS.solve_mean_excess);
          console.log('PROGRESS_MATCHED_BOUNDARY_DELTA\t'+c.progress_matched_boundary_calibration.mean_matched_delta);
          const p=require('/tmp/g7-p7-seal/derived/recovered-provenance-five-rival-geometry.json');
          if(p.solves!==60) process.exit(3);
          console.log('RECOVERED_PROVENANCE_CLASSES\t'+Object.keys(p.groups).length);
          console.log('RECOVERED_PROVENANCE_TS_UNOFFICIAL\t'+p.groups.SOURCE_DECLARED_UNOFFICIAL.rivals.TS.mean_excess);
          const t=require('/tmp/g7-p7-seal/derived/refined-provenance-five-rival-geometry-transport.json');
          console.log('REFINED_TRANSPORT_VERDICT\t'+t.verdict);
          console.log('REFINED_TRANSPORT_TS_POSTSTRAT\t'+t.overall.TS.poststrat_supported_mass_mean_excess);
          console.log('REFINED_TRANSPORT_H1_POSTSTRAT\t'+t.overall.H1.poststrat_supported_mass_mean_excess);
          const b=require('/tmp/g7-p7-seal/derived/adversarial-unidentified-mass-sign-bound.json');
          console.log('UNIDENTIFIED_BOUND_VERDICT\t'+b.verdict);
          console.log('UNIDENTIFIED_BOUND_TS_LOW\t'+b.rivals.TS.full_population_lower_bound);
          console.log('UNIDENTIFIED_BOUND_H1_LOW\t'+b.rivals.H1.full_population_lower_bound);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P7-reco-five-rival-${{ github.sha }}
          path: /tmp/g7-p7-seal
          if-no-files-found: error
          retention-days: 90
