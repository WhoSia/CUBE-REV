name: G7-P11 fresh replication selection seal

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p11/constitution.json'
      - 'scripts/g7-p11/select-fresh-replication-corpus.py'
      - '.github/workflows/g7-p11-fresh-selection.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Validate P11 constitution
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('g7/p11/constitution.json'))
          assert x['status']=='PRESEALED_BEFORE_FRESH_BODY_CONTACT'
          assert x['sampling_design']['target_total']==40
          assert sum(x['sampling_design']['cells'].values())==40
          assert x['acquisition']['max_solves_per_run']==10
          print('G7_P11_CONSTITUTION_GATE_PASS')
          PY

      - name: Recover frozen P8 index covariates and P3 population spine
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p11/p8 /tmp/p11/p3
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/artifacts/11238930249/zip" \
            -o /tmp/p11/p8.zip
          echo '460dc657565541b663f1bc91b6e75490a7591f56946a41c28af60802ee27f16a  /tmp/p11/p8.zip' | sha256sum -c -
          unzip -q /tmp/p11/p8.zip -d /tmp/p11/p8
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/artifacts/11205587281/zip" \
            -o /tmp/p11/p3.zip
          echo 'acb3dff14bbdb33fe4be3550e64eeba55dcb1879b85d6b8c1eacca7d9408c4e4  /tmp/p11/p3.zip' | sha256sum -c -
          unzip -q /tmp/p11/p3.zip -d /tmp/p11/p3
          test -n "$(find /tmp/p11/p8 -name frozen-index-covariates.jsonl -print -quit)"
          test -n "$(find /tmp/p11/p3 -name linkage-support.jsonl -print -quit)"
          echo 'G7_P11_FROZEN_INPUTS_PASS'

      - name: Materialize outcome-blind 40-solve selection
        run: |
          set -euo pipefail
          COV="$(find /tmp/p11/p8 -name frozen-index-covariates.jsonl -print -quit)"
          IDX="$(find /tmp/p11/p3 -name linkage-support.jsonl -print -quit)"
          mkdir -p /tmp/p11/out
          python3 scripts/g7-p11/select-fresh-replication-corpus.py \
            --covariates "$COV" \
            --frozen-index "$IDX" \
            --exclude60 g7/p7/source-provenance-recovery.json \
            --out /tmp/p11/out | tee /tmp/p11/selection.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/p11/out/selection-manifest.json'))
          assert x['status']=='SEALED_BEFORE_FRESH_BODY_CONTACT'
          assert x['target_total']==40 and len(x['rows'])==40
          assert all(len(x['batches'][str(i)])==10 for i in range(1,5))
          assert all(v==10 for v in x['selected_cell_counts'].values())
          print('G7_P11_SELECTION_RESULT_GATE_PASS')
          print('MANIFEST_SHA256',x['selection_manifest_sha256'])
          print('CELLS',x['selected_cell_counts'])
          print('ERAS',x['selected_era_counts'])
          PY

      - name: Seal selection authority only
        run: |
          set -euo pipefail
          mkdir -p /tmp/p11/seal/authority /tmp/p11/seal/derived
          cp g7/p11/constitution.json /tmp/p11/seal/authority/
          cp /tmp/p11/out/selection-manifest.json /tmp/p11/seal/derived/
          cp /tmp/p11/out/batch-*-source-ids.txt /tmp/p11/seal/derived/
          cp /tmp/p11/selection.log /tmp/p11/seal/derived/
          printf '%s\n' \
            'PHASE=G7-P11' \
            'OPERATION=FRESH_REPLICATION_SELECTION_SEAL' \
            'BODY_CONTACT=NONE' \
            'TARGET=40' \
            'BATCHES=4x10' \
            'OUTCOME_BLIND=YES' \
            > /tmp/p11/seal/AUTHORITY.txt
          (cd /tmp/p11/seal && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P11-fresh-selection-${{ github.sha }}
          path: /tmp/p11/seal
          retention-days: 90
