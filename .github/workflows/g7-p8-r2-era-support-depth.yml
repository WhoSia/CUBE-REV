name: G7-P8-R2 era support-depth Audit

concurrency:
  group: g7-p8-r2-era-support-depth-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p8/era-support-depth-audit-preseal.json'
      - 'scripts/g7-p8/audit-era-support-depth.py'
      - '.github/workflows/g7-p8-r2-era-support-depth.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate R2 preseal
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('g7/p8/era-support-depth-audit-preseal.json'))
          assert x['status']=='FROZEN_AFTER_R1_BEFORE_R2_EXECUTION'
          assert x['operation_type']=='Era×Composition Support-Depth Audit'
          assert x['authority_boundary']['new_solve_body_requests']==0
          assert x['authority_boundary']['human_contact_gate']=='CLOSED'
          print('G7_P8_R2_PRESEAL_GATE_PASS')
          PY

      - name: Recover immutable P8 Court and R1 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/g7-p8-r2/{court,r1}
          fetch_artifact () {
            id="$1"; out="$2"; expected="$3"
            curl --fail --location --silent --show-error               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPO/actions/artifacts/$id/zip"               -o "$out.zip"
            echo "$expected  $out.zip" | sha256sum -c -
            unzip -q "$out.zip" -d "$out"
          }
          fetch_artifact 11239796775 /tmp/g7-p8-r2/court 14d18409bf2cc82a0abbe348937097a4bb11a7b49cbb323b55b4cb3129cc67e1
          fetch_artifact 11240900495 /tmp/g7-p8-r2/r1 308d629754c8438a9b5f0d7c0d5887d4007c9ecab4ff453f37e570e223deecf0
          echo 'G7_P8_R2_PARENT_AUTHORITIES_PASS'

      - name: Execute zero-support denominator repair and support-depth sweep
        run: |
          set -euo pipefail
          COURT="$(find /tmp/g7-p8-r2/court -name method-reconstructor-geometry-transport.json -print -quit)"
          R1="$(find /tmp/g7-p8-r2/r1 -name method-dominance-sensitivity.json -print -quit)"
          test -n "$COURT" -a -n "$R1"
          mkdir -p /tmp/g7-p8-r2/out
          python3 scripts/g7-p8/audit-era-support-depth.py             --court "$COURT"             --r1 "$R1"             --out /tmp/g7-p8-r2/out | tee /tmp/g7-p8-r2/audit.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/g7-p8-r2/out/era-support-depth-audit.json'))
          assert x['operation_type']=='Era×Composition Support-Depth Audit'
          assert x['thresholds']==[1,2,3,5]
          print('G7_P8_R2_RESULT_GATE_PASS')
          print('VERDICT',x['verdict'])
          print('IDENTIFIED_NONPOSITIVE',x['identified_nonpositive_full_era'])
          print('SPARSE_SENSITIVE',x['sparse_support_sensitive'])
          PY

      - name: Seal derived-only R2 artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/g7-p8-r2/seal/authority /tmp/g7-p8-r2/seal/derived
          cp g7/p8/era-support-depth-audit-preseal.json /tmp/g7-p8-r2/seal/authority/
          cp /tmp/g7-p8-r2/out/era-support-depth-audit.json /tmp/g7-p8-r2/seal/derived/
          cp /tmp/g7-p8-r2/audit.log /tmp/g7-p8-r2/seal/derived/execution.log
          printf '%s\n'             'PHASE=G7-P8-R2'             'OPERATION=ERA_COMPOSITION_SUPPORT_DEPTH_AUDIT'             'PARENT_P8_COURT_ARTIFACT=11239796775'             'PARENT_R1_ARTIFACT=11240900495'             'NEW_SOURCE_CONTACT=NONE'             'HUMAN_CONTACT_GATE=CLOSED'             > /tmp/g7-p8-r2/seal/AUTHORITY.txt
          rm -rf /tmp/g7-p8-r2/court /tmp/g7-p8-r2/court.zip /tmp/g7-p8-r2/r1 /tmp/g7-p8-r2/r1.zip
          (cd /tmp/g7-p8-r2/seal && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P8-R2-era-support-depth-${{ github.sha }}
          path: /tmp/g7-p8-r2/seal
          if-no-files-found: error
          retention-days: 90
