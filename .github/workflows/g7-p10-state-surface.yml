name: G7-P10 TS low-overlap State-Surface Cartography

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p10/constitution.json'
      - 'scripts/g7-p10/cartograph-low-overlap-state-surface.py'
      - '.github/workflows/g7-p10-state-surface.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cartography:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate constitution
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('g7/p10/constitution.json'))
          assert x['status']=='PRESEALED_BEFORE_P10_OUTCOME'
          assert x['new_body_requests']==0
          print('G7_P10_CONSTITUTION_PASS')
          PY
      - name: Recover frozen geometry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/p10/p7
          curl --fail --location --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/actions/artifacts/11238382539/zip"             -o /tmp/p10/p7.zip
          echo 'b6e30ab56548e27905dd3b3718c5a3e56d772bff10a744e92180d189a3259a11  /tmp/p10/p7.zip' | sha256sum -c -
          unzip -q /tmp/p10/p7.zip -d /tmp/p10/p7
      - name: Execute cartography
        run: |
          FEAT="$(find /tmp/p10/p7 -name five-rival-features.tsv -print -quit)"
          CTX="$(find /tmp/p10/p7 -name prefix-context.jsonl -print -quit)"
          mkdir -p /tmp/p10/out
          python3 scripts/g7-p10/cartograph-low-overlap-state-surface.py             --features "$FEAT" --context "$CTX" --out /tmp/p10/out --permutations 100000 | tee /tmp/p10/run.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/p10/out/state-surface-cartography.json'))
          assert x['states']==2725 and x['solves']==60
          print('G7_P10_RESULT_GATE_PASS',x['verdict'])
          print('BOUNDARY',x['matched_boundary_minus_nonboundary'])
          PY
      - name: Seal
        run: |
          mkdir -p /tmp/p10/seal/authority /tmp/p10/seal/derived
          cp g7/p10/constitution.json /tmp/p10/seal/authority/
          cp /tmp/p10/out/state-surface-cartography.json /tmp/p10/seal/derived/
          cp /tmp/p10/run.log /tmp/p10/seal/derived/execution.log
          printf '%s\n' 'PHASE=G7-P10' 'OPERATION=TS_LOW_OVERLAP_STATE_SURFACE_CARTOGRAPHY' 'NEW_SOURCE_CONTACT=NONE' > /tmp/p10/seal/AUTHORITY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: G7-P10-state-surface-${{ github.sha }}
          path: /tmp/p10/seal
          retention-days: 90
