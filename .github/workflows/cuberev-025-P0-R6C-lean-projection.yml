name: CUBE-REV 0.25 P0-R6C fast Lean4 projection proof
on:
  workflow_dispatch:
  push:
    branches: [research/current]
    paths:
      - "formal/025/JointNextAction.lean"
      - "formal/025/lakefile.toml"
      - ".github/workflows/cuberev-025-P0-R6C-lean-projection.yml"
permissions:
  contents: read
jobs:
  abstract-same-action-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject bot-authored or bot-committed history
        shell: bash
        run: |
          set -euo pipefail
          if git log --format='%an <%ae> %cn <%ce>' | grep -Ei 'github-actions?\[bot\]|github-action\[bot\]'; then exit 1; fi
      - name: Kernel check on generic same-action finite descendant predicate
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/025
          build: true
          test: false
          use-mathlib-cache: false
      - name: Tracked source remains untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD --
          test -z "$(git status --porcelain --untracked-files=no)"
