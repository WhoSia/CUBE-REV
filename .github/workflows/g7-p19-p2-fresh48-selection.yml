name: G7-P19-P2 fresh48 hybrid-confirmation selection

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p19/constitution.json'
      - 'g7/p19/p2-fresh48-selection-preseal.json'
      - 'scripts/g7-p19/select-fresh48-hybrid-confirmation.py'
      - '.github/workflows/g7-p19-p2-fresh48-selection.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Preseal and zero-bot gate
        run: |
          set -euo pipefail
          ! grep -E 'git +(commit|push|tag)|contents: *write|github-actions\[bot\]' '.github/workflows/g7-p19-p2-fresh48-selection.yml'
          python3 - <<'PY'
          import json
          c=json.load(open('g7/p19/constitution.json'))
          p=json.load(open('g7/p19/p2-fresh48-selection-preseal.json'))
          r=json.load(open('g7/p19/p1-receipt.json'))
          assert c['status']=='PRESEALED_BEFORE_P19_FRESH_SELECTION_AND_BODY_CONTACT'
          assert p['status']=='FROZEN_BEFORE_P19_FRESH48_SELECTION'
          assert r['counts']['all_prior_contacted_through_p17']==418
          assert p['target_total']==48 and p['per_cell']==3
          print('G7_P19_P2_PRESEAL_PASS')
          print('G7_P19_P2_ZERO_BOT_WRITEBACK_PATTERN_PASS')
          PY

      - name: Recover frozen frame and prior418 exclusion authority
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p19p2/p8 /tmp/p19p2/p3 /tmp/p19p2/excl
          fetch_artifact () {
            id="$1"; dir="$2"; expected="$3"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/artifacts/$id/zip" \
              -o "/tmp/p19p2/$dir.zip"
            echo "$expected  /tmp/p19p2/$dir.zip" | sha256sum -c -
            unzip -q "/tmp/p19p2/$dir.zip" -d "/tmp/p19p2/$dir"
          }
          fetch_artifact 11238930249 p8 460dc657565541b663f1bc91b6e75490a7591f56946a41c28af60802ee27f16a
          fetch_artifact 11205587281 p3 acb3dff14bbdb33fe4be3550e64eeba55dcb1879b85d6b8c1eacca7d9408c4e4
          fetch_artifact 11333467367 excl d4363e807492333d299fe4140d710f611f4a3c496854dfed704bc31f0060b3de
          echo G7_P19_P2_INPUT_AUTHORITY_PASS

      - name: Materialize outcome-blind fresh48 selection
        run: |
          set -euo pipefail
          COV="$(find /tmp/p19p2/p8 -name frozen-index-covariates.jsonl -print -quit)"
          IDX="$(find /tmp/p19p2/p3 -name linkage-support.jsonl -print -quit)"
          EXCL="$(find /tmp/p19p2/excl -name prior-contact-census.json -print -quit)"
          test -n "$COV"; test -n "$IDX"; test -n "$EXCL"
          mkdir -p /tmp/p19p2/out
          python3 scripts/g7-p19/select-fresh48-hybrid-confirmation.py \
            --covariates "$COV" \
            --frozen-index "$IDX" \
            --exclusion-census "$EXCL" \
            --out /tmp/p19p2/out | tee /tmp/p19p2/selection.log

      - name: Selection result gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/p19p2/out/selection-manifest.json'))
          assert x['status']=='SEALED_BEFORE_FRESH48_BODY_CONTACT'
          assert x['prior_body_contacted_excluded']==418
          assert x['target_total']==48
          assert len(x['selected_cell_counts'])==16 and all(v==3 for v in x['selected_cell_counts'].values())
          assert all(len(x['batches'][str(i)])==8 for i in range(1,7))
          print('G7_P19_P2_RESULT_GATE_PASS')
          print('MANIFEST_SHA256',x['selection_manifest_sha256'])
          print('CELLS',x['selected_cell_counts'])
          print('BATCHES',x['selected_batch_counts'])
          print('MIX',x['batch_axis_mix'])
          PY

      - name: Seal selection authority
        run: |
          set -euo pipefail
          mkdir -p /tmp/p19p2/seal/authority /tmp/p19p2/seal/derived
          cp g7/p19/constitution.json /tmp/p19p2/seal/authority/
          cp g7/p19/p2-fresh48-selection-preseal.json /tmp/p19p2/seal/authority/
          cp /tmp/p19p2/out/* /tmp/p19p2/seal/derived/
          cp /tmp/p19p2/selection.log /tmp/p19p2/seal/derived/
          printf '%s\n' \
            'PHASE=G7-P19-P2' \
            'OPERATION=UNTOUCHED_FRESH48_HYBRID_CONFIRMATION_SELECTION' \
            'BODY_CONTACT=NONE' \
            'TARGET=48' \
            'PRIOR_CONTACTED_EXCLUDED=418' \
            'CELLS=16x3' \
            'BATCHES=6x8' \
            'HUMAN_CONTACT_GATE=CLOSED' \
            > /tmp/p19p2/seal/AUTHORITY.txt
          (cd /tmp/p19p2/seal && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P19-P2-fresh48-selection-${{ github.sha }}
          path: /tmp/p19p2/seal
          retention-days: 90
