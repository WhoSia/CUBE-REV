name: G7-P9 rival support-overlap Specificity Audit

concurrency:
  group: g7-p9-rival-overlap-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p9/constitution.json'
      - 'scripts/g7-p9/audit-rival-support-overlap.py'
      - '.github/workflows/g7-p9-rival-overlap-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate P9 constitution
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('g7/p9/constitution.json'))
          assert x['status']=='PRESEALED_BEFORE_P9_OUTCOME'
          assert x['operation_type']=='Five-Rival Support-Overlap Specificity Audit'
          assert x['new_body_requests']==0
          assert x['human_contact_gate']=='CLOSED'
          print('G7_P9_CONSTITUTION_GATE_PASS')
          PY

      - name: Recover frozen 60-solve geometry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/g7-p9/p7
          curl --fail --location --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/actions/artifacts/11238382539/zip"             -o /tmp/g7-p9/p7.zip
          echo 'b6e30ab56548e27905dd3b3718c5a3e56d772bff10a744e92180d189a3259a11  /tmp/g7-p9/p7.zip' | sha256sum -c -
          unzip -q /tmp/g7-p9/p7.zip -d /tmp/g7-p9/p7
          CTX="$(find /tmp/g7-p9/p7 -name prefix-context.jsonl -print -quit)"
          FEAT="$(find /tmp/g7-p9/p7 -name five-rival-features.tsv -print -quit)"
          test -n "$CTX" -a -n "$FEAT"
          printf '%s\n' "CTX=$CTX" "FEAT=$FEAT" > /tmp/g7-p9/inputs.env
          echo 'G7_P9_FROZEN_GEOMETRY_PASS'

      - name: Execute presealed overlap audit
        run: |
          set -euo pipefail
          source /tmp/g7-p9/inputs.env
          mkdir -p /tmp/g7-p9/out
          python3 scripts/g7-p9/audit-rival-support-overlap.py             --features "$FEAT"             --context "$CTX"             --provenance g7/p7/source-provenance-recovery.json             --out /tmp/g7-p9/out             --permutations 100000 | tee /tmp/g7-p9/audit.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/g7-p9/out/rival-support-overlap-specificity.json'))
          assert x['states']==2725 and x['solves']==60
          assert x['identity_max_abs_error'] < 1e-12
          print('G7_P9_RESULT_GATE_PASS')
          print('VERDICT',x['verdict'])
          print('TS_UNIQUE',x['TS_unique'])
          print('PAIRWISE',x['pairwise_TS_minus_rival'])
          PY

      - name: Seal derived-only P9 artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/g7-p9/seal/authority /tmp/g7-p9/seal/derived
          cp g7/p9/constitution.json /tmp/g7-p9/seal/authority/
          cp /tmp/g7-p9/out/rival-support-overlap-specificity.json /tmp/g7-p9/seal/derived/
          cp /tmp/g7-p9/audit.log /tmp/g7-p9/seal/derived/execution.log
          printf '%s\n'             'PHASE=G7-P9'             'OPERATION=FIVE_RIVAL_SUPPORT_OVERLAP_SPECIFICITY_AUDIT'             'PARENT_GEOMETRY_ARTIFACT=11238382539'             'NEW_SOURCE_CONTACT=NONE'             'HUMAN_CONTACT_GATE=CLOSED'             > /tmp/g7-p9/seal/AUTHORITY.txt
          rm -rf /tmp/g7-p9/p7 /tmp/g7-p9/p7.zip
          (cd /tmp/g7-p9/seal && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P9-rival-overlap-${{ github.sha }}
          path: /tmp/g7-p9/seal
          if-no-files-found: error
          retention-days: 90
