name: G7-P10-R3 Batch4 LB7 Leverage Fragility Audit

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p10/batch4-leverage-preseal.json'
      - 'scripts/g7-p10/audit-batch4-leverage.py'
      - '.github/workflows/g7-p10-r3-batch4-leverage.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate preseal
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('g7/p10/batch4-leverage-preseal.json'))
          assert x['status']=='FROZEN_AFTER_R2_BEFORE_R3_OUTCOME'
          assert x['new_body_requests']==0
          print('G7_P10_R3_PRESEAL_PASS')
          PY
      - name: Recover frozen geometry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/p10r3/p7
          curl --fail --location --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/actions/artifacts/11238382539/zip"             -o /tmp/p10r3/p7.zip
          echo 'b6e30ab56548e27905dd3b3718c5a3e56d772bff10a744e92180d189a3259a11  /tmp/p10r3/p7.zip' | sha256sum -c -
          unzip -q /tmp/p10r3/p7.zip -d /tmp/p10r3/p7
      - name: Execute leverage audit
        run: |
          FEAT="$(find /tmp/p10r3/p7 -name five-rival-features.tsv -print -quit)"
          CTX="$(find /tmp/p10r3/p7 -name prefix-context.jsonl -print -quit)"
          mkdir -p /tmp/p10r3/out
          python3 scripts/g7-p10/audit-batch4-leverage.py             --features "$FEAT" --context "$CTX"             --provenance g7/p7/source-provenance-recovery.json             --out /tmp/p10r3/out | tee /tmp/p10r3/run.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/p10r3/out/batch4-leverage-audit.json'))
          print('G7_P10_R3_RESULT_GATE_PASS',x['verdict'])
          print('RAW',x['raw_batch4_minus_other'])
          print('STANDARDIZED',x['standardized_batch4_minus_other'])
          print('SIGN_FLIPS',x['batch4_single_solve_sign_flips'])
          PY
      - name: Seal
        run: |
          mkdir -p /tmp/p10r3/seal/authority /tmp/p10r3/seal/derived
          cp g7/p10/batch4-leverage-preseal.json /tmp/p10r3/seal/authority/
          cp /tmp/p10r3/out/batch4-leverage-audit.json /tmp/p10r3/seal/derived/
          cp /tmp/p10r3/run.log /tmp/p10r3/seal/derived/execution.log
          printf '%s\n' 'PHASE=G7-P10-R3' 'OPERATION=P7_BATCH4_LB7_LEVERAGE_FRAGILITY_AUDIT' 'NEW_SOURCE_CONTACT=NONE' > /tmp/p10r3/seal/AUTHORITY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: G7-P10-R3-batch4-leverage-${{ github.sha }}
          path: /tmp/p10r3/seal
          retention-days: 90
