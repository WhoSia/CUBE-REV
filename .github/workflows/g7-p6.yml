name: Validate G7-P6 expanded rival data bank

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p6/**'
      - 'scripts/g7-p6/**'
      - 'crates/search-geometry-core/src/bin/g7_p6_*.rs'
      - '.github/workflows/g7-p6.yml'
  pull_request:
    paths:
      - 'g7/p6/**'
      - 'scripts/g7-p6/**'
      - 'crates/search-geometry-core/src/bin/g7_p6_*.rs'
      - '.github/workflows/g7-p6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g7-p6-data-bank:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Freeze P6 authority
        run: |
          set -euo pipefail
          node - <<'NODE'
          const p=require('./g7/p6/preseal.json');
          const l=require('./g7/p6/literature-audit.json');
          const d=require('./g7/p6/data-source-expansion.json');
          if(p.data_lanes.prospective_human_data.live_data_collection_authorized!==false) process.exit(1);
          if(p.expanded_rival_ecology.families.length!==5) process.exit(2);
          if(!l.normalization_receipt||l.normalization_receipt.intake_empty_after_move!==true) process.exit(3);
          if((l.missing_verified||[]).length!==0) process.exit(5);
          if(!d.sources.some(x=>x.source_id==='p6_wca_results_v2_273')) process.exit(4);
          console.log('G7_P6_AUTHORITY_PASS');
          NODE

      - name: Test packet-bank pipeline
        run: |
          set -euo pipefail
          node scripts/g7-p6/test-packet-bank.mjs
          node scripts/g7-p6/test-packet-bank-pipeline.mjs
          node scripts/g7-p6/test-packet-selection.mjs
          node scripts/g7-p6/test-contact-gate.mjs

      - name: Materialize exact multi-rival bank
        run: |
          set -euo pipefail
          rm -rf /tmp/g7-p6
          mkdir -p /tmp/g7-p6/authority
          cargo run -q -p search-geometry-core --bin g7_p6_packet_bank > /tmp/g7-p6/packet-bank.tsv
          node scripts/g7-p6/compile-packet-bank.mjs /tmp/g7-p6/packet-bank.tsv /tmp/g7-p6/packet-bank.json
          node scripts/g7-p6/audit-packet-bank.mjs /tmp/g7-p6/packet-bank.json /tmp/g7-p6/packet-bank-audit.json
          node scripts/g7-p6/select-prospective-packets.mjs /tmp/g7-p6/packet-bank.json /tmp/g7-p6/prospective-packets
          node scripts/g7-p6/compile-instrument-packet.mjs             /tmp/g7-p6/prospective-packets/development-packet.json             DEVELOPMENT             /tmp/g7-p6/prospective-packets/development-instrument.json
          node scripts/g7-p6/compile-instrument-packet.mjs             /tmp/g7-p6/prospective-packets/confirmation-packet.json             FRESH_CONFIRMATION             /tmp/g7-p6/prospective-packets/confirmation-instrument.json
          node - <<'NODE'
          const a=require('/tmp/g7-p6/packet-bank-audit.json');
          if(!a.pass||a.states!==256||a.seeds!==8) process.exit(1);
          for(const m of Object.values(a.motif_counts)) if(m!==64) process.exit(2);
          const s=require('/tmp/g7-p6/prospective-packets/selection-receipt.json');
          if(s.development_states!==32||s.confirmation_states!==32||s.reserve_states!==192) process.exit(3);
          if(s.exact_state_overlap_dev_confirm!==0||s.state_id_overlap_dev_confirm!==0) process.exit(4);
          const d=require('/tmp/g7-p6/prospective-packets/development-instrument.json');
          const c=require('/tmp/g7-p6/prospective-packets/confirmation-instrument.json');
          if(d.trials.length!==32||c.trials.length!==32) process.exit(5);
          if(d.human_contact_authority!=='CLOSED_PENDING_P6_CONTACT_GATE'||c.human_contact_authority!=='CLOSED_PENDING_P6_CONTACT_GATE') process.exit(6);
          console.log('G7_P6_DATA_BANK_PASS');
          console.log('G7_P6_PACKET_SPLIT_PASS');
          console.log('BANK_SHA256\t'+a.bank_sha256);
          console.log('PHASE1_LB_COUNTS\t'+JSON.stringify(a.phase1_lb_counts));
          NODE

      - name: Audit pinned external planning-data bytes without unpickling
        run: |
          set -euo pipefail
          SRC_COMMIT=911a6f60ad78f1d908dd50c261eaab69e65bf02f
          RAW=/tmp/g7-p6-nuzzi-raw
          mkdir -p "$RAW" /tmp/g7-p6/external-data-audit
          for f in LevelsFinal.pkl ResultsPilot.pkl ResultsFirstDecision.pkl ResultsAllDecisions.pkl ResultsTime.pkl AdditionalInfo.pkl; do
            curl --fail --location --silent --show-error               "https://raw.githubusercontent.com/DavideNuzzi/Planning-While-Acting/$SRC_COMMIT/data/$f"               -o "$RAW/$f"
            test -s "$RAW/$f"
          done
          python3 scripts/g7-p6/audit-nuzzi-pickles.py "$RAW" | tee /tmp/g7-p6/external-data-audit/nuzzi-audit.log
          cp "$RAW/static-audit.json" /tmp/g7-p6/external-data-audit/nuzzi-static-audit.json
          cp g7/p6/nuzzi-intake-manifest.json /tmp/g7-p6/external-data-audit/
          echo 'RAW_BYTES_NOT_PACKAGED=YES' > /tmp/g7-p6/external-data-audit/AUTHORITY.txt

      - name: Materialize deidentified external planning tables in no-network container
        run: |
          set -euo pipefail
          RAW=/tmp/g7-p6-nuzzi-raw
          SRC=/tmp/g7-p6-nuzzi-source
          OUT=/tmp/g7-p6/external-derived
          SRC_COMMIT=911a6f60ad78f1d908dd50c261eaab69e65bf02f
          mkdir -p "$SRC" "$OUT"
          chmod 0777 "$OUT"
          curl --fail --location --silent --show-error             "https://raw.githubusercontent.com/DavideNuzzi/Planning-While-Acting/$SRC_COMMIT/CrossTheRiver.py"             -o "$SRC/CrossTheRiver.py"
          cat > /tmp/g7-p6-nuzzi.Dockerfile <<'DOCKER'
          FROM python:3.12-slim
          RUN pip install --no-cache-dir numpy==2.4.2 pandas==2.3.3
          USER 65534:65534
          ENTRYPOINT ["python3","/script/materialize-nuzzi-derived.py"]
          DOCKER
          docker build -q -t g7-p6-nuzzi-derived -f /tmp/g7-p6-nuzzi.Dockerfile .
          docker run --rm             --network none             --read-only             --cap-drop ALL             --security-opt no-new-privileges             --pids-limit 128             --memory 2g             -v "$RAW:/input:ro"             -v "$SRC:/source:ro"             -v "$GITHUB_WORKSPACE/scripts/g7-p6:/script:ro"             -v "$OUT:/output:rw"             g7-p6-nuzzi-derived | tee /tmp/g7-p6/external-data-audit/nuzzi-derived.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/g7-p6/external-derived/derived-receipt.json'))
          assert x['counts']['participants']==40, x['counts']
          assert x['counts']['first_decisions']==1549, x['counts']
          assert x['counts']['all_decisions']==4778, x['counts']
          assert x['counts']['timing_rows']==33029, x['counts']
          assert x['counts']['timing_analysis_rows']==31444, x['counts']
          assert x['security']['raw_source_ids_written'] is False
          assert x['security']['age_gender_exported'] is False
          print('G7_P6_NUZZI_DERIVED_COUNTS_PASS')
          print(x['counts'])
          PY
          python3 scripts/g7-p6/analyze-cross-domain.py             /tmp/g7-p6/external-derived             /tmp/g7-p6/external-analysis | tee /tmp/g7-p6/external-data-audit/cross-domain-analysis.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/g7-p6/external-analysis/cross-domain-analysis.json'))
          assert x['counts_match_source_notebook'] is True
          assert x['verdict'] in ('PASS_EXTERNAL_MULTI_CUE_BEHAVIORAL_STRUCTURE','PASS_EXTERNAL_BEHAVIOR_DESCRIPTIVE_ONLY')
          print('G7_P6_EXTERNAL_TRANSPORT_GATE_PASS')
          print('VERDICT',x['verdict'])
          PY
          rm -rf "$RAW" "$SRC"
          test ! -e "$RAW"
          test ! -e "$SRC"

      - name: Seal authority and source ledgers
        run: |
          set -euo pipefail
          cp g7/p6/preseal.json g7/p6/literature-audit.json g7/p6/data-source-expansion.json /tmp/g7-p6/authority/
          printf '%s\n'             'HUMAN_CONTACT=CLOSED_PENDING_P6_CONTACT_GATE'             'LIVE_HUMAN_DATA=NONE'             'EXACT_PACKET_BANK=256_STATES'             'RIVAL_FAMILIES=5'             'EXTERNAL_PLANNING_DERIVED=DEIDENTIFIED'             'EXTERNAL_RAW_BYTES_PACKAGED=NO' > /tmp/g7-p6/AUTHORITY.txt
          (cd /tmp/g7-p6 && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: G7-P6-expanded-data-bank-${{ github.sha }}
          path: /tmp/g7-p6
          if-no-files-found: error
          retention-days: 90
