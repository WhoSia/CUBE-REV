name: CR0105R114 G4 Baseline Vintage Freeze
on:
  push:
    branches: [cube-rev-0.10.5-r1.14-roux-generation-g4]
    paths: [cr0105r114/RUN_BASELINE]
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify no G4 scoring evidence predates baseline
        run: |
          set -euo pipefail
          test -f research/0.10.5-r1.14/NAPKIN_G4_PREREGISTRATION.json
          test -f research/0.10.5-r1.14/GENERATION_INHERITANCE_LEDGER.json
          test ! -d research/0.10.5-r1.14/evidence-ontology
          test ! -d research/0.10.5-r1.14/evidence-reference
          test ! -d research/0.10.5-r1.14/evidence-fresh-authority
          python3 - <<'PY'
          import json
          n=json.load(open('research/0.10.5-r1.14/NAPKIN_G4_PREREGISTRATION.json'))
          assert n['status']=='FROZEN_BEFORE_G4_ROUTE_RECLASSIFICATION_AND_BEFORE_G4_NETWORK_SNAPSHOT'
          assert n['authority']['roux_future_scoring_authority_at_start'] is False
          print('CR0105R114_BASELINE_ORDERING_PASS')
          PY
      - name: Install index parser runtime
        run: python -m pip install --disable-pip-version-check requests==2.32.4 beautifulsoup4==4.13.4 lxml==6.0.0
      - name: Read live index exactly once and freeze complete ID set
        id: freeze
        shell: bash
        env: {R114_ROOT: /tmp/r114}
        run: |
          set +e
          mkdir -p /tmp/r114
          python research/0.10.5-r1.14/r114_freeze_live_baseline.py 2>&1 | tee /tmp/r114/BASELINE_LOG.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist fail-observable baseline evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p research/0.10.5-r1.14/evidence-baseline
          for f in G4_BASELINE_VINTAGE.json BASELINE_LOG.txt; do test -f /tmp/r114/$f && cp /tmp/r114/$f research/0.10.5-r1.14/evidence-baseline/ || true; done
          python3 - <<'PY'
          import json,os,datetime,pathlib
          x={'schema_version':'CR0105R114-BASELINE-RUN-1','workflow_run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'exit_code':int('${{ steps.freeze.outputs.exit_code || 97 }}'),'fresh_network_reads':1,'route_detail_reads':0,'geometry_scored':False,'null_scored':False,'human_observations':0,'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('research/0.10.5-r1.14/evidence-baseline/BASELINE_RUN_METADATA.json').write_text(json.dumps(x,indent=2)+'\n')
          PY
      - name: Commit baseline evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/0.10.5-r1.14/evidence-baseline
          git diff --cached --quiet || git commit -m "Record CUBE-REV 0.10.5-R1.14 G4 baseline vintage ${GITHUB_RUN_ID}"
          git pull --rebase origin cube-rev-0.10.5-r1.14-roux-generation-g4
          git push origin HEAD:cube-rev-0.10.5-r1.14-roux-generation-g4
      - name: Enforce baseline freeze
        if: always()
        run: |
          test '${{ steps.freeze.outputs.exit_code }}' = '0'
          python3 - <<'PY'
          import json
          x=json.load(open('research/0.10.5-r1.14/evidence-baseline/G4_BASELINE_VINTAGE.json'))
          assert x['status']=='PASS_G4_BASELINE_VINTAGE_FROZEN'
          assert x['baseline_definition']['uses_method'] is False
          assert x['baseline_definition']['uses_geometry'] is False
          print('CR0105R114_BASELINE_FROZEN',x['live']['unique_reco_id_n'],x['live']['max_reco_id'],x['live']['id_set_sha256'])
          PY
