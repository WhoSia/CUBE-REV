name: CUBE-REV closed legacy code custody (one-shot, read-only)
on:
  push:
    branches: ['research/current']
    paths:
      - '.github/workflows/cuberev-legacy-code-custody-one-shot.yml'
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Seal dormant 0.11/0.13/0.14/0.16 historical execution inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess,tarfile
          from pathlib import Path
          roots=('scripts/cuberev-011/','scripts/cuberev-013/',
                 'scripts/cuberev-014/','scripts/cuberev-016/')
          workflows=('.github/workflows/cuberev-011-face-word-regression.yml',
                     '.github/workflows/cuberev-016-small-core.yml')
          tracked=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          paths=sorted(p for p in tracked if p.startswith(roots) or p in workflows)
          assert len(paths)==42, f'unexpected path count {len(paths)}'
          dest=Path('/tmp/cuberev-legacy-custody');dest.mkdir()
          entries=[]
          for p in paths:
              raw=Path(p).read_bytes()
              gitsha=subprocess.check_output(['git','rev-parse',f'HEAD:{p}'],text=True).strip()
              assert subprocess.check_output(['git','hash-object','--',p],text=True).strip()==gitsha
              entries.append(dict(path=p,bytes=len(raw),git_blob_sha=gitsha,
                                  sha256=hashlib.sha256(raw).hexdigest()))
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          manifest=dict(schema='cuberev.closed-execution-custody.v1',
                        original_head=head,original_count=len(paths),files=entries,
                        deletion_authorized=False)
          (dest/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with tarfile.open(dest/'exact-sources.tar.gz','w:gz') as tar:
              for p in paths:tar.add(p,arcname=p)
          for p in sorted(dest.iterdir()):
              b=p.read_bytes()
              print('FILE_SHA256',p.name,hashlib.sha256(b).hexdigest(),len(b))
          print('CLOSED_EXECUTION_42_SOURCES_SEALED',head)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cuberev-legacy-code-42-${{ github.sha }}
          path: /tmp/cuberev-legacy-custody/
          if-no-files-found: error
          retention-days: 90
