name: CR0105R17 Target Selection Adjudication
on:
  push:
    branches: [cube-rev-0.10.5-r1.7-selection-court]
    paths: [cr0105r17/RUN_TARGET_SELECTION]
permissions:
  contents: write
jobs:
  adjudicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify selection evidence
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('research/0.10.5-r1.7/evidence-selection/SELECTION_CORRECTION_COURT.json'))
          m=json.load(open('research/0.10.5-r1.7/evidence-selection/RUN_METADATA.json'))
          assert x['status']=='PASS' and m['court_exit_code']==0
          assert x['population_valid_attempts']==8968473
          print('R17_TARGET_SELECTION_PREFLIGHT_PASS')
          PY
      - name: Run prospective target gate
        run: |
          set -euo pipefail
          python3 research/0.10.5-r1.7/r17_target_selection_adjudication.py | tee /tmp/r17_target_selection.log
          cp /tmp/r17_target_selection.log research/0.10.5-r1.7/evidence-selection-target/TARGET_SELECTION_LOG.txt
      - name: Commit target evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/0.10.5-r1.7/evidence-selection-target
          git diff --cached --quiet || git commit -m "Record CUBE-REV 0.10.5-R1.7 target selection adjudication ${GITHUB_RUN_ID}"
          git push origin HEAD:cube-rev-0.10.5-r1.7-selection-court
