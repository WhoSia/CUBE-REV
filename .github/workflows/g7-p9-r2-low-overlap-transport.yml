name: G7-P9-R2 low-overlap specificity Transport Stress Test

on:
  push:
    branches: ['research/current']
    paths:
      - 'g7/p9/low-overlap-transport-preseal.json'
      - 'scripts/g7-p9/stress-low-overlap-transport.py'
      - '.github/workflows/g7-p9-r2-low-overlap-transport.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate preseal
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('g7/p9/low-overlap-transport-preseal.json'))
          assert x['status']=='FROZEN_AFTER_R1_BEFORE_R2_OUTCOME'
          assert x['new_body_requests']==0
          print('G7_P9_R2_PRESEAL_PASS')
          PY
      - name: Recover frozen geometry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/p9r2/p7
          curl --fail --location --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/actions/artifacts/11238382539/zip"             -o /tmp/p9r2/p7.zip
          echo 'b6e30ab56548e27905dd3b3718c5a3e56d772bff10a744e92180d189a3259a11  /tmp/p9r2/p7.zip' | sha256sum -c -
          unzip -q /tmp/p9r2/p7.zip -d /tmp/p9r2/p7
      - name: Execute transport stress
        run: |
          FEAT="$(find /tmp/p9r2/p7 -name five-rival-features.tsv -print -quit)"
          CTX="$(find /tmp/p9r2/p7 -name prefix-context.jsonl -print -quit)"
          mkdir -p /tmp/p9r2/out
          python3 scripts/g7-p9/stress-low-overlap-transport.py             --features "$FEAT" --context "$CTX"             --provenance g7/p7/source-provenance-recovery.json             --out /tmp/p9r2/out --permutations 100000 | tee /tmp/p9r2/stress.log
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/p9r2/out/low-overlap-transport-stress.json'))
          assert x['solves']==60
          print('G7_P9_R2_RESULT_GATE_PASS',x['verdict'])
          print(x['campaign_epoch_nonpositive'])
          print(x['leave_one_out_nonpositive'])
          PY
      - name: Seal
        run: |
          mkdir -p /tmp/p9r2/seal/authority /tmp/p9r2/seal/derived
          cp g7/p9/low-overlap-transport-preseal.json /tmp/p9r2/seal/authority/
          cp /tmp/p9r2/out/low-overlap-transport-stress.json /tmp/p9r2/seal/derived/
          cp /tmp/p9r2/stress.log /tmp/p9r2/seal/derived/execution.log
          printf '%s\n' 'PHASE=G7-P9-R2' 'OPERATION=LOW_OVERLAP_TS_SPECIFICITY_TRANSPORT_STRESS_TEST' 'NEW_SOURCE_CONTACT=NONE' > /tmp/p9r2/seal/AUTHORITY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: G7-P9-R2-low-overlap-${{ github.sha }}
          path: /tmp/p9r2/seal
          retention-days: 90
