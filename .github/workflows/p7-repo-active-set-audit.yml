name: P7 repository active-set audit

on:
  push:
    branches: ['research/current']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce active-only repository invariant
        run: |
          set -euo pipefail
          git ls-files | sort | tee /tmp/tracked-files.txt
          node - <<'NODE'
          const fs=require('fs');
          const m=require('./g7/p7/active-set-manifest.json');
          const files=fs.readFileSync('/tmp/tracked-files.txt','utf8').trim().split(/\r?\n/).filter(Boolean);
          const retired=m.retired_patterns.map(x=>new RegExp(x));
          const legacy=files.filter(p=>retired.some(r=>r.test(p)));
          const unclassified=files.filter(p=>{
            if(m.allowed_root_files.includes(p)) return false;
            return !m.allowed_prefixes.some(prefix=>p.startsWith(prefix));
          });
          fs.writeFileSync('/tmp/legacy-candidates.txt',legacy.join('\n')+(legacy.length?'\n':''));
          fs.writeFileSync('/tmp/unclassified-files.txt',unclassified.join('\n')+(unclassified.length?'\n':''));
          const top={};
          for(const p of files){const k=p.split('/')[0];top[k]=(top[k]||0)+1;}
          const report={
            schema_version:'cube-rev.p7.active-set-audit.v1',
            tracked_files:files.length,
            legacy_candidates:legacy,
            unclassified_files:unclassified,
            top_level_counts:Object.fromEntries(Object.entries(top).sort((a,b)=>b[1]-a[1])),
            pass:legacy.length===0&&unclassified.length===0
          };
          fs.writeFileSync('/tmp/active-set-audit.json',JSON.stringify(report,null,2)+'\n');
          console.log('P7_REPO_ACTIVE_SET_AUDIT');
          console.log('TRACKED_FILES\t'+files.length);
          console.log('LEGACY_CANDIDATES\t'+legacy.length);
          console.log('UNCLASSIFIED_FILES\t'+unclassified.length);
          if(legacy.length) console.log('LEGACY\n'+legacy.join('\n'));
          if(unclassified.length) console.log('UNCLASSIFIED\n'+unclassified.join('\n'));
          if(!report.pass) process.exit(1);
          console.log('P7_REPO_ACTIVE_SET_PASS');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P7-repo-active-set-audit-${{ github.sha }}
          path: |
            /tmp/tracked-files.txt
            /tmp/legacy-candidates.txt
            /tmp/unclassified-files.txt
            /tmp/active-set-audit.json
          retention-days: 14
