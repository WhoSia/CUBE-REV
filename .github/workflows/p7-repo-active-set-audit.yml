name: P7 repository active-set audit

on:
  push:
    branches: ['research/current']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce exact active-only repository invariant
        run: |
          set -euo pipefail
          git ls-files | sort | tee /tmp/tracked-files.txt
          node - <<'NODE'
          const fs=require('fs');
          const m=require('./g7/p7/active-set-manifest.json');
          const files=fs.readFileSync('/tmp/tracked-files.txt','utf8').trim().split(/\r?\n/).filter(Boolean);
          const actual=new Set(files);
          const allowed=new Set(m.allowed_paths);
          const unexpected=files.filter(p=>!allowed.has(p));
          const missing=m.allowed_paths.filter(p=>!actual.has(p));
          fs.writeFileSync('/tmp/unexpected-files.txt',unexpected.join('\n')+(unexpected.length?'\n':''));
          fs.writeFileSync('/tmp/missing-active-files.txt',missing.join('\n')+(missing.length?'\n':''));
          const top={}; for(const p of files){const k=p.split('/')[0];top[k]=(top[k]||0)+1;}
          const report={
            schema_version:'cube-rev.p7.active-set-audit.v2',
            tracked_files:files.length,
            allowed_files:m.allowed_paths.length,
            unexpected_files:unexpected,
            missing_active_files:missing,
            top_level_counts:Object.fromEntries(Object.entries(top).sort((a,b)=>b[1]-a[1])),
            pass:unexpected.length===0&&missing.length===0&&files.length===m.allowed_paths.length
          };
          fs.writeFileSync('/tmp/active-set-audit.json',JSON.stringify(report,null,2)+'\n');
          console.log('P7_REPO_ACTIVE_SET_AUDIT_V2');
          console.log('TRACKED_FILES\t'+files.length);
          console.log('ALLOWED_FILES\t'+m.allowed_paths.length);
          console.log('UNEXPECTED_FILES\t'+unexpected.length);
          console.log('MISSING_ACTIVE_FILES\t'+missing.length);
          if(unexpected.length) console.log('UNEXPECTED\n'+unexpected.join('\n'));
          if(missing.length) console.log('MISSING\n'+missing.join('\n'));
          if(!report.pass) process.exit(1);
          console.log('P7_REPO_EXACT_ACTIVE_SET_PASS');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P7-repo-active-set-audit-${{ github.sha }}
          path: |
            /tmp/tracked-files.txt
            /tmp/unexpected-files.txt
            /tmp/missing-active-files.txt
            /tmp/active-set-audit.json
          retention-days: 30


  archive-transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout historical archive branch
        uses: actions/checkout@v4
        with:
          ref: archive/pre-p7-active-prune-20261002
          fetch-depth: 1

      - name: Package immutable tracked-tree snapshot
        run: |
          set -euo pipefail
          mkdir -p /tmp/cube-rev-archive
          HEAD_SHA="$(git rev-parse HEAD)"
          FILE_COUNT="$(git ls-files | wc -l | tr -d ' ')"
          git ls-files -z | tar --null -T - -czf /tmp/cube-rev-archive/CUBE-REV-archive-pre-p7-active-prune-20261002.tar.gz
          ARCHIVE_SHA="$(sha256sum /tmp/cube-rev-archive/CUBE-REV-archive-pre-p7-active-prune-20261002.tar.gz | awk '{print $1}')"
          ARCHIVE_BYTES="$(stat -c '%s' /tmp/cube-rev-archive/CUBE-REV-archive-pre-p7-active-prune-20261002.tar.gz)"
          python3 - <<PY
          import json
          x={
            "schema_version":"cube-rev.archive-transfer.v1",
            "repository":"WhoSia/CUBE-REV",
            "source_branch":"archive/pre-p7-active-prune-20261002",
            "source_head":"$HEAD_SHA",
            "tracked_files":int("$FILE_COUNT"),
            "archive_file":"CUBE-REV-archive-pre-p7-active-prune-20261002.tar.gz",
            "archive_sha256":"$ARCHIVE_SHA",
            "archive_bytes":int("$ARCHIVE_BYTES"),
            "package_scope":"all git-tracked files at source branch head",
            "git_history_included":False,
            "base_main_commit":"a5b16ad3f64c7f3de31b891e439c40e902d582bf",
            "branch_ahead_of_base_commits":421
          }
          open("/tmp/cube-rev-archive/archive-transfer-receipt.json","w").write(json.dumps(x,indent=2)+"\n")
          print("G7_P7_ARCHIVE_TRANSFER_PASS")
          print("SOURCE_HEAD\t"+x["source_head"])
          print("TRACKED_FILES\t"+str(x["tracked_files"]))
          print("ARCHIVE_SHA256\t"+x["archive_sha256"])
          print("ARCHIVE_BYTES\t"+str(x["archive_bytes"]))
          PY
          (cd /tmp/cube-rev-archive && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: CUBE-REV-archive-pre-p7-active-prune-20261002-${{ github.sha }}
          path: /tmp/cube-rev-archive
          if-no-files-found: error
          retention-days: 30
