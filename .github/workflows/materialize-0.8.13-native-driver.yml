name: CUBE-REV 0.8.13 native submission driver materializer
on:
  pull_request:
    branches: [cube-rev-0.8.12-active-session-cas]
    paths:
      - '.github/workflows/materialize-0.8.13-native-driver.yml'
      - 'scripts/patch_0_8_13_native_submission_driver.py'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cube-rev-0.8.13-native-browser-live-factory
          fetch-depth: 0
      - run: python scripts/patch_0_8_13_native_submission_driver.py
      - run: node --check tests/native_multi_window_0.8.13.spec.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/native_multi_window_0.8.13.spec.js
          git commit -m 'test(0.8.13): drive first submission from second native tab [skip ci]'
          git push origin HEAD:cube-rev-0.8.13-native-browser-live-factory
