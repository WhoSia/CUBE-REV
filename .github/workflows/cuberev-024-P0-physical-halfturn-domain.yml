name: CUBE-REV 0.24 P0 independent real cube physical domain
on:
  workflow_dispatch:
  push:
    branches: [research/current]
    paths:
      - "scripts/cuberev-024/p0_real_cube_parity_and_halfturn_domain.mjs"
      - "scripts/cuberev-024/p0_fullcube_parity_go/main.go"
      - ".github/workflows/cuberev-024-P0-physical-halfturn-domain.yml"
permissions:
  contents: read
jobs:
  full-54-facelet-physical-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ban every github-actions bot commit author or committer on research/current
        shell: bash
        run: |
          if git log --format='%an <%ae> %cn <%ce>' | grep -Ei 'github-actions?\[bot\]|github-action\[bot\]'; then
            echo "::error::Actions bot-authored or bot-committed history is not permitted"
            exit 1
          fi
      - name: Independent original 54-facelet Node 18 HTM, halfturn, parity and shortest DAG
        run: node scripts/cuberev-024/p0_real_cube_parity_and_halfturn_domain.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.2"
      - name: Independent full cube original facelet Go 18HTM parity census
        run: go run scripts/cuberev-024/p0_fullcube_parity_go/main.go
      - name: No source modifications or writebacks
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
