name: G3 cognitive runtime Chromium certification

on:
  push:
    branches: [g3-p10-r1-cognitive-runtime]
    paths:
      - 'g3-cog/**'
      - '.github/workflows/g3-cog-chromium.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - name: Checkout exact branch bytes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: g3-p10-r1-cognitive-runtime
          fetch-depth: 0
      - name: Capture environment and install exact Playwright package
        shell: bash
        run: |
          set -euxo pipefail
          node --version
          cat /etc/os-release
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Execute 35-checkpoint plus 180-case Chromium certification
        id: cert
        shell: bash
        run: |
          set +e
          node g3-cog/tests/serve.mjs > /tmp/g3-server.log 2>&1 &
          SERVER_PID=$!
          sleep 1
          node g3-cog/tests/chromium-cert.mjs
          STATUS=$?
          kill "$SERVER_PID" 2>/dev/null || true
          node -e "const fs=require('fs');const p='g3-cog/certification/receipt.json';const r=JSON.parse(fs.readFileSync(p));Object.assign(r,{workflow:'g3-cog-chromium.yml',workflow_run_id:process.env.GITHUB_RUN_ID,workflow_run_attempt:process.env.GITHUB_RUN_ATTEMPT,container:'mcr.microsoft.com/playwright:v1.55.0-noble',playwright:'1.55.0',runner:'ubuntu-24.04'});fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n')"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Seal certification receipt back to branch
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add g3-cog/certification/receipt.json
          git commit -m 'G3 P10-R1: seal Chromium certification receipt [skip ci]' || true
          git push origin HEAD:g3-p10-r1-cognitive-runtime
      - name: Enforce certification verdict
        shell: bash
        run: |
          test '${{ steps.cert.outputs.status }}' = '0'
