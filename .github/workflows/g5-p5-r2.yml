name: Validate G5-P5-R2 quotient court

on:
  push:
    branches: ['research/current']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p5-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust format seal
        run: cargo fmt --all --check
      - name: Workspace check
        run: cargo check --workspace
      - name: Workspace tests
        run: cargo test --workspace
      - name: Materialize R2 exact quotient court
        run: |
          mkdir -p g5/p5/ci-output
          cargo run --release --quiet -p search-geometry-core --bin p5_r2 > g5/p5/ci-output/p5-r2.tsv
      - name: Upload R2 court
        uses: actions/upload-artifact@v4
        with:
          name: g5-p5-r2-quotient-court
          path: g5/p5/ci-output/p5-r2.tsv
