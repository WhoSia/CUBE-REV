<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUBE-REV 0.8.12</title><style>:root{--bg:#f5f7fa;--card:#fff;--ink:#17191d;--muted:#68707b;--line:#d9dee7;--accent:#195bd7;--warn:#8a4b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}main{max-width:860px;margin:auto;padding:24px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}.hidden{display:none!important}button,input,textarea{font:inherit}button,.button{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;cursor:pointer;text-decoration:none;color:inherit}.primary{background:var(--accent);color:#fff}.faces{display:flex;gap:16px;justify-content:center;margin:24px 0}.face{display:grid;grid-template-columns:repeat(2,64px);gap:4px;background:#111;padding:5px;border-radius:8px}.st{height:64px;border-radius:4px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.selected{outline:3px solid var(--accent)}.progress{height:8px;background:#e7eaf0;border-radius:8px;overflow:hidden}.progress div{height:100%;background:var(--accent)}.small{font-size:13px;color:var(--muted)}.warning{color:var(--warn)}textarea{width:100%;min-height:90px}@media(max-width:620px){.face{grid-template-columns:repeat(2,42px)}.st{height:42px}.faces{gap:7px}}</style></head><body><main>
<section id="intro" class="card"><h1>큐브 첫 행동 선택 과제</h1><p>각 상태에서 자연스럽게 가장 먼저 할 회전을 선택하세요.</p><p class="small">여러 창에서 동시에 응답해도 최신 revision을 덮어쓰지 않으며, 제출 전송은 한 창만 담당합니다.</p><button id="begin" class="primary">시작 또는 이어하기</button><p class="small">CUBE-REV 0.8.12</p></section>
<section id="blocked" class="card hidden"><h2>저장 상태 확인이 필요합니다</h2><p id="blockedText" class="warning"></p><a id="legacyLink" class="button primary hidden" href="#">기존 버전에서 계속하기</a><button id="retryBoot" class="primary hidden">다시 확인</button><p class="small">기존 응답을 자동으로 삭제하거나 오래된 탭 상태로 덮어쓰지 않았습니다.</p></section>
<section id="task" class="card hidden"><div class="progress"><div id="bar"></div></div><p id="count" class="small"></p><p id="syncNotice" class="small warning hidden"></p><div id="faces" class="faces"></div><p>회전할 면</p><div id="faceChoices" class="choices"></div><p>회전 방향</p><div id="turnChoices" class="choices"></div><button id="confirm" class="primary" disabled>선택 확정</button></section>
<section id="post" class="card hidden"><h2>과제 후 확인</h2><label>이 과제가 무엇을 비교한다고 생각했나요?<textarea id="guess"></textarea></label><label>추측 확신도 (0–100)<input id="confidence" type="number" min="0" max="100" value="0"></label><p><label><input id="deliberate" type="checkbox"> 과제 목적을 추측해 일부러 선택 방식을 바꿨습니다</label></p><label>기술적 문제 또는 참고사항<textarea id="tech"></textarea></label><button id="finish" class="primary">응답 제출</button></section>
<section id="done" class="card hidden"><h2>완료되었습니다</h2><p id="doneText">응답을 안전하게 전송하고 있습니다.</p><button id="retry" class="primary hidden">다시 전송</button><p class="small">CUBE-REV 0.8.12</p></section></main>
<script src="collector-config.js"></script><script src="js/collector-client.js"></script>
<script src="js/participant-cognitive-mode-0.8.8.js"></script><script src="js/participant-cognitive-mode-0.8.9.js"></script><script src="js/participant-cognitive-mode-0.8.10.js"></script>
<script src="js/participant-cognitive-mode-0.8.11.js"></script><script src="js/atomic-migration-0.8.11.js"></script><script src="js/atomic-migration-commit-authority-0.8.11.js"></script>
<script src="js/asset-pins-0.8.12.js"></script><script src="js/public-asset-verifier-0.8.12.js"></script><script src="js/participant-cognitive-mode-0.8.12.js"></script><script src="js/active-session-cas-0.8.12.js"></script><script>
'use strict';
let C,parentC,parentBank,binding,parentBinding,bank={},state,casOptions,face,turn,shown=0,sending=false,booting=false,writing=false;
const $=s=>document.querySelector(s),colors={U:'#f5f5f5',D:'#ffd500',F:'#00a651',B:'#0051ba',R:'#c41e3a',L:'#ff5800'},now=()=>new Date().toISOString();
const idFactory=CUBE_REV_ACTIVE_SESSION_CAS_0812.makeIdFactory(crypto);
const tabId=idFactory('tab');
function randomHex(n){return Array.from(crypto.getRandomValues(new Uint8Array(n)),x=>x.toString(16).padStart(2,'0')).join('')}
async function fetchText(path,label){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(`${label}_MISSING`);return r.text()}
async function assets(){
  const [manifestText,bankText,configText,parentBankText,parentConfigText]=await Promise.all([
    fetchText('research/CUBE_REV_0.8.12_ASSET_MANIFEST.json','MANIFEST'),
    fetchText('cognitive/PARTICIPANT_STIMULUS_BANK_0.8.12.json','PUBLIC_BANK'),
    fetchText('cognitive/COGNITIVE_MODE_CONFIG_0.8.12.json','CONFIG'),
    fetchText('cognitive/PARTICIPANT_STIMULUS_BANK_0.8.11.json','PARENT_BANK'),
    fetchText('cognitive/COGNITIVE_MODE_CONFIG_0.8.11.json','PARENT_CONFIG')
  ]);
  const v=await CUBE_REV_PUBLIC_ASSET_VERIFIER_0812.verifyBundle({manifestText,bankText,configText,pins:CUBE_REV_ASSET_PINS_0812,cryptoObj:crypto});
  C=v.config;binding=v.binding;parentBinding=v.parent0811Binding;parentC=JSON.parse(parentConfigText);parentBank=JSON.parse(parentBankText);
  bank=Object.fromEntries(v.bank.stimuli.map(x=>[x.stimulus_id,x]));
  const atomic11Deps={storage:localStorage,lockManager:navigator.locks,bank11:parentBank,config11:parentC,config088:parentC,config089:parentC,config10:parentC,parent0810Binding:parentC.migration.parent_0810_asset_binding,binding:parentBinding,m088:CUBE_REV_COGNITIVE_MODE_0808,m089:CUBE_REV_COGNITIVE_MODE_0809,m10:CUBE_REV_COGNITIVE_MODE_0810,m11:CUBE_REV_COGNITIVE_MODE_0811,cryptoObj:crypto,now};
  casOptions={storage:localStorage,lockManager:navigator.locks,config:C,binding,parentConfig:parentC,parentBinding,m11:CUBE_REV_COGNITIVE_MODE_0811,m12:CUBE_REV_COGNITIVE_MODE_0812,atomic11:CUBE_REV_ATOMIC_MIGRATION_0811,atomic11Deps,cryptoObj,now,idFactory};
}
function hideAll(){['intro','blocked','task','post','done'].forEach(x=>$('#'+x).classList.add('hidden'))}
function block(message,{legacyRoute=null,retry=false}={}){hideAll();$('#blocked').classList.remove('hidden');$('#blockedText').textContent=message;$('#legacyLink').classList.toggle('hidden',!legacyRoute);if(legacyRoute)$('#legacyLink').href=legacyRoute;$('#retryBoot').classList.toggle('hidden',!retry)}
function blockingMessage(action){const map={LOCK_UNAVAILABLE:'이 브라우저에서는 여러 창 사이의 안전한 저장 잠금을 사용할 수 없습니다. 응답을 변경하지 않았습니다.',INVALID_ACTIVE_STATE:'현재 버전 저장 상태의 무결성을 확인하지 못해 격리했습니다. 자동으로 새 세션을 만들지 않았습니다.',PARENT_STATE_INVALID:'이전 버전 저장 상태의 무결성을 확인하지 못했습니다.',SOURCE_CONFLICT:'서로 다른 이전 세션이 발견되어 자동으로 하나를 선택하지 않았습니다.',ANCESTRY_CONFLICT:'상위 저장 상태와 보존된 이전 원본의 계보가 일치하지 않습니다.',TARGET_LOSS_WITH_SOURCE_DIVERGENCE:'새 저장 상태 손실과 기존 상태 변경이 함께 발견되어 자동 복구하지 않았습니다.'};return map[action]||'저장 상태를 안전하게 확정하지 못했습니다. 기존 응답은 보존했습니다.'}
async function boot(){
  if(booting)return;booting=true;$('#begin').disabled=true;$('#retryBoot').disabled=true;
  try{await assets();const result=await CUBE_REV_ACTIVE_SESSION_CAS_0812.loadOrInitializeActive(casOptions);if(result.action==='LEGACY_SEALED_RETRY'||result.action==='ROLLED_BACK_TO_LEGACY'){block('이 응답은 이전 버전의 봉인본으로 유지됩니다. 원래 버전에서 같은 봉인본을 다시 전송하세요.',{legacyRoute:result.legacy_route});return}if(result.blocking){block(blockingMessage(result.action),{retry:result.action!=='LOCK_UNAVAILABLE'});return}state=result.state;if(!state)throw new Error(`STATE_MISSING_AFTER_${result.action}`);route()}catch(e){block('과제 자산 또는 저장 상태를 검증하지 못했습니다. 응답은 변경하지 않았습니다.',{retry:true});console.error(e)}finally{booting=false;$('#begin').disabled=false;$('#retryBoot').disabled=false}}
function route(){hideAll();if(state.status==='SUBMITTED'){showDone('이미 안전하게 제출되었습니다.');return}if(state.status==='POST_TASK'||state.status==='READY_TO_SUBMIT'){if(state.status==='READY_TO_SUBMIT'){send();return}$('#post').classList.remove('hidden');return}$('#task').classList.remove('hidden');render()}
function grid(l,a){return `<div><b>${l}</b><div class="face">${a.flat().map(c=>`<div class="st" style="background:${colors[c]}"></div>`).join('')}</div></div>`}
function render(){const t=bank[state.schedule[state.cursor]];if(!t)throw new Error('STIMULUS_NOT_FOUND');$('#count').textContent=`${state.cursor+1} / 28 · revision ${state.revision}`;$('#bar').style.width=`${100*state.cursor/28}%`;$('#faces').innerHTML=grid('U',t.stickers.U)+grid('F',t.stickers.F)+grid('R',t.stickers.R);face=turn=null;$('#confirm').disabled=true;$('#syncNotice').classList.add('hidden');document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));shown=performance.now()}
function sel(g,v,e){g==='f'?face=v:turn=v;e.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');$('#confirm').disabled=face==null||turn==null||writing}
for(const f of 'URFDLB'){const b=document.createElement('button');b.textContent=f;b.onclick=()=>sel('f',f,b);$('#faceChoices').appendChild(b)}
for(const [v,l] of [['','시계 90°'],['2','180°'],["'",'반시계 90°']]){const b=document.createElement('button');b.textContent=l;b.onclick=()=>sel('t',v,b);$('#turnChoices').appendChild(b)}
$('#begin').onclick=boot;$('#retryBoot').onclick=boot;
async function apply(operation){const r=await CUBE_REV_ACTIVE_SESSION_CAS_0812.applyOperation(casOptions,{session_id:state.session_id,...operation});if(r.state&&(!state||r.state.revision>=state.revision))state=r.state;return r}
$('#confirm').onclick=async()=>{if(writing)return;writing=true;$('#confirm').disabled=true;try{const original=state,position=original.cursor,t=bank[original.schedule[position]],display=face+turn,code=t.choice_codes&&t.choice_codes[display];if(!code)throw new Error('OPAQUE_CHOICE_CODE_MISSING');const response={stimulus_id:t.stimulus_id,choice_display:display,choice_code:code,latency_ms:Math.round(performance.now()-shown)};let r=await apply({type:'RESPONSE',mutation_id:idFactory('response'),expected_revision:original.revision,expected_position:position,response});if(r.action==='STALE_REVISION'&&state.cursor===position)r=await apply({type:'RESPONSE',mutation_id:idFactory('response-retry'),expected_revision:state.revision,expected_position:position,response});if(r.action==='RESPONSE_CONFLICT'){$('#syncNotice').textContent='다른 창에서 이 문항의 응답이 먼저 저장되어 그 응답을 유지했습니다.';$('#syncNotice').classList.remove('hidden')}route()}catch(e){block('응답 저장을 완료하지 못했습니다. 기존 저장본은 덮어쓰지 않았습니다.',{retry:true});console.error(e)}finally{writing=false}};
$('#finish').onclick=async()=>{if(writing)return;writing=true;$('#finish').disabled=true;try{const payload={hypothesis_guess:$('#guess').value,confidence:$('#confidence').value,deliberate_strategy_change:$('#deliberate').checked,technical_notes:$('#tech').value};let r=await apply({type:'POST_TASK',mutation_id:idFactory('post-task'),expected_revision:state.revision,post_task:payload});if(r.action==='STALE_REVISION'&&state.status==='POST_TASK')r=await apply({type:'POST_TASK',mutation_id:idFactory('post-task-retry'),expected_revision:state.revision,post_task:payload});if(!r.ok&&r.action!=='POST_TASK_ALREADY_APPLIED')throw new Error(r.action);await send()}finally{writing=false;$('#finish').disabled=false}};
function telemetry(type,data){if(!state||!casOptions)return;const expected=state.revision;apply({type:'TELEMETRY',mutation_id:idFactory('telemetry'),expected_revision:expected,event_id:idFactory('event'),event_type:type,data:data||{}}).catch(console.error)}
document.addEventListener('visibilitychange',()=>telemetry(document.hidden?'VISIBILITY_HIDDEN':'VISIBILITY_VISIBLE',{}));addEventListener('pagehide',()=>telemetry('PAGEHIDE',{cursor:state&&state.cursor}));
addEventListener('storage',e=>{if(e.key!==CUBE_REV_COGNITIVE_MODE_0812.STORAGE_KEY||!e.newValue||!C)return;try{const x=JSON.parse(e.newValue);if(CUBE_REV_COGNITIVE_MODE_0812.valid(x,C,binding)&&(!state||x.revision>state.revision)){state=x;route()}}catch(_){}});
async function ensureSnapshot(){if(state.submission_snapshot)return;let r=await apply({type:'SEAL_SNAPSHOT',mutation_id:idFactory('snapshot'),expected_revision:state.revision});if(r.action==='STALE_REVISION'&&!state.submission_snapshot)r=await apply({type:'SEAL_SNAPSHOT',mutation_id:idFactory('snapshot-retry'),expected_revision:state.revision});if(!r.ok&&r.action!=='SNAPSHOT_ALREADY_SEALED')throw new Error(r.action)}
async function send(){
  if(sending)return;sending=true;hideAll();$('#done').classList.remove('hidden');$('#retry').classList.add('hidden');let leaseToken=null,persistQueue=Promise.resolve();
  try{if(state.status==='SUBMITTED'){showDone('이미 안전하게 제출되었습니다.');return}await ensureSnapshot();leaseToken=idFactory('submission-lease');const claim=await apply({type:'CLAIM_SUBMISSION',mutation_id:idFactory('claim'),expected_revision:state.revision,lease_token:leaseToken,lease_owner:tabId});if(claim.action==='SUBMISSION_IN_FLIGHT'){$('#doneText').textContent='다른 창에서 같은 봉인본을 전송 중입니다. 완료 상태를 기다립니다.';return}if(claim.action==='ALREADY_SUBMITTED'){showDone('이미 안전하게 제출되었습니다.');return}if(!claim.ok)throw new Error(claim.action);
    const shell={session_id:state.session_id,data_submission:{...(state.submission_control.collector_meta||{})},collectorEvents:[...(state.submission_control.collector_events||[])]};
    const queuePersist=()=>{const meta=JSON.parse(JSON.stringify(shell.data_submission||{})),events=JSON.parse(JSON.stringify(shell.collectorEvents||[]));persistQueue=persistQueue.then(async()=>{const r=await apply({type:'SUBMISSION_META',mutation_id:idFactory('collector-meta'),lease_token:leaseToken,collector_meta:meta,collector_events:events});if(!r.ok)throw new Error(r.action)});return persistQueue};
    const cv='0.7.12',cfg=CubeRevCollectorClient.normalizeConfig(window.CUBE_REV_COLLECTOR_CONFIG,cv);const client=new CubeRevCollectorClient({config:cfg,version:cv,getSession:()=>shell,exportSession:()=>CUBE_REV_COGNITIVE_MODE_0812.exportSnapshot(state),logEvent:(type,data)=>{shell.collectorEvents.push({type,at:now(),data:data||{}})},persist:queuePersist,setStatus:m=>$('#doneText').textContent=m,randomHex,hashString:CUBE_REV_COGNITIVE_MODE_0812.fnv1a,translate:k=>k});const receipt=await client.submit();await persistQueue;const confirmed=await apply({type:'CONFIRM_SUBMISSION',mutation_id:idFactory('confirm'),lease_token:leaseToken,receipt});if(!confirmed.ok)throw new Error(confirmed.action);showDone('응답이 안전하게 제출되었습니다.')
  }catch(e){try{await persistQueue}catch(_){}if(leaseToken){try{await apply({type:'RELEASE_SUBMISSION',mutation_id:idFactory('release'),lease_token:leaseToken,error:String(e&&e.message||e).slice(0,300)})}catch(_){}}$('#doneText').textContent='응답 봉인본은 이 기기에 보존되었습니다. 연결 후 다시 전송하세요.';$('#retry').classList.remove('hidden');console.error(e)}finally{sending=false}}
function showDone(x){$('#done').classList.remove('hidden');$('#doneText').textContent=x;$('#retry').classList.add('hidden')}
$('#retry').onclick=send;
</script></body></html>
